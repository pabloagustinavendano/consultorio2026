realizado durante el pontificado de Eugenio III (1145–1153), en parte deteriorado y en parte mal restaurado a mediados del s. XVIII.\n\n## Por dentro\n\nEl interior de la Basílica (86 m de largo) es sumamente armonioso. Dividen las tres naves (la central un poco más larga que las laterales) columnas monolíticas (36 de mármol y 4 de granito) con capiteles –icónicos que sostienen directamente las trabes o vigas. Son de mármol blanco del Imetto, y casi todas se remontan a tiempos de Sixto III (s.V). El bellísimo pavimento cosmatesco en mosaico de piedras duras, es del s.XII.\n\nEl artesonado del techo, atribuido a **Giuliano da Sangallo**, es considerado una de las obras maestras de la artesanía renacentista (las rosas miden un metro de diámetro); el oro de la decoración es el primer oro de América traído del Perú y ofrecido por Fernando e Isabel al Papa Alejandro VI. Desde el punto de vista artístico, la característica esencial de la Basílica viene dada por la cantidad de mosaico y por su calidad. La ampliación del presbiterio efectuada por Nicolás IV en el s.XIII, trajo consigo la demolición de la decoración original del ábside y la realización de nuevos mosaicos.\n\nAl tratarse de trabajos de distintas épocas, el conjunto resulta un compendio de las fases más significativas del arte mosaísta. Los 27 paneles sobre el arquitrabe de la nave central (la viga entre dos columnas), que datan del s.V., constituyen la obra más vasta y meritoria de los mosaístas del alto Medioevo. Los mosaicos que decoran el arco triunfal están dedicados a la infancia de Jesús, con pasajes de los Evangelios y de los apócrifos.\n\n## Los mosaicos del ábside\n\nTenemos después los mosaicos del ábside, terminados en 1295 por **Torriti**, que representan escenas de la vida de la Virgen –en los recuadros entre las ventanas–y la Coronación de la Virgen por Jesús, en el medallón central. La Confesión se rehízo en 1864, bajo diseño de Virginio **Vespignani**; la gran estatua muestra a Pío IX de rodillas ante las reliquias del Pesebre. En la Confesión, sobre el altar, en un relicario en forma de cuna, se encuentran fragmentos que la tradición venera como pertenecientes al pesebre del Niño Jesús. En este altar celebró su primera Misa San Ignacio de Loyola. El baldaquino del altar mayor, con cuatro columnas de pórfido, es de Fuga; la urna, también de pórfido, contiene reliquias del Apóstol Mateo.\n\n## La capilla Sixtina\n\nEn la nave derecha, cerca de la entrada, está el Baptisterio, obra de Flaminio Ponzio. Desde ahí se puede pasar a la Sacristía, también de Ponzio. Volviendo a la nave de la derecha se encuentra la capilla de las reliquias, de Fuga, con diez columnas de pérfido. La Capilla de **Sixto V** o del Santísimo –cerca del presbiterio–proyectada por Domenico Fontana, tiene un diseño a cruz griega. En los laterales se encuentran las tumbas de Sixto V y de **San Pío V**, ambas de Fontana, decoradas con bajorrelieves que relatan algunos de los principales episodios de esos pontificados.\n\nEn esta misma capilla están los restos de San Jerónimo, aunque no se sabe el lugar preciso. Sobre el altar central se encuentra el grandioso sagrario, obra de Scalzo (1590), que se apoya sobre cuatro ángeles de bronce, de Torrigiani. Bajo el altar se encuentra el Oratorio del Pesebre, resultado final de la recomposición de las partes de la antigua capilla donde desde el s.VIII se guardaban las reliquias del Pesebre de Belén. Aquí San Cayetano tuvo una aparición de la Virgen que le dio al Niño Jesús para que lo tuviera en brazos.\n\n## La capilla Paulina\n\nLa Capilla Paulina, al lado opuesto a la del Santísimo, fue construida por Flaminio Ponzio, por encargo de Paulo V, en 1611. Tiene un bellísimo altar (proyectado por Targone), decorado con jaspe, amatista, ágata y lapislázuli. La imagen de la Virgen **Salus Populi Romani** es de estilo bizantino, y una tradición la atribuye a San Lucas, pero parece haber sido pintada alrededor del s.XII. En la parte alta del retablo, la obra de **Maderno** ilustra la leyenda del trazado de la Basílica.\n\nLos brazos derecho e izquierdo contienen tumbas papales: Clemente VIII y Paulo V. La Capilla Sforza, también en la nave de la izquierda, fue construida por Giacomo della Porta, siguiendo un diseño de **Miguel Ángel**. Su estilo arquitectónico, con ábsides laterales entre columnas, es de gran originalidad. La tercera capilla de esta nave es la Capilla Cesi.", "logi": {"Horario": "7:00 a 19:00 · último ingreso 18:30", "Costo": "Gratis", "San Pío V": "Cappella Sistina, a la derecha del altar mayor", "Pesebre": "Cripta bajo el altar mayor"}, "map": "Basilica di Santa Maria Maggiore, Roma", "id": "s15", "day": "11", "hrs": {"open": [[420, 1140]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["Los **mosaicos del siglo V** en lo alto de la nave, con escenas del Antiguo Testamento. Son del tiempo del Concilio de Éfeso.", "La **Salus Populi Romani**, en la capilla Paulina, a la izquierda.", "La **reliquia del pesebre**, en la cripta bajo el altar mayor.", "La **tumba de San Pío V** en la capilla Sixtina, a la derecha.", "La tumba de **Bernini**: una lápida mínima en el piso, a la derecha del altar mayor. Casi nadie la encuentra."], "zone": "Monti y Esquilino"}, {"time": "12:45", "name": "Almuerzo en Monti", "tag": "food", "type": "food", "dur": 90, "quick": "Barrio tranquilo, buenas trattorias, cómodo con chicos.", "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Bajar por Via Cavour hacia el Foro y meterse en las callecitas de Monti: Via del Boschetto, Via dei Serpenti y Via Panisperna concentran las mejores trattorias.", "tip": "Reservar con anticipación: quince personas un domingo al mediodía no entran en cualquier lado."}, "logi": {"Costo adultos": "€18 a €28", "Costo niños": "€8 a €12"}, "id": "s16", "day": "11", "pri": 3}, {"time": "15:00", "name": "San Pietro in Vincoli", "tag": "site", "type": "site", "dur": 45, "quick": "Las cadenas de San Pedro y el Moisés de Miguel Ángel.", "hist": "Construida en el siglo V por la emperatriz Eudoxia para custodiar las cadenas del Apóstol. Guarda el Moisés que Miguel Ángel talló para la tumba de Julio II.", "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Monti, subir por Via Cavour hasta la escalinata cubierta de Via San Francesco di Paola, que sale a la izquierda. Arriba se abre la plaza de San Pietro in Vincoli.", "tip": "La escalinata es empinada: con cochecito conviene rodear por Via degli Annibaldi."}, "full": "## Las cadenas\n\nDe Vía Cavour se sube por una escalinata sobre la cual vivía la famosa Lucrecia Borgia. En el 436, la mujer del emperador de Oriente recibió como regalo de Juvenal, Obispo de Jerusalén, las cadenas que se habían usado cuando **San Pedro** estuvo en prisión. La emperatriz conservó una parte de esta reliquia en una espléndida basílica construida con este propósito, y envió la otra a Roma, a su hija Eudosia, esposa del emperador Valentiniano III.\n\nEsta, a su vez, la entregó al Papa **San León Magno**. Cuenta la tradición que el Papa colocó esa cadena junto a otra, que sirvió para tener prisionero al Apóstol en la Cárcel Mamertina de Roma, durante la época de **Nerón**. Cuando lo hizo, las dos cadenas se juntaron, de modo que formaron una sola. En memoria de este prodigio, y en honor del Apóstol Pedro, la emperatriz Eudosia edificó la actual Basílica, para conservar las cadenas, que por este motivo se llamó Basílica eudosiana de San Pietro in Vincoli (en cadenas).\n\n## La iglesia\n\nLa Basílica fue construida sobre otra ya existente –dedicada a los Santos Apóstoles–que había sido reconstruida por el predecesor de San León Magno. **Sixto III**, con ayuda de la misma Eudosia, sobre las estructuras de una basílica del s.IV y una Domus Ecclesiae del s.III. Posteriormente se llevaron a cabo diversas obras de restauración y decoración, la más importante es obra de Fontana, en el s.XVIII. Durante unas recientes excavaciones (1956–59) realizadas para rehacer el suelo, se descubrieron los restos de las construcciones precedentes–las más antiguas del s.II antes de Cristo–,\n\nque en parte se pueden visitar (se puede pedir permiso para entrar; la entrada está bajo el pórtico a la derecha; si se entra, es conveniente solicitar guía). La fachada está precedida por un elegante pórtico de cinco arcadas con pilastras octogonales, que se terminó en 1475. El amplio interior está dividido en tres naves por dos filas de columnas dóricas de mármol. La decoración interior medieval fue modificada en los s.XVII y XVIII. A la izquierda de la puerta principal se encuentra la tumba de Antonio y Piero del Pollaiuolo, famosos escultores florentinos del Renacimiento.\n\nEl altar mayor y **el baldaquino** son de **Vespignani** (1872). Abajo, la Confesión, del mismo autor, en cuyo altar hay dos ventanillas de bronce dorado con Escenas de la vida de San Pedro en bajorrelieve, atribuidas a Caradosso (1477); las ventanillas se abren para dejar ver en su interior la urna de bronce dorado (1856) que contiene las cadenas de San Pedro. En la Cripta bajo el altar se encuentra un sarcófago paleocristiano, que fue descubierto en el s.XIX. dividido en siete compartimentos interiores, en los que había algunos fragmentos de huesos y ceniza.\n\n## La tumba de Julio II\n\nDos laminillas de plomo con inscripciones confirmaban (ya se tenía alguna noticia) que eran las reliquias de los siete hermanos Macabeos, martirio que se relata en el Antiguo Testamento. Desde el punto de vista artístico, lo más sobresaliente es el Mausoleo del Papa **Julio II**. En 1505 el Papa mandó venir a **Miguel Ángel** desde Florencia, para realizar el proyecto de su tumba, que pensaba colocar en el centro de la Basílica de San Pedro. Miguel Ángel pasó varios meses en Carrara, eligiendo el mármol; el programa original comprendía unas cuarenta estatuas, numerosos bajorrelieves en bronce, y el sarcófago.\n\nPosteriormente, y después de la muerte del Pontífice fue perdiendo actualidad. Terminaron de arrinconarlo los sucesivos encargos por parte del nuevo Pontífice, Paulo III, que había encargado al artista la realización del Juicio Final para **la Capilla Sixtina**. Paulo III comenzaba a impacientarse con la tardanza en el mausoleo; se cuenta que en cierta ocasión fue a ver al escultor, y acabó convenciéndole de que la estatua de Moisés era tan bella que ella sola bastaba para honrar la sepultura de Julio II.\n\nEl comentario puso punto final al proyecto; Julio II acabó siendo sepultado en la tumba de su tío, **Sixto IV**, y Miguel Ángel, después de tres años de trabajo, se refería a la obra inacabada como la tragedia de su vida. Representa a Moisés recién bajado del Sinaí –donde ha recibido del Señor las Tablas de la Ley– aún con dos rayos de luz sobre la frente –los poderes–, que contempla al pueblo idólatra. Las estatuas de Lía y Raquel, que representan a la vida activa y a la vida contemplativa, fueron terminadas por Rafaello da Montelupo.", "logi": {"Horario": "8:00 a 12:30 y 15:00 a 19:00", "Costo": "Gratis", "Atención": "Cierra al mediodía. Por eso quedó a la tarde"}, "map": "Basilica di San Pietro in Vincoli, Roma", "id": "s17", "day": "11", "hrs": {"open": [[480, 750], [900, 1140]], "closed": []}, "hv": false, "pri": 1, "src": "fuentes", "ver": ["El **Moisés** de Miguel Ángel, en el brazo derecho del transepto.", "Las **cadenas de San Pedro** en un relicario bajo el altar mayor: las de Jerusalén y las de la prisión romana, que según la tradición se soldaron solas al juntarlas.", "La tumba de Julio II, que quedó inacabada: de las cuarenta estatuas previstas, Miguel Ángel talló apenas unas pocas."], "zone": "Monti y Esquilino"}, {"time": "16:30", "name": "Vuelta al departamento", "tag": "rest", "type": "rest", "quick": "Tarde libre. Domingo tranquilo.", "travel": {"mode": "metro", "dur": 40, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Desde Cavour, línea B una parada hasta Termini, y ahí línea A dirección Battistini hasta Ottaviano."}, "id": "s18", "day": "11", "pri": 3}]}, {"date": "2026-10-12", "phase": 1, "weekday": "Lun", "dd": "12", "title": "Foro Romano · Capitolio", "note": "Foro y Palatino con la entrada del Coliseo: vale un ingreso el día anterior. Tarde de descanso.", "stops": [{"time": "08:20", "name": "Traslado al Foro", "tag": "rest", "type": "rest", "dur": 40, "quick": "Metro A de Ottaviano a Termini y línea B hasta Colosseo.", "logi": {"Combinación": "Línea A hasta Termini, línea B hasta Colosseo", "Boleto": "€1,50 · menores de 10 gratis"}, "id": "s56", "day": "12", "pri": 3}, {"time": "09:00", "name": "Foro Romano y Palatino", "tag": "site", "type": "site", "dur": 180, "quick": "La Vía Sacra, la Curia, el templo de Vesta y el Palatino. Con la entrada Full Experience del Coliseo.", "hist": "Plaza pública, mercado, tribunal y centro religioso de la República y del Imperio. En el Palatino vivieron Augusto y sus sucesores.", "travel": {"mode": "metro", "dur": 40, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Línea A desde Ottaviano hasta Termini, línea B dirección Laurentina hasta Colosseo. Al salir, caminar por Via dei Fori Imperiales hasta Largo della Salara Vecchia (entrada 3) o entrar por Via Sacra junto al Arco de Tito (entrada 2).", "tip": "Abre a las 9:00. Temprano hay menos gente y más sombra."}, "full": "## La vista desde el Capitolio\n\nDesde una terraza situada a la derecha del Palacio Senatorial, se encuentra otra de las más sugestivas panorámicas del Foro Romano. La vista abraza todo el valle del Foro, limitado a la izquierda por la vía de los Foros Imperiales y a la derecha por la ladera del Palatino. Después de la realización de la Cloaca Máxima, construida durante la dinastía de los Tarquinos (los últimos reyes de Roma), el valle pantanoso que se extendía entre el Capitolio, el Palatino, y las laderas del Esquilino, fue saneado y llegó a convertirse en lugar de encuentro de los habitantes que\n\nresidían en las colinas cercanas. A partir de ese momento, el pequeño valle se convirtió en la plaza (el Foro): el centro político, religioso y comercial de Roma. Inmediatamente bajo la terraza, se distingue el Pórtico de los dioses Consejeros. Se trata del consejo de las doce divinidades principales. Formado por dos alas que forman un ángulo obtuso, es el último gran monumento dedicado en Roma al culto pagano.\n\n## Los edificios\n\nFue restaurado por el Prefecto de Roma, amigo de Juliano el Apóstata (367). A la izquierda se distinguen las tres columnas del Templo de **Vespasiano** iniciado por **Domiciano** (81) en honor de Vespasiano y Tito, fue restaurado por Septimio Severo y Caracalla. Desde aquí arriba podemos observar también las columnas del Templo de Saturno. Inaugurado en el año 497 a.C, era uno de los monumentos más venerados de la Roma republicana. Reconstruido por un general de César el año 30 a.C, con el botín de la guerra de Siria, fue durante algún tiempo el lugar donde se custodiaba el tesoro del Estado.\n\nDe sus restos destacan hoy las ocho columnas de granito del pronaos o pórtico. A la izquierda, un poco más abajo, se distingue el ARCO DE SEPTIMIO SEVERO, erigido el año 203 d. C., en honor de quien fue el autor del edicto Ne fiant christiani, que prohibía las conversiones al cristianismo. Con sus 23 metros de anchura, es uno de los más grandes arcos honorarios que existen. La inscripción en las dos caras del friso recuerda las victorias del emperador sobre partos, árabes y adiabenos.\n\nEl estado de conservación de los bajorrelieves no es óptimo; sin embargo, está intacta la estructura general del arco, gracias a haber quedado incluido durante siglos en construcciones de la Edad Media que han impedido el deterioro.\n\n## Cómo el Foro se hizo cristiano\n\n¿Cómo consiguieron los primeros cristianos convertir el Imperio? Antes de introducirnos en el Foro, vale la pena preguntarnos cómo impactó todo esto en los primeros cristianos y cómo hicieron ellos para convertir este imperio. “Hermanos, cuánto puede ser bella la Jerusalén celestial, si así resplandece la Roma terrena” Estas palabras de San Fulgencio, transmitidas por uno de sus discípulos, reflejan la gran admiración que suscitaba la Urbe entre quienes, viajando desde las provincias imperiales, la visitaban por primera vez.\n\nEn esos momentos, a comienzos del siglo VI, Roma ya había sido evangelizada: los antiguos templos paganos llevaban más de un siglo cerrados, y en el mismo Foro Romano se habían construido algunas iglesias cristianas.\n\nEn el himno que dedica a **San Lorenzo**, el poeta Prudencio exulta por la victoria de la fe en el corazón del Imperio: los ciudadanos romanos de antigua estirpe llenan los atrios de las iglesias; los principales del Senado, que antaño tenían como gran honor desfilar como flamines en las procesiones por la Vía Sacra, ahora besan el umbral de los santuarios de los mártires; las familias nobles ven con agrado que sus hijos e hijas dediquen su vida al servicio de la Iglesia; el fuego que ardía en el templo de Vesta se encuentra extinguido, e incluso la decana de las vírgenes vestales que lo guardaban, Claudia, se ha convertido al cristianismo; la Cruz, en resumen, domina sobre los antiguos signos paganos.\n\n## Los que trabajaban acá\n\n¿Cómo fue posible este cambio? Aparte de la acción de Dios, uno de los factores que lo explican es que los primeros cristianos jamás se consideraron ajenos a su ciudad ni a su oficio, por haber abrazado la fe.\n\nNo eran pocos los que desempeñaban su trabajo en los Foros, a menudo en actividades directamente al servicio del Imperio: ya en tiempos de Pedro y Pablo algunos eran patricios y formaban parte de los trescientos senadores que se reunían en la Curia; otros eran jurisconsultos, abogados o jueces; en la Epístola a los Filipenses, que escribió durante su cautividad en Roma, el Apóstol envía saludos de parte de los santos que vivían en la casa del César; y en la Epístola a los Romanos cita los nombres de Aristóbulo y Narciso, que habían sido colaboradores del emperador Claudio. Con casi toda seguridad, algunos miembros de la familia imperial habían abrazado la fe ya a finales del siglo I. **Tito** Flavio Clemente y Flavia Domitila, por ejemplo, eran un matrimonio\n\nemparentado con el emperador Domiciano. Tenían siete hijos, y los dos mayores habían sido escogidos como candidatos al trono y educados para ese fin por el famoso retor Quintiliano. Sin embargo, en el año 95 Flavio Clemente fue ajusticiado repentinamente con la acusación de ateísmo, que solía dirigirse contra los cristianos. Domitila, que fue desterrada a la isla Pandataria, también es conocida porque eran de su propiedad los terrenos de las catacumbas que llevan su nombre. En cuanto a los hijos, nunca llegaron al trono, ya que en el año 96 el propio Domiciano fue asesinado y la dinastía Flavia llegó a su fin.\n\n## Vivir bajo persecución\n\nLa persecución y el martirio representaban un peligro real para los primeros fieles cristianos. Pero, incluso en épocas de tranquilidad, la vida corriente no quedaba exenta de obstáculos.\n\nEn la sociedad romana, las costumbres cotidianas estaban plagadas de actos de adoración a las divinidades: al pedir un préstamo se exigía un juramento en nombre de los dioses, antes de ocupar un cargo público había que ofrecer un sacrificio, al pasar por delante de un templo o de una estatua de una divinidad era uso común descubrirse, y así una larga lista de modos corrientes de obrar cuya omisión era considerada una muestra de incivilidad y una traición a las costumbres patrias.\n\nÉste fue uno de los reproches más insidiosos que Celso dirigió a los cristianos: “¿Se niegan a observar las ceremonias públicas y a rendir homenaje a quienes las presiden? Entonces que renuncien también a tomar la veste viril, a casarse, a ser padres, a ejercer las funciones de la vida; que se vayan todos juntos lejos de aquí, sin dejar la más pequeña semilla de ellos mismos”.\n\nLa opinión pública de entonces compartía en gran medida esta llamativa intolerancia hacia los seguidores de Cristo: cuando menos, se juzgaba a los cristianos gente peculiar, que si se esforzaban por ayudar al prójimo, ser fieles en el matrimonio, pagar los impuestos o evitar escrupulosamente todo engaño en los negocios, lo hacían por fanatismo hacia su extraña religión y queriendo así mostrarse superiores a los demás.\n\nA las interpretaciones mezquinas, se unían las calumnias y los agravios, como el que sufrió un joven llamado Alexameno en el Pedagogium, la escuela de los pajes que entraban al servicio del emperador. Las aulas de esa escuela estaban en el Palatino, junto a los Foros, y allí los arqueólogos han encontrado un grafito que representa a un hombre rezando delante de un crucificado con cabeza de asno. Al lado, se lee esta inscripción: Alexameno adora a su dios. Debajo, con una letra distinta a la anterior, está grabado: Alexameno fiel.\n\nFue la respuesta audaz del joven Alexameno a la burla de sus compañeros. Por otro lado, en muchos ambientes del Imperio la moralidad se hallaba en un estado lamentable: las fiestas estaban plagadas de representaciones teatrales indignas, en el circo se vitoreaban matanzas humanas y el mundo del arte exaltaba a menudo la voluptuosidad; se admitía el divorcio y el índice de natalidad era muy bajo, entre otras cosas porque se recurría al aborto y al infanticidio. Ciertamente no todos los romanos eran así, y es verdad que la moral decayó sobre todo al final del Imperio.\n\nPero siempre se mantuvo la constante de que existían costumbres paganas, muy difundidas, que chocaban con la dignidad humana que el cristianismo había venido a restablecer. Ante todo esto -ambiente degradado, persecución, calumnia, insultos y amenaza real de martirio\u0002los primeros cristianos podrían haber reaccionado desapareciendo de las realidades temporales y refugiándose en un gueto, como les sugería Celso.\n\nSin embargo, no se les pasó por la cabeza hacerlo. Habían encontrado la fe, la vocación cristiana, la llamada a la santidad, en medio de su trabajo: en el foro, en los talleres artesanos, en el ejército, en el carro donde transportaban mercancías... No se sentían menos romanos que sus conciudadanos: amaban la maravillosa Urbe, y consideran el Imperio no sólo bueno, sino providencial, ya que había propiciado una unidad política y cultural en la que se difundiría más fácilmente la fe. Lo único que rechazaban eran las divinidades falsas y las costumbres brutales, que deseaban purificar porque eran plenamente conscientes de ser la sal de la tierra: y lo consiguieron.\n\n## La Cárcel Mamertina\n\nCárcel Mamertina Antes de entrar al Foro y bajando del Capitolio por la escalera que da hacia la Via dei Fori Imperiali puede visitarse la Iglesia de San Lucas y Martina y la Cárcel Mamertina. La IGLESIA DE LOS SANTOS LUCAS Y MARTINA, comprende además otra iglesia inferior, subterránea. Esta segunda fue erigida en el s. VI sobre las ruinas de la estancia del secretario del Senado, y dedicada a la mártir Santa Martina; más tarde, reedificada y restaurada, fue donada en 1588 por **Sixto V** a la Academia de San Lucas, corporación de artistas del s. XIV que estaba anexa a la iglesia.\n\nFue posteriormente demolida para la distribución de los Foros Imperiales. De San Lucas toma el segundo nombre. La iglesia actual fue construida por Pietro da Cortona en 1634, por iniciativa del cardenal Barberini, protector de la Academia. En frente, está la CÁRCEL MAMERTINA, desde tiempos muy remotos e inciertos la prisión principal de Roma, especialmente durante la República.\n\nA veces era llamada **Tullianum**, palabra que se deriva de tullus, o manantial de agua. Consta de dos aposentos hoy unidos por una escalera medieval: el piso inferior, la cárcel propiamente dicha, de forma semicircular y cónica, está construida con gruesos bloques de peperino. Antiguamente comunicaba con el aposento superior sólo por una abertura practicada en el techo, por donde eran arrojados los presos.\n\nLa parte inferior comunicaba a su vez por medio de un corredor con la Cloaca Máxima. En esta cárcel se recluían prisioneros que hoy llamaríamos políticos como Yugurta, Vergincetórix, los cómplices de Catilina... y **San Pedro** y **San Pablo** que permanecieron en esta prisión a la espera del martirio. En la pared apoya un pequeño altar con relieve a modo de Retablo, que representa un hecho narrado por la tradición: el bautismo de los carceleros Proceso y Martiano –luego mártires también–, y de los cuarenta y siete compañeros de prisión, con el agua de una fuente que brotó milagrosamente.\n\nA la izquierda del altar, la tradición señala en una pequeña columna el sitio donde los dos Apóstoles fueron encadenados. En base a esta tradición, desde el Siglo XVI empezó a llamarse San Pietro in Carcere. Entrando al Foro CURIA. A su derecha, oculta en parte por el Arco, se ve la fachada de la Curia, sede del Senado, que fue teatro de los acontecimientos más determinantes de la historia de Roma. El Papa Honorio la transformó el s. VII en iglesia y la dedicó a San **Adriano**. La tradición la hace remontarse a Tulio Ostilio, tercer rey de Roma.\n\n## La Curia y el Comicio\n\n**Julio César** la reedificó completamente más cerca del antiguo Comicio. El actual edificio de ladrillos es de la época de Diocleciano (303 d. C.); la puerta de bronce original fue sacada por el Papa Alejandro VII y colocada en la entrada principal de la Basílica de San Juan de Letrán. El interior de la Curia tiene forma rectangular (27 x 18 m.); las paredes están revestidas hasta cierta altura con lastras de mármol.\n\nPor encima de la decoración en mármol, había tres nichos en cada lado, decorados con pequeñas columnas de alabastro, y a los lados existen tres escalones, todavía visibles, en los que estaban colocados los asientos en madera de los senadores (cerca de 300). El pavimento está formado por incrustaciones de pórfido y mármol serpentino. Delante de la entrada debía de hallarse el ara sobre la que los senadores ofrecían sacrificios al entrar en el aula. En la pared opuesta a la entrada, había un podio para el presidente, y sobre el podio, adosada a la pared, la ESTATUA DE LA VICTORIA.\n\nEsta estatua (su original, pues aquí encontramos una réplica) protagonizó una importante historia: Hasta tiempo después de impuesto el cristianismo, el mundo romano seguía siendo pagano, y era frecuente sentir el balanceo de la hegemonía de una u otra religión. Quizá donde estaba simbolizada esta lucha era en la estatua de la Victoria, el símbolo más venerable del paganismo oficial. Toda de oro macizo, representaba a una mujer de aspecto marcial y formas opulentas, que desbordaban los pliegues holgados de su túnica, ceñido el talle por un cinturón guerrero. La diosa, ágil y robusta, apoyábase sobre un pie desnudo, extendiendo, como un ave divina, sus ricas alas, en actitud de cobijar a la augusta asamblea.\n\nDelante de la estatua había un altar, donde cada senador, al entrar en la curia, quemaba un grano de incienso y derramaba una libación a los pies de la diosa protectora del Imperio. Esta estatua, que para los cristianos era objeto de escándalo y para muchos miembros del patriciado como el postrer vestigio de la pujanza política del paganismo, sufrió numerosas vicisitudes. Durante la lucha de los cultos, que llena todo el siglo IV, la Victoria desciende de su pedestal cuantas veces el cristianismo sale triunfador, y vuelve a encumbrarse en el solio cuando el culto de los dioses reanuda su ofensiva.\n\nEl emperador Constante la retira, la vuelve a restablecer. En el viaje a Roma de **Constantino** la manda de nuevo retirar. Salido Constantino de Roma, la mayoría pagana del Senado la restablece en su sitio. Joviano la deja en paz. Valentiniano la tolera; pero la suprime una orden de Graciano, el primero de los emperadores que se mostró cristiano en la vida pública y en la privada.\n\nEl dolor de los senadores paganos fue grande, y enviaron una comisión a Milán, donde residía el emperador, para pedirle la revocación de la orden; pero los cristianos del Senado se adelantaron, pues llegó antes a Milán una carta del Papa San Dámaso, y Graciano se negó a recibir a los comisarios, persistiendo en su resolución. Todavía la lucha perdura, pues a la muerte trágica de Graciano, ocurrida al año siguiente, ocupa el trono Valentiniano II, de quien creyeron poder obtener en su inexperiencia lo que negara resueltamente el anterior emperador.\n\nEntonces entran en juego dos hombres importantes. Símaco, prefecto de la ciudad de Roma, pagano acérrimo de la vieja escuela, que presenta un alegato lleno de nostalgia por los dioses paganos, que dieron el poderío y grandeza a Roma a través de mil doscientos años de su historia, y **San Ambrosio**, que vindica la causa cristiana. En fin, son los últimos estertores del paganismo clásico. También Prudencio, en su poema Contra Simmacum, nos ha contado los últimos incidentes de este duelo, que acabó con la victoria definitiva del cristianismo.\n\nVincendi quaeris dominam? Sua dextera cuique est et Deus omnipotens \"¿Quieres saber cuál es la diosa Victoria? El propio brazo de cada uno y la ayuda de Dios todopoderoso.\" La Victoria pagana ha plegado definitivamente sus alas para abrirlas al lábaro de la cruz. Siguiendo el itinerario, a la izquierda del Arco de Septimio Severo se distinguen los ROSTRI (rostros), la tribuna desde la que hablaban los oradores políticos. El nombre le viene del motivo de adorno: seis espolones de bronce, botín de las naves enemigas en la batalla de Actium (338 a.C.).\n\n## Los Rostra\n\nSe sabe que estaban decorados con columnas y estatuas de homenaje; y que los dos bajorrelieves, llamados los Anaglipha o Plutei de **Trajano**, adornaban el parapeto de los Rostra. Se conservan en la Curia y son interesantísimos por los hechos históricos que representan y por la escenografía del mismo Foro. Sobre una de las caras, aparecen esculpidas las víctimas de los sacrificios solemnes; y sobre las otras, la institución alimentaria en favor de los niños pobres y huérfanos (Roma veía en la asistencia a los niños la tutela de la patria), y los hechos gloriosos de la vida de Trajano.\n\nLa colocación actual de los Rostros es de Julio César, que los situó en el mismo eje de la plaza alineados con las basílicas Julia y Emilia. Existían en el Foro otros podios para los oradores, uno frente al templo de los Dióscuros y otro frente al templo de Julio César. Dando la espalda a los Rostri, y en plena Plaza del Foro, nos encontramos con la COLUMNA DE FOCAS, la última memoria Clásica del Foro.\n\nA principios del s. VII el emperador de Bizancio. Focas, permitió al Papa Bonifacio IV que transformara el Panteón en una iglesia cristiana; los romanos, en señal de gratitud, quitaron una bella columna acanalada del pórtico de un edificio antiguo y la levantaron aquí en memoria de Focas. El Foro viene atravesado de este a oeste por la VIA SACRA, que recibe su nombre de los santuarios paganos que la rodeaban y de las procesiones que en ella se realizaban.\n\nEn este camino se cuenta que se encontraron San Pedro y San Pablo. En los lados largos del Foro, y limitando a la Via Sacra, se encontraban las dos grandes basílicas paganas; la que limita el lado Sur del Foro se conocía con el nombre de BASÍLICA JULIA que, devastada por un incendio, sufrió varias reconstrucciones hasta ser destruida definitivamente por los godos de Alarico (410 d.C.); ahora sólo queda parte del pavimento.\n\n## Los templos\n\nCerraban el lado sudeste de la plaza, confiriéndole un aspecto monumental, los tres templos que en cierto sentido resumían el aspecto religioso del Foro: El Templo de Cástor y Pólux, el Templo de Vesta y el Templo de César. El TEMPLO DE CÁSTOR Y PÓLUX, erigido al lado de la Basílica Julia el año 484 a. C, fue reconstruido muchas veces en distintas épocas; los restos actuales, tres hermosas columnas con su cornisa, son de la época de Tiberio (s. I a.C.).\n\nEste templo se identifica con el nacimiento de la república Romana y surgió en el lugar en el que, según la leyenda transmitida por Plutarco, aparecieron Cástor y Pólux, con sus caballos, para anunciar a los romanos la victoria conseguida por el pueblo frente al último rey de Roma (496 a.C.). En la reconstrucción mandada hacer por Tiberio (19 d. C.). el templo surgía sobre un alto podio con una escalinata recubierta de mármol.\n\nEn el pronao había una oficina en la que se guardaban los pesos y medidas. Más allá de este templo, hay una galería de tufo que recuerda el ambiente frío y desnudo de las catacumbas: a la izquierda está el oratorio de los cuarenta mártires de Sebaste, martirizados por Licinio, emperador de Oriente a principios del s. IV, cuando en Occidente la Iglesia conocía una época de paz; en el ábside se pueden ver sus figuras.\n\nCon caras expresivas y unas cruces bizantinas. Al fondo de la galería hay una basílica del s. VIII: SANTA MARIA ANTICA, en una hornacina aún se puede contemplar una imagen de Nuestra Señora con el Niño en brazos. El TEMPLO DE VESTA, levemente retrocedido respecto al Foro, fue construido tal vez por el mismo Numa Pompilio, segundo rey de Roma y fundador del culto a Vesta. En este templo, el más importante del Foro y de la ciudad, las vírgenes Vestales mantenían el fuego sagrado, símbolo de la vida de la ciudad.\n\n## Las Vestales\n\nLas vírgenes eran seis, elegidas entre las familias más nobles de la ciudad. Debían pronunciar el voto de castidad y quedaban en ese cargo durante 30 años; disfrutaban de numerosos privilegios, pero en caso de que faltasen a sus deberes eran sepultadas vivas. El templo era redondo, con una abertura en lo alto. Surgía sobre una base cuadrada y lindaba con la Casa de las Vestales, en la que se ven todavía muchas estatuas e inscripciones; de una de ellas ha sido borrado el nombre de la Vestal, dejando sólo la primera letra C.\n\n## Antonino y Faustina\n\nSiguiendo la Via Sacra, y prácticamente enfrente de la Casa de las Vestales, se encuentra el TEMPLO DE ANTONINO Y FAUSTINA, el edificio mejor conservado del Foro, que fue erigido por decreto del Senado a la divinización de la mujer de Antonino Pío (muerta en el año 141). En tiempos de este emperador, murió mártir San Policarpo de Esmirna, discípulo de San Juan, a quien San Justino dedicó el año 155 su Apología, en defensa de los cristianos.\n\nA la muerte de Antonino (año 161), el templo se dedicó a los dos: Antonino y Faustina. El podio se ha conservado por entero, aunque las escalinatas están totalmente restauradas. Destacan las 10 columnas monolíticas del pronao, de 17 m. de altura; las bases y los capiteles son de mármol blanco y uno de los mejores ejemplos del arte decorativo romano. En el s. XI, el templo fue transformado en iglesia: San Lorenzo en Miranda. BASÍLICA DE MAJENCIO Y CONSTANTINO. Fue iniciada por **Majencio** y terminada y modificada por Constantino, después de haber vencido a Majencio en la batalla del Puente Milvio el año 312 d.\n\nC. La única columna que quedó intacta después de los terremotos y expoliaciones. fue transportada en 1614 a la plaza de Santa María la Mayor por el Papa Paulo V. De la colosal estatua de Constantino que se hallaba en el fondo de la nave central, no han llegado hasta nosotros más que la cabeza y algunos fragmentos, que hoy se encuentran en el Palacio de los Conservadores, en el Capitolio. ARCO DE TITO. Surge al final de la Vía sacra, cerca de la salida del Foro. Fue erigido, después de la muerte del emperador, para celebrar la victoria contra los judíos, el año 70 d.\n\nC. Tiene un sólo arco de 15.40 metros de altura, 13.50, de ancho y 4,75 de profundidad. Es el arco más antiguo de todos los que se conservan en Roma, Se atribuye a Tito por la dedicatoria de la parte este del ático (el senado y el pueblo de Roma al divino Tito, hijo (“f”, filio) del divino Vespasiano, Vespasianus Augustus). Se debió erigir en honor de Tito, a poco de su muerte en el año 81.\n\n## El Arco de Tito\n\nEs una estructura sencilla de un único vano flanqueado por dos grandes pilares, con bóveda de cañón artesonado en el interior. El valor del arco de Tito reside en su decoración escultórica, sobria en el exterior (friso y enjutas del arco) y desbordante bajo la bóveda, donde altorrelieves de gran formato presentan la entrada triunfal de Vespasiano y Tito, el año 70 d.C., en la arrasada Jerusalén y el desfile de los trofeos arrancados a los judíos. Los dos grandes paneles representan dos episodios del triunfo en Judea e imponen un nuevo concepto escultórico diferente a lo hecho hasta entonces.\n\nEl panel del lado sur muestra el inicio de la ceremonia, es decir, la procesión cruzando la puerta de la victoria (la Porta Triumphalis, reconocible por las dos cuadrigas que la coronan), que está representada en el lado derecho, mientras que los sirvientes traen el botín desde el templo de Jerusalén (las trompetas de plata, los candelabros de siete brazos), y los paneles provistos de asas en los que probablemente se fijaron las inscripciones que explicaban lo que eran los objetos y los nombres de las ciudades.\n\nPor otra parte, el panel del lado norte representa el episodio central de la celebración del triunfo, es decir, el emperador Tito que, acompañado de una diosa de la Victoria que le corona, avanza sobre una cuadriga precedida por lictores y dirigida por la diosa Roma, seguido de las figuras alegóricas del pueblo y del senado romano, representados, respectivamente, por un hombre joven con el torso desnudo y un hombre viejo vestido con toga. Cuando el arco fue levantado, Tito había muerto. En lo más alto del intradós del arco un relieve lo muestra en su transporte al cielo a lomos del águila de la consecratio. Esta circunstancia aconsejó sin duda no representarlo en compañía de los vivos, sino de figuras alegóricas, aunque el hecho que se conmemoraba fuese histórico.", "logi": {"Horario": "9:00 a 18:30 · último ingreso 17:30", "Costo": "Incluido en la entrada del Coliseo", "Terreno": "Empedrado irregular, poca sombra", "Sobre el horario": "Vale un ingreso al Foro y Palatino el día del Coliseo, el anterior o el siguiente. Cada uno con su entrada y documento.", "Entrada": "Full Experience del Coliseo · un ingreso, el día antes"}, "map": "Foro Romano, Roma", "id": "s60", "day": "12", "hrs": {"open": [[540, 1110]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **Curia**, la sala del Senado, entera y en pie.", "El **Arco de Tito**: adentro, el relieve del candelabro de siete brazos saqueado del Templo de Jerusalén.", "La **casa de las Vestales**, con el estanque y las estatuas de las sacerdotisas.", "En el Palatino, la casa de Augusto y los restos de los palacios imperiales.", "La vista del Foro desde los Orti Farnesiani, arriba: la mejor foto del día."], "zone": "Roma antigua"}, {"time": "12:15", "name": "Cárcel Mamertina", "tag": "site", "type": "site", "dur": 30, "quick": "La celda donde estuvieron presos San Pedro y San Pablo.", "hist": "El Tullianum, la prisión de Estado de la Roma republicana. La tradición sitúa aquí el encarcelamiento de los dos Apóstoles antes del martirio.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Salir del Foro por la entrada de Via di San Pietro in Carcere (4): la Mamertina está ahí mismo, al pie del Capitolio."}, "full": "## La prisión del Estado\n\nAntes de entrar al Foro y bajando del Capitolio por la escalera que da hacia la Via dei Fori Imperiali puede visitarse la Iglesia de San Lucas y Martina y la Cárcel Mamertina. La IGLESIA DE LOS SANTOS LUCAS Y MARTINA, comprende además otra iglesia inferior, subterránea. Esta segunda fue erigida en el s. VI sobre las ruinas de la estancia del secretario del Senado, y dedicada a la mártir Santa Martina; más tarde, reedificada y restaurada, fue donada en 1588 por **Sixto V** a la Academia de San Lucas, corporación de artistas del s. XIV que estaba anexa a la iglesia.\n\nFue posteriormente demolida para la distribución de los Foros Imperiales. De San Lucas toma el segundo nombre. La iglesia actual fue construida por Pietro da Cortona en 1634, por iniciativa del cardenal Barberini, protector de la Academia. En frente, está la CÁRCEL MAMERTINA, desde tiempos muy remotos e inciertos la prisión principal de Roma, especialmente durante la República.\n\n## El Tullianum\n\nA veces era llamada **Tullianum**, palabra que se deriva de tullus, o manantial de agua. Consta de dos aposentos hoy unidos por una escalera medieval: el piso inferior, la cárcel propiamente dicha, de forma semicircular y cónica, está construida con gruesos bloques de peperino. Antiguamente comunicaba con el aposento superior sólo por una abertura practicada en el techo, por donde eran arrojados los presos.\n\nLa parte inferior comunicaba a su vez por medio de un corredor con la Cloaca Máxima. En esta cárcel se recluían prisioneros que hoy llamaríamos políticos como Yugurta, Vergincetórix, los cómplices de Catilina... y **San Pedro** y **San Pablo** que permanecieron en esta prisión a la espera del martirio. En la pared apoya un pequeño altar con relieve a modo de Retablo, que representa un hecho narrado por la tradición: el bautismo de los carceleros Proceso y Martiano –luego mártires también–, y de los cuarenta y siete compañeros de prisión, con el agua de una fuente que brotó milagrosamente.\n\n## Pedro y Pablo\n\nA la izquierda del altar, la tradición señala en una pequeña columna el sitio donde los dos Apóstoles fueron encadenados. En base a esta tradición, desde el Siglo XVI empezó a llamarse San Pietro in Carcere. Entrando al Foro CURIA. A su derecha, oculta en parte por el Arco, se ve la fachada de la Curia, sede del Senado, que fue teatro de los acontecimientos más determinantes de la historia de Roma. El Papa Honorio la transformó el s. VII en iglesia y la dedicó a San **Adriano**. La tradición la hace remontarse a Tulio Ostilio, tercer rey de Roma.\n\n## El Comicio y la Curia\n\n**Julio César** la reedificó completamente más cerca del antiguo Comicio. El actual edificio de ladrillos es de la época de Diocleciano (303 d. C.); la puerta de bronce original fue sacada por el Papa Alejandro VII y colocada en la entrada principal de la Basílica de San Juan de Letrán. El interior de la Curia tiene forma rectangular (27 x 18 m.); las paredes están revestidas hasta cierta altura con lastras de mármol.\n\nPor encima de la decoración en mármol, había tres nichos en cada lado, decorados con pequeñas columnas de alabastro, y a los lados existen tres escalones, todavía visibles, en los que estaban colocados los asientos en madera de los senadores (cerca de 300). El pavimento está formado por incrustaciones de pórfido y mármol serpentino. Delante de la entrada debía de hallarse el ara sobre la que los senadores ofrecían sacrificios al entrar en el aula. En la pared opuesta a la entrada, había un podio para el presidente, y sobre el podio, adosada a la pared, la ESTATUA DE LA VICTORIA.\n\nEsta estatua (su original, pues aquí encontramos una réplica) protagonizó una importante historia: Hasta tiempo después de impuesto el cristianismo, el mundo romano seguía siendo pagano, y era frecuente sentir el balanceo de la hegemonía de una u otra religión. Quizá donde estaba simbolizada esta lucha era en la estatua de la Victoria, el símbolo más venerable del paganismo oficial. Toda de oro macizo,", "logi": {"Horario": "9:00 a 17:00", "Costo": "€10 aprox.", "Acceso": "Escalera empinada hasta la celda inferior"}, "map": "Carcere Mamertino, Roma", "id": "s61", "day": "12", "hrs": {"open": [[540, 1020]], "closed": []}, "hv": false, "pri": 2, "src": "fuentes", "ver": ["El **Tullianum**, la celda inferior: se baja por una escalera empinada al pozo donde estuvieron los Apóstoles.", "La columna a la que, según la tradición, ataron a San Pedro.", "El manantial que, dice la tradición, brotó ahí para que Pedro bautizara a sus carceleros."], "zone": "Roma antigua"}, {"time": "12:50", "name": "Campidoglio y Santa Maria in Aracoeli", "tag": "site", "type": "site", "dur": 45, "quick": "La plaza de Miguel Ángel y la iglesia sobre la colina capitolina.", "hist": "Miguel Ángel rediseñó la plaza en 1536 para la visita de Carlos V. Aracoeli está sobre el templo de Juno Moneta, donde según la leyenda la Sibila anunció a Augusto el nacimiento de Cristo.", "travel": {"mode": "walk", "dur": 4, "costAd": "Gratis", "costCh": "Gratis", "how": "Subir la escalinata de la Cordonata o la de Aracoeli: la iglesia es la de los 124 escalones, a la izquierda."}, "full": "## Sobre el templo de Juno\n\nSurge en la cima más alta de la colina Capitolina. Esta iglesia, una de las primeras dedicadas a Santa María, fue construida entre el s. IV y el VII, en el lugar que según la leyenda, la Sibila había anunciado a **Augusto** quién sería su sucesor: un niño hebreo, Rey del Cielo. En ese mismo lugar, Augusto erigió un altar, y entre el s. IV y VII se levantó un monasterio y la iglesia. El aspecto actual de la iglesia es fruto de la reconstrucción románico–gótica realizada a principios del s. XIII.\n\nFue abadía benedictina en el s. X y pasó a los franciscanos en 1250. Durante la época medieval, la basílica fue una especie de foro o centro político–administrativo, donde se tenían las reuniones y debates de las asambleas populares (en aquel momento se vio la posibilidad de organizar un Ayuntamiento libre). En Santa Maria d'Aracoeli se celebró el triunfo de Marco Antonio Colonna en la batalla de Lepanto (1571); como recuerdo se cubrió de oro el techo que recorre toda la nave.\n\n## Los 122 escalones\n\nLa escalinata tiene 122 peldaños de mármol, y fue construida en 1348. La iglesia está dividida en tres naves. separadas por 22 columnas procedentes de diversos edificios de época romana. Bajo el pavimento cosmatesco (fines del s. XIII). se hallan sepulcros de los s. III y IV; el techo, con símbolos navales, conmemora la victoria de Lepanto. En la parte alta de la contra fachada se puede apreciar la enorme inscripción de Urbano VIII sostenida por dos virtudes, de la escuela de **Bernini**; y en la parte derecha, sobre el muro, la piedra sepulcral del archidiácono Giovanni Crivelli, obra de Donatello.\n\nEn el pavimento. sobre la tercera columna de la izquierda, se encuentra la inscripción: “cubículo”de los Augustos, atravesada por un agujero inclinado que probablemente servía para las observaciones celestes; sobre la siguiente columna, un fresco de influencia sienesa de la Virgen Refugium Peccatorum (s. XV); delante, la tumba del Magister Aldus, constructor de la Iglesia. En las naves laterales destaca la Capilla Bufalini con la historia de San Bernardo, decorada con espléndidos frescos de **Pinturicchio** (1486).\n\n## El interior\n\nEn el altar mayor, barroco, destaca una antigua imagen bizantina de la Virgen (s. X). Se la conoce como Madonna di S. Luca. A ella consagró Pío XII la ciudad de Roma en 1948. A la izquierda del altar mayor, en la capilla de san Gregorio, están los restos del beato Juan de Triora, mártir en China (+ 1816). Al centro del transepto izquierdo, la Capilla de **Santa Elena**, elegante construcción de 1605.\n\nEn el interior del altar se halla una urna de pórfido que contiene los restos de Santa Elena; sobre la urna, un poco más abajo del actual pavimento, se encuentra la Aparición de la Virgen a Augusto, un altar cosmatesco de finales del s. XIII colocado sobre el ara que –según leyenda–mandó construir el propio Augusto, después de la aparición de la profetisa. En una capilla al lado de la sacristía, se conserva el famoso **Santo Bambino**, muy popular y venerado en Roma.\n\n## El Santo Bambino\n\nLa imagen original fue robada hace años; se trataba de una escultura realizada con madera de olivo del Getsemaní a finales del s. XIII, revestida según la costumbre de la época para los recién nacidos, y adornada con exvotos.\n\nEn el viejo convento, demolido para hacer el llamado Altar de la Patria (o Máquina de Escribir, como la llaman los que no les gusta, que son todos los que tienen un poco de buen gusto), que fue Curia Generalicia de los Franciscanos Menos, vivieron varios santos: san Buenaventura (+ 1274), san Diego de Alcalá (+ 1463), san Juan de Capistrano (+ 1456), san Bernardino de Siena (+ 1444), san Juan de la Marca (+ 1476) y otros.", "logi": {"Horario": "9:00 a 18:30", "Costo": "Gratis", "No perderse": "El Santo Bambino y la vista del Foro desde el mirador"}, "map": "Piazza del Campidoglio, Roma", "id": "s62", "day": "12", "hrs": {"open": [[540, 1110]], "closed": []}, "hv": false, "pri": 2, "src": "fuentes", "ver": ["La plaza de **Miguel Ángel** con el pavimento en estrella y el Marco Aurelio ecuestre (el original está adentro de los museos).", "El **Santo Bambino** de Aracoeli, en su capilla: los chicos de Roma le escriben cartas.", "La **capilla Bufalini**, primera de la derecha: frescos de Pinturicchio con la vida de San Bernardino.", "El mirador detrás del Palazzo Senatorio, con el Foro entero abajo."], "zone": "Roma antigua"}, {"time": "13:45", "name": "Almuerzo en Monti", "tag": "food", "type": "food", "dur": 75, "quick": "Bajando del Capitolio, Monti tiene trattorias tranquilas.", "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Bajar hacia Piazza Venezia, tomar Via dei Fori Imperiales unos metros y subir por Via Baccina o Via Madonna dei Monti."}, "logi": {"Costo adultos": "€15 a €25", "Costo niños": "€8 a €12"}, "id": "s59", "day": "12", "pri": 3}, {"time": "15:15", "name": "Vuelta y tarde libre", "tag": "rest", "type": "rest", "quick": "Descanso después de una mañana de mucho caminar.", "travel": {"mode": "bus", "dur": 35, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Bus 64 desde Piazza Venezia hasta la parada final, Stazione San Pietro: queda al lado del departamento.", "tip": "El 64 va lleno: cuidar bolsos."}, "id": "s22", "day": "12", "pri": 3}]}, {"date": "2026-10-13", "phase": 1, "weekday": "Mar", "dd": "13", "title": "Letrán · Coliseo", "note": "De Santa Croce al Coliseo caminando hacia el oeste. Coliseo 16:00: estar 15:40 en la entrada 1 (Piazza del Colosseo, lado Valadier).", "stops": [{"time": "08:30", "name": "Traslado a Santa Croce", "tag": "rest", "type": "rest", "dur": 45, "quick": "Metro A directo de Ottaviano a San Giovanni, y diez minutos a pie.", "id": "s35", "day": "13", "pri": 3}, {"time": "09:15", "name": "Santa Croce in Gerusalemme", "tag": "site", "type": "site", "dur": 50, "quick": "Las reliquias de la Pasión que trajo Santa Elena.", "hist": "Levantada dentro del palacio de Santa Elena, madre de Constantino, para custodiar las reliquias que trajo de Tierra Santa hacia el año 325.", "travel": {"mode": "metro", "dur": 40, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Línea A desde Ottaviano dirección Anagnina, directo hasta San Giovanni. Salir por Piazzale Appio, cruzar la muralla por Porta San Giovanni y caminar por Viale Carlo Felice, entre jardines, hasta la basílica.", "tip": "Sin trasbordos."}, "full": "## La pregunta de Constantino\n\n\"¿pero dónde está el trofeo de la victoria? ¿Yo estoy en un trono y la cruz del Señor enterrada en el polvo? ¿Yo estoy rodeada de oro y el triunfo de Cristo entre las ruinas? (...). Veo que has hecho todo lo posible, diablo, para que fuese sepultada la espada que te ha reducido a la nada\". **Santa Elena** Entre los judíos estaba prohibido sepultar a los condenados en el cementerio común, y ése fue uno de los motivos por los que llevaron el cuerpo de Jesús a un sepulcro particular, donado por José de Arimatea.\n\nTambién los instrumentos de tortura usados para las ejecuciones se consideraban impuros, y por eso se enterraban o eran arrojados en alguna hendidura del terreno, fuera del alcance de la gente. No menos ignominiosa que esos instrumentos debía de resultar la colina del Gólgota para los habitantes de Jerusalén, como revelan las connotaciones siniestras de su nombre latino: locus calvariae, lugar de la calavera. Después de la Resurrección del Señor, sin duda produjo gran sorpresa en la ciudad el hecho de que los cristianos se acercasen con frecuencia a aquel desolador paraje, para arrodillarse en la tierra que había sido bañada por la sangre de Cristo y rezar junto al\n\nagujero donde había sido plantada la Cruz; también acudían a besar la roca en que había reposado su cuerpo muerto. Muy posiblemente esa costumbre tuvo que ser interrumpida en algunas épocas, a causa de las persecuciones y de otros avatares, como la destrucción de Jerusalén en el año 70 de nuestra era. No obstante, aún debía de conservarse en el siglo II, pues el emperador **Adriano** (117-138) mandó rellenar con tierra la depresión que separaba el Gólgota del Santo Sepulcro y en esa nueva plataforma hizo edificar dos templos: uno dedicado ajuno, sobre el Sepulcro; y otro dedicado a Venus, en la cima del Gólgota.\n\n## El Calvario sepultado\n\nSe sabe que Adriano sintió gran animadversión hacia el cristianismo al final de su vida, y es casi seguro que la construcción de estos templos tenía como fin borrar para siempre las huellas terrenas de la Redención. Los primeros historiadores eclesiásticos comentaban no sin cierta ironía el paradójico resultado que, con el correr del tiempo, tuvieron estos esfuerzos de los paganos. ¡Pobres hombres! –les apostrofaba Eusebio de Cesarea–¡Creían que era posible esconder al género humano el esplendor del sol que se había levantado sobre el mundo!\n\nAún no comprendían que es imposible mantener oculto bajo tierra a Quien ha obtenido ya la victoria sobre la muerte. En efecto, en el siglo IV, cuando la Iglesia gozó al fin de libertad, los dos templos paganos permitieron localizar sin margen de error la situación de los Santos Lugares: bastó derruirlos y excavar debajo para encontrar el Santo Sepulcro y la cima del Calvario. La invención (descubrimiento) de la Santa Cruz. La gran impulsora del redescubrimiento de los Lugares de la Pasión fue la Emperatriz Santa Elena, que en el año 326 viajó a Tierra Santa.\n\n## Santa Elena\n\nLa madre de **Constantino** era ya de avanzada edad –debía de frisar los ochenta años–, pero no quería morir sin antes haber rezado en la tierra donde el Señor había vivido, muerto y resucitado. Tenemos pocos datos sobre la juventud de Elena. Probablemente nació en Bitinia y tuvo origen humilde. Según **San Ambrosio** era stabularia –esto es, camarera o sirvienta en una posada–antes de casarse con Constancio Cloro en el 273, unión de la que nació Constantino al año siguiente. Constancio era un ambicioso oficial del ejército romano, que en el 293 alcanzó la dignidad de César.\n\nEse mismo año repudió a su esposa, que no tenía sangre noble, y Elena quedó en la sombra hasta que en el 306 su hijo Constantino le dio el título de Emperatriz. En ese momento Elena ya era cristiana, y se sirvió de la privilegiada posición que ocupaba para hacer el bien, ejercitando la caridad entre los necesitados e impulsando la extensión y dignidad del culto. Tanto brillaba por su fe y su piedad, que San Ambrosio no dudaba en tejer su alabanza diciendo: Mujer grande, que ofreció al emperador mucho más que lo que recibió de él.\n\n## El viaje a Jerusalén\n\nA su paso por Tierra Santa se debe la construcción de las primitivas basílicas de la Natividad, en Belén, y de la Ascensión, en el Monte de los Olivos. En cuanto al Gólgota, cuando Elena llegó a Jerusalén acababan de ser demolidos los templos paganos, de modo que la Emperatriz pudo cumplir su sueño de arrodillarse en la tierra sobre la que Nuestro Salvador había sido levantado en la Cruz y de rezar en la roca del Santo Sepulcro. Sin embargo, allí mismo reparó en que no se había hallado todavía la más importante de las reliquias.\n\nSan Ambrosio nos la describe con gran viveza, caminando entre las ruinas de los templos romanos acompañada de soldados y obreros. Y preguntándose: “He aquí el lugar de la batalla: ¿pero dónde está el trofeo de la victoria? ¿Yo estoy en un trono y la cruz del Señor enterrada en el polvo? ¿Yo estoy rodeada de oro y el triunfo de Cristo entre las ruinas? (...). Veo que has hecho todo lo posible, diablo, para que fuese sepultada la espada que te ha reducido a la nada”.\n\n## El hallazgo de la Cruz\n\nLas nuevas excavaciones que la Emperatriz mandó hacer tuvieron fruto cuando, al remover un terreno cercano al Gólgota, se encontraron tres cruces, y la tabla sobre la que se había escrito en hebreo, griego y latín: Jesús Nazareno Rey de los Judíos. Así se produjo la invención -el descubrimiento: inventio en latín significa venir hasta algo, encontrar- de la Santa Cruz del Señor, que había permanecido oculta durante tres siglos.\n\n## Las reliquias en Roma\n\nLa Santa Emperatriz dejó la mayor parte de las reliquias en Jerusalén, pero llevó consigo a Roma tres fragmentos de la Vera Crux, el título de la condena, uno de los clavos y algunas espinas de la corona que sus verdugos impusieron a Jesús. También hizo trasladar una gran cantidad de tierra del Gólgota y las gradas de piedra de la escalera que el Señor recorrió cuatro veces el día de su pasión, para comparecer ante Pilatos en el Pretorio.\n\n## La basílica Sessoriana\n\nLa Basílica Sessoriana, o Sancta Hierusalem. Existen numerosos documentos de los siglos IV y V que describen cómo a partir de la visita de Santa Elena los cristianos veneraban las reliquias de la Pasión que habían quedado en Jerusalén. Así lo atestiguan Eusebio, Rufino, Teodoreto y San Cirilo de Jerusalén. Egeria, una mujer que peregrinó a los Santos Lugares en el siglo IV, habla de multitudes de fieles que ya por entonces acudían de todo el Oriente cristiano para tomar parte en las solemnidades en honor de la Cruz.\n\nOtro historiador, Sócrates el Escolástico, recogió a mediados del siglo V una piadosa tradición según la cual, durante la travesía marítima que realizó la emperatriz para volver a Roma desde Jerusalén, habría sobrevenido una fuerte tempestad. La nave se debatía entre las olas a punto de naufragar, hasta que Santa Elena -después de atarlo con una cuerda para echarlo por la borda- hizo que tocara las aguas el Santo Clavo que llevaba consigo, y el mar se calmó al instante.\n\nEse Clavo, los tres fragmentos de la Cruz y el INRI fueron piadosamente custodiados por Santa Elena en su residencia imperial: el palacio Sessoriano. Al cabo de algunos años, posiblemente después de la muerte de su madre, Constantino quiso que se construyera allí una basílica que tomó el nombre del palacio, Basílica Sessoriana, aunque también era llamada Sancta Hierusalem.\n\n## El edificio\n\nDe hecho los muros perimetrales de la Basílica actual son de la época imperial. Como cimiento simbólico de esta construcción se puso la tierra del Gólgota que la Emperatriz había traído desde Palestina, y los preciosos fragmentos de la Santa Cruz se ofrecían a la vista de los fíeles en un relicario de oro adornado con gemas. De la primitiva basílica constantiniana sólo se conservan algunos restos pertenecientes a los muros exteriores. A esa edificación siguió otra del siglo XII, a su vez sustituida por el templo de estilo barroco tardío, terminado en 1744, que puede contemplarse actualmente.\n\nA pesar de estos cambios arquitectónicos y de otras vicisitudes históricas, como las invasiones padecidas por Roma, toda una colección de documentos atestigua que las reliquias que se veneran en esta basílica son las mismas que trajo Santa Elena desde Tierra Santa. Es del todo natural que este lugar se convirtiese enseguida en meta de la piedad del pueblo cristiano.\n\nMuy pronto se empezó a celebrar allí la liturgia del Viernes Santo. Hasta el siglo XIV, el Papa en persona, con los pies descalzos, encabezaba la procesión que iba desde la Basílica del Laterano hasta la Basflica de la Santa Cruz, para adorar la vexilla crucis, la bandera de la Cruz, el estandarte de la salvación. En el s.XII, el Papa Lucio II hizo algunas mejoras, entre las que destaca el campanario románico, para cuya construcción no se alteraron las paredes exteriores.\n\nTambién se levantó el nivel del pavimento interior, pero no el de la capilla de Santa Elena, probablemente debido a la tradición que dice que está hecho con tierra traída del Monte Calvario. Esta capilla estaba aislada del resto de la iglesia, y tenía una entrada independiente, hasta la época del Renacimiento. La Basílica adquirió su aspecto actual en el s.XVIII. Junto al Campanario se puede apreciar la fachada y el atrio oval, construido de acuerdo con los principios de **Borromini**.\n\n## El interior\n\nEn el interior destacan, nada más entrar, el pavimento cosmatesco, **el baldaquino** (s.XVIII) y el ábside, con la tumba del Cardenal Quiñones (1540), confesor de Carlos V, y un fresco de Antoniazzo Romano (finales del s.XV), que ilustra la tradición del hallazgo de la Santa Cruz por Santa Elena. Hacia la mitad de la nave derecha, en una capilla lateral, se encuentra una imagen de Nuestra Señora, Madre del Buen Consejo.\n\nAl fondo de esta misma nave, se encuentra la puerta por la que se accede la Capilla de Santa Elena, decorada con un mosaico de una finura y esplendor singulares (se puede encender la luz en el pilar externo del arco enfrente del altar). La estatua sobre el altar es una representación romana clásica de Juno, hábilmente convertida en Santa Elena. La visita más importante en esta Basílica es a la Capilla de las Reliquias de la Pasión. Al inicio de la escalera se encuentra el brazo transversal de la cruz de San Dimas, el Buen Ladrón. Tras el altar se encuentran las reliquias de la Santa Cruz. Se conservan: tres trozos de la Santa Cruz, un clavo, parte del INRI, dos espinas de la Corona, fragmentos de la columna de la flagelación, de la Gruta de Belén y del Santo Sepulcro, y el dedo índice de Santo Tomás Apóstol.\n\nRecomiendo ver el crucifijo realizado por Mons. Giulio Ricci con todos los datos de la Sábana Santa. Actualmente lo han puesto en una habitación muy pequeña en la misma cripta de las reliquias de la Pasión. Aquí está enterrada la venerable Antonietta Meo, muerta en olor de santidad a los seis años de edad (3 de julio de 1937).", "logi": {"Horario": "7:00 a 12:45 y 15:30 a 19:30", "Costo": "Gratis", "Reliquias": "Capilla al fondo a la izquierda: fragmentos de la Cruz, un clavo, dos espinas y el titulus", "Sobre el horario": "Verificar: durante el jubileo abrió corrido de 7:30 a 19:30."}, "map": "Basilica di Santa Croce in Gerusalemme, Roma", "id": "s39", "day": "13", "hrs": {"open": [[420, 765], [930, 1170]], "closed": []}, "hv": false, "pri": 1, "src": "fuentes", "ver": ["La **capilla de las reliquias**, al fondo a la izquierda subiendo una rampa: fragmentos de la Cruz, un clavo, dos espinas y el **titulus** que Pilato mandó clavar.", "El dedo de Santo Tomás, el que metió en el costado de Cristo.", "La **capilla de Santa Elena**, en el nivel inferior: el piso está hecho con tierra del Calvario que ella trajo.", "La tumba de la venerable Antonietta Meo, muerta a los seis años."], "zone": "Letrán"}, {"time": "10:15", "name": "Scala Santa", "tag": "mass", "type": "mass", "dur": 50, "quick": "Los 28 escalones del pretorio de Pilato. Se suben de rodillas.", "hist": "Traída de Jerusalén por Santa Elena y trasladada aquí por Sixto V en 1589. Arriba está el Sancta Sanctorum, la capilla privada de los papas medievales.", "travel": {"mode": "walk", "dur": 12, "costAd": "Gratis", "costCh": "Gratis", "how": "Volver por Viale Carlo Felice hacia Letrán. La Escala Santa es el edificio frente al lateral de la basílica, sobre Piazza di San Giovanni in Laterano."}, "full": "## Los veintiocho escalones\n\n**Sixto V** (1585–90) mandó demoler lo que quedaba del Palacio Laterano medieval, con dos excepciones: la Scala Santa, escaleras que de acuerdo con la tradición pertenecieron al palacio de Poncio Pilato y por las que subió Cristo el Viernes Santo, y la capilla privada de los Papas. Fueron trasladadas a un lugar cercano al original, en una construcción especialmente diseñada por Domenico Fontana para albergar la escalera, que tradicionalmente se sube de rodillas, en memoria de la Pasión del Señor. Los 28 escalones de mármol están recubiertos de madera, para aligerar la subida y para evitar el desgaste.\n\nEn ciertos puntos, unos trozos de vidrio cubren manchas tradicionalmente consideradas gotas de la Sangre de Nuestro Señor. Al final de la escalera se llega al ambulatorio de la Capilla de **San Lorenzo** papal, también llamada **Sancta Sanctorum**, por las preciosas reliquias que contiene. Está siempre cerrada, pero a través de las rejas se puede apreciar la decoración de cosmatesco.\n\n## El Sancta Sanctorum\n\nSobre el altar se encuentra el famoso icono de Cristo Archeiropoeton, es decir, no pintado por mano humana: la tradición dice que lo comenzó San Lucas y fue terminado por un ángel; llegó milagrosamente a Roma, desde Constantinopla, en el s. VIII. En realidad, todo parece indicar que se trata de una pintura sobre madera del s. VI o VII. La inscripción sobre el altar –non est in toto sanctior orbe locus (no hay en todo el orbe un lugar más santo que este)–afirma que nos encontramos en el lugar más santo de la tierra. Durante la Edad Media esta imagen era llevada en procesión por los Papas ante las grandes calamidades de la ciudad. Alrededor del altar están otras reliquias, y en las paredes hay 28 tabernáculos ojivales.", "logi": {"Horario": "6:00 a 14:00 y 15:00 a 19:00", "Costo": "Gratis · Sancta Sanctorum €3,50", "Consejo": "Llevar algo para las rodillas si alguien lo necesita", "Sobre el horario": "Subir de rodillas: hasta 13:30 y de 15:00 a 18:30. El Sancta Sanctorum cierra a las 17:00 y cuesta €3,50. Domingos abre 7:00. scala-santa.com"}, "map": "Scala Santa, Roma", "id": "s38", "day": "13", "hrs": {"open": [[360, 840], [900, 1140]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["Los **28 escalones** que se suben de rodillas, en silencio. Al costado hay escaleras normales para bajar.", "El **Sancta Sanctorum** arriba: se ve a través de la reja, era la capilla privada de los papas.", "La **Acheropita**, la imagen del Salvador \"no pintada por mano de hombre\", detrás del altar de esa capilla."], "zone": "Letrán"}, {"time": "11:15", "name": "San Juan de Letrán", "tag": "site", "type": "site", "dur": 75, "quick": "La catedral de Roma, madre y cabeza de todas las iglesias. Y el Baptisterio.", "hist": "Donada por Constantino al papa San Silvestre hacia el año 313. Fue residencia de los papas durante mil años y sigue siendo la catedral del obispo de Roma.", "travel": {"mode": "walk", "dur": 3, "costAd": "Gratis", "costCh": "Gratis", "how": "Cruzar la plaza: la entrada principal de la basílica da sobre Piazza di Porta San Giovanni."}, "full": "## Madre de todas las iglesias\n\nSan Juan de Letrán es una de las cuatro basílicas patriarcales o mayores. El nombre proviene de sus primeros propietarios. La Basílica, dedicada al Salvador, fue construida sobre los palacios de los Laterani, donados por **Constantino** al Papa Melquiades. La primera mención se remonta al 313, fecha en que se tuvo un consistorio de obispos in domum Faustae in Lateranum. En la fachada actual se lee: Sacrosancta Ecclesiarum omnium urbis et orbis Mater et Caput (Sacrosanta madre y cabeza de todas las iglesias de la ciudad y del mundo).\n\n## Constantino y el Laterano\n\nEl 28 de octubre del 312, después de vencer a **Majencio**, Constantino hizo su entrada triunfal en Roma e inmediatamente acabó con la persecución de los cristianos. En el 314 el Papa Silvestre I fue a vivir al Laterano, donde se fijó la residencia oficial del papado hasta el exilio de Avignon. Antes de iniciar la construcción de la antigua basílica de **San Pedro** en el Vaticano, Constantino construyó la Basílica Laterana en el lugar donde se encontraban las viviendas de la guardia personal –los equites singulares–de Majencio.\n\nLa Basílica estaba dedicada al Salvador y, aunque no era de dimensiones extraordinarias, tenía cinco naves y estaba precedida por un pórtico y un atrio con fuentes; en lo alto de la fachada estaba la imagen del Salvador. Posteriormente fue dedicada a **San Juan Bautista** y a San Juan Evangelista. Después de ser dañada por los bárbaros en el s. V y por un terremoto en el 896, fue destruida por un incendio en 1308.\n\n## Las reformas\n\nLa Basílica se reconstruyó en le época barroca y en el s. XVIII. En total veinte Papas contribuyeron a su reconstrucción, restauración y embellecimiento: desde **San León Magno** (440–461) hasta León XIII (1878–1903). En este lugar se llevaron a cabo los cinco Concilios Lateranenses, decisivos en la historia de la Iglesia. Aquí fue, por ejemplo, donde Nicolás II reunió en el 1059 el Sínodo que determinó que la elección del Papa correspondía a los cardenales\n\n## La fachada\n\nObra de **Alessandro Galilei** (1735), es probablemente la fachada más sugestiva de todas las basílicas romanas. Destaca el contraste entre las claras líneas de las columnas con las cavidades oscuras. Sobre la balaustrada de coronamiento se encuentran 15 estatuas, de 7 m. de altura, de Cristo, San Juan Bautista, San Juan Evangelista y Doctores de la Iglesia.\n\nEntrando en el pórtico, la puerta central de comunicación con el interior, proviene de la Curia o Parlamento del Foro Romano –probablemente la puerta más antigua que se conserva en el mundo–, y fue agrandada en 1660 con la adición de las zonas donde se encuentran las estrellas del Papa Alejandro VII. La última puerta de la derecha es la Puerta santa, que se abre sólo en los años jubilares. A la izquierda está la estatua del emperador Constantino, proveniente de las Termas del Quirinal. Sobre la estatua y sobre las puertas, se pueden ver varios altorrelieves en mármol con la historia de la vida del Bautista.\n\n## El interior\n\nTanto la nave central con sus 130 m de largo, como las laterales fueron remodeladas por el arquitecto barroco **Borromini** (1599-1667), invitado por el Papa Inocencio X, aproximadamente en 1650. En la nave central llaman inmediatamente la atención las estatuas de los Doce Apóstoles, en un estilo barroco tardío, obra de algunos seguidores de **Bernini**. Borromini creó doce enormes nichos en los pilares de la nave para recibirlas, y fueron colocadas ahí en 1718. Las columnas de mármol verde –que Borromini acortó y reutilizó–separaban la nave central de las laterales en la antigua basílica.\n\nSobre los Apóstoles se encuentran bajorrelieves que narran relatos del Antiguo y del Nuevo Testamento. El crucero, completamente renovado bajo la dirección de Della Porta y de d'Arpino (1597–1601), es uno de los conjuntos más armoniosos y representativos de la arquitectura romana de finales del s.XVI. En las paredes, los pintores manieristas de la época compusieron una especie de antología con escenas de la Ascensión, los Apóstoles, etc., y con frescos que narran los principales episodios de la vida del emperador Constantino.\n\n## El baldaquino y el altar papal\n\nEn la parte central del crucero, bajo el gran arco sostenido por dos columnas de granito, se encuentra el Tabernáculo ojival, obra del orfebre romano Giovanni di Stefano Sense. Encargado por Urbano V en 1367, y llevado a cabo con la ayuda económica de Carlos V de Francia, está adornado con doce recuadros al fresco, atribuidos a Barna da Siena. En la parte alta se encuentran unos relicarios de plata que, según la tradición, contienen reliquias de las cabezas de San Pedro y **San Pablo**, aunque no es segura su autenticidad.\n\nBajo el tabernáculo se encuentra el Altar Papal, donde sólo podía celebrar la Santa Misa el Romano Pontífice, hasta hace poco tiempo. Restaurado en 1851, en el interior se encuentra el altar de madera donde, según la tradición, celebraron Misa los primeros Papas, desde San Pedro hasta **San Silvestre**. A los pies del altar, en el recinto de **la Confesión** –obra del s. IX–se encuentra la tumba de Martín V, de Simón Ghini (1443). Sobre el tabernáculo se conserva la mesa sobre la cual, según la tradición, nuestro Señor y sus Apóstoles realizaron la Última Cena.\n\nEn el brazo derecho del crucero, en la cabecera del ingreso lateral, se encuentra uno de los órganos más antiguos y potentes que se conservan, desde hace mucho tiempo sin usar. A la derecha de las columnas de amarillo antiguo, hasta hace pocos años, ondeaba una bandera pirata arrebatada a los corsarios del Mediterráneo. El presbiterio y el ábside fueron arreglados en tiempos de León XIII (1884), por **Vespignani**.\n\n## El mosaico del ábside\n\nEl mosaico fue trasladado del antiguo ábside y restaurado; en alto se encuentra el Salvador; abajo – como se puede leer en el Apocalipsis–, la Cruz adornada con joyas, sobre la colina de la Jerusalén celestial, donde descienden para apagar la sed de la grey los cuatro ríos (los cuatro Evangelios); a la izquierda, la Santísima Virgen con el donador, Nicolás IV, de rodillas, y los santos Pedro y Pablo; a la derecha, San Juan Bautista y San Juan Evangelista con **San Andrés**; las dos figuras menores, San Francisco de Asís (a la izquierda) y San Antonio de Padua (a la derecha), son una inclusión al estilo iconográfico tradicional, por deseo de Nicolás IV, que era franciscano.\n\nEl Jordán aparece con las representaciones tradicionales (cisnes, peces, barcos, etc.). Más abajo, entre las ventanas, los nueve Apóstoles restantes, y las figuras de los autores, Iacopo **Torriti** (a la izquierda) y fray Iacopo da Camerino (a la derecha). El techo fue iniciado en 1562, completado en 1567 y restaurado en el s. XVIII. El diseño es de un grupo de discípulos de **Miguel Ángel** y los tres escudos corresponden a los Papas Pío IV, Pío V y Pío VI. En la nave izquierda, en el lugar más cercano a la puerta, se encuentra la Capilla Corsini, obra de Alessandro Galilei, construida a cruz griega, bajo una cúpula..\n\nA la izquierda se encuentra el sepulcro de Clemente XII, con una urna de pórfido que procede del Pantheon. Las estatuas son de finales del s.XVIII. En esa misma nave, ya cerca del presbiterio, se encuentra la entrada al Claustro, obra maestra del arte cosmatesco, realizado por los Vasalletti (padre e hijo). Su arte, como el de los Cosmati, consistía en cortar y ensamblar fragmentos de mármol antiguo. En medio del jardín, un pozo del s. IX, recuerdo del antiguo claustro benedictino.\n\n## El Baptisterio\n\nBaptisterio También construido por Constantino, era el lugar donde se bautizaban los cristianos de Roma durante el s. IV. En el s. V, **Sixto III** instaló las ocho columnas de pórfido en el centro e hizo imprimir en el espacio octagonal inscripciones alusivas al Bautismo. La columnata superior y la linterna son adiciones del s. XVI, para sustituir una cúpula que cedió el año 1540. El recinto circular, en cuyo centro se encuentra una urna de basalto egipcio, se usaba en los primeros tiempos del Cristianismo para el Bautismo de inmersión. Esas columnas sostienen un arquitrabe, que tiene escritos unos versos en latín, atribuidos al Papa San Sixto III (432-440), en los que se resume de manera admirable la doctrina cristiana sobre el Bautismo. Suenan tan magníficamente, que vale la pena leerlos en su lengua original. Debajo añadimos una traducción al castellano:", "logi": {"Horario": "7:00 a 18:30 · salida hasta 18:45", "Costo": "Gratis · claustro €5", "No perderse": "Las cabezas de San Pedro y San Pablo sobre el baldaquino, y el Baptisterio", "Sobre el horario": "El claustro 9:00 a 18:00 (€5). El Baptisterio 7:00 a 12:30 y 16:00 a 19:00: al mediodía está cerrado."}, "map": "Basilica di San Giovanni in Laterano, Roma", "id": "s37", "day": "13", "hrs": {"open": [[420, 1110]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["Las **cabezas de San Pedro y San Pablo** en los relicarios sobre el baldaquino gótico.", "Las **doce estatuas colosales de los apóstoles** en la nave, cada una con el instrumento de su martirio.", "El **claustro cosmatesco** del siglo XIII, con las columnas retorcidas y los mármoles de colores.", "La **Porta Santa**, la última de la derecha en la fachada.", "El **Baptisterio** está al lado, pero a esta hora cierra: queda para el final del día, a las 17:50."], "zone": "Letrán"}, {"id": "s70", "time": "12:35", "name": "Baptisterio de Letrán", "tag": "site", "type": "site", "dur": 25, "quick": "El baptisterio más antiguo de la cristiandad. Solo si quedan ganas.", "hist": "Lo mandó construir Constantino hacia el año 315, sobre las termas del palacio de Fausta. Durante siglos fue el único lugar de Roma donde se bautizaba, y el modelo del que copiaron todos los baptisterios de Occidente.", "ver": ["La **planta octogonal**: ocho lados por el octavo día, el de la Resurrección.", "Las **ocho columnas de pórfido rojo** alrededor de la pila bautismal.", "Los mosaicos del siglo V en las capillas laterales de San Juan Evangelista y San Venancio."], "travel": {"mode": "walk", "dur": 4, "costAd": "Gratis", "costCh": "Gratis", "how": "Saliendo por la puerta lateral, el baptisterio octogonal está junto al obelisco, sobre Piazza di San Giovanni in Laterano."}, "logi": {"Horario": "7:00 a 12:30 y 16:00 a 19:00", "Costo": "Gratis", "Por qué a esta hora": "Cierra de 12:30 a 16:00. A las 14:00, cuando el grupo llega a Letrán, está cerrado.", "Sobre el horario": "Verificado en agosto de 2026. Cierra al mediodía."}, "map": "Battistero Lateranense, Roma", "day": "13", "hrs": {"open": [[420, 750], [960, 1140]], "closed": []}, "hv": true, "pri": 2, "full": "Es el baptisterio más antiguo de la cristiandad y el modelo del que salieron todos los demás. Está a treinta metros de la basílica, con entrada propia desde la plaza, y muchísimos peregrinos pasan de largo sin entrar.\n\n## Constantino y las termas de Fausta\n\nLo mandó construir **Constantino** hacia el año 315, poco después de la victoria del Puente Milvio, sobre las termas del palacio de su segunda esposa Fausta. Todo el predio del Laterano había sido propiedad imperial y el emperador se lo donó al papa **San Silvestre**: la basílica, el palacio y este baptisterio.\n\nLa leyenda medieval quiso que el propio **Constantino** hubiera sido bautizado aquí por Silvestre, curado milagrosamente de la lepra en el momento de sumergirse. La escena se pintó cientos de veces y todavía se ve en los frescos de las capillas laterales. La historia es otra: Constantino recibió el bautismo recién en su lecho de muerte, en el año 337, en Nicomedia y de manos de un obispo arriano. Pero el relato quedó grabado en la memoria del lugar.\n\n## El octógono\n\nEl edificio que se ve hoy es el que le dio **Sixto III** hacia el año 440, sobre la planta circular original. Le dio forma octogonal, y el número no es decorativo.\n\nOcho lados por el octavo día. La semana judía termina el sábado; el domingo, día de la Resurrección, es el primero de la semana nueva pero también el octavo, el día que viene después del ciclo cerrado y que ya no tiene ocaso. El bautizado muere con Cristo bajo el agua y renace en ese octavo día. **San Ambrosio** lo explicó en unos versos que estuvieron escritos en este mismo baptisterio, y la idea, materializada acá en piedra, se copió después en Florencia, en Pisa, en Rávena y en cientos de baptisterios de toda Europa.\n\nEn el centro, ocho columnas de pórfido rojo —el mármol imperial, el más caro del mundo antiguo— rodean la pila. Sostienen un entablamento sobre el que se levanta un segundo orden de columnas más chicas.\n\n## El bautismo en la Roma antigua\n\nDurante siglos este fue el único lugar de Roma donde se administraba el bautismo. Las familias de toda la ciudad venían acá, y la ceremonia central del año era la vigilia pascual.\n\nLos catecúmenos habían pasado meses o años de preparación. Llegaban de noche, se desvestían, descendían por unos escalones al agua —la pila era mucho más profunda que la actual— y eran sumergidos tres veces, en el nombre del Padre, del Hijo y del Espíritu Santo. Salían por el lad
