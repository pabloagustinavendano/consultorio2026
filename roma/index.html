to": "Gratis", "Terreno": "Empedrado irregular, difícil con cochecito"}, "map": "Via Appia Antica, Roma", "id": "s44", "day": "15", "pri": 2, "src": "fuentes", "ver": ["El **basolato** original: las mismas piedras que pisó San Pablo entrando a Roma.", "Las tumbas y mausoleos romanos al costado del camino.", "Los pinos marítimos. Es el paisaje romano por excelencia."], "zone": "Fuera de las murallas"}, {"time": "12:30", "name": "Almuerzo en la zona", "tag": "food", "type": "food", "dur": 90, "quick": "Hay trattorias sobre la Appia, con jardín.", "logi": {"Costo adultos": "€18 a €30", "Costo niños": "€8 a €12"}, "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Hay varias trattorias con jardín sobre la Via Appia Antica, a pocos minutos de las catacumbas."}, "id": "s45", "day": "15", "pri": 3}, {"time": "14:30", "name": "Vuelta y tarde libre", "tag": "rest", "type": "rest", "quick": "Descanso. La tarde queda abierta.", "travel": {"mode": "car", "dur": 30, "costAd": "≈ €25 por taxi", "costCh": "—", "how": "Regreso en taxi o van por el mismo camino."}, "id": "s46", "day": "15", "pri": 3}, {"time": "19:00", "name": "Santa Maria della Vittoria", "tag": "site", "type": "site", "dur": 25, "quick": "Optativo, solo Pablo y Maira: el Éxtasis de Santa Teresa, el día de su fiesta.", "hist": "Bernini talló aquí, entre 1647 y 1652, la Transverberación de Santa Teresa de Ávila: la santa atravesada por el dardo del ángel, en la capilla Cornaro.", "full": "Una iglesia chica y oscura sobre Via XX Settembre que guarda una de las esculturas más famosas del mundo. Se visita en veinte minutos y vale cada uno.\n\n## La batalla de la Montaña Blanca\n\nLa iglesia se empezó en 1608 para los carmelitas descalzos, dedicada a **San Pablo**. Cambió de nombre en 1620 después de la batalla de la Montaña Blanca, cerca de Praga, donde los ejércitos católicos derrotaron a los protestantes bohemios en la Guerra de los Treinta Años.\n\nUn carmelita, el padre Domingo de Jesús y María, había arengado a las tropas llevando en la mano una imagen de la Natividad hallada en un castillo saqueado. Atribuida la victoria a esa intercesión, la imagen se trajo a Roma y la iglesia pasó a llamarse Santa Maria della Vittoria. El original se perdió en un incendio en 1833.\n\n## El Éxtasis de Santa Teresa\n\nEn el transepto izquierdo está la capilla Cornaro, con la *Transverberación de **Santa Teresa** de Ávila* que **Bernini** talló entre 1647 y 1652. Tenía cerca de cincuenta años y venía de una caída en desgracia: los campanarios que había levantado en **San Pedro** habían amenazado ruina y hubo que demolerlos. Esta obra lo devolvió a la cumbre.\n\nLa escena está tomada del libro de la propia **Santa Teresa**, que describe cómo un ángel le atravesaba el corazón con un dardo de oro y ella quedaba *«toda abrasada en amor grande de Dios»*, con un dolor tan intenso que la hacía gemir y una dulzura tan grande que no quería que cesara.\n\n**Bernini** talló ese instante: la santa desmayada sobre una nube, la boca entreabierta, el pie descolgado, los ropajes convertidos en un torbellino de pliegues; el ángel sonriendo, el dardo en la mano. Detrás, un haz de rayos de bronce dorado baja desde una ventana escondida en lo alto, invisible desde abajo, que ilumina el grupo con luz natural real. Toda la capilla está calculada como un escenario.\n\n## Los palcos\n\nA los dos costados, esculpidos en mármol, hay dos palcos con miembros de la familia **Cornaro** —el cardenal Federico y sus antepasados dogos de Venecia— asomados, conversando, mirando la escena.\n\nEs una idea audacísima: los donantes no aparecen arrodillados en actitud devota, como era costumbre, sino como espectadores en un teatro. El visitante que entra a la capilla queda convertido, sin darse cuenta, en un espectador más.\n\n## Lo práctico\n\nAbre de 8:30 a 12:00 y de 15:30 a 18:00. La entrada es gratuita. Hay una máquina que ilumina el grupo por unos minutos a cambio de una moneda: vale la pena, porque sin luz la capilla está en penumbra.\n\nEstá a doscientos metros de la estación Repubblica de la línea A. **El 15 de octubre es la fiesta de Santa Teresa de Ávila**, lo que hace de esa fecha el mejor día posible para venir.", "logi": {"Horario": "8:30 a 12:00 y 15:30 a 18:00", "Costo": "Gratis", "Metro": "Repubblica, línea A", "Por qué hoy": "15 de octubre: fiesta de Santa Teresa de Ávila"}, "map": "Santa Maria della Vittoria, Roma", "travel": {"mode": "metro", "dur": 30, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Desde Ottaviano, línea A dirección Anagnina hasta Repubblica. La iglesia está a 200 metros de la salida, en la esquina de Via XX Settembre.", "tip": "Verificar el horario: cierra a las 18:00."}, "id": "s47", "day": "15", "hrs": {"open": [[510, 720], [930, 1080]], "closed": []}, "hv": false, "pri": 2, "src": "propio", "ver": ["El **Éxtasis de Santa Teresa** de Bernini, en la capilla Cornaro, a la izquierda.", "Los palcos de mármol a los costados: la familia Cornaro esculpida como público, mirando la escena.", "La luz que baja por la ventana oculta sobre el grupo. Bernini la calculó."], "zone": "El norte · Spagna y Popolo"}, {"time": "20:00", "name": "Cena de aniversario", "tag": "food", "type": "food", "dur": 150, "quick": "Pablo y Maira. Las nenas quedan con la abuela.", "logi": {"Pendiente": "Falta elegir y reservar el restaurante"}, "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Según dónde sea la reserva. Todavía está por definirse."}, "id": "s48", "day": "15", "pri": 1}]}, {"date": "2026-10-16", "phase": 1, "weekday": "Vie", "dd": "16", "title": "Pontinia · Fossanova (por confirmar)", "note": "Por confirmar. Si al final se va el lunes 12, el Foro pasa al miércoles a la mañana y este día queda libre.", "stops": [{"time": "07:30", "name": "Salida de Roma", "tag": "rest", "type": "rest", "dur": 90, "quick": "Por la SS148 Pontina, 70 km hacia el sureste.", "logi": {"Distancia": "70 km", "Duración": "1h 15 a 1h 30", "Vehículos": "Dos vans de nueve plazas"}, "id": "s49", "day": "16", "pri": 3}, {"time": "09:00", "name": "MAP · Museo dell'Agro Pontino", "tag": "site", "type": "site", "dur": 90, "quick": "El museo de la bonifica: los colonos, la malaria y la vida cotidiana de los que hicieron esta tierra.", "hist": "Inaugurado en 2015 en la Ex Torre Idrica de la ciudad. Recoge objetos, fotografías y testimonios del período pre y post bonifica del Agro Pontino: la malaria, los migrantes del Véneto, las herramientas del trabajo en el pantano, la vida cotidiana de los colonos.", "travel": {"mode": "car", "dur": 90, "costAd": "Combustible y peajes", "costCh": "—", "how": "Salir de Roma por la Via Cristoforo Colombo y empalmar con la SS148 Pontina hacia el sur. Atravesar la llanura pontina hasta Pontinia. El museo está en Piazza Roma, en el centro exacto de la ciudad.", "tip": "Cargar combustible antes de salir de Roma."}, "full": "El museo cuenta la historia de la que salió Pontinia: la bonifica del Agro Pontino, la llegada de los colonos y la vida cotidiana de las familias que poblaron esta llanura en los años treinta.\n\n## Qué guarda\n\nNo es un museo de objetos preciosos sino de vida cotidiana. Herramientas de labranza, muebles, utensilios de cocina, ropa, documentos, contratos de colonato, fotografías de los trenes llegando cargados de familias y de los *poderi* recién construidos en medio de la nada.\n\nHay también material sobre la malaria, que fue el enemigo real de esta tierra durante siglos: los mosquiteros, la quinina, las estadísticas de muertos. Y registros orales: los relatos de los que llegaron, grabados cuando todavía estaban vivos para contarlo.\n\n## La bonifica\n\nEl drenaje de los pantanos pontinos se intentó durante dos mil años sin éxito. **Julio César** lo proyectó, **Augusto** hizo excavar un canal, y varios papas volvieron a probar entre el siglo XIII y el XVIII. Todos fracasaron o lograron avances que la naturaleza revertía.\n\nEntre 1928 y 1939 se hizo la obra definitiva: canales, bombas de drenaje, diques, caminos. Setenta y cinco mil hectáreas recuperadas. Y sobre ellas, cinco ciudades nuevas y miles de casas rurales dispersas.\n\nPara poblarlas se trajeron familias del **Véneto**, de **Friuli**, del Trentino y de Emilia: regiones donde sobraba gente y faltaba tierra. Llegaban con lo puesto, los animales y los aperos, y recibían una casa, un lote, una vaca y semillas bajo un contrato que en unos años les daba la propiedad.\n\n## Dónde está\n\n**Piazza John F. Kennedy 1**, en el edificio del ex mercado cubierto, a pasos de las dos plazas centrales.\n\n**Ojo con una confusión frecuente:** la torre de agua que está en Piazza Roma, el otro edificio alto de la ciudad, **no es el museo**. Desde 2015 funciona como sala de exposiciones coordinada con el MAP, pero abre solo por eventos. Quien va derecho a la torre se encuentra con la puerta cerrada.\n\n## Antes de ir, llamar\n\nLo gestiona la Pro Loco de Pontinia y los horarios cambian según la temporada. Alguna fuente reciente lo da directamente por cerrado, aunque otras lo dan como activo.\n\n**Conviene llamar al +39 0773 84641 antes de viajar.** Son setenta kilómetros desde Roma, y aunque el museo estuviera cerrado el viaje vale igual por la ciudad, la iglesia y Fossanova.", "logi": {"Dirección": "Piazza John F. Kennedy 1, en el ex mercado cubierto", "Ojo": "NO es la torre de agua. Esa está en Piazza Roma y es una sala de exposiciones aparte, que abre solo por eventos", "Horario": "Hay que llamar", "Teléfono": "+39 0773 84641 · lo gestiona la Pro Loco de Pontinia", "Alerta": "Algunas fuentes de 2024 lo dan por cerrado. Confirmar antes de viajar los 70 km"}, "map": "Piazza John F. Kennedy 1, Pontinia", "id": "s50", "day": "16", "hv": false, "pri": 1, "src": "propio", "ver": ["La torre de agua misma, símbolo de la ciudad nueva.", "Las fotos de los colonos llegando del Véneto y de Friuli en 1935.", "Las herramientas y los objetos cotidianos de la bonifica."], "zone": "Agro Pontino"}, {"time": "10:30", "name": "Iglesia de Sant'Anna", "tag": "mass", "type": "mass", "dur": 45, "quick": "La patrona de Pontinia, con su campanario racionalista de cincuenta metros.", "hist": "Construida junto con la ciudad en los años 30. Su campanario de 50 metros, revestido de travertino blanco, evoca los tubos de un órgano. Los símbolos de los cuatro evangelistas están esculpidos en la torre: el ángel (Mateo), el león (Marcos), el toro (Lucas) y el águila (Juan).", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Piazza Roma, la iglesia está a pocos metros: el campanario se ve desde toda la ciudad."}, "full": "La iglesia parroquial de Pontinia, dedicada a Santa Ana, madre de la Virgen. Es el edificio más visible de la ciudad: su campanario de cincuenta metros se ve desde toda la llanura pontina.\n\n## Una iglesia de 1935\n\nSe construyó junto con la ciudad, en los meses previos a la inauguración del 18 de diciembre de 1935, y forma parte del conjunto racionalista que rodea las dos plazas centrales.\n\nEl proyecto es de **Oriolo Frezzotti**, el arquitecto que había trazado también Littoria y que definió el lenguaje de las ciudades nuevas del Agro Pontino. Materiales pobres y nobles a la vez: travertino, ladrillo, hormigón. Volúmenes puros. Ninguna concesión decorativa.\n\n## El campanario\n\nEs lo que define la silueta de Pontinia. Una torre de cincuenta metros, de planta cuadrada, que sube en retranqueos escalonados hasta rematar en una cruz.\n\nEn una llanura absolutamente plana, drenada hacía pocos años, esa torre cumplía una función práctica además de simbólica: era el punto de referencia visible desde cualquier *podere* del campo, la señal que le decía al colono dónde quedaba el pueblo. Sobre el fuste hay relieves con escenas de la vida de Santa Ana.\n\n## Por dentro\n\nEl interior sorprende a quien viene de las iglesias romanas. No hay mármoles polícromos, ni capillas laterales cargadas, ni frescos barrocos. Una nave amplia, muros claros, luz entrando de lo alto y una sobriedad que se parece más a lo cisterciense que a lo romano, aunque por razones completamente distintas.\n\nEs una iglesia hecha para una comunidad de campesinos que llegaba de otra parte de Italia y tenía que empezar de cero. Eso se nota, y es parte de lo que hay que ir a ver.\n\n## Santa Ana\n\nLa advocación no es casual. Santa Ana es patrona de las familias, de las madres y de los trabajos de la tierra, y su fiesta cae el 26 de julio, en plena cosecha. Para una ciudad fundada sobre familias campesinas trasplantadas, era la elección natural.\n\nLa fiesta patronal de Pontinia sigue siendo el 26 de julio, con procesión y feria.", "logi": {"Dirección": "Piazza Indipendenza, Pontinia", "Horario": "Habitualmente 8-12 y 16-19", "Costo adultos": "Gratis", "Costo niños": "Gratis"}, "map": "Chiesa Sant'Anna Pontinia", "id": "s51", "day": "16", "pri": 1, "src": "propio", "ver": ["El campanario racionalista de cincuenta metros: se ve desde toda la llanura.", "La sobriedad del interior, muy distinta de las iglesias romanas."], "zone": "Agro Pontino"}, {"time": "11:15", "name": "Centro racionalista", "tag": "site", "type": "site", "dur": 90, "quick": "El Palazzo Comunale, la plaza fundacional y el monumento a los caídos.", "hist": "El centro de Pontinia es un raro ejemplo intacto de urbanismo racionalista italiano de los años 30. Edificios públicos en perfecta simetría, plazas amplias, materiales sobrios. Lo opuesto a un pueblo medieval.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Todo el centro fundacional está alrededor de Piazza Indipendenza, a pasos de la iglesia."}, "logi": {"Costo adultos": "Gratis", "Costo niños": "Gratis", "Opcional": "Si alguien tiene apellidos vénetos/friulanos, consultar en el registro municipal por archivos familiares."}, "id": "s52", "day": "16", "pri": 2, "full": "Pontinia se fundó el 18 de diciembre de 1935 y fue la tercera de las ciudades nuevas del Agro Pontino, después de Littoria y Sabaudia. No creció como crecen los pueblos: fue diseñada entera, sobre un tablero, y construida en pocos meses sobre tierra que hasta hacía nada era pantano y malaria.\n\n## La bonifica\n\nEl drenaje de los pantanos pontinos era un problema que Roma llevaba dos mil años sin resolver. **Julio César** proyectó desecarlos, **Augusto** hizo excavar un canal, varios papas lo intentaron —Bonifacio VIII, Martín V, **Sixto V**, Pío VI—, y todos fracasaron o consiguieron resultados parciales que la naturaleza revertía en pocas décadas. La malaria hacía el resto: la zona era prácticamente inhabitable.\n\nEntre 1928 y 1939 se hizo la obra a gran escala: canales, bombas de drenaje, diques y carreteras. Se drenaron unas setenta y cinco mil hectáreas. En ese suelo recuperado se fundaron cinco ciudades nuevas —Littoria, hoy Latina; Sabaudia; Pontinia; Aprilia; Pomezia— y cientos de casas rurales dispersas por el campo.\n\n## Los colonos\n\nLa tierra no servía de nada sin gente que la trabajara, y en la zona no había nadie. Así que se trajeron familias enteras del norte: del **Véneto**, de **Friuli**, del Trentino y de Emilia, regiones donde la población rural sobraba y la tierra faltaba.\n\nLlegaban en tren y en camión, con los muebles, los aperos y los animales. A cada familia se le asignaba una casa rural —el *podere*— con un lote de tierra, una vaca, herramientas y semillas, bajo un contrato que en varios años les daba la propiedad. Muchas eran familias numerosas: cuantos más brazos, más tierra.\n\nNo fue idílico. El clima era distinto, la malaria seguía cobrándose vidas los primeros años, y los del norte y los del sur no siempre se llevaron bien. Pero se quedaron, y sus apellidos vénetos y friulanos siguen siendo los apellidos de Pontinia.\n\n## La ciudad\n\nEl plano lo hicieron los ingenieros Alfredo Pappalardo, Ugo Frezza y Alfredo Petrucci, en el lenguaje racionalista de esos años: volúmenes limpios, ladrillo a la vista, travertino, simetría, ninguna decoración superflua. Es una arquitectura que se entiende de una sola mirada, hecha para ser construida rápido y para durar.\n\nTodo se organiza alrededor de dos plazas contiguas: **Piazza Indipendenza** y **Piazza Pio XII**. Ahí están el Palazzo Comunale con su torre cívica y el reloj, la iglesia de Sant'Anna con el campanario de cincuenta metros, la antigua casa del fascio, la oficina de correos, la escuela y el monumento a los caídos.\n\nSobre la entrada del Municipio quedó grabada una frase que resume el sentido de todo el proyecto: *«È l'aratro che traccia il solco, ma è la spada che lo difende»* — es el arado el que traza el surco, pero es la espada la que lo defiende.\n\n## Por qué estamos acá\n\nDe acá venimos. Caminar estas dos plazas es caminar el lugar exacto donde una familia decidió empezar de nuevo: dejar el norte, subirse a un tren con lo puesto y apostar a una tierra que hasta hacía cinco años era un pantano.\n\nEs la razón por la que este día está en el itinerario, y por la que vale el viaje de setenta kilómetros aunque el museo estuviera cerrado.", "src": "propio", "ver": ["Piazza Indipendenza y el Palazzo Comunale, el corazón de la ciudad fundada en 1935.", "El monumento a los caídos.", "El trazado de las calles: una ciudad entera diseñada y levantada sobre el pantano."], "zone": "Agro Pontino"}, {"time": "13:00", "name": "Almuerzo típico", "tag": "food", "type": "food", "dur": 120, "quick": "La alcachofa romanesca está en temporada justo en octubre.", "logi": {"Costo adultos": "€20-30 menú completo", "Costo niños": "€10-15", "Tip": "Pedir alcachofa romanesca si es temporada (octubre suele tener)."}, "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Los restaurantes del centro de Pontinia están todos alrededor de Piazza Indipendenza y Via Roma."}, "id": "s53", "day": "16", "pri": 3}, {"time": "15:30", "name": "Abadía de Fossanova", "tag": "site", "type": "site", "dur": 120, "quick": "La abadía cisterciense donde murió Santo Tomás de Aquino en 1274.", "hist": "Primera abadía cisterciense de Italia, consagrada en 1208 sobre un monasterio benedictino anterior. Santo Tomás de Aquino murió aquí el 7 de marzo de 1274, camino al Concilio de Lyon, y se conserva la celda donde expiró.", "travel": {"mode": "car", "dur": 25, "costAd": "€5 aprox.", "costCh": "Gratis los menores", "how": "Desde Pontinia, tomar la SS7 Appia hacia Priverno. La abadía está en la localidad de Fossanova, señalizada desde la ruta. Son unos 15 km.", "tip": "Confirmar por teléfono el horario de la tarde: en otoño las abadías cierran temprano."}, "full": "La primera abadía cisterciense de Italia y el lugar donde murió **Santo Tomás de Aquino**. Está en el término de Priverno, a quince kilómetros de Pontinia.\n\n## El canal nuevo\n\nHabía acá un monasterio benedictino desde el siglo IX, en decadencia, cuando en 1135 llegaron los monjes de Císter. Lo reconstruyeron entero según el modelo de Claraval y lo consagraron en 1208, con **Inocencio III** presente.\n\nEl nombre viene de *fossa nova*, el canal nuevo que los monjes abrieron para drenar los pantanos de la zona. Vale la pena detenerse en esto: ocho siglos antes de la bonifica que dio origen a Pontinia, los cistercienses ya estaban haciendo exactamente el mismo trabajo sobre la misma tierra. El agua de esta llanura fue peleada durante mil años.\n\n## La arquitectura cisterciense\n\nEs el ejemplo más puro que hay en Italia de lo que los cistercienses entendían por una iglesia. **San Bernardo** había escrito contra la ornamentación de los monasterios cluniacenses: las esculturas grotescas, los pavimentos historiados, la riqueza que distrae al monje de la oración.\n\nEl resultado está a la vista. Iglesia sin campanario —solo una espadaña—, sin cripta, sin vitrales de colores, sin decoración figurada. Piedra desnuda, proporción y luz. El único elemento ornamental permitido es el **rosetón** de la fachada. Es una arquitectura de transición del románico al gótico, y su austeridad tiene una belleza que las iglesias recargadas rara vez alcanzan.\n\n## La muerte de Santo Tomás\n\nEn 1274 el papa Gregorio X convocó el Concilio de Lyon y llamó a Tomás de Aquino. El fraile salió de Nápoles a caballo. En el camino se golpeó la cabeza contra la rama de un árbol caído y empezó a sentirse mal.\n\nLo llevaron a Fossanova, donde fue alojado en el cuarto del hermano del abad, porque no se consideraba digno de una celda mejor. Estuvo enfermo varias semanas. Pidió que le leyeran el **Cantar de los Cantares** y fue comentándolo mientras podía. Recibió el viático arrodillado en el suelo.\n\nMurió el 7 de marzo de 1274, con menos de cincuenta años. Meses antes, en Nápoles, después de una experiencia mística durante la misa, había dejado de escribir la *Summa* y le había dicho a su secretario: *«Todo lo que he escrito me parece paja»*.\n\nLa celda donde murió se conserva y fue transformada en capilla en el siglo XVIII. Sus restos ya no están acá: después de siglos de disputas entre cistercienses y dominicos, fueron trasladados en 1369 a Toulouse.\n\n## Qué se visita\n\nEl conjunto incluye la iglesia abacial, el **claustro** —con un lado románico y los otros tres góticos—, la sala capitular, el refectorio, el dormitorio de los monjes y la hospedería de peregrinos. En el piso del claustro se señalan unas marcas que la tradición atribuye a la mula que trajo a Santo Tomás.\n\nLo que más se recuerda del lugar no es ningún objeto sino el silencio del claustro a media tarde, con el sol entrando en diagonal entre las columnas pareadas.\n\n## Lo práctico\n\nAbre de 8:00 a 19:30 en horario de verano, que rige hasta el 25 de octubre. La entrada al complejo monumental cuesta unos cinco euros; la iglesia es gratuita. Se llega desde Pontinia por la SS7 Appia hacia Priverno, quince kilómetros, bien señalizado.", "logi": {"Horario": "8:00 a 19:30", "Dirección": "Via San Tommaso d'Aquino, Priverno (LT)", "Distancia": "15 km de Pontinia", "Verificar": "Horario de tarde antes de viajar", "No perderse": "La celda donde murió Santo Tomás", "Sobre el horario": "Horario de verano, vigente hasta el 25 de octubre. Confirmado en cultura.gov.it."}, "map": "Abbazia di Fossanova, Priverno", "fullSource": "Redacción propia", "id": "s54", "day": "16", "hrs": {"open": [[480, 1170]], "closed": []}, "hv": true, "pri": 1, "src": "propio", "ver": ["La **celda donde murió Santo Tomás de Aquino** el 7 de marzo de 1274, hoy convertida en capilla.", "El **claustro**: un lado románico y los otros tres góticos. En el piso, las supuestas huellas de la mula que lo trajo.", "El **rosetón** de la fachada.", "La iglesia sin campanario, sin cripta y sin decoración: la regla cisterciense en piedra.", "La sala capitular y el refectorio."], "zone": "Agro Pontino"}, {"time": "19:00", "name": "Regreso a Roma", "tag": "rest", "type": "rest", "quick": "Vuelta por la misma ruta. Llegada hacia las 20:30.", "travel": {"mode": "car", "dur": 90, "costAd": "Gratis", "costCh": "Gratis", "how": "SS7 hasta Latina y de ahí SS148 Pontina hacia el norte, hasta Roma.", "tip": "Un viernes a la tarde el tráfico de entrada a Roma es pesado: salir antes de las 19:30."}, "id": "s55", "day": "16", "pri": 3}]}, {"date": "2026-10-17", "phase": 1, "weekday": "Sáb", "dd": "17", "title": "Spagna · Popolo · el centro", "note": "Mañana por el norte; tarde por el centro histórico, sin apuro y con helado.", "stops": [{"time": "09:30", "name": "Sant'Andrea delle Fratte", "tag": "site", "type": "site", "dur": 40, "quick": "Donde la Virgen se le apareció a Ratisbonne. Los ángeles de Bernini.", "hist": "El 20 de enero de 1842 el judío Alphonse Ratisbonne, que se había puesto la Medalla Milagrosa casi por burla, vio aquí a la Virgen y se convirtió en el acto.", "full": "## San Andrés de las malezas\n\nLa iglesia de Sant' Andrea delle Fratte (**San Andrés** de las malezas) toma el nombre del antiguo emplazamiento que hasta el 1880 aprox. era bastante rural, tanto como para ser denominada Sant'Andrea in Hortis.\n\nLa construcción de la actual iglesia empezó alrededor del 1604 siguiendo el proyecto de Gaspare Guerra, los trabajos sufrieron diversos paros e incluso **Borromini** fue encargado para la realización, que desde el 1653 hasta el año de su muerte en 1667 siguió los trabajos y cambió el proyecto realizando una de sus ingeniosas arquitecturas echando mano a toda la parte alta de la iglesia: el ábside, el campanil y el tambor de la cúpula que vistos desde lo alto forman la clásica cruz de Sant' Andrea, esta misma arquitectura no fue nunca completada porque el conjunto fue concebido con revestimiento de mármol y en cambio, por otro lado resultando fascinante, ha permanecido todo en ladrillos.\n\n## Los ángeles de Bernini\n\nEntre los transeptos y el presbiterio es posible admirar la copia de los Ángeles esculpidos de la propia mano de **Bernini** para decorar Ponte Sant'Angelo pero considerados demasiado bellos para ser expuestos a la intemperie y donados a la iglesia de S. Andrea delle Fratte por los herederos de Bernini. Conversión de Alfonso de Ratisbona Aquí tuvo lugar la milagrosa aparición de la Virgen que convirtió al cristianismo al judío A. Ratibonne, de hecho la iglesia es también denominada \"Virgen del Milagro\".\n\n## Quién era Ratisbonne\n\nAlfonso Tobías de Ratisbona era un abogado y banquero judío de 27 años, de muy buena posición económica que profesaba gran odio hacia la religión católica porque uno de sus hermanos, Teodoro, se había convertido y ordenado sacerdote. Ratisbona conoció al Barón Teodoro de Bussiere, noble francés criado en el error protestante pero convertido al catolicismo, quien se había impuesto como misión convertir al catolicismo a todos los no creyentes y a las personas de otras religiones.\n\nCorría el año de 1842. Durante una cena en su casa, en Roma, el Barón le propuso al acaudalado banquero un desafío: pidió a Ratisbona que se colocase la **Medalla Milagrosa**. Parece ser que el ateo practicante tomó la propuesta como algo pueril pero al fin la aceptó, aunque al colgarse la medalla del cuello exclamó riéndose con sarcasmo: “Bueno, ya soy católico, apostólico y romano”. “Era el demonio que profetizaba con mi boca”, comentaría después Alfonso.\n\nEl señor de Bussiéres exultaba ingenuamente por su victoria y quiso hacerla todavía mayor, proponiéndole que rezara por la mañana y por la tarde el Acordaos de San Bernardo. Alfonso sintió bullir dentro de sí toda su animosidad, todo su resentimiento contra el proselitismo y contra todos los que él llamaba hipócritas y apóstatas. Para encerrar el tema y sin dar mayor importancia a la cosa, le prometió a Teodoro rezar la oración: “Aunque no me beneficie, por lo menos no me perjudicará”, comentó Alfonso.\n\n## La aparición\n\nEl jueves 20 de enero de 1842, debiendo Teodoro encargar una Misa por el Conde de Laferronays, pidió a Ratisbona que lo acompañase a la basílica de Santa Andrea delle Fratte, en Roma. Al entrar, se dirigió a la sacristía mientras Alfonso admiraba las obras de artes. Grande fue su sorpresa cuando, al volver, se encontró al renegado de rodillas, orando fervientemente frente a uno de los altares. Cuando le preguntó que sucedía, aquel le respondió que había ocurrido un milagro: \"...Me sentí dominado por una turbación inexplicable.\n\nEn la capilla de San Miguel se había concentrado toda la luz, y en medio de aquel esplendor apareció sobre el altar, radiante y llena de majestad y de dulzura, la Virgen Santísima tal y como está grabada en la medalla milagrosa. Una fuerza irresistible me impulsó hacia la capilla. Entonces la Virgen me hizo una seña con la mano como indicándome que me arrodillara... La Virgen no me habló pero lo he comprendido todo\". Poco tiempo después pidió ser bautizado en la Iglesia de Gesu en Roma, tomó la Primera Comunión y se confirmó en la verdadera Fe.\n\n## Después\n\nHabiendo ingresado en la Compañía de Jesús en 1847 se ordenó sacerdote, siendo destinado primeramente a París donde ayudó a su hermano Teodoro en la conversión de judíos y en 1848 viajó a Tierra Santa donde fundó en 1855 el Convento de Nuestra Señora de Sión. Murió en 1884 en Ain-Karim, a los 70 años, cuando hacía tiempo que la Iglesia había reconocido a su conversión como verdadero milagro.", "logi": {"Horario": "6:30 a 12:30 y 16:00 a 19:00", "Costo": "Gratis", "No perderse": "Los dos ángeles que Bernini talló para el Ponte Sant'Angelo"}, "map": "Sant'Andrea delle Fratte, Roma", "id": "s27", "day": "17", "hrs": {"open": [[390, 750], [960, 1140]], "closed": []}, "hv": false, "pri": 2, "src": "fuentes", "ver": ["La capilla de la izquierda donde, el 20 de enero de 1842, se le apareció la Virgen a Alphonse Ratisbonne.", "Los **dos ángeles de Bernini**, tallados para el Ponte Sant'Angelo y nunca colocados ahí: los conservó para sí.", "El campanario y la cúpula de Borromini, que se ven mejor desde la calle de atrás."], "zone": "El norte · Spagna y Popolo", "travel": {"mode": "metro", "dur": 30, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Caminar hasta Ottaviano (línea A) y tomar dirección Anagnina hasta Spagna. Salir por Piazza di Spagna y caminar cinco minutos por Via di Propaganda hasta Via Sant'Andrea delle Fratte.", "tip": "La estación Spagna tiene escaleras mecánicas largas: cómoda con cochecito."}}, {"time": "10:15", "name": "Trinità dei Monti", "tag": "site", "type": "site", "dur": 35, "quick": "La iglesia francesa en lo alto de la Escalinata.", "hist": "Fundada por Carlos VIII de Francia en 1502 y confiada después a los Mínimos de San Francisco de Paula.", "travel": {"mode": "walk", "dur": 12, "costAd": "Gratis", "costCh": "Gratis", "how": "Volver a Piazza di Spagna y subir la Escalinata de la Plaza de España, 135 escalones. Con cochecito, tomar el ascensor de la estación de metro Spagna, que sale arriba de todo.", "tip": "La vista desde el atrio, con el obelisco en primer plano, es de las mejores de Roma."}, "full": "La iglesia de las dos torres gemelas que corona la Escalinata de la Plaza de España. Es francesa, y esa rareza explica casi todo lo demás.\n\n## Una iglesia francesa en Roma\n\nLa fundó **Carlos VIII de Francia** en 1502, junto a un convento de los Mínimos de San Francisco de Paula, la orden más austera de la época. Sigue siendo hoy propiedad del Estado francés, uno de los cinco *pieux établissements* que Francia conserva en Roma, y la liturgia se celebra en francés.\n\nDurante la ocupación napoleónica el convento fue saqueado y la iglesia quedó en ruinas. La restauró Luis XVIII en 1816, y desde 1828 la ocuparon las religiosas del Sagrado Corazón, que instalaron acá un colegio célebre. Hoy la atiende la Comunidad de Jerusalén.\n\n## La Deposición de Volterra\n\nEn la segunda capilla de la nave izquierda está el *Descendimiento de la Cruz* de **Daniele da Volterra**, pintado hacia 1545. Es la obra maestra del lugar y una de las grandes pinturas del manierismo romano.\n\nVolterra era discípulo y amigo íntimo de **Miguel Ángel**, y se cree que el maestro le dio los dibujos preparatorios. Se nota: los cuerpos torsionados, la composición en aspa, la tensión muscular de los hombres que bajan el cuerpo son puro vocabulario miguelangelesco.\n\nA Volterra la historia lo recuerda por otra cosa, injustamente. Después del Concilio de Trento le encargaron cubrir las desnudeces del *Juicio Final* de la Sixtina, y quedó para siempre con el apodo de *il Braghettone*, el calzonero.\n\n## Las anamorfosis\n\nEn los corredores del convento hay dos frescos que son un juego óptico. Vistos de frente parecen paisajes borrosos; mirados desde un punto exacto, en ángulo casi rasante, se convierten en un retrato de **San Francisco de Paula** rezando y en otro de San Juan evangelista en Patmos.\n\nLos pintaron hacia 1642 los frailes Emmanuel Maignan y Jean-François Nicéron, que además de religiosos eran matemáticos y estudiosos de la óptica. Son de los ejemplos más famosos de anamorfosis del barroco europeo. No siempre están abiertos al público, pero vale preguntar.\n\n## El obelisco y la vista\n\nDelante de la fachada, el **obelisco Sallustiano**: es una imitación romana de un obelisco egipcio, hecha en el siglo II o III copiando los jeroglíficos del que está en Piazza del Popolo, sin entender lo que decían. Estuvo en los jardines de Salustio y Pío VI lo hizo trasladar acá en 1789.\n\nDesde el atrio, la vista baja por la Escalinata hacia Piazza di Spagna y sigue por Via Condotti hasta el fondo. Es la postal clásica de este rincón de Roma.\n\n## Lo práctico\n\nAbre de 10:15 a 20:00 y cierra los lunes. La entrada es gratuita. Se llega subiendo los 135 escalones de la Escalinata, o evitándolos con el ascensor de la estación de metro Spagna, que sale arriba de todo: con cochecito es la única opción sensata.", "logi": {"Horario": "10:15 a 20:00", "Costo": "Gratis", "No perderse": "La Deposición de Daniele da Volterra", "Sobre el horario": "Cerrada los lunes."}, "map": "Trinità dei Monti, Roma", "id": "s28", "day": "17", "hrs": {"open": [[615, 1200]], "closed": [1]}, "hv": false, "pri": 2, "src": "propio", "ver": ["La **Deposición** de Daniele da Volterra, discípulo de Miguel Ángel, en la tercera capilla de la izquierda.", "La vista desde el atrio, con el obelisco en primer plano y Roma al fondo.", "Los frescos del refectorio, si está abierto: incluyen una anamorfosis de San Francisco de Paula que solo se entiende desde un punto exacto."], "zone": "El norte · Spagna y Popolo"}, {"time": "11:00", "name": "Pincio", "tag": "site", "type": "site", "dur": 25, "quick": "El mirador sobre Piazza del Popolo, con Roma entera de fondo.", "hist": "La colina de los jardines de Lúculo en la antigüedad. La terraza actual la diseñó Giuseppe Valadier a comienzos del siglo XIX.", "travel": {"mode": "walk", "dur": 10, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Trinità dei Monti, seguir el Viale Trinità dei Monti bordeando el parque. El paseo lleva directo a la terraza del Pincio.", "tip": "Es plano y arbolado: el mejor tramo del día para los cochecitos."}, "full": "Fue el primer parque público de Roma y sigue teniendo la mejor vista de la ciudad al atardecer.\n\n## La colina de los jardines\n\nEn la antigüedad se llamaba *collis hortulorum*, la colina de los jardincitos, porque acá estaban las villas suburbanas más famosas de la Roma republicana e imperial: los jardines de **Lúculo**, los de Salustio, los de los Acilios. No formaba parte de las siete colinas ni estaba dentro de las murallas: era la zona donde los ricos venían a escaparse del ruido.\n\nLos jardines de **Lúculo** tuvieron un final siniestro. Lúculo, el general que popularizó los banquetes que llevan su nombre, los había construido con el botín de sus campañas en Oriente. Un siglo después, **Mesalina**, la esposa de Claudio, los codiciaba tanto que hizo acusar falsamente al dueño, Valerio Asiático, y lo empujó al suicidio para quedarse con ellos. Los disfrutó poco: en el año 48, en esos mismos jardines, un tribuno enviado por Claudio la mató.\n\nEl nombre actual viene de la familia Pincia, que tuvo acá su residencia en el siglo IV.\n\n## El paseo de Valadier\n\nEl parque que se recorre hoy es napoleónico. Cuando Francia ocupó los Estados Pontificios en 1809, la administración imperial quiso dotar a Roma de paseos públicos al estilo de París, y le encargó el proyecto a **Giuseppe Valadier**, el mismo arquitecto que rediseñó Piazza del Popolo justo abajo.\n\n**Valadier** trazó las rampas en zigzag que unen la plaza con la terraza, los senderos arbolados y los muros de contención. La obra se terminó después de la caída de Napoleón, ya con los papas de vuelta, y quedó como el primer parque de Roma abierto a cualquiera.\n\nA lo largo del paseo se fueron colocando bustos de italianos ilustres —hay más de doscientos veinte— y varios perdieron la nariz a manos de los visitantes a lo largo de dos siglos.\n\n## La vista\n\nLa terraza mira sobre **Piazza del Popolo**: abajo, el obelisco de Ramsés II que **Augusto** trajo de Heliópolis, las dos iglesias gemelas de Santa Maria in Montesanto y Santa Maria dei Miracoli, y las tres calles del Tridente abriéndose hacia el centro.\n\nMás allá, los techos de Roma, y recortada contra el horizonte la **cúpula de San Pedro**. Al atardecer, con el sol bajando justo detrás de la cúpula, es la postal más conocida de la ciudad y sigue estando a la altura de su fama.\n\n## El reloj de agua\n\nEntre los árboles del paseo, un poco escondido, hay un *idrocronometro*: un reloj movido por agua, construido por el dominico **Giovan Battista Embriaco** en 1867. Un chorro llena alternadamente dos recipientes que bascular y hacen avanzar el mecanismo. Ganó un premio en la Exposición Universal de París y sigue funcionando.\n\n## Lo práctico\n\nEs gratis y está siempre abierto. El tramo desde Trinità dei Monti es plano y arbolado: el mejor del día para los cochecitos. Desde la terraza se baja a Piazza del Popolo por las rampas de Valadier, que también son suaves.\n\nEl mejor momento es la última hora de la tarde. En octubre, antes del cambio de hora, eso significa alrededor de las seis.", "logi": {"Costo": "Gratis", "Mejor momento": "Última hora de la tarde"}, "map": "Terrazza del Pincio, Roma", "id": "s29", "day": "17", "pri": 2, "src": "propio", "ver": ["La terraza sobre Piazza del Popolo, con las dos iglesias gemelas abajo.", "La cúpula de San Pedro recortada al fondo: al atardecer es la mejor vista de Roma.", "El **idrocronometro**, un reloj movido por agua escondido entre los árboles del paseo."], "zone": "El norte · Spagna y Popolo"}, {"time": "11:35", "name": "Santa Maria del Popolo", "tag": "site", "type": "site", "dur": 40, "quick": "Dos Caravaggio y la capilla Chigi de Rafael.", "hist": "Levantada en 1099 sobre el sepulcro de los Domicios, donde la leyenda situaba la tumba de Nerón. Reconstruida por Sixto IV en el Renacimiento.", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Bajar del Pincio por la rampa en zigzag hasta Piazza del Popolo. La iglesia está a la izquierda, pegada a la Porta del Popolo."}, "full": "## Sobre la tumba de Nerón\n\nLa iglesia actual fue erigida en 1477 por **Sixto IV**, sobre una antigua capilla levantada por el Papa Pascual II con limosnas del pueblo romano, en acción de gracias por la conquista de Jerusalén, en julio de 1099. Un bosque de álamos cubría antiguamente la tumba, y de este particular han deducido\n\notro origen del nombre de la puerta, de la iglesia y de la misma plaza: álamo en latín se dice populus. La iglesia sufrió en el s.XVII algunas reformas barrocas, obra de **Bramante**, pero que no alteraron substancialmente su aspecto arquitectónico florentino–romano, característico de la época sixtina. En el convento de esta iglesia vivía Lutero antes de abandonar el catolicismo. El interior es de tres naves, con bóvedas sostenidas por pilastras, con medias columnas adosadas, y crucero coronado por una cúpula.\n\n## Las capillas\n\nSobre el altar de la primera capilla de la derecha, se encuentra una Adoración del Niño, de **Pinturicchio**, que pintó también las lunetas con escenas de la vida de San Jerónimo. La segunda tiene 16 columnas de jaspe siciliano y sobre el altar, un cuadro de Maratta que representa la Asunción. En la tercera, frescos de Pinturicchio y de otros colaboradores. La cúpula del crucero es la primera construida en Roma después de la época romana. El altar mayor fue reconstruido por **Bernini**, y en él se venera una imagen de la Virgen del s. XIII.\n\nEn el techo, frescos de Pinturicchio. A la izquierda del altar mayor, en la primera capilla, hay dos obras de **Caravaggio**: la Crucifixión de **San Pedro** y la Conversión de San Pablo. La Capilla Chigi, la segunda de la nave de la izquierda, es obra de Rafael. Son de Rafael los mosaicos de la bóveda, con escenas del Antiguo y del Nuevo Testamento. En los lados, las tumbas de los Chigi en forma de pirámide. De la Piazza del Popolo parten tres calles: Babuino, Corso y Ripetta. Esta última conducía directamente al puerto de Ripetta, sobre el Tíber, antiquísimo punto de avituallamiento de la Urbe. Era, junto al Corso, lugar de paso obligado para los peregrinos ilustres que, después de atravesar la porta del Popolo, se dirigían hacia San Pedro.", "logi": {"Horario": "7:15 a 12:30 y 16:00 a 19:00", "Costo": "Gratis", "No perderse": "La Conversión de San Pablo y la Crucifixión de San Pedro, en la capilla Cerasi"}, "map": "Basilica di Santa Maria del Popolo, Roma", "id": "s30", "day": "17", "hrs": {"open": [[435, 750], [960, 1140]], "closed": []}, "hv": false, "pri": 1, "src": "fuentes", "ver": ["Los **dos Caravaggio** en la capilla Cerasi, a la izquierda del altar mayor: la Conversión de San Pablo y la Crucifixión de San Pedro.", "La **capilla Chigi**, segunda de la nave izquierda, proyectada por Rafael: los mosaicos de la bóveda son suyos.", "La **Adoración del Niño** de Pinturicchio, sobre el altar de la primera capilla de la derecha."], "zone": "El norte · Spagna y Popolo"}, {"time": "12:30", "name": "Almuerzo en el Tridente", "tag": "food", "type": "food", "dur": 90, "quick": "Alrededor de Piazza del Popolo y Via di Ripetta.", "logi": {"Costo adultos": "€15 a €25", "Costo niños": "€8 a €12"}, "travel": {"mode": "walk", "dur": 6, "costAd": "Gratis", "costCh": "Gratis", "how": "Saliendo de Santa Maria del Popolo, bajar por Via di Ripetta: hay trattorias y pizzerías en las transversales."}, "id": "s26", "day": "17", "pri": 3}, {"id": "s71", "day": "17", "tag": "site", "type": "site", "time": "14:15", "dur": 25, "pri": 2, "name": "Fontana di Trevi", "zone": "Centro histórico", "quick": "La fuente más famosa de Roma. Una moneda de espaldas, para volver.", "hist": "Terminada en 1762 por Nicola Salvi sobre el final del acueducto Aqua Virgo, que trae agua a Roma desde el año 19 a.C. Océano domina el centro, entre la Abundancia y la Salubridad.", "ver": ["La figura de **Océano** sobre el carro de caballos marinos.", "A la derecha, **Santa Maria in Trivio**: ahí descansa **San Gaspar del Búfalo**.", "Enfrente, la iglesia de los **Santos Vicente y Anastasio**, con los corazones de los papas."], "logi": {"Acceso": "Libre, siempre abierta", "Gente": "Mucha a toda hora: cuidar bolsos", "Monedas": "Se donan a Cáritas de Roma"}, "map": "Fontana di Trevi, Roma", "src": "propio", "travel": {"mode": "walk", "dur": 20, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Piazza del Popolo, bajar por Via del Corso hasta Via delle Muratte, a la izquierda: desemboca en la fuente.", "tip": "Alternativa: metro A de Flaminio a Barberini y 6 minutos a pie."}}, {"id": "s72", "day": "17", "tag": "site", "type": "site", "time": "14:50", "dur": 35, "pri": 1, "name": "Panteón", "zone": "Centro histórico", "quick": "Templo de todos los dioses consagrado a la Virgen y los mártires en el año 609.", "hist": "Construido por Adriano hacia el 125 sobre el de Agripa. La cúpula de hormigón, con el óculo abierto al cielo, sigue siendo la más grande del mundo sin armar. En 609 el papa Bonifacio IV lo dedicó a Santa María y a todos los Mártires, y trajo carros de huesos de las catacumbas.", "ver": ["El **óculo**: 9 metros abiertos al cielo. Cuando llueve, el agua cae al piso y se va por los desagües originales.", "La tumba de **Rafael**.", "El **ícono de la Virgen** sobre el altar mayor, del siglo VII."], "logi": {"Horario": "9:00 a 19:00 · último ingreso 18:30", "Costo adultos": "€5", "Costo niños": "Gratis menores de 18", "Misa": "Domingos y feriados entrada libre para misa"}, "hrs": {"open": [[540, 1140]], "closed": []}, "hv": false, "map": "Pantheon, Roma", "src": "propio", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Trevi, tomar Via delle Muratte, cruzar Via del Corso y seguir por Via di Pietra y Piazza di Pietra (las columnas del templo de Adriano) hasta Piazza della Rotonda."}}, {"id": "s73", "day": "17", "tag": "site", "type": "site", "time": "15:30", "dur": 30, "pri": 2, "name": "Santa Maria sopra Minerva", "zone": "Centro histórico", "quick": "La única iglesia gótica de Roma. Bajo el altar, Santa Catalina de Siena.", "hist": "Iglesia dominica levantada en el siglo XIII sobre restos antiguos. Bóveda azul estrellada, el Cristo de Miguel Ángel y, bajo el altar mayor, el cuerpo de Santa Catalina de Siena, Doctora de la Iglesia y patrona de Italia y de Europa.", "ver": ["El sarcófago de **Santa Catalina de Siena**, bajo el altar mayor.", "El **Cristo Redentor** de Miguel Ángel, a la izquierda del altar.", "La tumba de **Fra Angélico**, en el pasillo a la izquierda del presbiterio.", "Afuera, el **elefantito de Bernini** con el obelisco."], "logi": {"Horario": "Aprox. 7:30 a 19:00 · verificar", "Costo": "Gratis"}, "hrs": {"open": [[450, 1140]], "closed": []}, "hv": false, "map": "Basilica di Santa Maria sopra Minerva, Roma", "src": "propio", "travel": {"mode": "walk", "dur": 2, "costAd": "Gratis", "costCh": "Gratis", "how": "Detrás del Panteón, por Via della Minerva: la plaza del elefante."}}, {"id": "s74", "day": "17", "tag": "site", "type": "site", "time": "16:15", "dur": 40, "pri": 2, "name": "Piazza Navona", "zone": "Centro histórico", "quick": "El estadio de Domiciano hecho plaza. Bernini, Borromini y Santa Inés.", "hist": "Conserva la forma alargada del estadio que Domiciano construyó hacia el año 86. Según la tradición, Santa Inés fue expuesta y martirizada en sus arcos; sobre ese lugar se levanta Sant'Agnese in Agone, de Borromini.", "ver": ["La **Fuente de los Cuatro Ríos** de Bernini: el Río de la Plata es el de la moneda.", "En **Sant'Agnese in Agone**, el **cráneo de Santa Inés** en la capilla de San Felipe Neri.", "Al norte, el **Estadio de Domiciano** visible desde Piazza di Tor Sanguigna."], "logi": {"Acceso": "Libre, siempre abierta", "Sant'Agnese in Agone": "9:00 a 13:00 y 15:00 a 19:00, lunes cerrada"}, "map": "Piazza Navona, Roma", "src": "propio", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde la Minerva, volver al Panteón y tomar Via Giustiniani y Corso del Rinascimento: Piazza Navona está del otro lado.", "tip": "Buen lugar para un helado antes de volver."}}, {"id": "s75", "day": "17", "tag": "rest", "type": "rest", "time": "17:15", "pri": 3, "name": "Vuelta al departamento", "quick": "En bus desde Corso Vittorio Emanuele.", "travel": {"mode": "bus", "dur": 25, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Bus 64 desde Corso Vittorio Emanuele (parada Sant'Andrea della Valle o Navona), hasta la parada final, Stazione San Pietro.", "tip": "Si van cansados, taxi desde Piazza Navona: unos €12."}}]}, {"date": "2026-10-18", "phase": 1, "weekday": "Dom", "dd": "18", "title": "Día de la Madre · despedida", "note": "Último día todos juntos, y Día de la Madre en Argentina.", "stops": [{"time": "08:10", "name": "Salida hacia Monti", "tag": "rest", "type": "rest", "dur": 40, "quick": "Mismo camino del domingo pasado.", "logi": {"Recorrido": "Metro A hasta Termini, línea B hasta Cavour", "Costo adultos": "€1,50", "Costo niños": "Gratis los menores de 10"}, "id": "s64", "day": "18", "pri": 3}, {"time": "09:00", "name": "Santa Misa", "tag": "mass", "type": "mass", "dur": 75, "quick": "Santa Caterina da Siena, Via Urbana 85. La última misa dominical todos juntos.", "hist": "Capilla de la Fraternidad San Pío X en Roma, en el Rione Monti.", "travel": {"mode": "metro", "dur": 40, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Ottaviano, línea A hasta Termini, línea B una parada hasta Cavour, y a pie por Via Urbana."}, "logi": {"Horario": "9:00 y 11:00 los domingos", "Dirección": "Via Urbana 85", "Costo": "Gratis", "Sobre el horario": "Cappella Santa Caterina da Siena. Viernes 18:30."}, "map": "Via Urbana 85, Roma", "id": "s65", "day": "18", "hrs": {"open": [[510, 630]], "closed": []}, "hv": true, "pri": 1, "full": "La Fraternidad Sacerdotal **San Pío X** tiene en Roma su capilla en Via Urbana 85, en pleno Rione Monti, a pasos del Foro de **Augusto** y de la basílica de Santa Pudenciana. Está dedicada a Santa Catalina de Siena.\n\n## Santa Catalina y el regreso de los papas\n\nCatalina Benincasa nació en Siena en 1347, la vigésimo cuarta hija de un tintorero. Terciaria dominica, analfabeta hasta la juventud, dictaba sus cartas a secretarios y se las mandaba a reyes, cardenales y papas con una libertad que a muchos les resultaba insoportable.\n\nEn 1376 viajó a Aviñón, donde los papas llevaban setenta años instalados bajo la protección de la corona francesa. Se plantó delante de **Gregorio XI** y le dijo que volviera a Roma. El papa volvió al año siguiente. Catalina murió en Roma en 1380, a los treinta y tres años, agotada. Es patrona de Italia y de Europa, y doctora de la Iglesia.\n\nQue la capilla lleve su nombre no es casual: es la santa que peleó por que la sede de Pedro estuviera donde tiene que estar.\n\n## La misa tradicional\n\nSe celebra en la forma extraordinaria del rito romano, el rito que **San Pío V** codificó en 1570 con la bula *Quo primum*, después del Concilio de Trento, y que se rezó prácticamente sin cambios durante cuatro siglos.\n\nPío V no inventó nada: fijó lo que la Iglesia de Roma venía haciendo desde hacía más de mil años, y ordenó que ese misal se usara en todas partes salvo donde hubiera un rito propio con más de dos siglos de antigüedad. De ahí que sobrevivieran el ambrosiano de Milán, el mozárabe de Toledo y el dominicano.\n\nLa misa es en latín, el sacerdote celebra vuelto al altar junto con el pueblo, y hay largos silencios: el canon se reza en voz baja. Para quien no está acostumbrado, conviene llegar unos minutos antes y conseguir un misal bilingüe.\n\n## Los horarios\n\nDomingos a las 9:00 y a las 11:00, con confesiones antes de cada una. Viernes a las 18:30. La capilla es chica y en temporada alta se llena, así que conviene no llegar sobre la hora.\n\n## El barrio\n\nMonti es el rione más antiguo de Roma. En la antigüedad era la Suburra, el barrio popular y hacinado donde vivían los pobres de la ciudad y donde nació **Julio César**. Hoy conserva un aire de pueblo que se perdió en el resto del centro: calles angostas, escaleras, ropa colgada, trattorias de barrio y talleres de artesanos.\n\nAlrededor de la capilla, en un radio de diez minutos a pie, hay más iglesias importantes que en casi cualquier otro punto de Roma. **Santa Pudenciana**, a la vuelta, con el mosaico absidal más antiguo de la ciudad. **Santa Práxedes**, con la columna de la flagelación y la capilla de **San Zenón**. **Santa María la Mayor**, la basílica mayor mariana. Y **San Pietro in Vincoli**, con las cadenas del Apóstol y **el Moisés** de Miguel Ángel.\n\n## Cómo llegar\n\nDesde el departamento son unos cuarenta minutos: metro A hasta Termini, línea B una parada hasta Cavour, y cinco minutos caminando. Subiendo por Via Cavour se dobla a la derecha en Via Urbana. Un domingo temprano el metro va casi vacío y Termini tiene ascensores para los cochecitos.", "src": "propio", "zone": "Monti y Esquilino"}, {"time": "10:30", "name": "San Pablo Extramuros", "tag": "site", "type": "site", "dur": 105, "quick": "Basílica mayor sobre la tumba de San Pablo. El friso con todos los papas.", "hist": "Levantada por Constantino sobre la tumba del Apóstol y ampliada por Teodosio. Un incendio la destruyó en 1823 y fue reconstruida idéntica.", "travel": {"mode": "metro", "dur": 30, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Desde Cavour, línea B dirección Laurentina hasta la estación Basilica San Paolo. La basílica está a 200 metros de la salida.", "tip": "Es la más tranquila de las cuatro mayores: casi nunca hay fila."}, "full": "## El martirio de San Pablo\n\n**San Pablo** fue hecho prisionero en Jerusalén en el año 58 y llevado a Roma por haber apelado a la autoridad del Cesar. Juzgado inocente, vivió en casa de Aquila y Priscila durante algún tiempo, antes de ser de nuevo encarcelado y decapitado el año 67, durante la persecución de **Nerón**; fue enterrado a un lado de la Via Ostiense. El núcleo primitivo del culto se remonta a Constantino y la primera basílica fue consagrada por el Papa Silvestre I. en el año 324.\n\n## La basílica de Teodosio\n\nLa construcción de la basílica en forma monumental se efectuó en tiempo de la triarquía de los emperadores Valentiniano II, **Teodosio** I (emperador que impuso a todo el Imperio el credo de Nicea e hizo del catolicismo la religión oficial del Estado) y su hijo Arcadio, quienes, en torno al año 390 ya habían terminado las obras de cimentación, más bien complicadas debido a la cercanía del Tíber.\n\nComo no podía alargarse la construcción original por el lado de la Via Ostiense y, por otro lado, no querían modificar la disposición de la tumba del Apóstol, cambiaron la orientación, que quedó con el ábside en la Via Ostiense y la fachada mirando hacia el Tíber, de modo que la tumba ocupase una posición central en el centro de la nave. La nueva Basílica era más grande que la de **San Pedro**. La noche del 15 al 16 de julio de 1823, un incendio estuvo a punto de devastar la basílica. Los daños fueron sólo parciales, y se procedió enseguida a remediar la catástrofe, con ayudas que llegaron de todo el orbe cristiano.\n\n## El incendio de 1823\n\nLa nave central y las laterales se reconstruyeron totalmente, a pesar de que las llamas no habían tocado la parte sur. El ábside y el crucero requirieron una reparación considerable. Aunque San Pablo Extramuros está adornada hoy en día con brillantes mármoles y vivos colores, aún corresponde a los planos originales del s.IV, y manifiesta la grandeza de las primitivas basílicas cristianas de Roma, y la fe de aquellas primeras generaciones de seguidores de Cristo. Atrio Entrando por la puerta principal –la que mira al Tíber se encuentra el cuadripórtico, rodeado de arcadas, construido a principios de este siglo.\n\n## El quadriportico\n\nEn la parte más cercana a la fachada se encuentran diez columnas monolíticas de mármol rosa de Baveno, de 10 m de alto; en los otros lados está rodeado por columnas de granito blanco, en filas dobles a los flancos, y en una triple fila en el lado del Tíber. En el centro se encuentra la estatua de San Pablo, y a la derecha de la fachada, la de San Lucas, ambas del s. XIX.\n\nEl mosaico es una reposición del realizado por **Pietro Cavallini** en el s.XIV. La puerta central de acceso al interior, flanqueada por las estatuas de San Pedro y San Pablo, está decorada, en bronce y plata, con escenas de las vidas de los Apóstoles.\n\nLa **Puerta Santa** se encuentra, tapiada, al lado derecho; en la parte interna de esta puerta están colocados los dos batientes de la puerta mayor de la antigua Basílica, cinceladas y damasquinadas en plata, con 54 recuadros en los que se narran historias del Antiguo y del Nuevo Testamento, símbolos e inscripciones, realizados en Constantinopla por Staurachio de Scio (1070), por encargo del Abad Hildebrando, que después sería el famoso Papa Gregorio VII.\n\n## El interior\n\nOchenta columnas –monolitos de granito–separan las cinco naves. El techo en oro y blanco ostenta el escudo de armas de Papa Pío IX (1846–78), que fue quien consagró esta Basílica de 131,66 m de largo, 65 m., de ancho (24.60 sólo la nave central) y 29,7m., de alto. Las grandes ventanas, en lugar de cristales, tienen placas de alabastro que filtran la luz del día e iluminan los 36 frescos con hechos de la vida de San Pablo, obra de los pintores más famosos de mediados del siglo pasado.\n\nEn el plano inmediatamente inferior se encuentran 262 mosaicos con la serie de retratos de los Papas –desde San Pedro hasta hoy–, que ocupa toda la nave central y parte de las laterales. A lo largo de las paredes laterales se alternan ventanas y nichos que contienen estatuas de los Apóstoles, de diversos autores, realizadas en torno a 1884. Dos gigantescas columnas de granito con capiteles jónicos (las más grandes que se han hecho después de la caída del Imperio Romano) sostienen el arco del presbiterio en el que han sido representados San Lucas y San Marcos y los 24 ancianos del Apocalipsis.\n\n## El baldaquino y el altar\n\nEl baldaquino gótico de **Arnolfo di Cambio** (1285) salió incólume del incendio, está sostenido por cuatro columnas de pórfido, con capiteles de mármol dorado, y decorado por figuras de fina ejecución, desde los ángeles que soportan los rosetones, hasta los animales en el techo abovedado. Sobre las columnas. en cuatro nichos, se distinguen San Pedro, San Pablo, San Lucas y San Benito. El lado que mira a la nave muestra al Abad Bartolomé, que mandó hacer **el baldaquino**, para ofrecerlo a San Pablo.\n\nBajo el baldaquino se encuentra el altar mayor. La mesa se halla 1.37 m. por encima de una placa de mármol con el nombre de Pablo, Apóstol y Mártir. También está enterrado aquí San Timoteo, discípulo de S. Pablo. El SEPULCRO DE SAN PABLO: En diciembre de 2006 un sarcófago que podría contener los restos de San Pablo ha sido identificado exactamente bajo el epígrafe “Paulo apostolo mart”que está siempre visible en la base del altar de la Basílica San Pablo de Extramuros de Roma.\n\n## La tumba del Apóstol\n\nLa Sala de Prensa del Vaticano publicó el 11 de noviembre de 2006 la siguiente nota del arqueólogo Giorgio Filippi sobre el sarcófago de San Pablo: \"La basílica surge en el sepulcro del apóstol, en la Vía Ostiense, donde a finales del siglo II el presbítero romano Gayo, indicaba la existencia del «tropaion», erigido para testimoniar el martirio de Pablo. En el lugar se sucedieron, a lo largo del siglo IV, dos edificios, el «constantiniano» y el de «los Tres Emperadores», ligados a la peregrinación devocional a la tumba del apóstol y utilizados como cementerios y con objetivos litúrgicos.\n\nLa única documentación que hace referencia a la situación arqueológica del monumento se encuentra en unos pocos dibujos y bocetos con medidas, cuya interpretación en ocasiones es enigmática, realizados por los arquitectos Virginio **Vespignani** (1808-1882) y Paolo Belloni (1815-1889), tras el incendio de 1823, durante las excavaciones realizadas con motivo de la nueva Confesión (1838) y de la colocación de los cimientos del baldaquino de Pío IX (1850).\n\nLos vestigios arqueológicos que se encontraron entonces dejaron de ser visibles después, pues en parte fueron destruidos y en parte precintados por la actual Confesión (monumento del altar mayor). El hecho de que la Basílica de San Pablo surgiera sobre la tumba del apóstol es un dato indiscutible en la tradición histórica, mientras que la identificación del sepulcro originario es una cuestión que ha quedado abierta.\n\nLa Crónica del Monasterio habla de un gran sarcófago de mármol, encontrado durante las obras de reconstrucción de la basílica, después del incendio de 1823, en el área de **la Confesión**, bajo las dos lápidas en las que está escrito «PAVLO APOSTOLO MART(YRI)», del que sin embargo no queda huella en la documentación de excavaciones, a diferencia de los otros sarcófagos descubiertos en aquella ocasión, entre los que se encuentra el famoso «dogmático», que hoy es conservado en los Museos Vaticanos.\n\nLas investigaciones arqueológicas en la zona, considerada tradicionalmente como el lugar de sepultura del apóstol, comenzadas en el año 2002 y acabadas el 22 de septiembre de 2006, han sacado a la luz diferentes estratos, formados por el ábside de la basílica constantiniana, englobada en el transepto del edificio de los Tres Emperadores: en el suelo de este último, bajo el altar papal, ha aparecido ese gran sarcófago del que se habían perdido las huellas y que se consideraba desde la época teodosiana como la Tumba de San Pablo. Estas investigaciones tenían por objetivo verificar la consistencia y el estado de conservación de los vestigios de la basílica constantiniana y teodosiona, sobrevividos a la reconstrucción que tuvo lugar después del incendio y de valorizarla por razones de devoción.\n\nDel 2 de mayo al 17 de noviembre de este año (2006), se acabó, en la zona de la Confesión, el proyecto para abrir acceso a la Tumba de San Pablo. Después de haber desmontado el Altar de San Timoteo, se excavó en la zona inferior para volver a sacar a la luz, en toda su superficie de unos 5 metros cuadrados, el ábside de la basílica constantiniana.\n\nPara llegar hasta los vestigios del siglo IV se excavó dentro de los muros de la moderna base para los cimientos que se adapta perfectamente a las estructuras antiguas, tanto en su base como en su altura, hasta llegar hasta el punto de diferencia entre la parte antigua y la nueva, que se puede constatar por el color diferente de la argamasa, rosada la del siglo XIX y gris la del siglo IV.\n\nDado que la altura del transepto de los Tres Emperadores, sobre el que se encuentra el sarcófago de San Pablo, es más alta con respecto al nivel de la actual Confesión, es evidente que el nivel ha sido demolido con motivo de las obras del siglo XIX. La plataforma se conserva, en forma de peldaño, detrás del altar de Timoteo, incorporado en el muro moderno que delimita el lado este de la Confesión.\n\nDurante las obras del siglo XIX, dado que parece que la cumbre del ábside tenía algunas partes inestables, fueron removidas, produciendo el efecto de un peldaño en el «emplecton», de unos diez centímetros de altura, correspondiente a dos hileras de ladrillos, que comienza en el borde interior del ábside, siguiendo su línea curva. En el frente del peldaño se ven las huellas dejadas en el cemento por los ladrillos removidos. Para alcanzar la altura del suelo constantiniano se removió la mitad sur de la zona del ábside.\n\nEn la excavación no se encontraron otros vestigios arqueológicos, con la excepción de restos de albañilería. Para aumentar la visibilidad del sarcófago de San Pablo se amplió en unos 0,70 centímetros el hueco que atraviesa el muro del siglo XIX durante las obras de los años 2002-2003. Ha sido posible tomar las medidas del sarcófago: caja de una longitud de 2,55 metros, de una anchura de 1,25 metros y de una altura de 0,97 metros. La cobertura es de 0,30 metros de altura. La parte del ábside descubierta constituye el único testimonio visible de la Basílica atribuida comúnmente a **Constantino**.\n\nSigue abierto el problema topográfico de la relación entre la basílica y el suelo descubierto en 1850, en el oeste del ábside de Constantino. Belloni consideró que se trataba de la antigua Vía Ostiense, que habría sido desviada a su colocación actual por orden de los Tres Emperadores, pero no midió el nivel del empedrado. En este sentido, resulta de particular interés el descubrimiento, dentro del ábside constantiniano, de algunos grandes bloques de basalto, reutilizados como material de construcción en los cimientos de la basílica de los Tres Emperadores.\n\nPor lo que se refiere a la planta de la basílica constantiniana, dado que sólo contamos con las nuevas medidas realizadas en el ábside, es prematuro hacer nuevas hipótesis, confirmando las modestas dimensiones del edificio.\n\nEl nivel del estrato de barro, descubierto sobre el nivel del ábside constantiniano, concuerda con al transepto de los Tres Emperadores (390 d.C.), sobre el que se apoya el gran sarcófago que indicaba la Tumba del Apóstol en la época de la construcción de la nueva y grande basílica, y estaba delimitado por un podio presbiteral monumental, como parece que deja suponer la gran plataforma de sus cimientos, de un espesor de 1,66 m., que se apoya directamente sobre el suelo del ábside constantiniano.\n\nNo se puede excluir que en el interior de estos cimientos puedan encontrarse restos del «tropaion» erigido sobre la tumba del apóstol Pablo. Se puede considerar que entre 1838 y 1840, en la zona de la Confesión, se removió o demolió todo lo que se encontraba sobre el suelo de los Tres Emperadores. Para echar los cimientos del nuevo presbiterio y del altar papal, se trasladó incluso el sarcófago de san Pablo. Por ahora en el área estudiada, entre el nivel del suelo del año 390 y el de los cimientos de 1840, no se han encontrado vestigios de otras épocas\".\n\n## Los análisis del sarcófago\n\nEl Papa **Benedicto XVI**, en una homilía de 28 de junio de 2009, dio a conocer el resultado de determinados análisis científicos efectuados en este sarcófago: \"Estamos congregados en la tumba del apóstol, cuyo sarcófago, conservado bajo el altar papal, ha sido recientemente objeto de un atento análisis científico.\n\nEn el sarcófago, que no ha sido abierto jamás durante tantos siglos, se practicó una pequeñísima perforación para introducir una sonda especial, mediante la cual se han puesto de manifiesto huellas de un precioso tejido de lino de color púrpura, recubierto con oro cequí, y de una tela de color azul con filamentos de lino. Se ha puesto de manifiesto también la presencia de granos de incienso rojo y de sustancias proteicas y calcáreas.\n\nAdemás, el análisis de pequeñísimos fragmentos óseos, sometidos al examen del carbono 14 por parte de expertos que desconocían su procedencia, ha dado como resultado que pertenecieron a una persona que vivió entre los siglos I y II de la era cristiana. Esto parece confirmar la unánime e indiscutible tradición que se trata de restos mortales del apóstol Pablo\". El mosaico del ábside, del s. XIII, es obra de artistas Venecianos, que siguieron el modelo bizantino. La pequeña figura a los pies de Cristo representa al Papa Honorio III. quien encargó la realización del mosaico. Fue restaurado en el s. XIX.\n\nEl techo del crucero está ricamente decorado con el símbolo de San Pablo –un brazo y una espada–y los escudos de diversos Papas desde 1800 hasta 1846 (Pío VII. León XII. Pío VIII y Gregorio XVI). A la izquierda del ábside se encuentra la Capilla del Santísimo, única capilla que se libró por completo de las demoliciones que siguieron al incendio. Aquí se encuentra un crucifijo de madera del s. XIV, atribuido a Cavallini; este es el que habló a Santa Brígida cuando vino como peregrina a Roma.\n\nHay una estatua de madera muy chamuscada de San Pablo, del s. XIII, muy venerada en la Edad Media porque se consideraba un retrato directo del Apóstol. Una placa recuerda que en este lugar hicieron sus votos san Ignacio y sus compañeros. A un lado del altar mayor. se encuentra el candelero del cirio pascual, de Nicoló di Angelo y Pietro Vassalletto (s. XII), de 5,6 m de alto. La basílica guarda las reliquias entre otros del beato Cardenal Schuster. El claustro es obra de Pietro Vassalletto (s. XII), el mismo a quien se atribuye el claustro de San Juan de Letrán. En esta zona se encuentra la Capilla de las Reliquias, donde se conservan relicarios preciosos, entre otros uno en el que se conserva un fragmento de la Cruz.", "logi": {"Horario": "7:00 a 18:30", "Costo": "Gratis · claustro €4", "No perderse": "El friso con los retratos de todos los papas y el claustro cosmatesco", "Sobre el horario": "Claustro €4."}, "map": "Basilica di San Paolo fuori le Mura, Roma", "id": "s66", "day": "18", "hrs": {"open": [[420, 1110]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **tumba de San Pablo** bajo el altar mayor, con las cadenas de su prisión en una vitrina.", "El **friso con los retratos de todos los papas** dando la vuelta a la nave: quedan huecos para los que vengan.", "El **claustro cosmatesco** del siglo XIII, que sobrevivió al incendio de 1823.", "El **candelabro pascual** del siglo XII, junto al altar, todo tallado con escenas de la Pasión.", "Las puertas bizantinas de bronce, del año 1070, hoy en el interior."], "zone": "Fuera de las murallas"}, {"time": "12:30", "name": "Almuerzo del Día de la Madre", "tag": "food", "type": "food", "dur": 90, "quick": "Un almuerzo tranquilo para agasajar a las mamás del grupo.", "logi": {"Costo adultos": "€15 a €25", "Costo niños": "€8 a €12"}, "travel": {"mode": "metro", "dur": 30, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Volver en la lí const D = DATA, T = D.trip, DAYS = T.days;
const STOPS = {}; DAYS.forEach(d => d.stops.forEach(s => STOPS[s.id] = s));
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MO = ['enero','febrero','marzo','abril','mayo','junio','julio',
            'agosto','septiembre','octubre','noviembre','diciembre'];

/* ── reloj de Roma ── */
function rome(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,
    weekday:'short'}).formatToParts(new Date());
  const g = k => p.find(x => x.type === k).value;
  return {ymd:`${g('year')}-${g('month')}-${g('day')}`,
          min:(+g('hour'))*60 + (+g('minute')),
          dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday'))};
}
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin = t => { const [a,b] = t.split(':'); return (+a)*60 + (+b); };
function dur(m){ const h = Math.floor(m/60), r = m%60;
  return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; }

/* ── estado ── */
let TAB = 'ahora', DAY = 0, Q = '';
const R = rome();
const todayIdx = DAYS.findIndex(d => d.date === R.ymd);
const before = R.ymd < DAYS[0].date, after = R.ymd > DAYS[DAYS.length-1].date;
DAY = todayIdx >= 0 ? todayIdx : (after ? DAYS.length-1 : 0);

/* ── horarios ── */
function closesIn(s, dayIso){
  if(!s.hrs || dayIso !== R.ymd) return null;
  if(s.hrs.closed && s.hrs.closed.includes(R.dow)) return {shut:true};
  for(const [a,b] of s.hrs.open){
    if(R.min >= a && R.min < b) return {left:b - R.min};
  }
  return null;
}
function warnings(){
  const d = DAYS[DAY]; if(!d || d.date !== R.ymd) return [];
  const out = [];
  for(const s of d.stops){
    const c = closesIn(s, d.date);
    if(c && !c.shut && c.left <= 60 && toMin(s.time) >= R.min - 30) out.push({s, left:c.left});
  }
  return out;
}

/* ── clima ── */
function paintWx(o, stale){
  const el = document.getElementById('wx'); if(!el) return;
  if(!o){ el.textContent = '—'; return; }
  const ic = o.code === 0 ? '☀' : o.code < 4 ? '⛅' : o.code < 60 ? '☁' : '🌧';
  el.textContent = `${o.temp}°`;
  const n = document.getElementById('wxn');
  if(n) n.textContent = (stale ? 'dato viejo ' : 'Roma ') + ic;
}
async function loadWx(){
  let c = null;
  try{ c = JSON.parse(localStorage.getItem('rome2026:wx') || 'null'); }catch(e){}
  if(c) paintWx(c, Date.now() - c.t > 6*3600e3);
  if(c && Date.now() - c.t < 3*3600e3) return;
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.902&longitude=12.453&current=temperature_2m,weather_code&timezone=Europe%2FRome');
    const j = await r.json();
    const o = {t:Date.now(), temp:Math.round(j.current.temperature_2m), code:j.current.weather_code};
    localStorage.setItem('rome2026:wx', JSON.stringify(o)); paintWx(o);
  }catch(e){ if(!c) paintWx(null); }
}

/* ── utilidades ── */
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapsUrl = s => 'https://www.google.com/maps/search/?api=1&query=' +
  encodeURIComponent(s.map || (s.name + ', Roma'));
const pic = (id, mini) => `<img src="fotos/${mini?'mini/':''}${id}.jpg" loading="lazy"
  alt="" onload="this.classList.add('on')" onerror="this.remove()">`;
const FUENTE = {
  fuentes: 'De la <i>Guía de Roma</i> del P. Miguel Ángel Fuentes, IVE (2011).',
  propio:  'Redacción propia, sobre fuentes históricas y arqueológicas.',
  mixto:   'Guía del P. Fuentes, IVE, ampliada con otras fuentes.'
};
const pieFuente = s => s.src
  ? `<div class="src">${FUENTE[s.src] || ''}</div>` : '';
const MODE = {walk:'🚶 A pie', metro:'Ⓜ️ Metro', bus:'🚌 Bus', car:'🚗 En auto', train:'🚆 Tren'};

/* ══ AHORA ══ */
function viewAhora(){
  const d = DAYS[DAY];
  let hero, next = null, cur = null;
  if(d.date === R.ymd){
    for(let i = 0; i < d.stops.length; i++){
      const s = d.stops[i], a = toMin(s.time), b = a + (s.dur || 45);
      if(R.min >= a && R.min < b){ cur = {s, a, b}; next = d.stops[i+1]; break; }
      if(R.min < a){ next = s; break; }
    }
  }
  if(before){
    const dd = Math.round((new Date(DAYS[0].date) - new Date(R.ymd)) / 864e5);
    hero = `<div class="hero"><div class="lbl">El viaje no empezó</div>
      <h2 class="disp">Faltan ${dd} días</h2>
      <div class="sub">Primer día: viernes 9 de octubre</div></div>`;
    next = DAYS[0].stops[0];
  } else if(after){
    hero = `<div class="hero"><div class="lbl">Fin del viaje</div>
      <h2 class="disp">Volvimos</h2><div class="sub">Que quede el recuerdo</div></div>`;
  } else if(cur){
    const pc = Math.round((R.min - cur.a) / (cur.b - cur.a) * 100);
    hero = `<div class="hero"><div class="lbl">En curso · ${hhmm(R.min)}</div>
      <h2 class="disp">${esc(cur.s.name)}</h2>
      <div class="sub">Termina ${hhmm(cur.b)} · ${esc(cur.s.quick || '')}</div>
      <div class="prog"><i style="width:${pc}%"></i></div></div>`;
  } else if(next){
    hero = `<div class="hero"><div class="lbl">Ahora · ${hhmm(R.min)}</div>
      <h2 class="disp">Rato libre</h2>
      <div class="sub">Lo próximo empieza ${next.time}</div></div>`;
  } else {
    hero = `<div class="hero"><div class="lbl">${esc(d.weekday)} ${d.dd} · ${hhmm(R.min)}</div>
      <h2 class="disp">Día terminado</h2><div class="sub">A descansar</div></div>`;
  }

  let nx = '';
  if(next){
    const t = next.travel;
    const ttl = before ? `Primera parada · vie 9, ${next.time}` : `Después · ${next.time}`;
    nx = `<div class="card"><div class="lbl">${ttl}</div>
      <h3 class="disp">${esc(next.name)}</h3>
      ${t && !before ? `<div class="go"><span>${MODE[t.mode] || '→'}</span>
        <span><b>${t.dur} min</b> ${esc((t.how||'').split('.')[0])}</span></div>` : ''}
      ${before ? `<div class="go"><span>🕒</span><span>${esc(next.quick||'')}</span></div>` : ''}
      <button class="mapbtn" onclick="window.open('${mapsUrl(next)}','_blank')">📍 Abrir en Google Maps</button>
    </div>`;
  }

  let pend = '';
  if(before){
    const p = D.info.reservas.rows.filter(r => /pendiente/i.test(r[1]));
    if(p.length) pend = `<div class="card"><div class="lbl">Todavía falta reservar</div>
      ${p.map(([k,v]) => `<div class="row"><div class="k">${esc(k)}</div>
        <div class="v">${esc(v)}</div></div>`).join('')}</div>`;
  }

  const rest = d.date === R.ymd ? d.stops.filter(s => toMin(s.time) > R.min).length : d.stops.length;
  const last = d.stops[d.stops.length-1];
  const chips = `<div class="chips">
    <div class="chip"><div class="k" id="wxn">Roma</div><div class="v" id="wx">…</div></div>
    <div class="chip"><div class="k">Paradas</div><div class="v">${rest}</div></div>
    <div class="chip"><div class="k">Cierra</div><div class="v">${last.time}</div></div></div>`;

  const w = warnings().map(x => `<div class="warn">⏳ <span><b>${esc(x.s.name)}
    cierra en ${dur(x.left)}.</b> Si van hoy, tiene que ser ahora.</span></div>`).join('');

  const sc = SANTOS.ahoraCard(cur ? cur.s : (!before && !after ? next : null));
  return hero + `<div class="pad">${nx}${sc}${chips}${w}${pend}</div>`;
}

function strip(){
  return '<div class="strip">' + DAYS.map((d,i) =>
    `<button class="${i===DAY?'on':''}" onclick="go(${i})"><i>${d.weekday}</i>${d.dd}</button>`
  ).join('') + '</div>';
}
function go(i){ DAY = i; if(TAB === 'guia') TAB = 'dia'; render(); }

/* ══ DÍA ══ */
let ONLY = false;
function viewDia(){
  const d = DAYS[DAY], isToday = d.date === R.ymd;
  const n0 = d.stops.filter(s => s.pri === 1).length;
  const list = (ONLY && n0 >= 2) ? d.stops.filter(s => s.pri === 1) : d.stops;
  const li = list.map(s => {
    const done = isToday && toMin(s.time) + (s.dur||45) < R.min;
    const c = closesIn(s, d.date);
    const t = s.travel;
    const trav = (!ONLY && t) ? `<div class="trav">${MODE[t.mode]||'→'} · ${t.dur} min</div>${SANTOS.legHTML(s.id)}` : '';
    if(s.pri === 3) return `${trav}<li class="s3 ${done?'done':''}">
      <span class="hr">${s.time}</span>
      <button class="logi" onclick="open_('${s.id}')"><b>${esc(s.name)}</b>${
        s.dur ? ` · ${dur(s.dur)}` : ''}</button></li>`;
    const tags = [];
    if(s.pri === 2) tags.push('<span class="tagm">Si hay tiempo</span>');
    if(s.dur) tags.push(`<span class="tagm">${dur(s.dur)}</span>`);
    if(s.tag === 'mass') tags.push('<span class="tagm lit">Liturgia</span>');
    if(c && !c.shut && c.left <= 60) tags.push(`<span class="tagm hot">Cierra en ${dur(c.left)}</span>`);
    return `${trav}<li class="${s.pri===1?'key':'s2'} ${done?'done':''}">
      <span class="hr">${s.time}</span>
      <button class="stop ${s.pri===2?'s2':''}" onclick="open_('${s.id}')">
        <div class="n">${esc(s.name)}</div>
        <div class="q">${esc(s.quick||'')}</div>
        ${tags.length?`<div class="m">${tags.join('')}</div>`:''}
      </button></li>`;
  }).join('');
  const n1 = d.stops.filter(s => s.pri === 1).length;
  const seg = n1 >= 2 && n1 < d.stops.length ? `<div class="seg">
        <button class="${!ONLY?'on':''}" onclick="ONLY=false;render()">Todo el día</button>
        <button class="${ONLY?'on':''}" onclick="ONLY=true;render()">Solo lo esencial · ${n1}</button>
      </div>` : '';
  return `<div class="pad">${strip()}${seg}</div>
    <div class="dayhd"><h2 class="disp">${esc(d.title)}</h2>
      <div class="nt">${esc(d.note||'')}</div></div>
    ${SANTOS.dayRoute(d)}
    <ol class="tl">${li}</ol>`;
}

/* ══ GUÍA ══ */
function viewGuia(){
  const q = Q.trim().toLowerCase();
  const all = [];
  DAYS.forEach(d => d.stops.forEach(s => { if(s.zone) all.push(s); }));
  const hits = q ? all.filter(s =>
    (s.name + ' ' + (s.quick||'') + ' ' + (s.hist||'')).toLowerCase().includes(q)) : all;
  let out = `<div class="pad"><input class="search" placeholder="Buscar un lugar…"
    value="${esc(Q)}" oninput="Q=this.value;render();this.focus()"></div>`;
  if(!hits.length) return out + '<div class="empty">Nada con esa palabra.</div>';
  out += '<div class="pad">';
  T.zones.forEach(z => {
    const g = hits.filter(s => s.zone === z);
    if(!g.length) return;
    out += `<div class="zone">${esc(z)}</div>` + g.map(s =>
      `<button class="gitem" onclick="open_('${s.id}')">
        <span class="gth">✠${pic(s.id, true)}</span>
        <span class="tx">
          <div class="n">${esc(s.name)}</div>
          <div class="q">${esc(s.quick||'')}</div>
          <div class="d">${esc(DAYS.find(d=>d.dd===s.day).weekday)} ${s.day}${
            s.pri===2 ? ' · si hay tiempo' : ''}</div>
        </span>
      </button>`).join('');
  });
  return out + '</div>';
}

/* ══ INFO ══ */

  const blk = o => `<div class="block"><h3 class="disp">${esc(o.title)}</h3>` +
    o.rows.map(([k,v]) => `<div class="row"><div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div></div>`).join('') +

    '</div>';
  const misas = ['11','18'].map(dd => {
