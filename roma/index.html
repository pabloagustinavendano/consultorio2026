<style>
:root{
  --paper:#f6f0e4; --paper2:#fbf7ee; --ink:#2c2620; --soft:#8a7f6f; --mute:#a09482;
  --crimson:#7c1f2b; --deep:#5e1620; --gold:#a9863c; --gold2:#c9a24a;
  --line:#e6dcc6; --line2:#efe7d4;
  --warn:#fdf0e2; --warnl:#e8cfa8; --warnk:#a2661c;
  --ok:#e9efdf; --okk:#4a5d3a;
  --sans:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;
  --disp:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --serif:'EB Garamond',Garamond,Georgia,serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.serif{font-family:var(--serif)} .disp{font-family:var(--disp)}

/* ══ PORTÓN ══ */
#gate{position:fixed;inset:0;z-index:99;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:26px}
#gate .box{width:100%;max-width:320px;text-align:center}
#gate img{width:78px;height:78px;border-radius:18px;box-shadow:0 4px 16px rgba(60,40,15,.24)}
#gate h1{font-family:var(--disp);font-weight:600;font-size:31px;color:var(--crimson);
  margin:16px 0 1px;letter-spacing:.01em}
#gate .sub{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:16px;margin-bottom:24px}
#gate input{width:100%;padding:13px 15px;font:inherit;font-size:17px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:11px;text-align:center;
  letter-spacing:.06em;outline:none}
#gate input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,134,60,.16)}
#gate button.go{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:600;
  color:#fff;background:var(--crimson);border-radius:11px}
#gate .err{color:var(--crimson);font-family:var(--serif);font-style:italic;font-size:15px;
  margin-top:12px;min-height:21px}
#gate .foot{margin-top:22px;font-family:var(--serif);font-style:italic;color:var(--mute);font-size:14px}

/* ══ ESTRUCTURA ══ */
#app{display:none;flex-direction:column;height:100%}
#app.on{display:flex}
.topbar{display:flex;align-items:center;gap:7px;padding:calc(var(--safeT) + 7px) 15px 6px;
  background:var(--paper);flex:0 0 auto}
.topbar img{width:17px;height:17px;border-radius:4px}
.topbar .nm{font-size:9.5px;font-weight:700;letter-spacing:.11em;color:var(--mute);text-transform:uppercase}
.topbar .net{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#8fbf6a;
  font-size:0;overflow:hidden;flex:0 0 auto}
.topbar .net.off{background:#d59a3c}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:22px}
.pad{padding:0 16px}
nav.tabs{flex:0 0 auto;display:flex;gap:2px;background:#efe7d4;border-top:1px solid #e2d6ba;
  padding:0 6px calc(var(--safeB) + 6px)}
nav.tabs button{flex:1;font-size:9.5px;font-weight:700;letter-spacing:.11em;color:var(--mute);
  padding:11px 0 12px;border-radius:11px 11px 0 0;position:relative}
nav.tabs button.on{background:var(--paper);color:var(--crimson);
  box-shadow:inset 0 -2px 0 var(--gold)}
nav.tabs button.on:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--crimson);border-radius:3px 3px 0 0}

/* ══ PIEZAS ══ */
.lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hero{background:var(--crimson);color:#fbf3e2;padding:16px 16px 18px}
.hero .lbl{color:#e0b866}
.hero h2{font-family:var(--disp);font-size:32px;font-weight:600;line-height:1.05;
  margin:5px 0 4px;letter-spacing:.01em}
.hero .sub{font-size:12.5px;color:#e6c8ad}
.hero .prog{height:4px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:12px;overflow:hidden}
.hero .prog i{display:block;height:100%;background:var(--gold2);border-radius:3px}
.card{background:var(--paper2);border-left:3px solid var(--gold);border-radius:12px;
  padding:12px 13px 12px 14px;margin-top:12px;box-shadow:0 2px 10px rgba(90,68,30,.09)}
.card h3{font-family:var(--disp);font-size:20px;font-weight:600;margin-top:3px;line-height:1.15}
.go{display:flex;align-items:center;gap:8px;background:var(--line2);border-radius:10px;
  padding:9px 11px;margin-top:10px;font-size:12.5px;color:#4a4136}
.go b{color:var(--crimson)}
.go .btn{margin-left:auto;background:var(--crimson);color:#fff;border-radius:8px;
  padding:7px 11px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chips{display:flex;background:var(--paper2);border-radius:13px;padding:11px 4px;
  margin-top:12px;box-shadow:0 2px 10px rgba(90,68,30,.09)}
.chip{flex:1;text-align:center;position:relative}
.chip+.chip:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:#eadfc7}
.chip .k{font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chip .v{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.08;
  margin-top:3px;color:var(--ink)}
.warn{display:flex;gap:8px;background:var(--warn);border:1px solid var(--warnl);
  border-left:3px solid #c9761f;border-radius:11px;padding:10px 12px;margin-top:12px;
  font-size:12px;color:#7a5320;line-height:1.45}
.warn b{color:var(--warnk)}
.strip{display:flex;gap:5px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.strip button{flex:1 0 auto;min-width:38px;border:1px solid var(--line);border-radius:9px;
  padding:5px 0;font-size:10.5px;font-weight:700;color:var(--mute);background:var(--paper2)}
.strip button.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.strip button i{display:block;font-style:normal;font-size:8px;letter-spacing:.08em;opacity:.75}

/* ── día ── */
.dayhd{padding:15px 16px 0}
.dayhd h2{font-family:var(--disp);font-size:29px;font-weight:600;color:var(--crimson);line-height:1.08}
.dayhd .nt{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:15px;margin-top:4px}
ol.tl{list-style:none;padding:14px 16px 0 62px;position:relative}
ol.tl:before{content:"";position:absolute;left:47px;top:24px;bottom:14px;width:1px;background:#e9dfc8}
ol.tl li{position:relative;padding-bottom:14px}
ol.tl li:before{content:"";position:absolute;left:-19px;top:9px;width:9px;height:9px;
  border-radius:50%;background:var(--paper);border:1.5px solid var(--gold)}
ol.tl li.key:before{background:var(--crimson);border-color:var(--crimson);width:11px;height:11px;left:-20px}
ol.tl li.done:before{background:#ded2b8;border-color:#ded2b8}
.hr{position:absolute;left:-62px;top:3px;width:40px;text-align:right;font-size:12px;
  color:var(--soft);font-variant-numeric:tabular-nums;font-weight:600}
.stop{width:100%;text-align:left;background:var(--paper2);border-left:3px solid var(--gold);
  border-radius:12px;padding:11px 12px 11px 13px;display:block;
  box-shadow:0 2px 9px rgba(90,68,30,.085)}
.stop .n{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--crimson);line-height:1.15}
.stop .q{font-size:12.5px;color:#4a4136;margin-top:3px;line-height:1.45}
.stop .m{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;
  align-items:center;align-content:flex-start}
.tagm{display:inline-flex;align-items:center;align-self:center;flex:0 0 auto;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;line-height:1.7;border-radius:999px;padding:2px 9px;
  background:var(--line2);color:var(--soft)}
.tagm.hot{background:var(--warn);color:var(--warnk)}
.tagm.lit{background:#f2e3e0;color:var(--crimson)}
.trav{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--soft);
  margin:0 0 10px;padding-left:2px}
/* nivel 2 · si hay tiempo */
.stop.s2{background:transparent;border-left-color:#ded2b8;box-shadow:none;padding:9px 11px 9px 12px}
.stop.s2 .n{font-size:17px;color:#9a4a54}
.stop.s2 .q{font-size:12px;color:#5f5648}
ol.tl li.s2:before{background:var(--paper);border-color:var(--gold);width:9px;height:9px}
/* nivel 3 · logística */
ol.tl li.s3{padding-bottom:9px}
ol.tl li.s3:before{width:5px;height:5px;left:-17px;top:9px;background:#d6c9ab;border-color:#d6c9ab}
.logi{display:block;width:100%;text-align:left;font-size:13px;color:var(--soft);padding:2px 0}
.logi b{font-weight:600;color:#5f5648}
/* interruptor */
.seg{display:flex;border-radius:11px;overflow:hidden;margin-top:12px;
  box-shadow:0 2px 9px rgba(90,68,30,.085)}
.seg button{flex:1;padding:8px 0;font-size:11.5px;font-weight:700;color:var(--soft);background:var(--paper2)}
.seg button.on{background:var(--crimson);color:#fff}

/* ── guía ── */
.search{width:100%;padding:12px 15px;font:inherit;font-size:15px;background:#fff;
  border:none;border-radius:11px;outline:none;margin-top:14px;
  box-shadow:0 2px 10px rgba(90,68,30,.1)}
.search:focus{border-color:var(--gold)}
.zone{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin:20px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:5px}
/* foto de la ficha */
.ph{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;
  background:var(--line2);box-shadow:0 3px 14px rgba(90,68,30,.12);display:flex;
  align-items:center;justify-content:center;margin-top:12px}
.ph span{font-family:var(--serif);font-style:italic;color:var(--mute);font-size:14px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s}
.ph img.on{opacity:1}
/* miniatura de la guía */
.gth{flex:0 0 54px;height:54px;border-radius:10px;overflow:hidden;position:relative;
  background:var(--line2);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:#d9c9a4;font-size:15px}
.gth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s}
.gth img.on{opacity:1}
.gitem{width:100%;text-align:left;padding:10px 0;border-bottom:1px dotted var(--line);
  display:flex;gap:11px;align-items:flex-start}
.gitem .tx{flex:1;min-width:0}
.gitem .n{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--crimson);line-height:1.2}
.gitem .q{font-size:12.5px;color:#4a4136;margin-top:2px;line-height:1.45}
.gitem .d{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mute);
  text-transform:uppercase;margin-top:4px}

/* ── info ── */
.block{margin-top:22px}
.block h3{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--crimson);
  border-bottom:1px solid var(--line);padding-bottom:5px}
.row{display:flex;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.row .k{flex:0 0 40%;color:var(--soft);font-weight:600}
.row .v{flex:1;color:var(--ink)}
.mass{background:var(--paper2);border-left:3px solid #ded2b8;border-radius:12px;
  padding:11px 12px 11px 13px;margin-top:9px;box-shadow:0 2px 9px rgba(90,68,30,.075)}
.mass.pick{border-left-color:var(--gold);background:#fdf8ec}
.mass .h{display:flex;align-items:baseline;gap:8px}
.mass .hh{font-size:17px;font-weight:700}
.mass .pl{font-family:var(--disp);font-size:18px;font-weight:600;margin-top:2px}
.mass .mt{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.4}

/* ══ FICHA ══ */
#scrim{position:fixed;inset:0;background:rgba(30,22,12,.5);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:60}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;z-index:61;
  background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(101%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;
  box-shadow:0 -8px 34px rgba(40,28,10,.28)}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:3px;background:#ddd0b4;margin:9px auto 0;flex:0 0 auto}
#sheet .in{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(var(--safeB) + 26px)}
#sheet h2{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--crimson);
  line-height:1.06;margin-top:8px;letter-spacing:.01em}
#sheet .kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
#sheet .kv span{font-size:10.5px;font-weight:600;color:#4a4136;background:var(--line2);
  border:1px solid var(--line);border-radius:20px;padding:4px 9px}
#sheet .kv .hot{background:var(--warn);border-color:var(--warnl);color:var(--warnk)}
#sheet .kv .okc{background:var(--ok);border-color:#cdd9bc;color:var(--okk)}
#sheet .sum{font-family:var(--serif);font-size:16.5px;line-height:1.55;color:#3a332a;margin-top:13px}
details{border-top:1px solid var(--line);margin-top:14px}
details summary{list-style:none;display:flex;align-items:center;padding:11px 0 10px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary .t{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;color:var(--gold)}
details summary .c{margin-left:auto;color:var(--gold);font-size:15px;transition:transform .2s}
details[open] summary .c{transform:rotate(90deg)}
details .body{padding-bottom:13px;font-size:14px;line-height:1.6;color:#3a332a}
ul.mir{list-style:none;padding:0 0 13px;margin:0}
ul.mir li{position:relative;padding:0 0 9px 17px;font-size:14.5px;line-height:1.55;color:#3a332a}
ul.mir li:before{content:"";position:absolute;left:1px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}
ul.mir li b{color:var(--crimson);font-weight:600}
details .body.rd{font-family:var(--serif);font-size:16px;line-height:1.62}
details .body p{margin-bottom:11px}
h3.sub{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--crimson);
  margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3.sub:first-child{margin-top:2px}
.mapbtn{display:block;width:100%;text-align:center;background:var(--ink);color:var(--paper);
  border-radius:11px;padding:12px;font-size:13px;font-weight:700;margin-top:11px;
  box-shadow:0 3px 12px rgba(44,38,32,.22)}
.close{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;
  background:var(--line2);color:var(--soft);font-size:16px;line-height:1}
.empty{text-align:center;color:var(--mute);font-family:var(--serif);font-style:italic;
  padding:44px 20px;font-size:16px}
</style>
</head>

<script>
const DATA = {"trip":{"demoDate":null,"days":[{"date":"2026-10-09","phase":1,"weekday":"Vie","dd":"09","title":"Llegada","note":"Día suave a propósito. Solo instalarse y dormir.","stops":[{"time":"17:00","name":"Aterrizaje en Fiumicino","tag":"rest","type":"rest","dur":90,"quick":"Vuelo AR1140. Con quince personas, calcular hora y media hasta salir.","hist":"El aeropuerto Leonardo da Vinci se inauguró en 1961, sobre la desembocadura del Tíber, a pocos kilómetros de la antigua Ostia romana.","logi":{"Terminal":"T3 — llegadas internacionales","Trámites":"Migraciones + equipaje: 60 a 90 min","Distancia a Roma":"32 km"},"map":"Aeroporto Leonardo da Vinci Fiumicino","id":"s1","day":"09","pri":3},{"time":"18:30","name":"Traslado en van","tag":"rest","type":"rest","dur":60,"quick":"Dos vans reservadas, con cartel. Nada de trenes con las valijas.","travel":{"mode":"car","dur":60,"costAd":"≈ €70 por van","costCh":"—","how":"Salida por la Autostrada Roma–Fiumicino, después Via Portuense y Lungotevere hasta Prati. Con quince personas y el equipaje hacen falta dos vans de nueve plazas.","tip":"Reservar de antemano con el número de vuelo cargado: si el avión se atrasa, el chofer espera igual."},"logi":{"Duración":"45 a 70 min según tráfico","Alternativa":"Leonardo Express hasta Termini, pero con valijas y chicos no conviene"},"id":"s2","day":"09","pri":3},{"time":"19:30","name":"Check-in","tag":"rest","type":"rest","dur":60,"quick":"The Holy Apartments. Reconocer la cuadra y comprar lo básico.","logi":{"Dirección":"Piazza della Stazione di San Pietro","Zona":"Vaticano / Aurelio","A San Pedro":"10 min a pie"},"map":"Piazza della Stazione di San Pietro, Roma","travel":{"mode":"car","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Las vans dejan al grupo en la puerta, sobre Piazza della Stazione di San Pietro."},"id":"s3","day":"09","pri":3},{"time":"20:30","name":"Cena simple en el barrio","tag":"food","type":"food","dur":75,"quick":"Y a dormir. Hoy no se fuerza nada: mañana empieza en serio.","logi":{"Idea":"Pizza al taglio o trattoria de barrio","Costo":"€12 a €18 por persona"},"travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Salir del departamento y caminar por el barrio: hay trattorias y pizzerías a pocos metros."},"id":"s4","day":"09","pri":3}]},{"date":"2026-10-10","phase":1,"weekday":"Sáb","dd":"10","title":"Vaticano","note":"Primer encuentro con San Pedro, sin apuro. Es el peor día de jet lag.","stops":[{"time":"09:00","name":"Basílica de San Pedro","tag":"site","type":"site","dur":150,"quick":"La Confesión sobre la tumba del Apóstol, la Piedad, el baldaquino y el cuerpo de San Pío X.","hist":"Construida sobre la tumba del apóstol Pedro, primer Papa. La basílica actual (1506-1626) es obra de Bramante, Miguel Ángel, Maderno y Bernini.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Salir de Piazza della Stazione di San Pietro y subir por Via di Porta Cavalleggeri hasta la Piazza del Sant'Uffizio. Desde ahí se entra a la Piazza San Pietro por el brazo izquierdo de la columnata. La fila del control de seguridad se forma sobre el lado derecho.","tip":"Llegar 8:45. A las 9:30 la fila ya da la vuelta a la plaza."},"full":"## Historia y fachada\n\nLa primera basílica fue construida en el siglo IV. La nueva comienza en el siglo XV y fue\nterminada en el s. XVIII (con la sacristía, lo último en hacerse).\n\n Fachada\n El frente fue hecho por Carlo Maderno, del 1607 al 1614, está presidido por una gran escalinata,\nobra de Bernini. A los lados, las colosales estatuas de San Pedro y de San Pablo, colocadas en 1840.\nEl pórtico de la izquierda es el Arco de las Campanas, que da acceso a la Ciudad del Vaticano. De\nlos 9 balcones, el central corresponde a la llamada Loggia de las Bendiciones, desde donde el Papa\nimparte las Bendiciones solemnes; debajo, se encuentra el altorrelieve La Entrega de las Llaves, de\n\n Columna dórica: es la que tiene el capitel más sencillo; sigue en complejidad el jónico y el más elaborado y florido es\nel corintio.\n\nBonvicino (1614). Coronan la fachada trece estatuas (5,70 m) del Redentor, San Juan Bautista y los\nApóstoles, a excepción de San Pedro. Corona el conjunto la majestuosa cúpula de Miguel Ángel\n(1465–1564), las dos cúpulas laterales, de Vignola (discípulo de Miguel Ángel y director de las\nobras a la muerte del maestro), son meramente decorativas: no guardan relación con el interior de la\nBasílica.\n A la derecha de la fachada, en el llamado Palacio del Mayordomo, está la imagen de la Virgen en\nmosaico. Son 50.000 teselas o piedrecitas que reproducen la imagen que se venera como Mater\nEcclesiae en el interior de la Basílica.\n\n Pórtico2\n Al fondo a la derecha, la estatua de Constantino, de Bernini (1670). A la izquierda, la estatua\necuestre de Carlomagno (de Cornacchini, 1725), coronado en San Pedro, en la Navidad del año 800,\ndurante el pontificado de León III. De las cinco puertas por las que se entra a la Basílica, la de la\nderecha es la Puerta Santa, que se abre sólo cada Año Jubilar. Sobre la puerta central se pusieron las\nhojas de bronce de la antigua basílica, que tienen como tema central una evocación del Concilio de\nFlorencia, en el que se debatió y se resolvió, por un tiempo, la difícil cuestión de la unión entre las\nIglesias de Oriente y de Occidente. Encima hay un relieve, Jesús que confió a San Pedro la Grey\nCristiana, de Bernini o de uno de sus discípulos. A la izquierda la Puerta de la Muerte, de Giaccomo\nManzú, y a la derecha la Puerta de los Sacramentos. Otro recuerdo de la antigua Basílica es el\nMosaico de la Navecilla, obra de Giotto muy restaurada y deteriorada; se ve entrando en el atrio3 y\ndando la espalda a la nave central.\n\n## La nave central\n\n\n San Pedro tiene cerca de 35.000 m2 de superficie, incluyendo las capillas laterales y la sacristía, y\n186 m de largo, que llegan a 194 si se tiene en cuenta el espesor de los muros. El largo total, incluido\nel pórtico, es de 211,5 m. La capacidad interior, aprovechando todos los espacios disponibles, llega a\n60.000 personas, aunque en las ceremonias suelen entrar solamente 15.000. En el suelo de la nave\ncentral se pueden ver las medidas de algunas iglesias especialmente conocidas.\n La nave central tiene la típica estructura de las iglesias de la Contrarreforma. Está cubierta por\nuna bóveda artesonada (de 44 m de alto), ricamente decorada en la época de Pío VI (1780). A nivel\nde la pilastra que está en línea con las capillas del Santísimo Sacramento y del Coro, se puede ver el\nempalme de la arquitectura de Maderno, más alta y más ancha con el brazo de crucero proyectado\npor Miguel Ángel. En los nichos excavados en las pilastras (= columnas cuadrangulares) a partir del\n1706 se han colocado estatuas de Fundadores de órdenes religiosas. Al final de la nave central está la\nestatua de San Pedro en bronce, con el pie derecho desgastado por los besos de los fieles. Durante\naños se pensó que era una escultura de Arnolfo di Cambio del s. XIII, pero recientes investigaciones\n(1989) permiten asegurar la paternidad a un artista sirio del s.V.\n\n Sobre esta estatua, arriba de todo está la estatua de Don Bosco, con una hermosa curiosidad: tiene\ndos jovencitos: uno de ellos es Domingo Savio y el otro es CEFERINO NANUMCURÁ. Sobre esto\nquiero reportar aquí lo que cuentan las “Memorias Biográficas”tomo XIX:\n\n “Hay un detalle muy curioso, certificado por don Miguel Rúa. La primera vez que el Don Bosco visitó\n la Basílica de S. Pedro, en su compañía, el 26 de febrero de 1858, después de haber permanecido unos\n instantes contemplando en silencio el espectáculo de tanta magnificencia, lo que más llamó su atención fue\n la serie de estatuas de mármol que representaban a los fundadores de familias religiosas; y he aquí que\n había llegado también para él el momento de ser colocado en uno de los nichos, que entonces observó\n vacío y a la espera de quien lo había de ocupar. Subió a él, por tanto, en el mes de enero de 1936.\n Su monumento es un colosal grupo de mármol, cuya figura principal mide cuatro metros con ochenta\n centímetros de altura, sin tener en cuenta el pedestal de un metro y siete centímetros. Don Bosco está\n representado en actitud de señalar con noble gesto de su derecha el altar papal con dos jovencitos,\n\n Pórtico: sitio cubierto y con columnas que se construye delante de los templos u otros edificios suntuosos.\n Atrio: espacio descubierto y por lo común cercado de pórticos, que hay en algunos edificios.\n\n envueltos por su mano izquierda con un amplio gesto paternal. Son éstos el Venerable Domingo Savio y el\n patagón Ceferino Namuncurá. José De Mori hizo de ella una descripción, de la que extraemos algunos\n períodos (L'Avvenire d'Italia, 9 de enero de 1936). La estatua de Don Bosco transparenta, en efecto, «el\n carácter meditativo del Santo, su fuerza intelectual, su previsión de santo y de apóstol, lo que, unido a la\n sonrisa paternal de su boca, integra bien su carácter exuberante de caridad y de amor». El gesto es\n «expresivo, espontáneo y al mismo tiempo recogido y austero. Con la mano izquierda protege a dos\n jovencitos que son la personificación histórica y espiritual de su misión. Más alto Domingo Savio, alumno\n predilecto, que pronto le seguirá en el honor de los altares. Más pequeño el muchacho patagón, Ceferino\n Namuncurá, hijo del gran Cacique, convertido con su tribu por el cardenal Cagliero, que fue como\n adoptado por don Bosco y por los Salesianos, para indicar que su apostolado en favor de la juventud no\n conoce límites de continentes ni prejuicios de razas (...). Con su mano derecha señala San Juan Bosco el\n venerado sepulcro del Príncipe de los Apóstoles y parece que los dos jovencitos estén pendientes de sus\n labios para oír perpetuada en el mármol aquella profesión de fidelidad al Pontificado Romano, que ha sido\n la divisa incontaminada de don Bosco».\n Para no recaer, en el error en el que deplorablemente incurrió alguno, hay que considerar que ni\n Domingo Savio ni Ceferino Namuncurá son los representantes de su país de origen, sino que, mientras el\n primero representa a la juventud de todo el mundo civilizado educada por don Bosco y sus discípulos, el\n otro simboliza a la juventud que los Misioneros de don Bosco van redimiendo en tierras no besadas todavía\n por el sol del Cristianismo y de la civilización. El haber elegido como tipo de la segunda categoría a un hijo\n de las Pampas, se debe únicamente al hecho de que don Bosco enviara a sus primeros apóstoles del\n Evangelio, como todos saben, a las tribus de la Patagonia, entonces salvajes.\n El monumento fue inaugurado el treinta y uno de enero.\n La hornacina asignada por el Papa a don Bosco puede muy bien decirse que es un sitio de honor; en\n efecto, no hay ninguna otra en un lugar tan distinguido. La estatua se levanta allí sobre la de San Pedro y se\n destaca sobre el medallón en mosaico de Pío IX; don Francisco Tomasetti explicó muy bien lo que ello\n significa. Los que vivieron en los últimos años del Santo no podían contemplarlo allá arriba sin recordar un\n sueño suyo, que le oyeron contar siendo niños. Le había parecido hallarse precisamente dentro de aquella\n hornacina sin saber cómo había sucedido aquello. Espantado miraba alrededor para pedir socorro; pero,\n reinaba un profundo silencio bajo las bóvedas del templo. Dio entonces un grito, y con la angustia se\n despertó. ¡Quién sabe cuántas veces, al visitar San Pedro, se había él acercado a la estatua de bronce del\n Apóstol, había besado su pie, y había acercado, como suele hacerse, la frente hasta tocarlo como signo de\n humildad y fiel sumisión al Vicario de Jesucristo! Nadie, y él menos aún, habría imaginado entonces qué\n arcano podía esconderse bajo el velo del extraño sueño”.\n\n## La cúpula\n\n, que descansa sobre cuatro grandiosos arcos, tiene un perímetro de 71 m. Todo es\ngigantesco: la pluma de San Marcos mide cerca de dos metros: la linterna mide más de 17 m. En los\nmedallones de las pechinas se representan los cuatro evangelistas. En la base del tambor, la cúpula\nmide más de 42 m de diámetro, un espacio inmenso que llenan 96 figuras en mosaico de Papas,\nSantos y Doctores de la Iglesia, a medio busto, en el inferior: siguen sentados el Redentor, la Virgen,\nSan Pablo, San Juan Bautista y los Apóstoles. En la linterna, el Padre Eterno bendiciendo.\n En los cuatro grandes nichos de la base de la cúpula, están las estatuas mandadas colocar por\nUrbano VIII (de 5 m de alto) de:\n  San Longino, el soldado romano que clavó la lanza en el pecho de Jesús (Bernini); aquí,\n en los nichos del balcón, se guarda la punta de la lanza con la que éste abrió el\n costado de Jesús;\n  Santa Elena (Andrea Bolgil); se conserva aquí un fragmento de la verdadera cruz;\n  Santa Verónica (Mochil); se conserva aquí el llamado sudario de la Verónica, que ya\n estaba en la anterior basílica y es mostrado durante cada Semana Santa.\n  y San Andrés (Duquesnov); aquí se conservaba hasta 1964 la cabeza de san Andrés,\n que en ese año fue restituida por Pablo VI a la diócesis de Patras. Actualmente se dice\n que está el manto de san Andrés.\n Bajo el altar papal está la Confesión, de Maderno; se llama así porque está construido\ndirectamente sobre la tumba del Apóstol que derramo su sangre por confesar a Cristo; 99 lámparas\nperennales que iluminan la tumba de San Pedro, al lado de la cual está la estatua de Pío VI (Canova).\nPapa amable y de cultura refinada que creó los Museo\n\n## El baldaquino y la Confesión\n\ns Vaticanos en los últimos años del s. XVIII.\nSobre el altar papal se levanta el Baldaquino, obra maestra de Bernini. Inaugurado por Urbano VIII\n\nBarberini el 28 de junio de 1633, víspera de San Pedro y San Pablo, tiene la altura de Palacio\nFarnese (29 m).\n\n## La nave de la derecha\n\n\n La primera capilla es la de la Piedad, famoso grupo escultórico de Miguel Ángel, realizado\ncuando contaba 25 años de edad. Es la única obra que lleva la firma del artista: puede verse en la\ncinta que cruza el vestido de la Santísima Virgen. Firmó cuando oyó un impostor adjudicarse la\nobra.\n A continuación se encuentra La Capilla Elíptica de Bernini, donde se ha colocado el Crucifijo\natribuido a Cavallini (s. XIII), de expresión vigorosa.\n La siguiente capilla está dedicada al Martirio de San Sebastián, capilla que sustituyó al altar que\nse dedicaba en la antigua basílica constantiniana a Sebastián, mártir capitán de los Pretorianos bajo\ndel imperio de Diocleciano. Bajo el altar está actualmente el cuerpo del beato Juan Pablo II.\n A continuación, viene la Capilla del Santísimo Sacramento, donde se colocó el Tabernáculo de\nBernini, de bronce dorado y lapislázuli. Detrás del tabernáculo, el fresco de La Trinidad, obra de\nPietro di Cortona.\n Saliendo de la capilla, a mano derecha se encuentra el monumento al Papa Gregorio XIII\nBoncompagni, flanqueado por las estatuas de la Religión y de la Sabiduría. El bajorrelieve, recuerda\nla reforma del calendario dispuesta por el Pontífice.\n Al fondo, sobre el pilar que sostiene la cúpula está la tumba del beato Juan XIII.\n Girando este mismo pilar está la tumba con el cuerpo de san Josafat de Kuncewyz, metropolita\nucraniano, martirizado en 1623. Fue traído de Viena a Roma después de la Segunda Guerra Mundial.\nPío XII quiso que recibiera honores especiales en San Pedro por haber muerto por la unidad de la\nIglesia.\n La siguiente es la capilla Gregoriana, diseñada por Della Porta, y riquísima en mármoles y\npiedras preciosas. Sobre el altar, la pequeña imagen de la Virgen del Socorro, del s. XI, que estaba\nya en la primera Basílica. Bajo el altar está enterrado San Gregorio Nacianceno (+ 390), patriarca\nde Constantinopla y uno de los cuatro grandes Padres de Oriente.\n\n Crucero de la derecha\n Aquí tuvieron lugar las sesiones del Concilio Vaticano I, mientras que las del Vaticano II fueron\nen la nave central de la Basílica. En los tres altares del crucero están los mosaicos de San\nWenceslao, Rey de Bohemia; el Martirio de San Proceso y San Martiniano y están sus reliquias\n(estos fueron los carceleros de san Pedro y fueron convertidos por él); y El Martirio de San Erasmo.\n\n Todos los cuadros del interior de la Basílica son copias en mosaico de famosas pinturas al óleo de\nla época. En las obras escultóricas trabajaron más de 600 artistas.\n\n Ábside\n El luminoso proyecto para el\n\n## El ábside y la Cátedra\n\nábside, de Miguel Ángel, fue superado por el formidable sentido\ndecorativo –fantasía barroca– de Bernini, que engrandece la Cátedra de San Pedro, realizada en\nbronce y oro bajo el pontificado de Alejandro VII (1656–65), como relicario de un trono papal\ncuyo origen se remonta al s.VIII. Este trono fue traído por Carlos el Calvo en el 875 para su\ncoronación y luego donado al Papa; pero según otros se trataría de una silla proveniente de la\niglesia de santa Pudenciana, y propiedad del senado san Pudente quien hospedaba a san Pedro,\npor lo que la habría usado este apóstol.\n Dos tumbas papales flanquean la cátedra: la de Urbano VIII de Bernini, y la de Paulo III, de\nDella Porta (1551–75).\n Al fondo, la Gloria de Bernini, con la representación del Espíritu Santo. La luz penetra a través\ndel cristal de Bohemia como entre una nube de oro.\n Sigue la Capilla de Nuestra Señora de la Columna, donde se encuentran las reliquias de San\nLeón Magno. Papa que tuvo que enfrentarse con numerosas controversias y herejías; fue él quien\n\nconvocó el Concilio de Calcedonia en el 451, donde los más de 600 Padres Conciliares dieron un\nclaro ejemplo de la unión con el Romano Pontífice. Cuando recibieron la carta del Papa, la\naclamaron: “Pedro ha hablado por boca de León”. En la misma capilla se encuentra la imagen de la\nVirgen, Madre de la Iglesia, que procede de la Basílica primitiva. En esta capilla se quiso\nrepresentar a los doctores que más han escrito sobre la Santísima Virgen: Santo Tomás, San Juan\nDamasceno, San Genaro y San Buenaventura.\n En el pasaje que sigue, la tumba de Alejandro VII, del último periodo de actividad de Bernini,\ncon las representaciones de la Caridad, la Verdad, la Justicia y la Prudencia, obra de Mazzoli.\n\n Crucero de la izquierda\n El tercer brazo de la cruz griega de Miguel Ángel está formado por la tribuna, también llamada\nde los Santos Simón y Judas, y que comprende, además de la enorme bóveda decorada por\nVanvitelli y Maini, tres altares decorados con mármoles preciosos:\n  San Marcial, de Camuccini,\n  Al centro San José Protector de la Iglesia Universal –la única pintura moderna de la\n Basílica–, de Achille Funi. Bajo este altar están enterrados los restos de los apóstoles\n Simón y Judas Tadeo.\n  y el Martirio de San Pedro, de Guido Reni, sobre el punto exacto del Circo de Nerón en\n el que el primer Papa fue crucificado sobre una cruz invertida.\n\n A continuación, se encuentra la capilla Clementina, llevada a cabo por Della Porta. En el altar de\nla derecha, San Gregorio Magno, de Andrea Sacchi; bajo el altar se conservan las reliquias del\nsanto; Gregorio era miembro de una familia noble romana, llegó a ser prefecto de la Urbe antes de\nser elegido Papa, el año 590. Al lado, la tumba de Pío VIII: Papa que sufrió la prisión en 1809 por\norden de Napoleón, obra neoclásica de Thorvaldsen (1823). Es la única obra realizada en San Pedro\npor un artista protestante.\n\n## La nave de la izquierda\n\n\n En su extremo, el altar de la Transfiguración, con el mosaico que reproduce la obra maestra de\nRafael (1483–1530).\n Enfrente se encuentra la capilla del Coro, destinada a la oración de los canónigos, obra de Della\nPorta, que guarda los sepulcros de Clemente XI y de San Juan Crisóstomo.\n En el pasaje siguiente, la Tumba de Inocencio VIII, de Pollaiolo (1498), en bronce parcialmente\ndorado. Es el monumento fúnebre más antiguo, el único que fue trasladado de la Basílica\nConstantiniana a la nueva (1619), y el primero en el que se ve a un Papa sentado en su trono. Son\nespecialmente bellos los relieves en los nichos con las figuras de las cuatro virtudes cardinales. En\neste mismo pasaje, el monumento a San Pío X.\n Bajo el altar de la siguiente capilla, de la Presentación, se encuentran los restos incorruptos de\nSan Pío X, canonizado en 1954. En esta misma capilla están los monumentos a Juan XXIII y\nBenedicto XV. A la derecha del altar, se halla el lóculo donde se depositan los restos del Papa desde\nque fallece hasta que se trasladan a su sepultura definitiva.\n Por último, el Baptisterio, con el mosaico del Bautismo de Jesús, diseñado por Maratta. En las\npechinas, están representadas las partes del mundo que han sido evangelizadas.","logi":{"Horario":"7:00 a 20:00 · último ingreso 19:15","A pie":"8 min","Costo adultos":"Basílica gratis · Cúpula €10","Costo niños":"Gratis · Cúpula €5","Tip":"Llegar 8:45 para evitar fila","Sobre el horario":"Desde junio de 2026, todos los días. basilicasanpietro.va"},"map":"Basilica di San Pietro","id":"s5","day":"10","hrs":{"open":[[420,1200]],"closed":[]},"hv":true,"pri":1,"ver":["La **Piedad**, primera capilla de la nave derecha. Única obra que Miguel Ángel firmó: la firma está en la cinta que cruza el pecho de la Virgen.","La **Confesión** bajo el altar papal, con 99 lámparas siempre encendidas sobre la tumba del Apóstol.","El **baldaquino de Bernini**: 29 metros de bronce, la altura del Palacio Farnese.","La **estatua de bronce de San Pedro**, al final de la nave central, con el pie derecho gastado por los besos.","El **cuerpo de San Pío X**, incorrupto, en la capilla de la Presentación.","La **Cátedra de Bernini** en el ábside, y arriba la Gloria con el Espíritu Santo en alabastro.","En los nichos de la cúpula, **San Longino** de Bernini: ahí se guarda la punta de la lanza que abrió el costado de Cristo."],"zone":"Vaticano y Prati"},{"time":"11:30","name":"Grutas Vaticanas","tag":"site","type":"site","dur":45,"quick":"El nivel de las tumbas papales. Aquí está Benedicto XVI.","hist":"Nivel inferior de la basílica, construido sobre la necrópolis antigua. Reposan aquí decenas de pontífices, desde el siglo X hasta hoy.","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Desde adentro de la basílica, bajar por la escalera señalizada \"Tombe dei Papi / Grotte Vaticane\", cerca de la Confesión. No hay que salir ni volver a hacer fila."},"logi":{"Horario":"7:00 a 18:00","Costo":"Gratis","Salida":"Da al exterior, junto a la sacristía","Sobre el horario":"Siguen el horario de verano de la basílica hasta el 25 de octubre."},"id":"s6","day":"10","hrs":{"open":[[420,1080]],"closed":[]},"hv":false,"pri":1,"full":"Bajo el piso de la basílica actual, entre el nivel de Miguel Ángel y la necrópolis romana, se extiende un piso intermedio que casi nadie espera encontrar. Son las Grutas Vaticanas: lo que queda de la basílica que Constantino levantó en el siglo IV, sepultada cuando el Renacimiento decidió reemplazarla por algo más grande.\n\nCuando en 1506 Julio II mandó demoler la vieja basílica, el nivel del piso nuevo quedó unos tres metros y medio más alto. Ese hueco entre los dos pisos, en vez de rellenarse, se convirtió en cripta. Ahí quedaron atrapados capiteles, columnas, sarcófagos y frescos de la iglesia constantiniana, y ahí se fueron acomodando, siglo tras siglo, las tumbas de los papas.\n\nHoy reposan unos noventa pontífices. El recorrido pasa frente a las tumbas de Adriano IV, el único papa inglés; de Nicolás III; de Bonifacio VIII; y de reinas como Cristina de Suecia y Carlota de Chipre. Están también los sarcófagos de Juan Pablo I y de Benedicto XVI, muerto en 2022 y sepultado en el nicho que había ocupado Juan XXIII.\n\nEl punto central es la capilla clementina, que está exactamente sobre la tumba de San Pedro. Detrás del altar se ve el muro que separa la cripta del trofeo de Gayo, el monumento que marcaba el sepulcro ya en el año 200. Quien hizo el Scavi reconoce el otro lado de esa misma pared.\n\nLa entrada es gratuita y se hace desde adentro de la basílica, bajando por una escalera junto a la Confesión. Se sale al exterior, cerca de la sacristía. Media hora alcanza.","fullSource":"propio","ver":["La **tumba de Benedicto XVI**.","Los restos de la basílica de Constantino, del siglo IV, bajo el piso actual.","La capilla clementina, justo encima de la tumba de San Pedro."],"zone":"Vaticano y Prati"},{"time":"12:30","name":"Almuerzo en Prati","tag":"food","type":"food","dur":75,"quick":"Borgo Pio o Via Cola di Rienzo. Zona cómoda con chicos.","travel":{"mode":"walk","dur":8,"costAd":"Gratis","costCh":"Gratis","how":"Saliendo de la basílica, cruzar hacia Borgo Pio: es la calle peatonal a la derecha de la columnata, llena de trattorias."},"logi":{"Costo adultos":"€15 a €25","Costo niños":"€8 a €12"},"id":"s7","day":"10","pri":3},{"time":"14:00","name":"Descanso en el departamento","tag":"rest","type":"rest","dur":180,"quick":"Tarde libre. El primer día completo se paga caro si se estira.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Vuelta por el mismo camino, cuesta abajo."},"id":"s8","day":"10","pri":3},{"time":"17:30","name":"Ponte y Castel Sant'Angelo","tag":"site","type":"site","dur":60,"quick":"Los ángeles de Bernini sobre el Tíber al atardecer. Por fuera, sin entrar.","hist":"Erigido por Adriano (139 d.C.) como mausoleo imperial, luego fortaleza y refugio de los Papas, conectado al Vaticano por el Passetto.","travel":{"mode":"walk","dur":18,"costAd":"Gratis","costCh":"Gratis","how":"Desde el departamento, tomar Via di Porta Cavalleggeri, bordear la columnata y seguir por Via della Conciliazione en línea recta hasta el Tíber. El castillo se ve al fondo todo el camino.","tip":"A esa hora la luz sobre el puente es la mejor del día."},"full":"Fortaleza mandada construir por Adriano como sepulcro familiar. Fue iniciado por el emperador\nen el año 135 d.C., y terminado cuatro años más tarde por su hijo adoptivo y sucesor en el trono\nimperial, Antonio Pío.\n La base, de 84 m2, está cerrada por un tambor de 20 m de alto. Estaba coronado por una estrella\ndel emperador y una cuadriga de bronce. El mausoleo contiene las urnas con las cenizas de todos los\nemperadores desde Adriano hasta Septimio Severo (211 d.C.).\n Cuando Aureliano amuralló la ciudad, en el 270, colocó el mausoleo como parte de la muralla y\nlo convirtió en fortaleza.\n En 590 el Papa Gregorio Magno encabezó una procesión contra la peste que diezmaba la ciudad.\nAl pasar delante de Castell Sant'Angelo, encima del mausoleo apareció un ángel que blandía su\nespada, que fue interpretado como un signo de que sería abatida la peste. En agradecimiento, el Papa\nmandó construir una capilla en el mausoleo y colocar un San Miguel de bronce en el punto más alto.\n Durante los conflictos medievales entre el papado y la nobleza romana, el edificio se convirtió en\nfortaleza. Nicolás V (1447–55) construyó unos pertrechos de ladrillo en la parte alta de la\nconstrucción original, y añadió torretas en las esquinas.\n El alto muro defensivo –Passetto– construido por León IV (847–55), unía el castillo con el\nPalacio Vaticano. Alejandro VI creó un pasaje a lo largo de la parte alta del muro, de manera que el\nPapa pudiera llegar fácilmente a la fortaleza, en caso de asedio.\n En 1527 Clemente VII se refugió de las tropas de Carlos V, e hizo habitables varias estancias,\nque fueron mejoradas por Paulo III. Después de la unificación de Italia, se instalaron unas barracas y\nuna prisión militar.\n Desde fuera, Castel Sant'Angelo aparece como una sólida masa compacta: una cinta cuadrada en\nla base, reforzada en las esquinas por los bastiones de San Mateo, San Juan, San Marcos y San\nLucas. La construcción original del mausoleo se distingue de los añadidos por los grandes bloques\nde travertino y peperino. En la parte media, encima de la construcción romana, el gran cilindro\n\nconstruido por Benedicto IX (1033–44) y completado en alto por la bella cortina de Alejandro VI.\nAún más arriba, la construcción renacentista de los apartamentos papales.\n\n Castel Sant'Angelo albergaba en su interior el Museo Nacional Militar. Entre sus salas hay que\ndestacar: El Cortile dell'Angelo, donde se encuentra el ángel de mármol que coronaba la\nconstrucción antes del actual de bronce, obra de Raffaelo da Montelupo; los Apartamentos Papales,\nmandados adaptar por Paulo III. El primero es la Sala Paulina o del Consejo, donde esperaban los\nvisitantes para ser recibidos por el Papa; en el techo, estucos de Girolamo da Sermoneta y de Braccio\nde Montelupo; la decoración de las paredes es obra de Perin del Vaga y de sus discípulos, y de\nPellegrino Tibaldi: se trata de escenas de la historia de Roma y de la vida de Alejandro Magno.\nSigue la Cámara de Perseo; en las paredes están una Piedad, de un anónimo ferrarense del s.XVI.\ndos Cristos, de Paris Bordone y Sebastiano del Piombo respectivamente y un busto de Paulo III,\ncopia del de Guglielmo della Porta, ahora en Nápoles. Desde la terraza, hay una buena vista.\n\n En la parte más alta, la gran terraza coronada por la ESTATUA DE BRONCE DE SAN\nMIGUEL. Esto evoca un episodio del año 590: el papa San Gregorio encabezaba una procesión\npara rogar que cesara la peste que diezmaba la ciudad. En lo alto del castillo apareció\nrepentinamente un ángel que enfundaba de nuevo su espada en la vaina. Este gesto fue interpretado\ncomo una señal que aunciaba el fin de la epidemia; en agradecimiento a esta señal, el Papa construyó\nuna capilla sobre el mausoleo.","map":"Castel Sant'Angelo","id":"s9","day":"10","pri":2,"ver":["Los **diez ángeles de Bernini** sobre el puente, cada uno con un instrumento de la Pasión.","El **Passetto di Borgo**, el corredor amurallado que une el castillo con el Vaticano.","La silueta del castillo al atardecer, desde el medio del puente."],"zone":"Vaticano y Prati"}]},{"date":"2026-10-11","phase":1,"weekday":"Dom","dd":"11","title":"Misa · Esquilino","note":"Todo el día está a diez minutos a pie de la capilla. Misa temprano para aprovechar la mañana entera.","stops":[{"time":"08:10","name":"Salida hacia Monti","tag":"rest","type":"rest","dur":40,"quick":"Unos 40 minutos hasta Via Urbana. Salir con margen.","logi":{"Recorrido":"Metro A hasta Termini, después B una parada hasta Cavour","Costo adultos":"€1,50","Costo niños":"Gratis los menores de 10","Alternativa":"Cuatro taxis, 20 min, ≈ €15 cada uno"},"id":"s10","day":"11","pri":3},{"time":"08:30","name":"Confesiones","tag":"mass","type":"mass","dur":30,"quick":"Antes de la misa, en la capilla.","travel":{"mode":"metro","dur":40,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Caminar hasta la estación Ottaviano (línea A) y tomar dirección Anagnina hasta Termini. Ahí cambiar a la línea B dirección Laurentina, una sola parada hasta Cavour. Desde Cavour, subir por Via Cavour y doblar a la derecha en Via Urbana: la capilla está a 300 metros.","tip":"Domingo temprano: el metro va casi vacío y hay ascensores en Termini para los cochecitos."},"id":"s11","day":"11","logi":{"Horario":"Desde 8:30"},"hrs":{"open":[[480,540]],"closed":[]},"hv":true,"pri":2,"full":"Antes de la misa dominical hay confesiones en la capilla. Vale la pena aprovecharlas: es la razón por la que conviene llegar media hora antes.\n\nRoma ofrece además algo que no se consigue en otro lado. En las cuatro basílicas mayores —San Pedro, San Juan de Letrán, Santa María la Mayor y San Pablo Extramuros— hay confesionarios atendidos durante casi todo el día, con sacerdotes de distintas lenguas: cada cabina tiene un cartel con los idiomas que el confesor habla. En San Pedro están sobre la nave izquierda, pasando la capilla del Coro, y en San Pablo a la derecha del transepto.\n\nLos penitenciarios de las basílicas patriarcales tienen facultades especiales para absolver casos reservados, una costumbre que viene de la Edad Media, cuando los peregrinos llegaban a Roma justamente para eso: para confesarse en las tumbas de los Apóstoles.","fullSource":"propio","zone":"Monti y Esquilino"},{"time":"09:00","name":"Santa Misa","tag":"mass","type":"mass","dur":75,"quick":"Cappella Santa Caterina da Siena, Via Urbana 85. Rito tradicional.","hist":"La capilla de la Fraternidad San Pío X en Roma, en pleno Monti, a pasos del Foro de Augusto. Misa dominical en la forma extraordinaria del rito romano.","logi":{"Horario":"9:00 y 11:00 los domingos","Dirección":"Via Urbana 85, Rione Monti","Horarios domingo":"9:00 y 11:00","Viernes":"18:30","Costo":"Gratis","Sobre el horario":"Cappella Santa Caterina da Siena. Viernes 18:30."},"map":"Via Urbana 85, Roma","travel":{"mode":"walk","dur":2,"costAd":"Gratis","costCh":"Gratis","how":"Es en la misma capilla donde se confesaron. Solo hay que sentarse."},"id":"s12","day":"11","hrs":{"open":[[510,630]],"closed":[]},"hv":true,"pri":1,"full":"La Fraternidad Sacerdotal San Pío X tiene en Roma su capilla en Via Urbana 85, en pleno Rione Monti, a pasos del Foro de Augusto y de la basílica de Santa Pudenciana. Está dedicada a Santa Catalina de Siena, la dominica que en 1377 convenció al papa Gregorio XI de volver desde Aviñón y devolverle a Roma la sede de Pedro.\n\nSe celebra la Misa en la forma extraordinaria del rito romano, la que codificó San Pío V en 1570 tras el Concilio de Trento y que se rezó sin interrupción durante cuatro siglos. Los domingos hay dos misas, a las 9:00 y a las 11:00, con confesiones antes de cada una. Los viernes, a las 18:30.\n\nEl barrio ayuda. Monti es el rione más antiguo de Roma y todavía tiene aire de pueblo: calles angostas, escaleras, ropa colgada, trattorias de barrio. Alrededor de la capilla, en un radio de diez minutos a pie, están Santa Pudenciana con el mosaico más antiguo de la ciudad, Santa Práxedes con la columna de la flagelación, Santa María la Mayor y San Pietro in Vincoli con el Moisés.\n\nDesde el departamento son unos cuarenta minutos: metro A hasta Termini, línea B una parada hasta Cavour, y cinco minutos caminando.","fullSource":"propio","zone":"Monti y Esquilino"},{"time":"10:15","name":"Santa Pudenciana","tag":"site","type":"site","dur":30,"quick":"A la vuelta de la capilla. El mosaico absidal más antiguo de Roma.","hist":"Levantada sobre la casa del senador Pudente, donde según la tradición se hospedó San Pedro. El mosaico del ábside es del siglo IV.","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Bajar por Via Urbana hacia Via Cavour. Santa Pudenciana está sobre Via Urbana 160, unos metros más abajo, en un nivel hundido respecto de la calle actual.","tip":"El piso está varios metros por debajo del nivel de hoy: eso da la medida de cuánto subió Roma en dieciséis siglos."},"full":"La antigua tradición narra que en los primeros tiempos de la era cristiana existía en este lugar la casa del noble senador romano Pudente, padre de Santa Práxedes y Santa Pudenciana, quien había hospedado al apóstol Pedro, quien bautizó a S. Pudenciana. Aquí habitó S. Justino, filósofo y mártir. Están sepultados numerosos mártires, enterrados aquí por las santas Pudenciana y Práxedes (así como en la iglesa de S. Práxedes). En la capilla de S. Pedro, un sarcófago, ideado por el Card. Wiseman (autor de “Fabiola”) encierra un fragmento del altar de madera sobre el cual S. Pedro celebraba la Misa. En el s.II se instalaron aquí unas termas y en el s.IV la iglesia de Santa Pudenciana, que se incendió en ese mismo siglo. Fue reconstruida en el s.VIII y sucesivamente restaurada. A finales del s.XII Inocencio III mandó construir el campanario y la entrada. En 1589 se realizaron profundas modificaciones, sobrepuestas al antiguo edificio románico. En el interior destacan los mosaicos del s.IV, uno de los más antiguos ejemplos –junto con los de Santa María la Mayor, Santa Constanza y el Baptisterio de San Juan de Letrán–de mosaico cristiano en Roma. La forma en que está representado Cristo, el brillante colorido y el movimiento de las figuras muestran la persistencia de las características romanas en el mosaico cristiano, antes de la influencia oriental.\n\nDesde aquí, por la Via Urbana, se desemboca en la Piazza dell´Esquilino. En cuyo centro se levanta un obelisco (14.80 m) que, como su gemelo de la Plaza del Quirinal, adornaba el ingreso del Mausoleo de Augusto, y que fue transportado por Sixto V en el 1587. A la derecha, sobre la grandiosa Escalinata, se puede apreciar la parte exterior del ábside de Santa María la Mayor.","logi":{"Horario":"8:30 a 12:00 y 15:00 a 18:00","Costo":"Gratis"},"map":"Basilica di Santa Pudenziana, Roma","id":"s13","day":"11","hrs":{"open":[[510,720],[900,1080]],"closed":[]},"hv":false,"pri":2,"ver":["El **mosaico del ábside**, del siglo IV: Cristo entronizado entre los apóstoles vestidos como senadores romanos. El más antiguo de Roma.","El nivel del piso, varios metros por debajo de la calle: es la medida de cuánto subió Roma en dieciséis siglos.","Aquí estuvo la casa del senador Pudente, que hospedó a San Pedro, y aquí vivió San Justino mártir."],"zone":"Monti y Esquilino"},{"time":"10:45","name":"Santa Práxedes","tag":"site","type":"site","dur":30,"quick":"La capilla de San Zenón y la columna de la flagelación.","hist":"Fundada por el papa San Pascual I en el siglo IX. La capilla de San Zenón está enteramente revestida de mosaico bizantino, único en Roma.","travel":{"mode":"walk","dur":7,"costAd":"Gratis","costCh":"Gratis","how":"Cruzar Via Cavour y subir por Via di San Martino ai Monti. La entrada de Santa Práxedes es discreta, sobre Via di Santa Prassede, casi al lado de Santa María la Mayor.","tip":"La puerta principal suele estar cerrada: se entra por la lateral."},"full":"Esta iglesia es uno de los “antiguos títulos”, es decir, una casa particular donde se tenían las ceremonias litúrgicas en la antigüedad. En este lugar era la casa de la familia de Santa Práxedes, de su hermana Santa Pudenciana, de sus hermanos San Timoteo y Novato y su padre San Pudente. Bajo el altar mayor, en la cripta están los sarcófagos con los restos de santa Práxedes y Pudenciana, traídas aquí del cementerio de Priscilla. Además se veneran los restos de 2300 mártires (estas santas juntaban los cuerpos después del martirio y los sepultaban en su casa), Se tienen noticias de su existencia como Basílica ya desde el s.V; pueden verse todavía restos de las antiguas estructuras en el cuádruple pórtico de la iglesia. La construcción actual es de la época de Pascual I (822), y responde a una planta basilical, con las tres naves separadas por 16 columnas de pórfido gris y 6 pilastras en las que se apoyan directamente las trabes. Fue modificada en el s.XIII, al agregársele tres arcos transversales en la nave, en el s.XVII al decorarla con frescos, y al arreglar el techo en el s.XIX. Lo más sobresaliente en el interior son los mosaicos del arco triunfal y del ábside, del s.IX y especialmente la Capilla de San Zenón (a la derecha), el monumento bizantino más importante de Roma, fue encargada por Pascual I (817–824), como mausoleo para su madre, Teodora. Aunque ha sufrido modificaciones posteriores, se trata de una obra deliciosa, llamada el Jardín del Paraíso. Las doce columnas de granito negro, a los lados del portal, y el rico marco que sirve de trabe, provienen de edificios de la antigüedad pagana, así como las bases de las columnas y la urna de mármol que se encuentra en el arco de la entrada. El interior (dirigirse a la sacristía) está cubierto de mosaicos sobre fondo dorado, de gran interés artístico, por su riguroso estilo bizantino. El ícono de la Virgen se denomina “Santa María, libera nos a poenis inferni”, muy venerado en la antigüedad. A la derecha de esta capilla se encuentra un pequeño monumento donde se puede venerar la Columna de la Flagelación de Nuestro Señor; en la pared opuesta, por el lado exterior, un fresco recuerda esta escena con toda su crueldad. Fue traída de Jerusalén en 1223 por el cardenal Giovanni Colonna. También se conservan tres espinas de la corona de Cristo, en un relicario. En el monasterio de S. Práxedes habitaron del 867 al 869 los santos Cirilo y Metodio, apóstoles de los eslavos y creadores de la escritura paleoeslava. Aquí murió S. Cirilo el 14 de febrero de 869 (sus restos están en la iglesia de S. Clemente).\n\nEn la segunda capilla de la nave izquierda, dedicada a S. Carlos Borromeo, está el faldistorio de San Carlos (del latín faldistorium; es un elegante asiento originario de la Edad Media que utilizan los obispos delante del altar en algunas funciones pontificales como impartir la confirmación, ordenaciones, etc. Es un asiento sin respaldo, con cuatro pilares pequeños en los ángulos y las patas en forma de tijera). En la tercera capilla se custodia la mesa en la que el mismo santo distribuía la comida a los pobres.","logi":{"Horario":"7:30 a 12:00 y 16:00 a 18:30","Costo":"Gratis","No perderse":"La columna de la flagelación, en la capilla de San Zenón","Sobre el horario":"Se entra por la puerta lateral de Via di Santa Prassede."},"map":"Basilica di Santa Prassede, Roma","id":"s14","day":"11","hrs":{"open":[[450,720],[960,1110]],"closed":[]},"hv":false,"pri":1,"ver":["La **capilla de San Zenón**, a la derecha: enteramente revestida de mosaico bizantino. El monumento bizantino más importante de Roma.","La **columna de la flagelación**, dentro de esa misma capilla, traída de Jerusalén en 1223.","Los mosaicos del arco triunfal y del ábside, del siglo IX, encargados por el papa San Pascual I.","El disco de mármol en el piso de la nave: la tradición dice que ahí Práxedes recogía la sangre de los mártires."],"zone":"Monti y Esquilino"},{"time":"11:15","name":"Santa María la Mayor","tag":"site","type":"site","dur":90,"quick":"Basílica mayor mariana: la reliquia del pesebre, la Salus Populi Romani y la tumba de San Pío V.","hist":"La mayor de las iglesias marianas de Occidente, levantada tras el Concilio de Éfeso (431). Conserva los mosaicos paleocristianos del siglo V en la nave.","travel":{"mode":"walk","dur":4,"costAd":"Gratis","costCh":"Gratis","how":"Salir de Santa Práxedes y bordear la manzana: la fachada lateral de Santa María la Mayor está enfrente. El ingreso principal da a Piazza di Santa Maria Maggiore.","tip":"Hay control de seguridad, puede haber unos minutos de fila."},"full":"El Liber Pontificalis narra que la noche del 5 de agosto del 352, la Santísima Virgen se apareció en sueños a un patricio romano de nombre Ioannes, a quien expresó su deseo de que se construyera una iglesia en cierto lugar de Roma donde nevaría la mañana siguiente. Ioannes refirió el mensaje al Papa Liberio, esa misma mañana, mientras una copiosa nevada cubría de blanco el punto más alto del Esquilino, una de las sete colinas romanas, sede de un aristocrático barrio donde habían vivido Mecenas, Ovidio, Horacio y Virgilio. El Papa, acompañado del patricio, trazó, en el suelo los límites de lo que sería la primera basílica romana dedicada a Nuestra Señora. Cada 5 de agosto, se evoca aquella singular nevada con una lluvia de pétalos blancos sobre el pavimento de la Basílica. La actual Santa María la Mayor fue edificada por el Papa Sixto III sobre la antigua basílica liberiana (del Papa Liberio), para conmemorar la proclamación por el Concilio de Éfeso (431) de la Maternidad divina de María. Tras Sixto III, los Papas sucesivos, han volcado su atención sobre el Santuario más antiguo y venerado en honor al dogma de María, Madre de Dios. Exterior La fachada es creación de Ferdinando Fuga (1743–50). Está flanqueada por dos alas idénticas, si bien construidas con un siglo de diferencia. El campanario (1377) es el más alto de la ciudad–y su decoración polícroma –mayólica sobre ladrillo rojo–es típicamente romana. En el pórtico resaltan, a la derecha, la estatua de Felipe IV de España, de Lucenti (1692) bajo diseño de Bernini; y a la izquierda, la Puerta Santa. Desde el pórtico, por la escalera de la izquierda, se llega a la loggia desde la que el Papa daba las bendiciones Urbi et Orbi (abierta de 9 a 11. solicitando permiso en la Sacristía), donde se conserva un monumental mosaico, realizado durante el pontificado de Eugenio III (1145–1153), en parte deteriorado y en parte mal restaurado a mediados del s. XVIII. Interior El interior de la Basílica (86 m de largo) es sumamente armonioso. Dividen las tres naves (la central un poco más larga que las laterales) columnas monolíticas (36 de mármol y 4 de granito) con capiteles –icónicos que sostienen directamente las trabes o vigas. Son de mármol blanco del Imetto, y casi todas se remontan a tiempos de Sixto III (s.V). El bellísimo pavimento cosmatesco en mosaico de piedras duras, es del s.XII. El artesonado del techo, atribuido a Giuliano da Sangallo, es considerado una de las obras maestras de la artesanía renacentista (las rosas miden un metro de diámetro); el oro de la decoración es el primer oro de América traído del Perú y ofrecido por Fernando e Isabel al Papa Alejandro VI. Desde el punto de vista artístico, la característica esencial de la Basílica viene dada por la cantidad de mosaico y por su calidad. La ampliación del presbiterio efectuada por Nicolás IV en el s.XIII, trajo consigo la demolición de la decoración original del ábside y la realización de nuevos mosaicos. Al tratarse de trabajos de distintas épocas, el conjunto resulta un compendio de las fases más significativas del arte mosaísta. Los 27 paneles sobre el arquitrabe de la nave central (la viga entre dos columnas), que datan del s.V., constituyen la obra más vasta y meritoria de los mosaístas del alto Medioevo. Los mosaicos que decoran el arco triunfal están dedicados a la infancia de Jesús, con pasajes de los Evangelios y de los apócrifos. Tenemos después los mosaicos del ábside, terminados en 1295 por Torriti, que representan escenas de la vida de la Virgen –en los recuadros entre las ventanas–y la Coronación de la Virgen por Jesús, en el medallón central. La Confesión se rehízo en 1864, bajo diseño de Virginio Vespignani; la gran estatua muestra a Pío IX de rodillas ante las reliquias del Pesebre. En la Confesión, sobre el altar, en un relicario en forma de cuna, se encuentran fragmentos que la tradición venera como pertenecientes al pesebre del Niño Jesús. En este altar celebró su primera Misa San Ignacio de Loyola. El baldaquino del altar mayor, con cuatro columnas de pórfido, es de Fuga; la urna, también de pórfido, contiene reliquias del Apóstol Mateo.","logi":{"Horario":"7:00 a 19:00 · último ingreso 18:30","Costo":"Gratis","San Pío V":"Cappella Sistina, a la derecha del altar mayor","Pesebre":"Cripta bajo el altar mayor"},"map":"Basilica di Santa Maria Maggiore, Roma","id":"s15","day":"11","hrs":{"open":[[420,1140]],"closed":[]},"hv":true,"pri":1,"ver":["Los **mosaicos del siglo V** en lo alto de la nave, con escenas del Antiguo Testamento. Son del tiempo del Concilio de Éfeso.","La **Salus Populi Romani**, en la capilla Paulina, a la izquierda.","La **reliquia del pesebre**, en la cripta bajo el altar mayor.","La **tumba de San Pío V** en la capilla Sixtina, a la derecha.","La tumba de **Bernini**: una lápida mínima en el piso, a la derecha del altar mayor. Casi nadie la encuentra."],"zone":"Monti y Esquilino"},{"time":"12:45","name":"Almuerzo en Monti","tag":"food","type":"food","dur":90,"quick":"Barrio tranquilo, buenas trattorias, cómodo con chicos.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Bajar por Via Cavour hacia el Foro y meterse en las callecitas de Monti: Via del Boschetto, Via dei Serpenti y Via Panisperna concentran las mejores trattorias.","tip":"Reservar con anticipación: quince personas un domingo al mediodía no entran en cualquier lado."},"logi":{"Costo adultos":"€18 a €28","Costo niños":"€8 a €12"},"id":"s16","day":"11","pri":3},{"time":"15:00","name":"San Pietro in Vincoli","tag":"site","type":"site","dur":45,"quick":"Las cadenas de San Pedro y el Moisés de Miguel Ángel.","hist":"Construida en el siglo V por la emperatriz Eudoxia para custodiar las cadenas del Apóstol. Guarda el Moisés que Miguel Ángel talló para la tumba de Julio II.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Desde Monti, subir por Via Cavour hasta la escalinata cubierta de Via San Francesco di Paola, que sale a la izquierda. Arriba se abre la plaza de San Pietro in Vincoli.","tip":"La escalinata es empinada: con cochecito conviene rodear por Via degli Annibaldi."},"full":"De Vía Cavour se sube por una escalinata sobre la cual vivía la famosa Lucrecia Borgia. En el 436, la mujer del emperador de Oriente recibió como regalo de Juvenal, Obispo de Jerusalén, las cadenas que se habían usado cuando San Pedro estuvo en prisión. La emperatriz conservó una parte de esta reliquia en una espléndida basílica construida con este propósito, y envió la otra a Roma, a su hija Eudosia, esposa del emperador Valentiniano III. Esta, a su vez, la entregó al Papa San León Magno. Cuenta la tradición que el Papa colocó esa cadena junto a otra, que sirvió para tener prisionero al Apóstol en la Cárcel Mamertina de Roma, durante la época de Nerón. Cuando lo hizo, las dos cadenas se juntaron, de modo que formaron una sola. En memoria de este prodigio, y en honor del Apóstol Pedro, la emperatriz Eudosia edificó la actual Basílica, para conservar las cadenas, que por este motivo se llamó Basílica eudosiana de San Pietro in Vincoli (en cadenas). La Basílica fue construida sobre otra ya existente –dedicada a los Santos Apóstoles–que había sido reconstruida por el predecesor de San León Magno. Sixto III, con ayuda de la misma Eudosia, sobre las estructuras de una basílica del s.IV y una Domus Ecclesiae del s.III. Posteriormente se llevaron a cabo diversas obras de restauración y decoración, la más importante es obra de Fontana, en el s.XVIII. Durante unas recientes excavaciones (1956–59) realizadas para rehacer el suelo, se descubrieron los restos de las construcciones precedentes–las más antiguas del s.II antes de Cristo–,\n\nque en parte se pueden visitar (se puede pedir permiso para entrar; la entrada está bajo el pórtico a la derecha; si se entra, es conveniente solicitar guía). La fachada está precedida por un elegante pórtico de cinco arcadas con pilastras octogonales, que se terminó en 1475. El amplio interior está dividido en tres naves por dos filas de columnas dóricas de mármol. La decoración interior medieval fue modificada en los s.XVII y XVIII. A la izquierda de la puerta principal se encuentra la tumba de Antonio y Piero del Pollaiuolo, famosos escultores florentinos del Renacimiento. El altar mayor y el baldaquino son de Vespignani (1872). Abajo, la Confesión, del mismo autor, en cuyo altar hay dos ventanillas de bronce dorado con Escenas de la vida de San Pedro en bajorrelieve, atribuidas a Caradosso (1477); las ventanillas se abren para dejar ver en su interior la urna de bronce dorado (1856) que contiene las cadenas de San Pedro. En la Cripta bajo el altar se encuentra un sarcófago paleocristiano, que fue descubierto en el s.XIX. dividido en siete compartimentos interiores, en los que había algunos fragmentos de huesos y ceniza. Dos laminillas de plomo con inscripciones confirmaban (ya se tenía alguna noticia) que eran las reliquias de los siete hermanos Macabeos, martirio que se relata en el Antiguo Testamento. Desde el punto de vista artístico, lo más sobresaliente es el Mausoleo del Papa Julio II. En 1505 el Papa mandó venir a Miguel Ángel desde Florencia, para realizar el proyecto de su tumba, que pensaba colocar en el centro de la Basílica de San Pedro. Miguel Ángel pasó varios meses en Carrara, eligiendo el mármol; el programa original comprendía unas cuarenta estatuas, numerosos bajorrelieves en bronce, y el sarcófago. Posteriormente, y después de la muerte del Pontífice fue perdiendo actualidad. Terminaron de arrinconarlo los sucesivos encargos por parte del nuevo Pontífice, Paulo III, que había encargado al artista la realización del Juicio Final para la Capilla Sixtina. Paulo III comenzaba a impacientarse con la tardanza en el mausoleo; se cuenta que en cierta ocasión fue a ver al escultor, y acabó convenciéndole de que la estatua de Moisés era tan bella que ella sola bastaba para honrar la sepultura de Julio II. El comentario puso punto final al proyecto; Julio II acabó siendo sepultado en la tumba de su tío, Sixto IV, y Miguel Ángel, después de tres años de trabajo, se refería a la obra inacabada como la tragedia de su vida. Representa a Moisés recién bajado del Sinaí –donde ha recibido del Señor las Tablas de la Ley– aún con dos rayos de luz sobre la frente –los poderes–, que contempla al pueblo idólatra. Las estatuas de Lía y Raquel, que representan a la vida activa y a la vida contemplativa, fueron terminadas por Rafaello da Montelupo.","logi":{"Horario":"8:00 a 12:30 y 15:00 a 19:00","Costo":"Gratis","Atención":"Cierra al mediodía. Por eso quedó a la tarde"},"map":"Basilica di San Pietro in Vincoli, Roma","id":"s17","day":"11","hrs":{"open":[[480,750],[900,1140]],"closed":[]},"hv":false,"pri":1,"ver":["El **Moisés** de Miguel Ángel, en el brazo derecho del transepto.","Las **cadenas de San Pedro** en un relicario bajo el altar mayor: las de Jerusalén y las de la prisión romana, que según la tradición se soldaron solas al juntarlas.","La tumba de Julio II, que quedó inacabada: de las cuarenta estatuas previstas, Miguel Ángel talló apenas unas pocas."],"zone":"Monti y Esquilino"},{"time":"16:30","name":"Vuelta al departamento","tag":"rest","type":"rest","quick":"Tarde libre. Domingo tranquilo.","travel":{"mode":"metro","dur":40,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Desde Cavour, línea B una parada hasta Termini, y ahí línea A dirección Battistini hasta Ottaviano."},"id":"s18","day":"11","pri":3}]},{"date":"2026-10-12","phase":1,"weekday":"Lun","dd":"12","title":"Museos Vaticanos","note":"Día partido: los grandes a los Museos, las nenas se quedan con la abuela.","stops":[{"time":"07:45","name":"En la puerta de Viale Vaticano","tag":"rest","type":"rest","dur":15,"quick":"Quince minutos a pie desde casa. Llegar antes de la hora del turno.","logi":{"Entrada":"Viale Vaticano, muralla norte","Importante":"Llevar la reserva en el celular y documento"},"map":"Musei Vaticani ingresso, Viale Vaticano","id":"s19","day":"12","pri":3},{"time":"08:00","name":"Museos Vaticanos y Capilla Sixtina","tag":"site","type":"site","dur":240,"quick":"Galería de los Mapas, Estancias de Rafael y la Sixtina. Cuatro horas.","hist":"La colección papal empezó con el Laocoonte, comprado por Julio II en 1506. Hoy son siete kilómetros de salas.","travel":{"mode":"walk","dur":15,"costAd":"€20 + €5 de reserva","costCh":"€8 de 6 a 18 · gratis menores de 6","how":"Desde el departamento, bordear la muralla vaticana por Via Aurelia y Via Leone IV hasta Viale Vaticano. La entrada está sobre la muralla, bien señalizada.","tip":"Con el turno de las 8:00 se llega a la Sixtina antes que los grupos grandes."},"full":"Las obras más sobresalientes que conviene ver como mínimo:  De la Pinacoteca. Sala II: Políptico de Giotto; Sala III: la Coronación de la Virgen, de Filippo Lippi y La Virgen de los Ángeles, de Fray Angélico; Sala V: La Piedad, de Bernini; Sala VI: La Virgen con el Niño, de Perugino; Sala VII: varias obras de Rafael; Sala VIII: Boceto de San Jerónimo, de Leonardo da Vinci (1452–1519); Sala X: La\n\nVirgen de San Nicolás, de Ticiano: Sala XII: Comunión de San Jerónimo, de Domenichino y La Deposición, de Caravaggio: Sala XIII: Las bodas de Santa Catalina, de Murillo.  En el Museo Pío–Clementino, que se encuentra en el Palacio del Belvedere, se conservan obras de la antigüedad griega y romana. Lo más sobresaliente es el grupo del Laconte, el Apolo, Perseo, Hermes y El Atleta en el Patio del Belvedere: La Estatua de Meleagro, en la sala de los Animales: Apolo Saurótono, en la Galería de las estatuas: varias esculturas de la Galería de los Bustos: la Venus de Cnido, en el Gabinete de las Máscaras. El Torso del Belvedere, en la Sala de las Musas.  Las estancias de Rafael.  La Capilla Sixtina. Estancias de Rafael La Estancia del Incendio (1514–17) fue la última habitación diseñada personalmente por Rafael, pues a partir de 1515 trabajó con un grupo de asistentes, que plasmaban los frescos del maestro. Los del techo son de Perugino. Para honrar al Papa León X –sucesor de Julio II–, que confirmó a Rafael en el encargo de decorar las estancias, el artista retrató al Papa al representar a sus predecesores León III y León IV. En la Coronación de Carlomagno (en la pared de entrada), el emperador está representado como Francisco I de Francia, contemporáneo del pintor. En la pared de la derecha, de frente a la ventana, el Incendio del Borgo, en el que se representa el pasaje del Liber Pontificalis que narra el incendio, ocurrido el 847, del barrio del Borgo, extinguido por León IV con el signo de la Cruz. En la pared de enfrente, la Batalla de Ostia, que representa el triunfo de León IV sobre los sarracenos (849), idea alusiva a la cruzada contra los turcos, que ocupó vivamente a León X. En la pared de la izquierda, el Juramento de León III, representa el momento en que el Romano Pontífice aclaró en San Pedro la falsedad de ciertas acusaciones (23–XII–800). Cuenta la tradición que una voz tronó: “Corresponde a Dios, no a los hombres, juzgar a los Obispos”(inscripción latina a la izquierda de la ventana) . La Estancia de la Signatura (1508–11) está considerada como la obra pictórica más insigne de Rafael. Parte del techo fue concluida por dos de sus colaboradores: Sodoma y Bramantino. En la pared de entrada, la disputa del Santísimo Sacramento, también llamado la Glorificación del Catolicismo, pues cielo y tierra se unen en un himno a Dios Uno y Trino en el misterio de la Transubstanciación. Es el primero de los grandes frescos romanos de Rafael. En la parte alta, la Iglesia triunfante rodea a la Santísima Trinidad. En la tierra, alrededor del altar con el Ostensorio (centro de toda la composición), Doctores de la Iglesia, Papas y fieles: se distingue a Dante, a la derecha con la corona de laurel. En la pared de la derecha, la Prudencia y la Templanza. A la derecha de la ventana, Gregorio IX (retrato de Julio II) entrega a un abogado consistorial los Decretales; a la izquierda de la ventana, Justiniano entrega a Treboniano el Corpus Iuris Civilis. En la pared de enfrente, la Escuela de Atenas. Al centro, Platón (retrato de Leonardo da 'Vinci) y Aristóteles. A la izquierda, Sócrates (en túnica) habla con Alcibíades; Diógenes y un discípulo; Epicuro, coronado de laurel; Arquímedes (retrato de Bramante) hace figuras geométricas. En la esquina de la derecha aparece el mismo Rafael (con sombrero negro) , junto al pintor Sodoma (con sombrero blanco). La figura solitaria del primer–plano, con la cabeza apoyada en la mano izquierda, es Miguel Ángel que trabaja en la Capilla Sixtina. En la pared de la izquierda, el Parnaso. Alrededor de Apolo y las nueve Musas están agrupados los grandes poetas, encabezados por Homero y Virgilio. En la Estancia de Heliodoro (1512–14), los temas de la decoración, probablemente sugeridos por el mismo Julio II muestran intervenciones milagrosas de Dios en favor de su Iglesia. En la pared de entrada, San León detiene la invasión de Atila. Una aparición de los Apóstoles Pedro y Pablo, dio ánimos a San León para repeler la invasión de los Hunos. Rafael ha trasladado el evento a Roma, como se puede ver por el Coliseo, el acueducto y la Basílica.. Rafael no había terminado la obra cuando Julio II murió (1513) y en el último momento le sustituyó en la persona de","logi":{"Horario":"8:00 a 19:00 · último ingreso 17:00","Reserva":"tickets.museivaticani.va","Entradas":"Se liberan 60 días antes","Vestimenta":"Hombros y rodillas cubiertos","Sobre el horario":"Cerrados los domingos, salvo el último de cada mes. Hay que salir de las salas 30 min antes."},"map":"Musei Vaticani","id":"s20","day":"12","hrs":{"open":[[480,1140]],"closed":[0]},"hv":true,"pri":1,"ver":["La **Galería de los Mapas**: 120 metros de frescos cartográficos del siglo XVI.","Las **Estancias de Rafael**, sobre todo la Escuela de Atenas.","La **Capilla Sixtina**: el techo y el Juicio Final. En silencio y sin fotos.","El **Laocoonte**, en el Patio Octogonal. Con él arrancó la colección, en 1506."],"zone":"Vaticano y Prati"},{"time":"12:00","name":"Almuerzo en Borgo Pio","tag":"food","type":"food","dur":90,"quick":"Reencuentro con el resto del grupo.","travel":{"mode":"walk","dur":15,"costAd":"Gratis","costCh":"Gratis","how":"Saliendo de los Museos, bajar por Via Leone IV hasta Piazza Risorgimento y entrar a Borgo Pio, la calle peatonal detrás de la columnata."},"logi":{"Costo adultos":"€15 a €25","Costo niños":"€8 a €12"},"id":"s21","day":"12","pri":3},{"time":"14:00","name":"Tarde libre","tag":"rest","type":"rest","quick":"Mercato Trionfale o las tiendas de Via Cola di Rienzo, para quien tenga ganas.","hist":"Uno de los mercados cubiertos más grandes de Roma, en funcionamiento desde hace más de un siglo.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Desde Borgo Pio, volver al departamento por Via di Porta Cavalleggeri, o subir a Prati por Via Cola di Rienzo."},"id":"s22","day":"12","pri":3}]},{"date":"2026-10-13","phase":1,"weekday":"Mar","dd":"13","title":"Scavi · el norte","note":"El día más importante del viaje. Y además, el aniversario del Milagro del Sol en Fátima.","stops":[{"time":"09:25","name":"Ufficio Scavi","tag":"rest","type":"rest","dur":20,"quick":"Largo del Colonnato 5, columnata izquierda. Al que llega tarde no lo dejan entrar.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Desde el departamento, subir por Via di Porta Cavalleggeri hasta Piazza del Sant'Uffizio y entrar por el arco de la columnata izquierda. Los guardias suizos indican el Ufficio Scavi apenas se dice \"necropoli\".","tip":"Salir 9:05. No hay reembolso ni segunda oportunidad si se llega tarde."},"logi":{"Dirección":"Largo del Colonnato 5, Ciudad del Vaticano","Reserva":"BPH7-LCVV · 5 personas","Costo":"€94 el grupo","Edad mínima":"15 años, sin excepciones"},"map":"Ufficio Scavi, Vaticano","id":"s23","day":"13","pri":1},{"time":"09:45","name":"Tour Scavi","tag":"site","type":"site","dur":60,"quick":"La necrópolis bajo la basílica hasta la tumba de San Pedro. Van Pablo, Maira, Josué, Raúl y Bautista.","hist":"Bajo el altar mayor de San Pedro se conserva una necrópolis romana del siglo I, sepultada por Constantino al levantar la primera basílica. Las excavaciones de Pío XII, entre 1939 y 1949, sacaron a la luz el trofeo de Gayo y, detrás, los huesos que Pablo VI reconoció en 1968 como los del Apóstol.","full":"La necrópolis vaticana es una calle de tumbas del siglo I y II, con mausoleos familiares paganos y, entre ellos, los primeros enterramientos cristianos. Estaba a cielo abierto sobre la ladera del Vaticano, junto al circo de Nerón, hasta que Constantino la rellenó de tierra hacia el año 320 para levantar la basílica encima. Ese relleno es lo que la conservó intacta durante mil seiscientos años.\n\nEl recorrido avanza por la vía funeraria antigua, entre mausoleos con frescos, estucos y mosaicos todavía en su lugar. Se pasa por el mausoleo de los Julios, con el célebre mosaico de Cristo como Sol Invicto guiando el carro, la imagen cristiana más antigua conservada en el Vaticano.\n\nAl final del recorrido está el Campo P, y en él el llamado trofeo de Gayo: el pequeño monumento con columnas que un sacerdote romano describía ya hacia el año 200 como la señal visible de la tumba del Apóstol. Junto a él, el Muro Rojo y el Muro G, cubierto de grafitos de peregrinos. En un hueco de ese muro aparecieron los restos óseos de un varón de contextura robusta, muerto entre los sesenta y los setenta años, envueltos en tela de púrpura con hilos de oro.\n\nLa visita termina exactamente debajo del alta
