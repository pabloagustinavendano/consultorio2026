expuesto; desde 2010 reposa en una urna de cristal en la cripta de la iglesia de San Pío, diseñada por Renzo Piano. Se ve el cuerpo vestido con el hábito; el rostro está cubierto por una máscara de silicona. La celda n.º 1 del convento, donde murió en 1968, se ve tras un vidrio. La reliquia del corazón se conserva en la celda n.º 5, donde vivió treinta años, en un relicario del orfebre Goudji, y sólo se expone en ocasiones (por ejemplo el 23 de septiembre o en viajes). Atribución segura en todos los casos.", "porQue": "Es uno de los santos más cercanos a nuestra época, y el recorrido por su celda, el crucifijo de los estigmas y su tumba es muy fuerte para confesarse y rezar.", "oracion": "San Pío de Pietrelcina, ruega por nosotros; danos un corazón arrepentido y fuerza en el sufrimiento.", "practico": [{"iglesia": "Iglesia de San Pío (Renzo Piano), cripta", "horario": "7:00-19:00. Misas lun-vie 7:30 (iglesia inferior), 10:00 y 11:30; sáb, dom y feriados también 16:30.", "entrada": "gratis", "consejo": "Bajar por la rampa con mosaicos de Rupnik hasta la cripta; ir temprano para evitar los micros de peregrinos."}, {"iglesia": "Convento de Santa Maria delle Grazie", "horario": "Recorrido de celda, cripta antigua y crucifijo 7:00-19:00; iglesia 6:00-22:00.", "entrada": "gratis", "consejo": "El recorrido de los 'lugares de Padre Pio' pasa por la celda n.º 1 y el coro con el crucifijo de los estigmas."}, {"iglesia": "Convento de Santa Maria delle Grazie", "horario": "Sólo en ocasiones (verificar exposición del corazón).", "entrada": "gratis", "consejo": "La celda n.º 5 no siempre se abre: consultar a los frailes; en octubre no hay fecha de exposición prevista que haya podido confirmar."}], "fuentes": ["https://www.conventosantuariopadrepio.it/it/il-santuario/news/orari.html", "https://www.avvenire.it/chiesa/pagine/san-pio-esposta-a-settembre-la-reliquia-del-suo-c", "https://www.acistampa.com/story/23297/il-cuore-di-padre-pio-esposto-alla-venerazione-dei-fedeli-a-san-giova const REFS = ["Refugio Vaticano","The Holy Apartments","Piazza San Pietro","Panteón","Piazza Navona","Fontana di Trevi","Piazza di Spagna","Piazza del Popolo","Piazza Venezia","Coliseo","Campo de' Fiori","Boca de la Verdad (Bocca della Verità)","Estación Termini","Cappella Santa Caterina da Siena FSSPX","Santissima Trinità dei Pellegrini"];

/* distancia a pie: línea recta × 1,3 por el trazado de las calles, a 75 m por minuto */
const geoOf = p => COORD[shortChurch(p.i)] || null;
function meters(a, b){
  const r = Math.PI/180, dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 12742000*Math.asin(Math.sqrt(h));
}
const walk = m => Math.max(1, Math.round(m*1.3/75));
const minLbl = (n, m) => m != null && m < 70 ? "Aquí" : n + " min";

/* estado */
const V = {mode:"imp", city:"all", vis:false, star:false, oct:false, q:"", ref:null, gps:null, gpsMsg:""};
let STARS = new Set();
try{ JSON.parse(localStorage.getItem("rome2026:santos") || "[]").forEach(k => STARS.add(k)); }catch(e){}
const saveStars = () => { try{ localStorage.setItem("rome2026:santos", JSON.stringify([...STARS])); }catch(e){} };
const byKey = k => S.find(s => s.key === k);

/* qué lugares pasan los filtros */
const placeOK = p => (V.city === "all" || p.c === V.city) && (!V.vis || p.v === "V" || p.v === "U");
const saintOK = s => (!V.star || STARS.has(s.key)) && (!V.oct || s.oct) &&
  (!V.q || s.txt.includes(norm(V.q)));

/* iglesias con sus santos, opcionalmente ordenadas por distancia a un punto */
function churches(origin){
  const m = new Map();
  for(const s of S){
    if(!saintOK(s)) continue;
    for(const p of s.places){
      if(!placeOK(p)) continue;
      const k = shortChurch(p.i);
      if(!m.has(k)) m.set(k, {k, full:p.i, c:p.c, z:p.z, geo:geoOf(p), items:[]});
      m.get(k).items.push({s, p});
    }
  }
  const L = [...m.values()];
  L.forEach(ch => {
    ch.items.sort((a,b) => a.s.imp - b.s.imp || VORD[a.p.v] - VORD[b.p.v]);
    ch.top = Math.min(...ch.items.map(x => x.s.imp));
    if(origin && ch.geo){ ch.m = meters(origin, ch.geo); ch.min = walk(ch.m); }
  });
  return L;
}

/* ── piezas ── */
const vtag = v => `<span class="stag v${v}">${TAGV[v]}</span>`;
const qk = k => esc(k).replace(/'/g,"\\'");
const row = (s, p, extra, back) => `<button class="srow" onclick="SANTOS.open('${qk(s.key)}'${back ? `,'${back}'` : ''})">

const churchBlock = (ch, head) => `<div class="sch">

function filters(){

/* ── vista por importancia ── */
function vImp(){
  const L = S.map(s => ({s, pl: s.places.filter(placeOK)})).filter(x => x.pl.length && saintOK(x.s));
  if(!L.length) return '<div class="empty">Ningún santo con estos filtros.</div>';
  const ord = s => s.imp === 1 ? I1.indexOf(s.key) : s.imp === 2 ? I2.indexOf(s.key) : 0;
  L.sort((a,b) => a.s.imp - b.s.imp || ord(a.s) - ord(b.s) || a.s.key.localeCompare(b.s.key, "es"));
  let h = '', cur = 0;
  for(const {s, pl} of L){
    if(s.imp !== cur){ cur = s.imp;
      h += `<div class="zone">${TIERS[cur].t}</div><div class="snote">${TIERS[cur].d}</div>`; }
    const I = INFO[s.key] || {};
    h += `<button class="gitem ssaint" onclick="SANTOS.open('${esc(s.key).replace(/'/g,"\\'")}')">
      <span class="gth smark m${s.imp}">${MARK[s.imp]}</span>
      <span class="tx"><div class="n">${esc(s.key)}${STARS.has(s.key) ? ' <i class="sst">★</i>' : ''}</div>
        <div class="q">${esc(I.porQue || s.bio)}</div>
        <div class="d">${[...new Set(pl.map(p => shortChurch(p.i) + (p.c !== 'R' ? ' · ' + CITY[p.c] : '')))].join(' · ')}</div>
        <div class="stags">${vtag(pl[0].v)}${s.oct ? `<span class="stag vO">Fiesta ${esc(s.f)}</span>` : ''}</div>
      </span></button>`;
  }
  return h;
}

/* ── vista por zona ── */
function vZona(){
  const L = churches();
  const byZ = new Map(ZONAS.map(z => [z.id, []]));
  L.forEach(ch => byZ.get(zonaDe({c:ch.c, z:ch.z}).id).push(ch));
  let h = '', jump = [];
  for(const z of ZONAS){
    const g = byZ.get(z.id); if(!g.length) continue;
    g.sort((a,b) => a.top - b.top || b.items.length - a.items.length || a.k.localeCompare(b.k, "es"));
    const ns = new Set(g.flatMap(c => c.items.map(x => x.s.key))).size;
    jump.push(`<button class="sfc" onclick="SANTOS.jump('${z.id}')">${esc(z.n.split(',')[0].split(' y ')[0])}</button>`);
    h += `<div class="zone" id="sz-${z.id}">${esc(z.n)}</div>
      <div class="snote">${esc(z.d)} ${ns} santo${ns > 1 ? 's' : ''}.</div>` + g.map(c => churchBlock(c)).join('');
  }
  return h ? `<div class="sfil sjump">${jump.join('')}</div>` + h : '<div class="empty">Ninguna iglesia con estos filtros.</div>';
}

function open(key, backStop){
  const s = byKey(key); if(!s) return;
  const I = INFO[s.key] || {}, on = STARS.has(s.key);
  const prac = p => (I.practico || []).find(x => x.iglesia === p.i) ||
    (I.practico || []).find(x => norm(x.iglesia).includes(norm(shortChurch(p.i))) || norm(shortChurch(p.i)).includes(norm(shortChurch(x.iglesia))));
  const kv = [`<span>${TIERS[s.imp].t}</span>`, `<span>Fiesta ${esc(s.f)}</span>`];
  if(s.oct) kv.push('<span class="okc">Su fiesta cae en el viaje</span>');
  const places = s.places.map(p => {
    const pr = prac(p), g = geoOf(p);
    const rows = [["Reliquia", TIPO[p.t]], ["Dónde", p.u]];
    if(pr && pr.horario) rows.push(["Horario", pr.horario]);
    if(pr && pr.entrada) rows.push(["Entrada", pr.entrada]);
    if(p.n) rows.push(["Nota", p.n]);
    if(pr && pr.consejo) rows.push(["Consejo", pr.consejo]);
    const dm = backStop && STOPGEO[backStop] && g ? meters(STOPGEO[backStop], g) : null;
    const dist = dm == null ? '' : dm < 70 ? ' · es acá' : ` · ${walk(dm)} min de acá`;
    return `<div class="splace">${vtag(p.v)}
      <div class="spn disp">${esc(p.i)}</div>
      <div class="spz">${p.c === 'R' ? esc(p.z) + ' · Roma' : CITY[p.c]}${dist}</div>
      ${rows.map(([k,v]) => `<div class="row"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}
      <button class="mapbtn" onclick="window.open('${mapURL(shortChurch(p.i) + ', ' + (p.c === 'R' ? 'Roma' : CITY[p.c]))}','_blank')">📍 Abrir en Google Maps</button>
      <button class="mapbtn salt" onclick="window.open('${imgURL(s.key + ' ' + shortChurch(p.i))}','_blank')">Ver fotos ›</button></div>`;
  }).join('');
  const src = [...new Set([...(I.fuentes || []), ...s.places.map(p => p.src)])];
  const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return u; } };
  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     ${backStop ? `<button class="sback" onclick="open_('${backStop}')">‹ ${esc(STOPS[backStop].name)}</button>` : ''}
     <h2 class="disp">${esc(s.key)}</h2>
     <div style="font-size:11.5px;color:var(--soft);font-weight:600;margin-top:5px">
       ${s.rg.map(x => RANGO[x]).join(' · ')} · siglo ${esc(s.sg)}</div>
     <div class="kv">${kv.join('')}</div>
     <div class="sum">${esc(I.porQue || s.bio)}</div>
     <details open><summary><span class="t">Quién fue</span><span class="c">›</span></summary>
       <div class="body rd"><p>${esc(I.vida || s.bio)}</p>
       ${I.patrono && I.patrono !== '—' ? `<p><b>Patrono:</b> ${esc(I.patrono)}</p>` : ''}</div></details>
     ${I.reliquia ? `<details><summary><span class="t">Su reliquia</span><span class="c">›</span></summary>
       <div class="body rd"><p>${esc(I.reliquia)}</p></div></details>` : ''}
     <details open><summary><span class="t">Dónde venerarlo</span><span class="c">›</span></summary>
       <div class="body">${places}</div></details>
     ${I.oracion ? `<details><summary><span class="t">Para rezarle</span><span class="c">›</span></summary>
       <div class="body rd spray">${esc(I.oracion)}</div></details>` : ''}
     <button class="mapbtn sstar ${on ? 'on' : ''}" onclick="SANTOS.star('${esc(s.key).replace(/'/g,"\\'")}','${backStop || ''}')">${on ? '★ Marcado para visitar' : '☆ Marcar para visitar'}</button>
     <div class="src">Fuentes: ${src.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(hostOf(u))}</a>`).join(' · ')}</div>`;
  show();
}

/* ── santos aquí y cerca de una parada (para la ficha del itinerario) ── */
function nearStop(id, max){
  const g = STOPGEO[id]; if(!g) return [];
  const saved = {...V}; V.city = "all"; V.vis = false; V.star = false; V.oct = false; V.q = "";
  const L = churches(g).filter(c => c.min != null && c.min <= (max || 10)).sort((a,b) => a.min - b.min);
  Object.assign(V, saved);
  return L;
}

/* ── lugares para improvisar ── */
const CATN = {cristiana:'Roma cristiana', imperial:'Roma imperial', mirador:'Mirador'};
function nearPlaces(g, max, self){
  return LUGARES.map(l => { const m = meters(g, l.geo); return {...l, m, min: walk(m)}; })
    .filter(l => l.min <= max && !(self && l.m < 60)).sort((a,b) => a.m - b.m);
}
const lugRow = (l, back) => `<div class="lrow">
  <div class="lhd"><span class="smin">${minLbl(l.min, l.m)}</span><button class="ln disp" onclick="SANTOS.openLugar('${l.id}'${back ? `,'${back}'` : ''})">${esc(l.n)}</button></div>
  <div class="lmeta"><span class="stag lc-${l.cat}">${CATN[l.cat] || l.cat}</span><span>${l.t} min</span><span>${esc(l.c)}</span>${l.kids ? '<span>Lindo con chicos</span>' : ''}</div>
  <div class="ld">${esc(l.d)}</div>
  <div class="lh">${esc(l.h)} · <a href="${mapURL(l.n.replace(/ \(.*\)$/, '') + ', Roma')}" target="_blank" rel="noopener">Mapa ›</a>
   · <a href="${imgURL(l.n.replace(/ \(.*\)$/, '') + ' Roma')}" target="_blank" rel="noopener">Fotos ›</a></div></div>`;
function placesSection(id){
  const g = STOPGEO[id]; if(!g) return '';
  const P = nearPlaces(g, 10, true).slice(0, 8); if(!P.length) return '';
  return `<details><summary><span class="t">Para improvisar cerca</span><span class="c">›</span></summary>
    <div class="body"><div class="snote">Si sobra tiempo: ${P.length} lugar${P.length > 1 ? 'es' : ''} lindo${P.length > 1 ? 's' : ''} a menos de 10 minutos.</div>
    ${P.map(l => lugRow(l, id)).join('')}</div></details>`;
}
function stopSection(id){
  const L = nearStop(id, 10); if(!L.length) return '';
  const rows = L.flatMap(c => c.items.map(x => ({...x, c})))
    .sort((a,b) => a.c.min - b.c.min || a.s.imp - b.s.imp).slice(0, 14);
  const n = new Set(rows.map(x => x.s.key)).size;
  return `<details open><summary><span class="t">Santos aquí y cerca</span><span class="c">›</span></summary>
    <div class="body"><div class="snote">${n} santo${n > 1 ? 's' : ''} a menos de 10 minutos caminando.</div>
    ${rows.map(({s, p, c}) => row(s, p, `<span class="smin">${minLbl(c.min, c.m)}</span>`, id)).join('')}
    <button class="mapbtn salt" onclick="SANTOS.nearFrom('${id}')">Ver todos los cercanos ›</button></div></details>`;
}
function ahoraCard(stop){
  if(!stop || !STOPGEO[stop.id]) return '';
  const L = nearStop(stop.id, 10); if(!L.length) return '';
  const names = [...new Set(L.flatMap(c => c.items.map(x => x.s.key)))];
  const nP = nearPlaces(STOPGEO[stop.id], 10, true).length;
  return `<div class="card"><div class="lbl">✠ Santos cerca de ${esc(stop.name)}</div>
    <h3 class="disp">${names.length} a menos de 10 min</h3>
    <div class="snote" style="margin-top:4px">${names.slice(0, 4).map(esc).join(' · ')}${names.length > 4 ? '…' : ''}</div>
    ${nP ? `<div class="snote">Y ${nP} lugar${nP > 1 ? 'es' : ''} lindo${nP > 1 ? 's' : ''} para improvisar.</div>` : ''}
    <button class="mapbtn" onclick="SANTOS.nearFrom('${stop.id}')">Ver qué hay cerca ›</button></div>`;
}


/* ── ruta a pie o en transporte desde la parada anterior ── */
function route(id){
  const g = STOPGEO[id]; if(!g) return '';
  const day = DAYS.find(d => d.stops.some(x => x.id === id));
  const idx = day.stops.findIndex(x => x.id === id);
  let prev = null;
  for(let k = idx - 1; k >= 0; k--){ if(STOPGEO[day.stops[k].id]){ prev = day.stops[k]; break; } }
  const t = STOPS[id].travel || {};
  const mode = t.mode === 'walk' ? 'walking' : (t.mode === 'car' ? 'driving' : 'transit');
  const dest = g.join(',');
  const url = prev ? `https://www.google.com/maps/dir/?api=1&origin=${STOPGEO[prev.id].join(',')}&destination=${dest}&travelmode=${mode}`
                   : `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=${mode}`;
  const lbl = prev ? `🧭 Ruta desde ${esc(prev.name)}` : '🧭 Ruta desde donde estoy';
  return `<button class="mapbtn" onclick="window.open('${url}','_blank')">${lbl}</button>`;
}

/* ── en el camino entre dos paradas ── */
function segDist(p, a, b){
  const k = Math.cos(a[0]*Math.PI/180) * 111320, kl = 110540;
  const P = [(p[1]-a[1])*k, (p[0]-a[0])*kl], Bv = [(b[1]-a[1])*k, (b[0]-a[0])*kl];
  const L2 = Bv[0]**2 + Bv[1]**2; let t = L2 ? (P[0]*Bv[0] + P[1]*Bv[1]) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(P[0] - t*Bv[0], P[1] - t*Bv[1]);
}
function prevGeoStop(id){
  const day = DAYS.find(d => d.stops.some(x => x.id === id)); if(!day) return null;
  const idx = day.stops.findIndex(x => x.id === id);
  for(let k = idx - 1; k >= 0; k--) if(STOPGEO[day.stops[k].id]) return day.stops[k];
  return null;
}
function legItems(id){
  const b = STOPGEO[id], ps = prevGeoStop(id); if(!b || !ps) return null;
  const a = STOPGEO[ps.id], len = meters(a, b);
  if(len < 150) return null;
  const day = DAYS.find(d => d.stops.some(x => x.id === id));
  const dayG = day.stops.map(x => STOPGEO[x.id]).filter(Boolean);
  const off = (g) => segDist(g, a, b) < 220 && dayG.every(q => meters(g, q) > 120);
  const saved = {...V}; V.city = "all"; V.vis = false; V.star = false; V.oct = false; V.q = "";
  const ch = churches().filter(c => c.geo && off(c.geo));
  Object.assign(V, saved);
  const sts = ch.flatMap(c => c.items.map(x => ({...x, c})))
    .sort((x, y) => x.s.imp - y.s.imp || VORD[x.p.v] - VORD[y.p.v]).slice(0, 4);
  const lg = LUGARES.filter(l => off(l.geo)).sort((x, y) => (y.kids - x.kids) || x.t - y.t).slice(0, 4);
  return {sts, lg, from: ps};
}
function legHTML(id){
  const t = STOPS[id].travel; if(!t || t.mode !== 'walk') return '';
  const L = legItems(id); if(!L || (!L.sts.length && !L.lg.length)) return '';
  const chip = (cls, on, txt) => `<button class="lchip ${cls}" onclick="event.stopPropagation();${on}">${txt}</button>`;
  return `<div class="leg"><span class="legl">En el camino</span>${
    L.sts.map(x => chip('ls', `SANTOS.open('${qk(x.s.key)}','${id}')`, `${MARK[x.s.imp]} ${esc(x.s.key)}`)).join('')}${
    L.lg.map(l => chip('ll', `SANTOS.openLugar('${l.id}','${id}')`, esc(l.n.replace(/ \\(.*\\)$/, '')))).join('')}</div>`;
}
function dayRoute(d){
  const pts = d.stops.filter(s => STOPGEO[s.id]).map(s => STOPGEO[s.id].join(','));
  const uniq = pts.filter((p, i) => i === 0 || p !== pts[i-1]);
  if(uniq.length < 2) return '';
  const url = `https://www.google.com/maps/dir/${uniq.slice(0, 10).join('/')}`;
  return `<div class="pad"><button class="mapbtn salt" onclick="window.open('${url}','_blank')">🗺 Recorrido del día en Google Maps</button></div>`;
}
function openLugar(lid, back){
  const l = LUGARES.find(x => x.id === lid); if(!l) return;
  const g = back && STOPGEO[back], m = g ? meters(g, l.geo) : null;
  const nm = l.n.replace(/ \\(.*\\)$/, '');
  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     ${back ? `<button class="sback" onclick="open_('${back}')">‹ ${esc(STOPS[back].name)}</button>` : ''}
     <h2 class="disp">${esc(l.n)}</h2>
     <div class="kv"><span>${CATN[l.cat] || l.cat}</span><span>${l.t} min</span><span>${esc(l.c)}</span>${m != null ? `<span>${walk(m)} min a pie de ${esc(STOPS[back].name)}</span>` : ''}${l.kids ? '<span class="okc">Lindo con chicos</span>' : ''}</div>
     <div class="sum">${esc(l.d)}</div>
     <details open><summary><span class="t">Datos</span><span class="c">›</span></summary><div class="body">
       <div class="row"><div class="k">Horario</div><div class="v">${esc(l.h)}</div></div>
       <div class="row"><div class="k">Costo</div><div class="v">${esc(l.c)}</div></div></div></details>
     <button class="mapbtn" onclick="window.open('https://www.google.com/maps/dir/?api=1${g ? '&origin=' + g.join(',') : ''}&destination=${l.geo.join(',')}&travelmode=walking','_blank')">🧭 Cómo llegar a pie</button>
     <button class="mapbtn salt" onclick="window.open('${imgURL(nm + ' Roma')}','_blank')">Ver fotos ›</button>`;
  show();
}
/* ── acciones ── */
const api = {
  view, open, stopSection, placesSection, ahoraCard, route, legHTML, dayRoute, openLugar,
  set(k, v){ V[k] = v; render(); },
  flip(k){ V[k] = !V[k]; render(); },
  search(v){ V.q = v; render(); const i = document.getElementById('sq');
    if(i){ i.focus(); i.setSelectionRange(v.length, v.length); } },
  jump(id){ const el = document.getElementById('sz-' + id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },
  pick(v){
    if(!v){ V.ref = null; }
    else if(v[0] === 'R'){ const k = v.slice(2); V.ref = {id:v, label:k, geo:COORD[k]}; }
    else { const id = v.slice(2); V.ref = {id:v, label:STOPS[id].name, geo:STOPGEO[id]}; }
    V.gpsMsg = ''; render();
  },
  gps(){
    if(!navigator.geolocation){ V.gpsMsg = 'Este teléfono no permite usar la ubicación. Elegí un punto de la lista.'; render(); return; }
    V.gpsMsg = 'Buscando tu ubicación…'; render();
    navigator.geolocation.getCurrentPosition(p => {
      V.ref = {id:'gps', label:'tu ubicación', geo:[p.coords.latitude, p.coords.longitude]};
      V.gpsMsg = ''; render();
    }, () => { V.gpsMsg = 'No se pudo obtener tu ubicación. Revisá que el navegador tenga permiso, o elegí un punto de la lista.'; render(); },
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  },
  nearFrom(id){ V.mode = 'cerca'; V.ref = {id:'S|' + id, label:STOPS[id].name, geo:STOPGEO[id]};
    shut(); tab('santos'); },
  star(k, back){ STARS.has(k) ? STARS.delete(k) : STARS.add(k); saveStars();
    const sc = document.querySelector('#sheet .in').scrollTop; open(k, back || undefined);
    document.querySelector('#sheet .in').scrollTop = sc; if(TAB === 'santos') render(); }
};
return api;
})();

/* ══ RENDER ══ */
function render(){
  document.getElementById('view').innerHTML =
    TAB === 'ahora' ? viewAhora() :
    TAB === 'dia'   ? viewDia()   :
    TAB === 'guia'  ? viewGuia()  :
    TAB === 'santos' ? SANTOS.view() : viewInfo();
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === TAB));
  if(TAB === 'ahora') loadWx();
}
function tab(t){ TAB = t; document.getElementById('view').scrollTop = 0; render(); }

function net(){
  const e = document.getElementById('net');
  const on = navigator.onLine;
  e.textContent = on ? 'EN LÍNEA' : 'SIN DATOS · OK';
  e.className = 'net' + (on ? '' : ' off');
}
addEventListener('online', net); addEventListener('offline', net);

/* ══ PORTÓN ══ */
const GKEY = 68829258;
function gh(s){ let v = 5381; for(const c of s){ v = ((v*33) ^ c.codePointAt(0)) >>> 0; } return v; }
function tryGate(){
  const i = document.getElementById('gpass');
  if(gh(i.value.trim().toLowerCase()) === GKEY){
    localStorage.setItem('rome2026:auth', String(GKEY)); enter();
  } else {
    document.getElementById('gerr').textContent = 'Esa no es la clave.';
    i.value = ''; i.focus();
  }
}
function enter(){
  const g = document.getElementById('gate'); if(g) g.remove();
  document.getElementById('app').classList.add('on');
  let n = localStorage.getItem('rome2026:name');
  if(!n){
    n = (prompt('¿Cómo te llamás?') || '').trim();
    if(n) localStorage.setItem('rome2026:name', n);
  }
  document.getElementById('who').textContent = n || 'Peregrino';
  net(); render();
}
if(localStorage.getItem('rome2026:auth') === String(GKEY)) enter();
else document.getElementById('gpass')
  .addEventListener('keydown', e => { if(e.key === 'Enter') tryGate(); });

if('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
