o opuesto, se les entregaba una túnica blanca que llevarían toda la semana, y entraban a la basílica a participar por primera vez de la Eucaristía. Bajar por un lado y salir por el otro era parte del signo: se entra de una manera y se sale de otra.\n\n## Las capillas\n\nAlrededor del octógono se abren cuatro capillas, agregadas en distintos siglos.\n\nLa de **San Juan Evangelista** conserva un mosaico del siglo V en la bóveda: sobre fondo de oro, un cordero rodeado de follajes verdes, flores y pájaros. Es de una delicadeza que sorprende, y está prácticamente intacto.\n\nLa de **San Venancio** es del siglo VII y tiene mosaicos con los santos mártires de Dalmacia, de figuras rígidas y frontales, en un estilo ya bizantino que contrasta con el anterior. Los dos mosaicos, uno al lado del otro, muestran cómo cambió el arte cristiano en doscientos años.\n\n## La visita\n\nEs gratis y son veinte minutos. **Ojo con el horario:** abre de 7:00 a 12:30 y reabre recién a las 16:00. Muchos grupos llegan a Letrán a media tarde y lo encuentran cerrado.", "src": "propio", "zone": "Letrán"}, {"time": "13:10", "name": "Almuerzo cerca de Letrán", "tag": "food", "type": "food", "dur": 100, "quick": "Zona San Giovanni, tranquila y barata.", "logi": {"Costo adultos": "€12 a €20", "Costo niños": "€7 a €10"}, "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Via di San Giovanni in Laterano y las calles hacia el Celio tienen trattorias a buen precio."}, "id": "s36", "day": "13", "pri": 3}, {"time": "15:00", "name": "San Clemente", "tag": "site", "type": "site", "dur": 35, "quick": "Tres niveles de historia: la basílica del siglo XII, la del IV y un templo de Mitra abajo.", "hist": "Basílica del siglo XII sobre otra del siglo IV, y esa sobre una casa romana con un templo de Mitra. Se baja mil años por cada escalera.", "travel": {"mode": "walk", "dur": 12, "costAd": "Gratis", "costCh": "Gratis", "how": "Por Via di San Giovanni in Laterano, recta hacia el Coliseo: San Clemente queda a mitad de camino, a la derecha.", "tip": "Abre a la tarde a las 15:00. La basílica de abajo tiene entrada aparte."}, "full": "## Tres iglesias, una sobre otra\n\nSe levanta sobre una iglesia del s. IV, dedicada a **San Clemente**, cuarto Romano Pontífice de la Iglesia, que a su vez había sido edificada sobre una casa romana que se dice que perteneció al santo. Fue destruida en 1084 y reconstruida en el mismo sitio por Pascual II en 1108. Este santo murió en el exilio en Crimea y sus restos fueron traídos a Roma por los santos Cirilo y Metodio. El interior conserva la planta original del s. XII, con una nave principal y dos laterales. La unidad de estilo, sin embargo, viene rota por la decoración barroca (frescos del techo y las paredes). correspondientes al s. XIII.\n\n## La basílica de arriba\n\nSon especialmente interesantes los trabajos de mármol; por ejemplo, la schola cantorum de la nave principal, algunos restos de la primera basílica. con su pavimento cosmatesco, y los ambones del s. XII. La balaustrada que separa el coro del presbiterio corresponde a la basílica primitiva y data del s. VI. Bajo el altar mayor están las reliquias de San Clemente I, papa y un brazo de S. Ignacio de Antioquía, martirizado en el cercano Coliseo. En la iglesia subterránea está enterrado S. Cirilo (+ 869), apóstol de los eslavos. El mosaico del ábside es del s. XII y representa la exaltación de la Santa Cruz.\n\nEs una cruz “staurotesca”, es decir, que contiene fragmentos de la verdadera cruz de Cristo. Las doce palomas simbolizan a los Apóstoles; a los flancos, la Virgen y San Juan. En la parte alta, el Paraíso, con Dios Padre que sostiene la corona de Jesús. Debajo de la Cruz, un grupo de ciervos, símbolo de los catecúmenos, acude a saciar su sed en la verdad cristiana. Más abajo, en el\n\nábside, un rebaño de ovejas abandonan Jerusalén, imagen de la Antigua Ley, y se dirigen a adorar al Cordero. Sobre el arco, los profetas Jeremías e Isaías proclaman el triunfo de Cristo, que está rodeado por los símbolos de los Evangelistas; entre Cristo y los Profetas se encuentran San Clemente (en la barca con **San Pedro**) y **San Lorenzo** (acompañado por San Pablo). En la nave izquierda, en la parte más cercana al pórtico, se halla la Capilla de Santa Catalina.\n\n## La capilla de Santa Catalina\n\nLos frescos de **Masolino** da Panicale (1383–1447), representan a San Cristóbal llevando a Jesús (a la izquierda de la arcada); episodios de la vida de **Santa Catalina** de Alejandría (pared de la izquierda); la Crucifixión (pared del fondo); y particulares de la vida de San Ambrosio (pared de la derecha, algo dañada), obispo de Milán que animó al emperador Graciano hacia el año 380 a renunciar al título de Pontifex Maximus y a clausurar en Roma el altar de la victoria donde todavía se ofrecían sacrificios idolátricos.\n\n## El nivel del siglo IV\n\nEn la nave de la derecha, a un lado de la Sacristía, se encuentra la escalera que conduce a las excavaciones de la basílica primitiva (s. IV). Tiene una planta típicamente basilical con nártex (espacio cubierto, entre el atrio y la nave), una nave central y dos laterales y un ábside. Un muro de carga, que soporta la basílica superior, divide la nave central en dos partes. Especialmente interesantes son los frescos.\n\nLos del nártex datan de los s. XI y XII, y otros son más antiguos. En la nave se encuentran algunos que llaman la atención por su buen estado de conservación y por la viveza de las escenas: Sisinius, prefecto de Roma, acude a arrestar a su mujer porque asistía a una Misa clandestina celebrada por el Papa San Clemente, pero quedó ciego, al igual que sus sirvientes, y cargaron una columna pensando que era la esposa de Sisinius. El fresco es particularmente célebre porque contiene algunas de las primerísimas frases en italiano, muy valiosas para el estudio de la formación del italiano romance.\n\n## El mitreo\n\nA la izquierda del ábside de la basílica antigua, se encuentran unas escaleras que conducen a los restos de dos casas construidas en la época de la República. La que se encuentra bajo el ábside, que data del s. III, estaba provista de un Mithraeum, pequeño templo dedicado al culto del dios Mitra. Se accede salvando unos antiguos peldaños, hasta llegar a dos bancos de piedra, donde se sentaban los iniciados. La estatua del dios sol fue colocada al fondo; en el centro se encuentra el altar. que muestra a Mitra cortando la lengua del toro, mientras el perro, la serpiente y el escorpión –símbolos del mal–tratan de evitar el sacrificio.", "logi": {"Horario": "9:00 a 12:30 y 15:00 a 18:00", "Costo": "Iglesia superior gratis · excavaciones €10", "No permitido": "Cochecitos en los niveles inferiores", "Sobre el horario": "Excavaciones €10 adultos, €5 niños. Sin cochecitos en los niveles inferiores."}, "map": "Basilica di San Clemente, Roma", "id": "s58", "day": "13", "hrs": {"open": [[540, 750], [900, 1080]], "closed": []}, "hv": false, "pri": 1, "src": "fuentes", "ver": ["La **schola cantorum** de mármol en la nave, rescatada de la iglesia anterior.", "El **mosaico del ábside**: la cruz como árbol de la vida, con volutas verdes que se comen todo el fondo dorado.", "La tumba de **San Clemente**, cuyos restos trajeron desde Crimea los santos Cirilo y Metodio.", "Un nivel más abajo, la iglesia del siglo IV con frescos de la vida del santo.", "Abajo de todo, el **mitreo** romano. Se escucha correr un manantial que sigue ahí."], "zone": "Roma antigua"}, {"time": "15:40", "name": "Coliseo", "tag": "site", "type": "site", "dur": 110, "quick": "Entrada 16:00, estar 15:40. Full Experience Arena: primer y segundo nivel, y la arena.", "hist": "Inaugurado por Tito en el año 80 con cien días de juegos. Cabían más de cincuenta mil espectadores.", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Seguir Via di San Giovanni in Laterano hasta el final: desemboca en la Piazza del Colosseo. La entrada 1 está del lado de la plaza.", "tip": "Salir de San Clemente 15:30 a más tardar."}, "full": "## El anfiteatro Flavio\n\nEntre el Esquilino, el Celio y el Palatino, se yergue el Anfiteatro Flavio, llamado comúnmente Coliseo, el monumento más representativo de la Roma clásica, iniciado por **Vespasiano** en el 72 d. C., en el lugar donde antaño surgiera el lago artificial de la neroniana Domus Aurea. Se cuenta que lo construyó un tal Gaudencio, pobre hombre que no gozó mucho tiempo de su trabajo: terminó ahí dentro, ad bestias. Se inauguró en el año 80, bajo **Tito**, con fastuosas fiestas y espectáculos que, según el poeta Marcial, se prolongaron durante cien días.\n\nCompletado en algunas partes por **Domiciano** y restaurado por Septimio Severo, durante muchos siglos el Coliseo vino a ser el símbolo de la grandeza y de la potencia de Roma. En él se celebraron especialmente continuos combates entre gladiadores, quizá el espectáculo más apreciado por el pueblo romano. Las luchas entre gladiadores terminaron hacia el año 404, mientras que aquellas entre animales continuaron hasta el s. VI.\n\n## Ruina y saqueo\n\nGraves terremotos dañaron muchas veces el anfiteatro; más tarde las familias romanas de los Frangipani y de los Anibaldi lo hicieron su fortaleza. hasta que en el 1312, por orden de Arrigo VII el Coliseo volvió a ser propiedad del pueblo romano.\n\nDurante los siglos sucesivos inició su decadencia; enormes bloques de travertino fueron sacados y utilizados para otras construcciones; finalmente, en 1750, Benedicto XIV lo declaró lugar santo, por haber sido teatro del martirio de los cristianos, evitando así posteriores expolios; una cruz negra, de madera, conmemora la fe y la fortaleza de los mártires que dieron en este lugar su vida por el nombre de Cristo; entre estos cabe citar a San Ignacio, obispo de Antioquía y discípulo de San Juan, enviado a las fieras bajo **Trajano** (98–117).\n\n## Cómo está hecho\n\nEl anfiteatro es de forma elíptica, de 188 metros por 156, y tiene una altura de 57 metros. Las obras de construcción duraron más de diez años. La estructura exterior es de travertino, y está distribuida en 4 pisos. Los bloques de la base de los pilares son de dos metros cúbicos cada uno y pesan 5 toneladas. Los tres primeros pisos están formados por 80 arcos de medio punto, divididos por pilastras en las que están adosadas semicolumnas que siguen la secuencia canónica de los estilos: el primer piso de estilo dórico; el segundo de estilo jónico, y el tercero corintio.\n\nEl cuarto piso es de pared llena con pilastras corintias salientes de la pared y con pequeñas ventanas. En la cornisa que remata la obra, se pueden ver todavía los orificios donde se introducían los palos que sujetaban el toldo, con el que se protegía del sol a los espectadores, operación que llevaban a cabo los marineros de la flota imperial del Miseno.\n\nA cada arco de la planta baja le correspondía un acceso al correspondiente sector del anfiteatro, 76 de esos ingresos estaban numerados (son visibles todavía los números romanos sobre los arcos); los cuatro principales estaban reservados: uno a la corte imperial, uno a las vestales, uno a los magistrados y el cuarto a los huéspedes de honor.\n\nTodos los arcos del segundo y tercer piso estaban adornados con estatuas, hoy perdidas. Cuando en la Edad Media, el Coliseo se convirtió en una enorme mina de material para la construcción, le fueron extirpadas todas las grapas metálicas de sutura entre los bloques de travertino, originando innumerables agujeros aún hoy visibles. En la explanada que había delante del anfiteatro se erguía la estatua de **Nerón**, de bronce dorado, de casi 30 metros de altura. El anfiteatro tenía cabida para unos 50.000 espectadores, que se distribuían en las gradas según la clase social.\n\n## Dónde se sentaba cada uno\n\nExistían tres órdenes de puestos: podium, era el primer Orden, reservado a las clases más elevadas y al palco del Emperador; el orden central acogía a los ciudadanos que pertenecían a la clase media; y el último orden, la suma, era el destinado al pueblo. Todo el piso, formado de tablas de madera, estaba cubierto de arena; alrededor había una red para proteger a los espectadores. Debajo de la arena existía un sistema de celdas, galerías, almacenes, camarines y subterráneos, que hoy son visibles gracias a las excavaciones.\n\n## Los juegos\n\nLos principales espectáculos eran los ludi (luchas) de los gladiadores y las cazas de fieras, pero en la arena se efectuaban, también, exhibiciones de malabaristas, competiciones atléticas, torneos a caballo y naumaquias simulacros de batallas navales. Un martirio insigne in Amphitheatrum Un ejemplo conmovedor de cómo afrontaban el martirio los primeros cristianos nos lo ha dejado **San Ignacio de Antioquía**, muerto en tiempos del emperador Trajano. Convertido del paganismo, Ignacio fue el segundo sucesor de **San Pedro** en la sede episcopal de Antioquía.\n\n## San Ignacio de Antioquía\n\nEl año 107 fue detenido, condenado adbelvas -a las fieras- y enviado a Roma bajo custodia militar para cumplir allí su pena. Del largo viaje desde Siria a la capital del Imperio conocemos bastantes detalles por el historiador Eusebio de Cesarea y, sobre todo, gracias a las siete cartas que el mismo San Ignacio escribió a las Iglesias de otras tantas ciudades para fortalecerles en la fe y prevenirles ante las herejías gnósticas, que por entonces empezaban a extenderse.\n\nTodas las cartas empiezan con el saludo de Ignacio, llamado también Teoforo, portador de Dios. Muy lleno de Dios iba San Ignacio, como refleja el tono de gozo que tienen sus cartas. Las razones de su felicidad eran totalmente sobrenaturales, ya que el futuro mártir conocía lo que le aguardaba; y los esbirros que le conducían no destacaban precisamente por su delicadeza: “desde Siria hasta Roma, escribe, voy luchando con las fieras, por tierra y mar, de día y de noche, encadenado a diez leopardos, esto es, a un pelotón de soldados.\n\nÉstos, a pesar del bien que reciben, se hacen peores. Con sus malos tratos voy siendo más discípulo (de Cristo)”. San Ignacio se gozaba de compartir la Cruz de Jesús, y tenía el deseo ardiente de que su identificación con Nuestro Señor se completase con el martirio. Por eso, ruega a los cristianos que no intercedan por él ante las autoridades y expresa su deseo de que las fieras se lancen a devorarle rápidamente: “no me vaya a suceder, dice, como algunos a los que, acobardadas, no tocaron”.\n\n## Los mártires\n\nEran famosos algunos casos en que los animales hambrientos no habían atacado a los cristianos o incluso se habían echado mansamente a sus pies, ante el asombro de los espectadores. Según antiguas tradiciones, así sucedió a Santa Martina, San Alejandro y San Marino, entre otros santos. El obispo de Antioquía fue arrojado a los leones in Amphitheatrum. Así vio cumplido su anhelo: “Soy trigo de Dios, y es preciso que sea molido por los dientes de las fieras, para convertirme en pan inmaculado de Cristo”.\n\nDespués del horrible espectáculo, los cristianos lograron rescatar algunos huesos del mártir, los custodiaron con veneración y más tarde los enviaron a Antioquía: vosotros habéis gozado de su episcopado -decía San Juan Crisóstomo a los fieles de la ciudad siria- y los romanos han admirado su martirio. El Señor os ha quitado por poco tiempo este precioso tesoro para mostrarlo a los romanos, y os lo ha devuelto con gloria mayor. En el siglo VII, sin embargo, a causa de las invasiones sarracenas, las reliquias fueron trasladadas de nuevo a Roma, y hoy reposan en la iglesia de **San Clemente**. Allí se puede acudir ahora para, siguiendo un consejo del Crisóstomo, sacar frutos espirituales de estos sagrados restos, ya que son como un tesoro del que se puede tomar parte sin que nunca se agote.", "logi": {"Costo": "Entradas ya compradas", "Turno": "Martes 13, 16:00 · llegar 15:40", "Entrada": "1 · Piazza del Colosseo, lado Valadier", "Incluye": "Primer y segundo nivel, y la arena", "No incluye": "Subterráneos ni ático", "Visita": "Hasta 90 minutos, recorrido de un solo sentido", "Baños": "Solo al principio del recorrido", "Llevar": "Entrada y documento de cada uno", "No permitido": "Mochilas grandes, valijas, botellas de vidrio"}, "map": "Colosseo, Roma", "id": "s57", "day": "13", "hrs": {"open": [[510, 1110]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **cruz** en el borde de la arena, donde el Papa reza el Vía Crucis del Viernes Santo.", "Los **subterráneos** al descubierto: los pasillos y jaulas por donde subían las fieras.", "El **Arco de Constantino** al lado, del 315, levantado tras la victoria del Puente Milvio.", "Los tres órdenes de arcadas de la fachada: dórico, jónico y corintio, de abajo hacia arriba."], "zone": "Roma antigua"}, {"time": "17:40", "name": "Vuelta al departamento", "tag": "rest", "type": "rest", "quick": "Si a la tarde el grupo está fundido, se corta después del Foro y el Campidoglio queda para otro día.", "travel": {"mode": "metro", "dur": 35, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Línea B desde Colosseo hasta Termini, línea A dirección Battistini hasta Ottaviano.", "tip": "Si están muy cansados, taxi desde Via dei Fori Imperiales."}, "id": "s63", "day": "13", "pri": 3}]}, {"date": "2026-10-14", "phase": 1, "weekday": "Mié", "dd": "14", "title": "Castel Sant'Angelo · Scavi", "note": "Mañana tranquila cerca de casa y la Necrópolis a las 13:45: estar 13:25 en el Ufficio Scavi.", "stops": [{"time": "09:30", "name": "Ponte y Castel Sant'Angelo", "tag": "site", "type": "site", "dur": 90, "quick": "Los ángeles de Bernini sobre el Tíber al atardecer. Por fuera, sin entrar.", "hist": "Erigido por Adriano (139 d.C.) como mausoleo imperial, luego fortaleza y refugio de los Papas, conectado al Vaticano por el Passetto.", "travel": {"mode": "walk", "dur": 15, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde el departamento, ir hasta Piazza San Pietro y caminar Via della Conciliazione hasta el río. El castillo está al final, a la izquierda.", "tip": "Abre a las 9:00."}, "full": "## El mausoleo de Adriano\n\nFortaleza mandada construir por **Adriano** como sepulcro familiar. Fue iniciado por el emperador\nen el año 135 d.C., y terminado cuatro años más tarde por su hijo adoptivo y sucesor en el trono\nimperial, Antonio Pío. La base, de 84 m2, está cerrada por un tambor de 20 m de alto. Estaba coronado por una estrella\ndel emperador y una cuadriga de bronce. El mausoleo contiene las urnas con las cenizas de todos los\nemperadores desde Adriano hasta Septimio Severo (211 d.C.). Cuando Aureliano amuralló la ciudad, en el 270, colocó el mausoleo como parte de la muralla y\nlo convirtió en fortaleza.\n\n## El ángel de la peste\n\nEn 590 el Papa Gregorio Magno encabezó una procesión contra la peste que diezmaba la ciudad. Al pasar delante de Castell Sant'Angelo, encima del mausoleo apareció un ángel que blandía su\nespada, que fue interpretado como un signo de que sería abatida la peste. En agradecimiento, el Papa\nmandó construir una capilla en el mausoleo y colocar un San Miguel de bronce en el punto más alto. Durante los conflictos medievales entre el papado y la nobleza romana, el edificio se convirtió en\nfortaleza.\n\n## La fortaleza de los papas\n\nNicolás V (1447–55) construyó unos pertrechos de ladrillo en la parte alta de la\nconstrucción original, y añadió torretas en las esquinas. El alto muro defensivo –Passetto– construido por León IV (847–55), unía el castillo con el\nPalacio Vaticano. Alejandro VI creó un pasaje a lo largo de la parte alta del muro, de manera que el\nPapa pudiera llegar fácilmente a la fortaleza, en caso de asedio. En 1527 Clemente VII se refugió de las tropas de Carlos V, e hizo habitables varias estancias,\nque fueron mejoradas por Paulo III.\n\nDespués de la unificación de Italia, se instalaron unas barracas y\nuna prisión militar. Desde fuera, Castel Sant'Angelo aparece como una sólida masa compacta: una cinta cuadrada en\nla base, reforzada en las esquinas por los bastiones de San Mateo, San Juan, San Marcos y San\nLucas. La construcción original del mausoleo se distingue de los añadidos por los grandes bloques\nde travertino y peperino. En la parte media, encima de la construcción romana, el gran cilindro\n\nconstruido por Benedicto IX (1033–44) y completado en alto por la bella cortina de Alejandro VI.\nAún más arriba, la construcción renacentista de los apartamentos papales.\n\n## Por dentro\n\nCastel Sant'Angelo albergaba en su interior el Museo Nacional Militar. Entre sus salas hay que\ndestacar: El Cortile dell'Angelo, donde se encuentra el ángel de mármol que coronaba la\nconstrucción antes del actual de bronce, obra de Raffaelo da Montelupo; los Apartamentos Papales,\nmandados adaptar por Paulo III.\n\nEl primero es la Sala Paulina o del Consejo, donde esperaban los\nvisitantes para ser recibidos por el Papa; en el techo, estucos de Girolamo da Sermoneta y de Braccio\nde Montelupo; la decoración de las paredes es obra de Perin del Vaga y de sus discípulos, y de\nPellegrino Tibaldi: se trata de escenas de la historia de Roma y de la vida de Alejandro Magno. Sigue la Cámara de Perseo; en las paredes están una Piedad, de un anónimo ferrarense del s.XVI.\ndos Cristos, de Paris Bordone y Sebastiano del Piombo respectivamente y un busto de Paulo III,\ncopia del de Guglielmo della Porta, ahora en Nápoles. Desde la terraza, hay una buena vista.\n\nEn la parte más alta, la gran terraza coronada por la ESTATUA DE BRONCE DE SAN\nMIGUEL. Esto evoca un episodio del año 590: el papa San Gregorio encabezaba una procesión\npara rogar que cesara la peste que diezmaba la ciudad. En lo alto del castillo apareció\nrepentinamente un ángel que enfundaba de nuevo su espada en la vaina. Este gesto fue interpretado\ncomo una señal que aunciaba el fin de la epidemia; en agradecimiento a esta señal, el Papa construyó\nuna capilla sobre el mausoleo.", "map": "Castel Sant'Angelo", "id": "s9", "day": "14", "pri": 2, "src": "fuentes", "ver": ["Los **diez ángeles de Bernini** sobre el puente, cada uno con un instrumento de la Pasión.", "El **Passetto di Borgo**, el corredor amurallado que une el castillo con el Vaticano.", "La silueta del castillo al atardecer, desde el medio del puente."], "zone": "Vaticano y Prati"}, {"id": "s76", "tag": "site", "type": "site", "time": "11:15", "dur": 30, "pri": 1, "name": "Santo Spirito in Sassia", "zone": "Vaticano y Prati", "quick": "Santuario de la Divina Misericordia, a dos cuadras de San Pedro.", "hist": "Iglesia del antiguo hospital de los peregrinos sajones, reconstruida en el siglo XVI. Desde 1994 es el santuario de la Divina Misericordia en Roma: aquí se venera la imagen de Jesús Misericordioso y una reliquia de Santa Faustina Kowalska.", "ver": ["La capilla de la **Divina Misericordia**, a la derecha, con la imagen de Jesús Misericordioso.", "La **reliquia de Santa Faustina Kowalska**.", "A las 15:00 se reza la **Coronilla de la Misericordia**."], "logi": {"Horario": "Aprox. 7:00 a 12:00 y 15:00 a 19:00 · verificar", "Costo": "Gratis"}, "hrs": {"open": [[420, 720], [900, 1140]], "closed": []}, "hv": false, "map": "Chiesa di Santo Spirito in Sassia, Roma", "src": "propio", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde el castillo, volver por el Lungotevere hacia San Pedro y entrar por Borgo Santo Spirito: la iglesia está a la izquierda, antes de la columnata."}, "day": "14"}, {"time": "12:00", "name": "Almuerzo en Borgo Pio", "tag": "food", "type": "food", "dur": 75, "quick": "Sin alejarse: a las 13:25 hay que estar en el Ufficio Scavi.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Santo Spirito, cruzar Via della Conciliazione y entrar a Borgo Pio."}, "logi": {"Costo adultos": "€15 a €25", "Costo niños": "€8 a €12"}, "id": "s21", "day": "14", "pri": 3}, {"time": "13:25", "name": "Ufficio Scavi", "tag": "r MfBVlUgvVf/XJcbum7O3u/pVP7jTDUZoEFFlikw7xmmP/M78heZqP7n2XsgjVS8MCeqf8MMWW9w89yVWJCvgjDO8Ky3rAAwkrWAgiexbPu61kzy37bfXzPFJBKYqHnM3xdD8En+0gHsMACi4F1haxDrD6pvWZl144h47Da4qO+qKbvMnFY3moQeeMw9LqjgQeLfciUbugN5xvkWFXQdzb/kefAavrJRBZmQITZMUSbBRZYYDGwdkmHdRNDKtu3Fpb9ttXB+KAUzxKGYIEFFljs2B4nXScK/+0qaHqJycDc15nRneaNP6lLjt7biK0efhKGYN0CVoI1286D9e7SIa4XW3GmA+/WWcfTOiY2dY3FVGzqqs0CCyyw3sMSrEWqefssmmOVkB0qadm+as0xn4pY5FnaLLDAAgsstn1055wcSs+c0i8USsdPt8Fq1qFvJKgl1CpJtCxc7fph+CrJ5pfZ1wEsnsWzeNbHeWt3Bk6OQse/XFfMw8rVcbds8kueEvsUPFhggQUWWGzm08gT6iuPuu/Sh/x60hirlQTPEoZggQUWWOzH6jfzPZaXqFkkhxGGYIEFFlhgMbDAAgsssMBiYIEFFlhggcXAAgsssMACi4EFFlivY38B62Eu6vGkiiAAAAAASUVORK5CYII="}, {"time": "13:45", "name": "Tour Scavi", "tag": "site", "type": "site", "dur": 90, "quick": "La necrópolis bajo la basílica hasta la tumba de San Pedro.", "hist": "Bajo el altar mayor de San Pedro se conserva una necrópolis romana del siglo I, sepultada por Constantino al levantar la primera basílica. Las excavaciones de Pío XII, entre 1939 y 1949, sacaron a la luz el trofeo de Gayo y, detrás, los huesos que Pablo VI reconoció en 1968 como los del Apóstol.", "full": "Bajo el altar mayor de la basílica, doce metros por debajo del piso que pisan los peregrinos, hay una calle de tumbas romanas del siglo I que estuvo enterrada mil seiscientos años. Es la única visita del viaje que hay que reservar con meses de anticipación, y es la que más cuesta conseguir.\n\n## Cómo se conservó\n\nLa ladera del Vaticano, fuera de las murallas y al costado del circo de **Nerón**, era zona de cementerios. Por ley romana no se podía enterrar dentro de la ciudad, así que los muertos iban al borde de los caminos, y acá se armó una necrópolis con mausoleos familiares de ladrillo, uno pegado al otro, a los dos lados de una calle en pendiente. Era un cementerio de clase media acomodada: libertos enriquecidos, comerciantes, funcionarios.\n\nHacia el año 320 **Constantino** decidió levantar una basílica sobre la tumba del Apóstol. El terreno estaba en pendiente y hacía falta una plataforma plana, así que se cortó la colina de un lado y se rellenó del otro. Los mausoleos quedaron sepultados bajo miles de metros cúbicos de tierra, con los techos derribados pero las paredes en pie.\n\nNadie construye así por comodidad: nivelar esa ladera fue mucho más caro y difícil que levantar la basílica cien metros más allá, en terreno llano. Que **Constantino** haya insistido en ese punto exacto es, para los arqueólogos, el argumento más fuerte de que ahí había algo que no se podía mover.\n\n## Las excavaciones\n\nEn 1939 murió Pío XI y pidió ser enterrado en las Grutas. Al abrir el piso para la tumba, los obreros se toparon con estructuras antiguas. **Pío XII** ordenó excavar en secreto, y los trabajos duraron diez años, de 1940 a 1949, en plena guerra.\n\nEn 1950 el papa anunció por radio que se había encontrado la tumba de Pedro. Pero faltaba lo principal: no aparecían los restos. Recién en 1952 la epigrafista **Margherita Guarducci** empezó a estudiar los grafitos del llamado Muro G y descifró un sistema de abreviaturas cristianas. Encontró la fórmula *PETR ENI* — «Pedro está aquí dentro».\n\nLos huesos habían aparecido años antes en un hueco de ese muro, pero se habían guardado en una caja sin estudiar. Cuando finalmente se analizaron, resultaron ser de un varón de contextura robusta, muerto entre los sesenta y los setenta años, envuelto en tela de púrpura con hilos de oro, y sin los huesos de los pies. En 1968 **Pablo VI** anunció que los restos habían sido identificados de manera convincente.\n\n## El recorrido\n\nSe baja en grupos de doce como máximo, con guía. El aire está climatizado para proteger los frescos y hay bastante humedad.\n\nSe avanza por la vía funeraria antigua, entre mausoleos que conservan estucos, frescos y mosaicos en su lugar original. Se pasa por el **mausoleo de los Julios**, donde está el mosaico de Cristo representado como Sol Invicto guiando el carro entre parras: es la imagen cristiana más antigua conservada en el Vaticano, de mediados del siglo III.\n\nAl final está el Campo P, y en él el **trofeo de Gayo**: el pequeño monumento con columnas que un sacerdote romano llamado Gayo describía ya hacia el año 200 como la señal visible de la tumba del Apóstol. Junto a él, el Muro Rojo y el Muro G cubierto de grafitos de peregrinos.\n\nEl recorrido termina exactamente debajo del altar papal, en el eje vertical que une la tumba, **la Confesión** y la cúpula de **Miguel Ángel**. Es el único punto de la basílica donde se entiende de una sola mirada por qué San Pedro está donde está.\n\n## Lo práctico\n\nUna hora exacta. Edad mínima quince años, sin excepciones. No se permiten fotos, bolsos grandes ni cochecitos. Hombros y rodillas cubiertos. Los pasillos son angostos y hay escaleras: no se recomienda a quien tenga claustrofobia.\n\nSe sale adentro de la basílica, junto a las Grutas, lo que permite encadenar las dos visitas.", "logi": {"Duración": "Alrededor de 1 hora y media", "Ambiente": "~24 °C y humedad alta, pasillos angostos", "No permitido": "Fotos, bolsos grandes, cochecitos", "Salida": "Adentro de la basílica, junto a las Grutas"}, "map": "Necropoli Vaticana", "fullSource": "Redacción propia sobre las excavaciones vaticanas", "travel": {"mode": "walk", "dur": 2, "costAd": "Gratis", "costCh": "Gratis", "how": "El guía retira al grupo en el mismo Ufficio Scavi y baja con él a la necrópolis."}, "id": "s24", "day": "14", "pri": 1, "src": "propio", "ver": ["El **mosaico de Cristo como Sol Invicto** en el mausoleo de los Julios: la imagen cristiana más antigua del Vaticano.", "La calle de mausoleos paganos, con estucos y frescos en su lugar original.", "El **trofeo de Gayo**, el monumento que hacia el año 200 ya marcaba la tumba.", "El **Muro G**, cubierto de grafitos de peregrinos, donde aparecieron los huesos.", "El punto final del recorrido: exactamente debajo del altar papal."], "zone": "Vaticano y Prati"}, {"time": "13:45", "name": "Mientras tanto: Mercato Trionfale", "tag": "food", "type": "food", "dur": 75, "quick": "Para los que no bajan a la necrópolis. Mercado cubierto enorme, muy romano y cómodo con chicos.", "hist": "Uno de los mercados cubiertos más grandes de Roma, en funcionamiento desde hace más de un siglo.", "logi": {"Horario": "7:00 a 15:00", "A pie": "12 min desde la plaza", "Sobre el horario": "Cerrado los domingos."}, "map": "Mercato Trionfale, Roma", "travel": {"mode": "walk", "dur": 15, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde la Piazza San Pietro, subir por Via di Porta Angelica hasta Piazza Risorgimento y seguir por Via Andrea Doria."}, "id": "s25", "day": "14", "hrs": {"open": [[420, 900]], "closed": [0]}, "hv": false, "pri": 2, "full": "Es uno de los mercados cubiertos más grandes de Roma y el más antiguo de los que siguen funcionando. Está a doce minutos a pie de la Plaza de **San Pedro** y es el mejor plan para el resto del grupo mientras los cinco están abajo, en el Scavi.\n\n## Historia\n\nNació en 1890 como feria al aire libre sobre Via Andrea Doria, cuando Prati todavía era campo abierto entre el Vaticano y el Tíber. El barrio se estaba trazando entonces, con sus calles anchas en cuadrícula, y el mercado se armó para abastecer a las familias que llegaban.\n\nDurante más de un siglo funcionó a la intemperie, con los puestos armándose y desarmándose cada día. En 2009 se mudó al edificio actual, de dos niveles, con cámaras frigoríficas y todo lo que pide la normativa moderna. Muchos temieron que perdiera el alma en la mudanza; los puestos y las familias que los atienden son los mismos, y varios llevan tres o cuatro generaciones.\n\n## Qué hay\n\nMás de doscientos setenta puestos. Verdulerías con la producción del Agro Romano, pescaderías que se abastecen en Fiumicino, carnicerías, quesos del Lacio y de Cerdeña, embutidos, panaderías, especias, flores. Y varios puestos de comida preparada donde se almuerza mucho mejor y bastante más barato que en cualquier restaurante de la zona del Vaticano.\n\nEn octubre están de temporada la **alcachofa romanesca**, que es la variedad redonda y sin espinas con la que se hacen los *carciofi alla romana*; la uva fresca; las castañas; los primeros porcini; y las *puntarelle*, esos brotes de achicoria que en Roma se comen con una salsa de anchoas y ajo.\n\n## Por qué vale la pena\n\nEs de los pocos lugares del barrio donde todavía se ve Roma funcionando en vez de Roma mostrándose. Se escucha regatear en romanesco, las señoras del barrio hacen la cola de siempre, y nadie intenta venderte nada.\n\nCon chicos funciona bien: es cubierto, es plano, hay lugar para el cochecito, y siempre aparece un puestero que les regala una fruta. Buen lugar para comprar la merienda del día, agua, y algo para llevar al departamento.\n\n## Lo práctico\n\nAbre de mañana y cierra alrededor de las tres. Cerrado los domingos. Se llega subiendo desde la Plaza de San Pedro por Via di Porta Angelica hasta Piazza Risorgimento, y de ahí por Via Andrea Doria: el mercado ocupa una manzana entera y está señalizado. Casi todos los puestos son solo efectivo.", "src": "propio", "ver": ["Los puestos de quesos y embutidos del sector cubierto.", "Las verdulerías: en octubre está la alcachofa romanesca y la uva fresca.", "Buen lugar para comprar la merienda de las nenas."], "zone": "Vaticano y Prati"}, {"time": "15:30", "name": "Tarde libre", "tag": "rest", "type": "rest", "quick": "Todos juntos de nuevo. Descanso o paseo por el Borgo.", "travel": {"mode": "walk", "dur": 12, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde la salida de la necrópolis, dentro de la basílica, salir a la plaza y volver por Via di Porta Cavalleggeri."}, "id": "s32", "day": "14", "pri": 3}]}, {"date": "2026-10-15", "phase": 1, "weekday": "Jue", "dd": "15", "title": "Vía Apia", "note": "Solo la mañana. Tarde y noche libres: es el aniversario de Pablo y Maira, y la fiesta de Santa Teresa de Ávila.", "stops": [{"time": "08:30", "name": "Salida hacia la Appia", "tag": "rest", "type": "rest", "dur": 45, "quick": "Vans o taxis. En transporte público este tramo es incómodo.", "logi": {"Distancia": "9 km al sur", "Alternativa": "Metro B hasta Circo Massimo y bus 118"}, "id": "s41", "day": "15", "pri": 3}, {"time": "09:15", "name": "Domine Quo Vadis", "tag": "site", "type": "site", "dur": 25, "quick": "La capillita donde Cristo salió al encuentro de Pedro que huía.", "hist": "Aquí, según los Hechos de Pedro, el Apóstol que escapaba de la persecución se cruzó con Cristo y le preguntó \"Domine, quo vadis?\". La respuesta lo hizo volver a Roma a morir.", "travel": {"mode": "car", "dur": 30, "costAd": "≈ €25 por taxi", "costCh": "—", "how": "Bajar por el Lungotevere hasta Porta San Sebastiano y seguir por Via Appia Antica. La iglesita está a 800 metros de la puerta, en la primera bifurcación.", "tip": "Dejar los vehículos ahí: desde este punto se sigue a pie hasta las catacumbas."}, "full": "Una iglesita mínima al costado de la **Via Appia** Antica, a ochocientos metros de la Porta San Sebastiano, en la primera bifurcación del camino. No tiene nada de monumental y se visita en diez minutos, pero lo que pasó acá según la tradición explica por qué **San Pedro** está enterrado en el Vaticano y no en cualquier otro lugar del mundo.\n\n## La huida\n\nCorría el año 64, o el 67 según las versiones. **Nerón** había desatado la persecución después del incendio de Roma y los cristianos morían en el circo del Vaticano: crucificados, devorados por los perros, quemados vivos como antorchas para iluminar los jardines imperiales.\n\nLa comunidad convenció a Pedro de que se fuera. El argumento era razonable: sin la cabeza, todo se perdía; había que salvar al pastor para salvar al rebaño. El Apóstol, ya viejo, aceptó. Salió de la ciudad de noche, por la Appia, camino al sur.\n\n## Domine, quo vadis?\n\nLos *Hechos de Pedro*, un texto apócrifo de fines del siglo II, cuentan que en este punto del camino se cruzó con Cristo, que venía en dirección contraria, hacia Roma.\n\nPedro le preguntó: *«**Domine, quo vadis**?»* — Señor, ¿adónde vas? Y la respuesta fue: *«Venio Romam iterum crucifigi»* — voy a Roma a ser crucificado de nuevo.\n\nPedro entendió. Si él huía, Cristo tendría que volver a morir en su lugar. Dio media vuelta, volvió a la ciudad y se dejó prender. Pidió que lo crucificaran cabeza abajo, porque no se creía digno de morir de la misma manera que su Maestro.\n\nEl episodio no está en la Escritura y la Iglesia nunca lo declaró histórico. Pero **San Ambrosio** lo recoge en el siglo IV como algo sabido por todos, y desde entonces atravesó la piedad cristiana entera. Es, en el fondo, la última conversión de Pedro: el mismo que había negado tres veces en el patio del sumo sacerdote, y que acá está por escaparse otra vez, se da vuelta y camina hacia su muerte.\n\n## Las huellas\n\nEn el centro de la nave, protegida por una reja, hay una losa de mármol con dos huellas de pies hundidas en la piedra. La tradición popular las atribuye a Cristo, marcadas en el momento del encuentro.\n\nLos arqueólogos las explican de otro modo: es un ex-voto pagano de los que se dejaban al borde de los caminos, agradeciendo un viaje cumplido o pidiendo protección para el que empezaba. Los pies grabados en piedra eran una fórmula habitual. Que un objeto pagano de camino se haya convertido en el signo de este episodio es, en sí mismo, un buen resumen de cómo funcionó Roma con su propio pasado.\n\nLa losa que se ve acá es una copia. El original se conserva en la basílica de San Sebastián, un poco más adelante sobre la misma Appia.\n\n## La iglesia\n\nEl nombre oficial es **Santa Maria in Palmis**. Se levantó en el siglo IX, se reconstruyó en 1637 por encargo del cardenal Francesco Barberini, y tiene una fachada sencilla de dos pisos y un interior de una sola nave, encalado y casi vacío.\n\nAdentro hay un busto de **Henryk Sienkiewicz**, el escritor polaco que ambientó acá una escena de *Quo Vadis?*, la novela sobre las persecuciones de **Nerón** que publicó en 1896, que le valió el Nobel en 1905 y que hizo conocido el episodio en el mundo entero. Se cuenta que la idea de escribirla se le ocurrió sentado en esta iglesia.\n\n## Lo práctico\n\nAbre de 8:00 a 18:00 y la entrada es gratuita. Está sobre la Via Appia Antica, en el punto donde el camino se bifurca con la Via Ardeatina, a unos quince minutos a pie de la entrada de las catacumbas de **San Calixto**. Es la parada natural antes de bajar a las catacumbas: primero el lugar donde Pedro decidió volver a morir, después el cementerio de los que hicieron lo mismo.", "logi": {"Horario": "8:00 a 18:00", "Costo": "Gratis", "En el piso": "La copia de las huellas: el original está en San Sebastián"}, "map": "Chiesa del Domine Quo Vadis, Roma", "id": "s42", "day": "15", "hrs": {"open": [[480, 1080]], "closed": []}, "hv": false, "pri": 2, "src": "propio", "ver": ["Las **huellas en el mármol** del piso, en el centro de la nave. Son una copia: el original está en San Sebastián.", "La placa con el diálogo: \"Domine, quo vadis?\" — \"Venio Romam iterum crucifigi\".", "La iglesita es mínima. Diez minutos alcanzan."], "zone": "Fuera de las murallas"}, {"time": "10:00", "name": "Catacumbas de San Calixto", "tag": "site", "type": "site", "dur": 60, "quick": "El mayor cementerio cristiano antiguo. La Cripta de los Papas y la de Santa Cecilia.", "hist": "Veinte kilómetros de galerías en cuatro niveles, con medio millón de sepulturas. Aquí fueron enterrados dieciséis papas del siglo III y Santa Cecilia.", "travel": {"mode": "walk", "dur": 15, "costAd": "€10", "costCh": "€7 de 7 a 16 · gratis menores de 6", "how": "Seguir por Via Appia Antica y tomar a la izquierda la entrada arbolada de San Calixto. El camino de acceso, entre cipreses, es de unos 500 metros.", "tip": "Llevar abrigo: abajo hay 16 grados constantes."}, "full": "## El cementerio de la Iglesia\n\nEl cementerio oficial más antiguo de la comunidad romana es también conocido porque fue la sepultura de casi todos los Papas del s. III, a excepción del Papa Urbano y del propio Calixto (217– 222), tal vez a causa de los disturbios populares al tiempo de su martirio. También es conocida por su excepcional colección de pintura paleocristiana. INTRODUCCIÓN. Recorriendo la vía Appia Antica, a menos de un kilómetro de la Puerta de San Sebastián, se encuentran la pequeña iglesia del \"Quo Vadis?\", después las Catacumbas de Pretextato, las de San Sebastián y, más allá, la tumba de Cecilia Metela.\n\nEn el centro de esta área arqueológica, comprendida entre las vías Appia Antica, la Ardeatina y el Callejón de las Siete Iglesias se extiende el \"Complejo Calixtiano\", una vasto predio de unas treinta hectáreas, de las cuales unas quince encierran catacumbas. Las galerías, a veces en cuatro pisos sobrepuestos, alcanzan una longitud de casi veinte kilómetros.\n\nNumerosísimas son las tumbas, quizás medio millón. Este complejo resulta formado por varios núcleos cementeriales que se extendieron con el tiempo: el Cementerio de **San Calixto** y las Criptas de Lucina, que se fusionaron entre sí; los Cementerios de Santa Sotera, de los Santos Marcos, Marceliano y Dámaso, y finalmente el de Balbina. A nosotros nos interesan ahora las Catacumbas de San Calixto, que son entre las más importantes e imponentes de las aproximadamente sesenta catacumbas cristianas de Roma.\n\n## La cuna de la cristiandad\n\nSe las puede considerar como \"la cuna de la Cristiandad y los archivos de la Iglesia primitiva\", porque ilustran su vida, usos y costumbres, el Credo que profesó, y atestiguan su historia martirial. Tuvieron ellas su origen hacia la mitad del siglo II, a partir de un área funeraria perteneciente tal vez a la noble familia de los Cecilios; a comienzos del tercer siglo, pasaron a depender directamente de la Iglesia de Roma. El papa San Ceferino (199-217) confió la custodia de esta incipiente catacumba al diácono Calixto, a fin de que la administrara en nombre de la Iglesia.\n\nCalixto tenía que presidir la excavación para que todos los fieles, sobre todo los pobres y los esclavos, pudieran tener una digna sepultura. Nombrado a su vez papa, Calixto agrandó el complejo funerario que de él tomó el nombre y que llegó a ser el cementerio oficial de la Iglesia de Roma.\n\n## Las criptas\n\nLos núcleos más antiguos de las catacumbas de San Calixto son las Criptas de Lucina y la Zona llamada de los Papas y de **Santa Cecilia**, donde se conservan algunas entre las memorias más sagradas del lugar (la **Cripta de los Papas** y la de Santa Cecilia y los Cubículos de los Sacramentos); las otras zonas son las de San Cayo y de San Eusebio (fines del III siglo), la Occidental (primera mitad del siglo IV) y la Liberiana (segunda mitad de ese siglo). LA ZONA EXTERNA. Esta área a cielo abierto, preexistente a las catacumbas, estaba ocupada a ambos lados de la vía Appia por sepulcros paganos.\n\nPosteriormente fueron construidos mausoleos y pequeñas basílicas, sobre o junto a las tumbas de los mártires. De estos monumentos han llegado hasta nosotros tan solo dos pequeños edificios llamados \"Tricoras\", por los tres ábsides que constituyen su planta.\n\n## Arriba, en la superficie\n\nSiempre en la superficie externa, tal vez en la \"Tricora occidental\", fueron sepultados cercanos, si bien en tiempos diversos, el papa San Ceferino y el joven mártir de la Eucaristía, San Tarsicio, celebrado en un poema del papa Dámaso (366-384), que recuerda así su martirio: \"Mientras un perverso grupo de fanáticos se abalanzaba sobre Tarsicio que llevaba la Eucaristía, para profanarla, el joven prefirió perder la vida antes que dejar a esos perros rabiosos el Cuerpo de Cristo\".\n\nLas dos tricoras han sido restauradas y la oriental desempeña ahora la función de pequeño museo, que contiene inscripciones del cementerio y numerosos fragmentos de sarcófagos, que representan escenas del Antiguo y del Nuevo Testamento. El más importante es el sarcófago del Niño, así llamado por sus dimensiones reducidas y que conserva ahora la parte del frente ricamente esculpida.\n\n## Un catecismo en piedra\n\nEste sarcófago se puede considerar un pequeño catecismo ilustrado. He aquí las escenas: Noé con la paloma en el arca, un profeta que sostiene el rollo de la ley divina, Daniel en el foso de los leones, el niño orante entre dos santos, el milagro de Caná y la resurrección de Lázaro. Arrodillada a los pies de Jesús la hermana de Lázaro, María. En el centro de la tapa dos geniecitos sostienen una tablita; en las extremidades hay sendas cabezas, esculpidas como adorno. Las escenas representadas en este sarcófago dejan transparentar un profundo simbolismo, y el sucederse de las escenas no es casual.\n\nEl cristiano nace a la vida divina mediante el Bautismo (Noé). Nutre esta vida divina con el pan (Abacuc) y el vino (Caná) consagrados en la Misa, es decir, con la Comunión. La Eucaristía le ofrece como prenda la resurrección final (Lázaro). Así el cristiano (niño) vivirá en el paraíso (orante). Hallamos aquí el eco de las palabras de Jesús: \"Quien come mi carne y bebe mi sangre, tiene la vida eterna, y yo lo resucitaré en el último día\" (Jn 6, 54).\n\n## Bajando\n\nEL CEMENTERIO SUBTERRÁNEO. La escalera de ingreso. Se baja a las catacumbas por una escalera de ingreso moderna, construida en buena parte sobre el lugar de la anterior del IV siglo, abierta en tiempos del papa Dámaso a fin de permitir a los peregrinos llegar con facilidad a las tumbas de los mártires. A lo largo de las paredes del primer tramo de la escalera se han pegado numerosos fragmentos de las lápidas que cerraban los lóculos.\n\nLa estatua del Buen Pastor. En el rellano, donde la escalera gira a la derecha, se encuentra una estatua del Buen Pastor, copia del original del siglo IV, guardada en los Museos Vaticanos. El Buen Pastor con la oveja sobre los hombros representa a Cristo Salvador y al alma que El ha salvado. Es el símbolo más frecuente del amor de Cristo y el más querido por los primeros cristianos. Revestía para ellos la misma importancia que tiene para nosotros el Crucifijo. La lápida de Agripina.\n\nA lo largo de las paredes de la escalera están pegadas algunas inscripciones funerarias. En una de ellas el día de la muerte es llamado \"el día en que la difunta ha entrado en la luz\" (\"cuius dies inlúxit\"). \"Agripina entregó (el alma a Dios)... Entró en la luz... sepultada en los Idus de ...\". El cristianismo había sabido transformar en luz el lúgubre concepto pagano de la muerte. Los grafitos. En el fondo de la escalera, sobre la pared protegida por un cristal, comienza una serie de grafitos, esculpidos con una punta de hierro sobre el revoque del muro.\n\nSon nombres de personas, palabras o también pequeñas frases de invocación a los mártires, que los peregrinos fueron escribiendo cuando visitaban las catacumbas. Los grafitos son frecuentes junto a las tumbas de los mártires. Así, en la pared externa de la Cripta de los Papas leemos estas expresiones: \"¡Oh, San Sixto, acuérdate en tus oraciones de Aurelio Repentino!...\" \"¡Oh, Almas Santas, acuérdense de Marciano, de Suceso, de Severo, y de todos nuestros hermanos!\" \"Felición, PBR (presbítero), pecador\".\n\nLeemos también la expresión admirativa con la que un desconocido compara la Cripta de los Papas con la Jerusalén celestial: \"Jerusalén, ciudad y ornamento de los mártires de Dios...\" A la izquierda está la apertura que introduce en la Cripta de los Papas. CRIPTA DE LOS PAPAS. Es el lugar más sagrado e importante de estas catacumbas, descubierto por el gran arqueólogo Juan Bautista de Rossi en 1854, y definido por él \"el pequeño Vaticano, el monumento central de las necrópolis cristianas\".\n\n## La Cripta de los Papas\n\nTuvo su origen hacia fines del siglo II como cubículo privado. Después de la donación de esa área a la Iglesia de Roma, el cubículo fue remodelado y transformado en cripta y se volvió el sepulcro de los papas del III siglo. La cripta, de forma rectangular, contenía cuatro nichos para sarcófagos y seis lóculos en cada lado; en total, dieciséis sepulturas, más una tumba monumental en la pared del fondo. En esta cripta fueron sepultados nueve papas y ocho obispos del siglo II. En las paredes están pegadas las lápidas originales, quebradas e incompletas, de cinco papas. Sus nombres están escritos en griego, según la costumbre oficial de la Iglesia de ese tiempo. Sobre cuatro lápidas, junto al nombre del pontífice, está la calificación de epí(scopos) = obispo, porque era el jefe de la Iglesia de Roma; y sobre dos lápidas está la sigla, es decir, la abreviatura MTR = Mártir. Mártir significa\n\ntestigo. Se llamó mártires a los cristianos que habían dado testimonio con la sangre de su fe en Cristo. Los nombres de los papas, escritos en las lápidas, son: San Ponciano (230-235). Murió mártir en Cerdeña adonde había sido deportado y condenado a los trabajos forzados. Para no poner en dificultad a la Iglesia de Roma a causa de su definitiva ausencia, poco después de su llegada a la isla renunció al pontificado. Probablemente el clima malsano, el trabajo enervante en la mina y el mal trato apresuraron el fin de su existencia.\n\nCuando murió, la Iglesia lo consideró un verdadero mártir. Algunos años más tarde sus restos mortales fueron transportados a Roma y sepultados en el cementerio de San Calixto. San Antero (235-236). De origen griego, tuvo un brevísimo pontificado, de 43 días solamente, todos transcurridos en la cárcel. San Fabián (236-250). Era romano y fue elegido papa al morir San Antero. Su servicio coincidió con un período de paz religiosa. Fue un gran organizador de la Iglesia de Roma. Dividió la ciudad en siete zonas eclesiásticas confiando a cada una sus \"títulos\" (= parroquias), su clero y sus catacumbas (cementerios).\n\nMurió decapitado durante la persecución del emperador Decio. San Lucio I (253-254). Tuvo un pontificado breve: ocho meses en total, transcurridos parcialmente en Civitavecchia, adonde había sido desterrado. San Eutiquiano (275-283). De Luni en Liguria, fue el último de los nueve papas sepultados en esta cripta. El papa mártir Sixto II (257-258). Definido por San Cipriano \"sacerdote bueno y pacífico\", es ciertamente uno de los mártires más ilustres de esta catacumba.\n\n## San Sixto II\n\nEs el mártir por excelencia de las catacumbas. En efecto, estaba presidiendo una liturgia precisamente en este cementerio, cuando fue sorprendido por los soldados del emperador Valeriano el 6 de agosto del año 258 y decapitado en ese lugar, el mismo día, juntamente con cuatro diáconos. Los poemas del papa Dámaso. En la pared derecha de la Cripta de los Papas se conservan, juntados, dos fragmentos originales de un primer poema de San Dámaso, dedicado al papa Sixto II para celebrar su glorioso martirio.\n\n\"Cuando la espada (persecución) las pías entrañas de la Madre (Iglesia) traspasaba, aquí el obispo sepultado (Sixto II) la doctrina (las divinas Escrituras) enseñaba. Llegan de improviso soldados y arrestan allí al sentado en cátedra (la cátedra episcopal), mientras los fieles ofrecen sus cuellos a la guardia enviada (es decir, intentan salvar al papa a costa de su vida). Apenas el anciano (obispo) supo que uno quiso arrebatarle la palma (del martirio), él mismo fue el primero en ofrecerse y dar su cabeza a la espada, para que así a ninguno pudiera herir una tan impaciente rabia (pagana).\n\nCristo que distribuye los premios de la vida, reconoció el mérito del pastor, defendiendo El mismo el resto de su grey\". Los otros papas aquí sepultados son Esteban I (254-257), San Dionisio (259-268) y San Félix I (269-274); pero de estos no se han hallado las lápidas. En el siglo IV, el papa San Dámaso, piadoso cultor de los mártires, transformó la cripta en lugar de culto. Hizo colocar ahí un altar, del cual hoy se conserva tan solo el antiguo basamento en mármol.\n\nFueron abiertos dos lucernarios en el cielo raso y fueron colocadas las columnas, que sostenían un arquitrabe del cual colgaban lámparas y cruces en honor de los mártires. Muy interesante desde el punto de vista histórico es la lápida original que todavía en gran parte se conserva ante la tumba del papa Sixto II. Fue hecha grabar en el mármol por el papa Dámaso y\n\ncontiene un segundo poema, en hexámetros latinos, que conmemora a los mártires y a los fieles sepultados en la cripta y en todo el cementerio: \"Aquí, si algo buscas, yace una apiñada multitud de justos: venerandos sepulcros conservan las cenizas de unos santos, cuyas etéreas almas raptó para sí la celestial morada. Aquí están los compañeros de Sixto que arrebataron el triunfo al enemigo. Aquí un contingente de próceres que custodian el altar de Cristo. Aquí reposa el obispo que vivió el largo período de paz. Aquí descansan los santos confesores (de la fe) que Grecia nos envió.\n\nAquí duermen jóvenes y niños, ancianos y sus castos familiares que, unánimes, prefirieron conservar su virginal pudor. Aquí yo, Dámaso, lo confieso, quise dar sepultura a mi cuerpo, pero temí molestar las santas reliquias de los justos\". CRIPTA DE SANTA CECILIA. En la pared de la izquierda, abajo, se abre un gran nicho en el cual fue colocado el sarcófago que contiene el cuerpo de Cecilia, que permaneció allí hasta el año 821 cuando el papa San **Pascual I** lo hizo transportar al Trastévere, a la basílica dedicada a ella.\n\n## Santa Cecilia\n\nLa estatua, ahí colocada, es una copia de la célebre estatua de Esteban **Maderno** (1566-1636), esculpida en 1599, cuando se hizo el reconocimiento de los restos mortales de Cecilia. Estos fueron hallados incorruptos y en la posición reproducida por el escultor. Maderno quiso también poner de relieve el corte de la espada en el cuello y la posición de los dedos: tres abiertos en la mano derecha y un dedo abierto en la izquierda. Conforme a la tradición, la santa quiso manifestar así su fe en la Unidad y en la Trinidad de Dios.\n\nLa cripta había sido embellecida con mosaicos y pinturas. De estas últimas quedan ahora algunas imágenes. En la pared izquierda, junto al lugar de sepultura de la mártir, en alto está representada Santa Cecilia en actitud de orante; abajo, en un pequeño nicho, se encuentra la imagen de Cristo \"Pantocrátor\" (Omnipotente), que sostiene el Evangelio. Al lado, está la imagen de San Urbano, papa y mártir, contemporáneo de Santa Cecilia, unido en la pasión a la mártir. En la cavidad del lucernario se admira la cruz entre dos ovejitas y las imágenes de los mártires Polícamo, Sebastián y Quirino.\n\nEn la cripta se conservan numerosas inscripciones. La más importante, por el hermoso testimonio de fe, es la de Septimio Frontón, de rango senatorial. Está en lengua griega y se remonta al siglo III. \"Yo Septimio Frontón Pretextato Liciniano, siervo de Dios (= cristiano), reposo aquí. No me arrepentiré (nunca) de haber vivido honradamente. Te serviré, también, en el cielo, (Señor), y daré las gracias a tu nombre.\n\nEntregué mi alma a Dios a los 33 años y 6 meses\". LAS GALERÍAS. Al salir de la cripta de Santa Cecilia, volviéndose a la izquierda se llega a un largo corredor, que constituye uno de los dos núcleos más antiguos del cementerio (galería B). Al término se pasa a la galería C, donde se halla la hermosa lápida de Augurino con la paloma que tiene el ramito de olivo en el pico. Por un estrecho pasadizo se llega a la galería A, llamada de los Cubículos de los Sacramentos. En las paredes se encuentran algunas inscripciones. Leemos una: \"A Cartilio Ciríaco, hijo dulcísimo.\n\n¡Puedas tú vivir en el Espíritu Santo!\" La estructura de las galerías y la disposición de los sepulcros dan la impresión de un vasto dormitorio, llamado por los cristianos cementerio, que significa precisamente lugar del sueño, como veremos más adelante, al hablar del cubículo del diácono Severo. Las CRIPTAS DE LOS SACRAMENTOS. En esta galería A, encontramos a la izquierda cinco cuartitos o tumbas de familia, llamadas \"los Cubículos de los Sacramentos\", famosas e importantes\n\n## Los cubículos de los Sacramentos\n\npor los frescos que contienen, cuya datación puede corresponder al siglo III y que representan simbólicamente los sacramentos de la iniciación cristiana: Bautismo y Eucaristía. Con estas representaciones los cristianos de los primeros siglos querían ante todo recordar su catecumenado (la preparación al Bautismo), y después dejar un mensaje a los contemporáneos: ellos se habían vuelto cristianos mediante el Bautismo y habían perseverado en la vida cristiana gracias a la Comunión frecuente.\n\nQuerían además hacer presente a los familiares y a cuantos visitaban sus tumbas que, si hicieran uso de los mismos medios de salvación, un día se reunirían nuevamente con sus seres queridos. El Bautismo. Como enseñaban los Padres de la Iglesia en sus catequesis, estos medios de salvación fueron prefigurados en el Antiguo Testamento. Esto aparece claro en el milagro de Moisés que hace manar el agua de la roca para apagar la sed de su pueblo en el desierto (Ex 17, 1-7).\n\nTambién el Bautismo de Jesús (Mt 3, 13-17) es una prefiguración del bautismo cristiano. Por eso, se ve la escena de Jesús que se hace bautizar por Juan en el Jordán. En la pared del fondo del cubículo A2 está pintada la más antigua escena del bautismo de un catecúmeno. El sacerdote revestido de túnica y palio pone la mano derecha sobre la cabeza del que es bautizado, quien tiene los pies en el agua. Otras representaciones del bautismo las ofrecen el pescador, la Samaritana junto al pozo y el paralítico de la piscina de Betsaida.\n\n## Los símbolos\n\nLa Eucaristía. Los primeros cristianos prefirieron representar en sus cubículos como símbolo de la Eucaristía el milagro de la multiplicación de los panes y peces (Jn 6, 1-15). Jesús, en efecto, remitiéndose a este milagro, promete un pan particular y diverso: su cuerpo (Jn 6, 22-59). La escena de la multiplicación de los panes se repite siempre de la misma manera: siete personas están sentadas alrededor de una mesa.\n\nEl número siete es simbólico e indica que todos están llamados por Dios a la salvación. Sobre la mesa son colocados dos o tres platos con panes y peces y en los costados de la mesa están los canastos de pan. El bíblico Jonás. En todos estos cubículos aparece el profeta Jonás. Es el profeta más amado por los cristianos, porque predicó el mensaje de la salvación a los habitantes de Nínive, es decir, a paganos, y por ello es el símbolo de la llamada a la salvación de todos los hombres indistintamente, tanto judíos como paganos.\n\nNo olvidemos que la mayoría de los fieles sepultados en este cementerio provenían del paganismo. Jonás, por otra parte, es también símbolo de la resurrección. Jesús mismo en el Evangelio lo toma como figura de esta realidad: \"Como Jonás permaneció en el vientre del pez tres días y tres noches, así el Hijo del Hombre permanecerá en el corazón de la tierra tres días y tres noches, y luego resucitará\" (Mt 12, 40).\n\n## La zona de Milcíades\n\nLa escalera de los mártires. Al final de la galería de los Cubículos de los Sacramentos empieza la escalera de los mártires, que fue excavada alrededor de la mitad del siglo II y conserva todavía algunas pequeñas gradas de esa época. Se la llama \"escalera de los mártires\", porque a través de ella pasaron los papas sepultados en la cripta muy cercana. Según una tradición, también el joven Tarcisio bajaba por esta escalera, cuando iba a rezar sobre las tumbas de los mártires o bien para tomar la Eucaristía y llevarla a los cristianos en las cárceles o en las familias durante un período de persecuciones.\n\nLa ZONA LLAMADA DEL PAPA MILCIADES. A través de una abertura practicada en la pared del fondo del cubículo A1 se penetra en la zona llamada de San Milcíades. La zona fue excavada en la segunda mitad del III siglo y contiene muchos cubículos y arcosolios, también a lo largo de las galerías. La primera galería que se recorre, se presenta espaciosa. Se la recorría continuamente en el período de las visitas a los sepulcros de los mártires, ya que constituía el paso obligado de los antiguos peregrinos desde la Cripta de los Papas y la de Santa Cecilia al sepulcro del papa mártir San Cornelio en las criptas de Lucina.\n\nEn la pared de la izquierda, al comienzo de la galería, son visibles algunos símbolos: la paloma, dos monogramas, el pez, el ancla, el pajarito que va a apagar su sed en un jarro. Sobre el ángulo de la primera galería a la izquierda hay dos lápidas, que se refieren a sacerdotes: \"Julianus présbyter\" (Juliano, sacerdote) y \"Présbyter in pace\" (Sacerdote, en paz). En seguida después de un cruce de galerías con un amplio lucernario, a la derecha en alto se discierne la sugestiva lápida del ave fénix radiada y nimbada, es decir, con rayos y aureola alrededor\n\nde la cabeza. Como hemos explicado hablando de los símbolos, para los primeros cristianos el ave fénix representaba la resurrección de la carne y el nacimiento a la nueva vida divina. Observamos ahora el primer arcosolio, que a veces, como en este caso, está decorado. Sobre el arcosolio se ve la pequeña lápida de Irene, una niña cristiana representada como orante en la paz del cielo.\n\nAl lado tiene el símbolo por excelencia de la paz: la paloma. Un poco más adelante, a la izquierda está la cripta del refrigerio, que servía para las reuniones de oración y para los ritos del refrigerio, es decir, para la conmemoración anual de los difuntos. En el interior se conserva la tapa de un sarcófago monumental y debido a la forma del techo con tejas, la cripta fue llamada, en tiempos de de Rossi, la cripta de la teja. En frente se abre el cubículo de las cuatro estaciones, que simbolizan la continuidad de la vida.\n\nAl término de la galería, antes de la verja, encontramos dos cubículos: a la izquierda el cubículo de Aquilina, con la inscripciòn \"Aquilina dormit in pace\" (Aquilina duerme en paz). A la derecha, tenemos el cubículo de Sofronia, así llamado por el nombre de la difunta repetido dos veces en la pared del fondo. Otras dos veces este nombre aparece grabado cerca de la Cripta de los Papas. Las inscripciones hacen presumir que un cristiano, profundamente impresionado por la muerte de una persona querida, quizás su mujer, había bajado a la catacumba en busca de consuelo a su dolor.\n\nAl final de la escalera escribió este deseo: \"Oh, Sofronia, puedas tú vivir con los tuyos\". Después escribió todavía: \"Oh, Sofronia, tú vivirás en el Señor\". Iluminado por la fe, al llegar a este cubículo sintió la necesidad de escribir: \"Oh dulce Sofronia, tú vivirás siempre en Dios\" y, abajo, \"Sí, Sofronia, tú vivirás\". Es un lindo testimonio de amor conyugal y de fe en la resurrección. Después de una curva en U se entra en la galería W2. Por la derecha se encuentra el cubículo de Océano, por el nombre de la mítica personificación del mar pintado en la bóveda.\n\nEs de modestas dimensiones, decorado con franjas rojas fuertemente marcadas. Prosiguiendo se llega a la galería decumana Q1, galería principal y la más larga del cementerio, de la que parten las galerías secundarias llamadas \"cárdines\" (bisagras). A pocos pasos de la escalera de salida se halla el cubículo de los sarcófagos, que están cerrados en la parte superior por losas de vidrio y que contienen unos pocos restos. (Aquí termina la visita ordinaria a las catacumbas de San Calixto).\n\n## San Cayo y San Eusebio\n\nLA ZONA DE SAN CAYO Y DE SAN EUSEBIO. Yendo adelante, a lo largo de la galería Q1 y más allá de la escalera de salida Z, se encuentran en seguida dos importantes criptas históricas: a la derecha la cripta del papa Cayo y a la izquierda la del papa mártir San Eusebio. La cripta de San Cayo. Esta cripta ocupa un lugar especial en las Catacumbas de San Calixto por sus proporciones verdaderamente excepcionales. Podía contener a más de sesenta personas. Desde su mismo origen fue proyectada tan vasta para favorecer las reuniones comunitarias.\n\nA través del amplio lucernario, situado en la galería, se aseguraban para la cripta la luz y la suficiente ventilación. La decoración es muy sobria; las paredes fueron revestidas de una simple capa de estuco blanco. En las paredes laterales se encuentran muchos lóculos, pero solo tres en la pared del fondo. El lóculo del medio, de notables dimensiones, es la tumba principal y más importante de toda la cripta. En ella se conservan los fragmentos de la inscripción griega del papa Cayo: \"Deposición del obispo Cayo, 22 de abril\" (año 296).\n\nEn la cripta hallamos varias inscripciones griegas y latinas, lamentablemente casi todas fragmentarias, y también algunos grafitos. Uno de ellos dice: \"Señor, ayuda a tu siervo Benjamín\". En un epígrafe está escrito: \"En paz el espíritu de Silvano. Amén\". También el piso está lleno de tumbas. En las paredes de la cripta los grafitos llevan los nombres de tres obispos africanos, que habían venido a rezar sobre la tumba de su compatriota San Optato, probablemente sepultado en esta cripta. La cripta de San Eusebio. Se encuentra frente a la de San Cayo. Es de forma rectangular, pero no demasiado espaciosa.\n\nLas paredes y el pavimento estaban revestidos de mármol. El lucernario es moderno: el original se abría sobre el cielo raso de la galería. La cripta contiene tres arcosolios. En el arcosolio de la pared derecha estaba situado el sepulcro de San Eusebio. El interior estaba revestido de mármol, y el arco decorado con mosaico. Ahí se\n\nencuentra una gran losa de mármol moderna, sobre la cual está grabado el poema compuesto por el papa Dámaso en honor de San Eusebio. En el centro de la pieza sepulcral se halla una tosca copia de este poema, hecha grabar por el papa Virgilio (537 - 559) después de la devastación gótica por el papa Virgilio (537-559).\n\nEn el dorso la losa contiene una dedicatoria en honor de Caracala. La inscripción del papa Dámaso recuerda la bondad y la misericordia del pontífice hacia los \"lapsi\" (caídos, sobre entendido en el error), los apóstatas del cristianismo, es decir, aquellos que, por miedo a las persecuciones, habían renegado de la fe. Opuesta a la del pontífice era la postura de Heraclio, un exponente del clero romano, que no aceptaba el arrepentimiento de ellos.\n\n## El cisma de los lapsi\n\nEl Papa sostenía que siguiendo el ejemplo de Cristo, quien había perdonado siempre, había que ser comprensivos y perdonar a los apóstatas tras un período de adecuada penitencia. La controversia, ya debatida bajo el pontificado del papa San Cornelio (251-253), causó enconados contrastes sobre todo en la segunda mitad del siglo III y a comienzos del IV. Se provocaron desórdenes. El emperador **Majencio**, a causa de los choques entre las dos facciones religiosas, hizo alejar de Roma a sus exponentes.\n\nEusebio fue desterrado a Sicilia, donde murió de pena y penuria algún tiempo después. La Iglesia lo consideró en seguida un verdadero mártir. Su sucesor San Milcíades mandó trasladar su cuerpo a Roma y colocarlo en esta cripta que tomó su nombre. El poema en su honor trae la dedicatoria \"Dámaso obispo hizo (esta inscripción) para Eusebio, obispo y mártir\". He aquí el texto de la composición: \"Heraclio prohibió a los lapsos confesar sus pecados, Eusebio sostuvo que los pecadores llorasen sus culpas (hicieran penitencia).\n\nEl pueblo se divide en facciones con furor enardecido: bandos, muertes, guerra, discordia, disensiones. De improviso ambos (Heraclio y Eusebio) son desterrados por el cruel tirano, a pesar de que el papa cumplió por entero la paz pactada. Por amor divino sufrió alegre el destierro decretado, dejando su vida y el mundo en la costa brava siciliana\". El cubículo de los mártires Calócero y Partenio. Dejada la cripta de San Eusebio y pasado un cruce de galerías, encontramos la cripta de los Santos Calócero y Partenio, quizás víctimas de la persecución de Diocleciano.\n\nSobre un trecho de revoque, a la izquierda de la entrada , llama particularmente la atención un grafito: \"PARTEN(i) MARTIRI es decir (Sepulcro) de Partenio mártir CALO(c)ERI MARTIRI es decir (Sepulcro) de Calócero mártir\" La expresión correcta sería: \"Parténii Mártyris, Calóceri Mártyris\". El cubículo fue completamente restaurado ya desde los primeros siglos a causa de la toba poco consistente. El cubículo de enfrente, más grande que un cubículo ordinario de catacumba, servía como lugar de culto junto a tumbas veneradas.\n\nProsiguiendo el recorrido en la galería Q1, se halla un doble cubículo, al que un amplio lucernario proporciona luz suficiente. A la izquierda se encuentra el cubículo de los cinco Santos. Fue llamado así porque en la pared del fondo estaban representadas cinco personas orantes en medio de un jardín, alegrado por el canto de los pájaros, con plantas cargadas de flores y frutos: clara imagen del paraíso. Sobre cada figura fue puesto el nombre acompañado del deseo \"en paz\": \"Dionisia en paz - Nemesio en paz - Procopio en paz - Heliodora en paz - Zoe en paz\". Se considera que la pintura fue realizada a comienzos del siglo IV.\n\n## Los últimos cubículos\n\nA la derecha hay un doble cubículo, que antiguamente recibía luz de un amplio lucernario. Es el cubículo del diácono Severo. Pertenecía a este eclesiástico, quien había sido autorizado a excavarlo por el papa Marcelino (296 - 304). En el vasto ambiente está grabada, sobre una cancela marmórea que cerraba un arcosolio, una inscripción métrica, una de las más importantes y sugestivas de la Roma subterránea.\n\nLos primeros versos de la inscripción hablan de la propiedad del cubículo: \"Este diácono Severo, autorizado por su papa Marcelino, hizo este cubículo doble (formado por dos aposentos contiguos), con arcosolios y lucernario, como tranquila mansión de paz para él y los suyos, a fin de que por largo tiempo guarde en el sueño los dulces miembros (para Dios), creador y juez...\". La inscripción continúa con el recuerdo afectuoso del padre Severo hacia su joven hija: \"Severa, dulce con sus padres y con los domésticos, entregó (su alma a Dios) siendo virgen (es decir, niña) un 25 de enero.\n\nQuiso el Señor concederle desde su nacimiento una admirable sabiduría y hermosura...\". La inscripción es importante desde el punto de vista dogmático, puesto que expresa la fe en la resurrección de los cuerpos: \"El cuerpo mortal está sepultado aquí en tranquila paz hasta tanto lo haga resurgir el Señor, quien arrebató (a Severa) el alma casta, recatada y por siempre inviolable con su Santo Espíritu, y que la devolverá (al cuerpo) adornada de gloria espiritual.\n\nVivió nueve años, once meses y quince días. Así pasó de esta vida terrenal\". La inscripción es importante también desde el punto de vista histórico, porque es el primer documento epigráfico en que el Obispo de Roma es designado con el título de \"papa\" (padre). Desde entonces el término fue usado como sinónimo del obispo de Roma. La palabra no está grabada por completo, sino con la sigla PP, todavía usada por los papas cuando firman. Dejando ahora el camino maestro de la galería Q1 y volviéndonos a mano izquierda nos introducimos en la galería R2, a cuya izquierda se encuentra el cubículo de las Ovejitas.\n\nEl sepulcro del fondo se compone de un nicho para sarcófago, con un arco por encima. El arco y la luneta contienen una pintura del IV siglo, dañada por la apertura de un lóculo. En el centro del arcosolio está la imagen del Buen Pastor con la ovejita sobre sus hombros, rodeado del rebaño (un carnero y unas ovejas). La escena representa la imagen del Buen Pastor que lleva al difunto entre las filas de los bienaventurados.\n\nEn los costados, dos hombres con túnica y palio se apresuran a beber en las dos fuentes que brotan de la roca: son dos bienaventurados que reaniman sus fuerzas en las fuentes del agua viva que es Cristo. En la pared izquierda del nicho se halla una escena eucarística que puede calificarse como única en la pintura, mientras que es frecuente en los sarcófagos. Jesús impone las manos sobre un canasto de panes y sobre algunos peces que le son presentados por dos Apóstoles.\n\nEn el suelo se ven seis canastos de pan con la cruz arriba. La pintura fue posteriormente perjudicada por la apertura de un pequeño nicho para lámparas. En la pared derecha del arcosolio está representado Moisés que se desata las sandalias. Junto a él aparece Pedro en el acto de golpear la roca para hacer manar agua. Un soldado con la espada ceñida, se acerca a la fuente y toma el agua con las dos manos. Moisés es símbolo de la antigua Ley, Pedro de la nueva. El agua de la roca es símbolo de la del bautismo; el soldado vestido como un militar romano representa a los primeros cristianos convertidos por Pedro.\n\n## Para terminar\n\nDESPEDIDA. Las Catacumbas de San Calixto son muy extensas. Hemos recorrido tan solo una parte del segundo piso. Pero esta constituye la parte más importante por las criptas de indudable valor histórico: las de los papas, de Santa Cecilia, de San Eusebio y los cubículos de los sacramentos. La nuestra ha sido una breve visita de estudio y piedad, suficiente para darnos una idea de lo que son las catacumbas, cementerios de la Iglesia de los primeros tiempos.\n\nLas catacumbas son la prueba histórica de que la Iglesia en sus orígenes fue una Iglesia de Mártires: 46 mártires, de quienes conocemos el nombre, están sepultados en estas catacumbas, pero ciertamente hubo muchos más. La Iglesia de esos tiempos fue también una Iglesia de cristianos auténticos, que no han sepultado su fe bajo tierra, sino que la han manifestado abiertamente en cada situación de la vida, en familia, en el trabajo, en las profesiones, con la lealtad al emperador y al Estado, con la bondad hacia todos, suscitando la admiración incondicional también de los no cristianos.\n\nHemos descrito un cementerio donde todo habla de vida más que de muerte. Cada galería recorrida, cada cubículo visitado, cada pintura, cada escultura, cada inscripción, nos han ofrecido un mensaje, con un lenguaje silencioso, pero verdadero y comprensible: el mensaje de la fe, del testimonio cristiano en la vida de cada día y del martirio en las persecuciones.", "logi": {"Horario": "9:00 a 12:00 y 14:00 a 17:00", "Cerrado": "Miércoles", "Visita": "Solo con guía, unos 45 min", "No permitido": "Cochecitos. Hay escaleras", "Temperatura": "16 °C todo el año", "Sobre el horario": "Cerradas los miércoles. €10 adultos, €7 de 7 a 16 años. La última visita de la mañana sale 12:00."}, "map": "Catacombe di San Callisto, Roma", "id": "s43", "day": "15", "hrs": {"open": [[540, 720], [840, 1020]], "closed": [3]}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **Cripta de los Papas**, donde fueron sepultados dieciséis pontífices del siglo III.", "La **cripta de Santa Cecilia**, con la copia de la estatua de Maderno en el lugar donde la encontraron incorrupta.", "Los símbolos paleocristianos en las paredes: el pez, el ancla, el Buen Pastor.", "Los **loculi** vacíos apilados de piso a techo, a los dos lados de las galerías."], "zone": "Fuera de las murallas"}, {"time": "11:30", "name": "Paseo por la Appia Antica", "tag": "site", "type": "site", "dur": 45, "quick": "El empedrado original entre pinos y tumbas romanas.", "hist": "Abierta en el 312 a.C. por Appio Claudio. Por estas piedras entró San Pablo a Roma y aquí fueron crucificados los seis mil esclavos de Espartaco.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Volver a la Via Appia Antica y caminar hacia el sur unos cientos de metros, hasta donde aparece el basolato original."}, "full": "## Los caminos del Imperio\n\nLas carreteras de Roma surgieron con un objetivo netamente militar, pero con el tiempo adoptaron fines diversos, incluido el turismo. Desde Roma partían 29 caminos dispuestos en abanico que enlazaban la ciudad con las provincias de Italia y continuaban en los países lindantes. Sobrepasando los Alpes. Estos caminos, llamados consulares, estaban a su vez enlazados entre sí por vías secundarias, llamadas provinciales. Los caminos tenían generalmente una parte central reservada a carros cuadrúpedos y, a los lados, las aceras más altas para los peatones.\n\nPor estos caminos también pasaba el correo romano, que permitía al emperador hacer llegar en poquísimo tiempo sus órdenes hasta los más lejanos confines del Imperio.. Los elevados gastos del correo, que corrían a cargo de las provincias, comprendían el mantenimiento de diversos edificios para el reposo durante el viaje, como mansiones, albergues (stationes), caballerizas, y gastos del numeroso personal de servicio (obreros, arrieros, veterinarios, carpinteros. mozos de cuadra y conductores). También recaía sobre las provincias la alimentación y los gastos inherentes a la estancia de los viajeros.\n\n## Viajar en el siglo I\n\nA quien no podía disfrutar de estos servicios del Estado, no le quedaba otra salida que dirigirse a los particulares. De este modo, paralelamente a la organización oficial, nacida para satisfacer las necesidades políticas y militares, surgió rápidamente una organización privada que alquilaba coches y animales y que hacía frente al transporte del correo particular. Guías e itinerarios para viajeros (turistas) fueron escritos desde la más lejana antigüedad. Se recorrían 30 kilómetros al día, con paradas cada cinco, para que los viajeros pudieran apagar su sed o comer un poco.\n\nAl llegar la noche, se hospedaban en los albergues oficiales o particulares. La **Via Appia** Proyectada y llevada a cabo el año 312 a.C. por el Censor Apio Claudio, el ciego. Pretendió ser la más larga y bella de las carreteras romanas, y y pronto se le comenzó a llamar Regina Viarum. Para su alzado se hizo necesario vencer obstáculos sin cuento, como cruzar pantanos y valles, remontar torrentes y ríos, superar montañas, agudizando hasta extremos memorables la ciencia y la técnica de entonces.\n\n## La reina de los caminos\n\nAdoquinada con polígonos de basalto –roca volcánica, de color negro o verdoso–, tenia una anchura total de 14 pies romanos. esto es, poco más de cuatro metros, lo que permitía el paso simultaneo de un carro en cada dirección. Además, contaba con aceras de tierra batida de metro y medio de ancho a cada lado, limitadas por un borde de piedra.\n\n**Julio César** la restauró a costa de su propio patrimonio. Con las sucesivas aportaciones de **Augusto**, Domiciano y Vespasiano, llegó a sus dimensiones definitivas: 540 kilómetros, que unían la capital del Imperio con Brindisi, al sur de Italia, puerto crucial para el dominio del Mediterráneo y para la comunicación con el Oriente; distancia que podía cubrirse en 13 ó 14 jornadas de viaje Por esta Via llegó San Pablo prisionero a Roma en el año 61. En los primeros 20 kilómetros, flanqueaban la Appia diversas tumbas de ciudadanos ilustres.\n\n## Las tumbas del costado\n\nA la altura de las Catacumbas de **San Calixto**, se encontraban las sepulturas de los Pomponios, los columbarios de los cocineros imperiales y de los marineros de la flota de Miseno, que tenían el encargo de manejar el toldo del Coliseo. Antes de llegar a las Catacumbas, se encuentra la Iglesia del Quo vadis, a la altura del cruce de la Via Appia con la Via Ardeatina. En esta iglesia se venera una piedra con las huellas de los pies de Cristo, copia del original, que se encuentra en las catacumbas de San Sebastián.\n\nYa cerca de las Catacumbas de San Sebastián, se hallaba el mausoleo de Rómulo, hijo del emperador **Majencio** y, al lado, el circo de Majencio. La tumba que por grandeza y por su peculiar estado de conservación domina el camino consular es la de Cecilia Metela (s. I a.C.), que se erige al final de una corta subida en la tercera milla de la Via Appia. Está formada por un basamento cuadrangular sobre el que se levanta el cuerpo de fábrica. Tiene cerca de 20 metros de altura y está toda revestida de travertino; en la parte alta, una lápida recuerda a Cecilia, hija de Quinto Metelo Crético, el que sometió la isla de Creta.", "logi": {"Cos
