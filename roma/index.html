r papal y de la Confesión, en el eje vertical que une la tumba, el altar y la cúpula de Miguel Ángel. Es el único punto de la basílica donde se entiende de una sola mirada por qué San Pedro está donde está.","logi":{"Duración":"1 hora exacta","Ambiente":"~24 °C y humedad alta, pasillos angostos","No permitido":"Fotos, bolsos grandes, cochecitos","Salida":"Adentro de la basílica, junto a las Grutas"},"map":"Necropoli Vaticana","fullSource":"Redacción propia sobre las excavaciones vaticanas","travel":{"mode":"walk","dur":2,"costAd":"Gratis","costCh":"Gratis","how":"El guía retira al grupo en el mismo Ufficio Scavi y baja con él a la necrópolis."},"id":"s24","day":"13","pri":1,"ver":["El **mosaico de Cristo como Sol Invicto** en el mausoleo de los Julios: la imagen cristiana más antigua del Vaticano.","La calle de mausoleos paganos, con estucos y frescos en su lugar original.","El **trofeo de Gayo**, el monumento que hacia el año 200 ya marcaba la tumba.","El **Muro G**, cubierto de grafitos de peregrinos, donde aparecieron los huesos.","El punto final del recorrido: exactamente debajo del altar papal."],"zone":"Vaticano y Prati"},{"time":"10:00","name":"Mientras tanto: Mercato Trionfale","tag":"food","type":"food","dur":90,"quick":"El resto del grupo. Mercado cubierto enorme, muy romano y cómodo con chicos.","hist":"Uno de los mercados cubiertos más grandes de Roma, en funcionamiento desde hace más de un siglo.","logi":{"Horario":"7:00 a 15:00","A pie":"12 min desde la plaza","Sobre el horario":"Cerrado los domingos."},"map":"Mercato Trionfale, Roma","travel":{"mode":"walk","dur":15,"costAd":"Gratis","costCh":"Gratis","how":"Desde la Piazza San Pietro, subir por Via di Porta Angelica hasta Piazza Risorgimento y seguir por Via Andrea Doria. El mercado ocupa una manzana entera."},"id":"s25","day":"13","hrs":{"open":[[420,900]],"closed":[0]},"hv":false,"pri":2,"full":"Es uno de los mercados cubiertos más grandes de Roma y el más antiguo de los que siguen funcionando: nació en 1890 como feria al aire libre sobre Via Andrea Doria, cuando el barrio Prati todavía era campo abierto entre el Vaticano y el Tíber. En 2009 se mudó al edificio actual, pero los puestos y las familias que los atienden son los de siempre.\n\nSon más de doscientos setenta puestos repartidos en dos niveles. Verdulerías con la producción del Agro Romano, pescaderías con la pesca de Fiumicino, carnicerías, quesos del Lacio y de Cerdeña, embutidos, panaderías, y varios puestos de comida preparada donde se almuerza barato y bien.\n\nEn octubre están de temporada la alcachofa romanesca, la uva fresca, las castañas y los primeros porcini. Es buen lugar para comprar la merienda de las nenas, o simplemente para caminar entre los puestos escuchando cómo se pelea el precio en romanesco.\n\nEstá a doce minutos a pie de la Plaza de San Pedro, subiendo por Via di Porta Angelica hasta Piazza Risorgimento. Abre de mañana y cierra alrededor de las tres.","fullSource":"propio","ver":["Los puestos de quesos y embutidos del sector cubierto.","Las verdulerías: en octubre está la alcachofa romanesca y la uva fresca.","Buen lugar para comprar la merienda de las nenas."],"zone":"Vaticano y Prati"},{"time":"12:30","name":"Reencuentro y almuerzo","tag":"food","type":"food","dur":90,"quick":"Todos juntos otra vez, en Borgo Pio o Prati.","logi":{"Costo adultos":"€15 a €25","Costo niños":"€8 a €12"},"travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Bajar del mercado por Via Leone IV hacia Borgo Pio, donde salen los del Scavi."},"id":"s26","day":"13","pri":3},{"time":"15:30","name":"Sant'Andrea delle Fratte","tag":"site","type":"site","dur":40,"quick":"Donde la Virgen se le apareció a Ratisbonne. Los ángeles de Bernini.","hist":"El 20 de enero de 1842 el judío Alphonse Ratisbonne, que se había puesto la Medalla Milagrosa casi por burla, vio aquí a la Virgen y se convirtió en el acto.","travel":{"mode":"metro","dur":30,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Caminar hasta Ottaviano (línea A) y tomar dirección Anagnina hasta Spagna. Salir por Piazza di Spagna y caminar cinco minutos por Via di Propaganda hasta Via Sant'Andrea delle Fratte.","tip":"La estación Spagna tiene escaleras mecánicas largas: cómoda con cochecito."},"full":"La iglesia de Sant' Andrea delle Fratte (San Andrés de las malezas) toma el nombre del antiguo emplazamiento que hasta el 1880 aprox. era bastante rural, tanto como para ser denominada Sant'Andrea in Hortis. La construcción de la actual iglesia empezó alrededor del 1604 siguiendo el proyecto de Gaspare Guerra, los trabajos sufrieron diversos paros e incluso Borromini fue encargado para la realización, que desde el 1653 hasta el año de su muerte en 1667 siguió los trabajos y cambió el proyecto realizando una de sus ingeniosas arquitecturas echando mano a toda la parte alta de la iglesia: el ábside, el campanil y el tambor de la cúpula que vistos desde lo alto forman la clásica cruz de Sant' Andrea, esta misma arquitectura no fue nunca completada porque el conjunto fue concebido con revestimiento de mármol y en cambio, por otro lado resultando fascinante, ha permanecido todo en ladrillos. Entre los transeptos y el presbiterio es posible admirar la copia de los Ángeles esculpidos de la propia mano de Bernini para decorar Ponte Sant'Angelo pero considerados demasiado bellos para ser expuestos a la intemperie y donados a la iglesia de S. Andrea delle Fratte por los herederos de Bernini. Conversión de Alfonso de Ratisbona Aquí tuvo lugar la milagrosa aparición de la Virgen que convirtió al cristianismo al judío A. Ratibonne, de hecho la iglesia es también denominada \"Virgen del Milagro\".\n\nAlfonso Tobías de Ratisbona era un abogado y banquero judío de 27 años, de muy buena posición económica que profesaba gran odio hacia la religión católica porque uno de sus hermanos, Teodoro, se había convertido y ordenado sacerdote. Ratisbona conoció al Barón Teodoro de Bussiere, noble francés criado en el error protestante pero convertido al catolicismo, quien se había impuesto como misión convertir al catolicismo a todos los no creyentes y a las personas de otras religiones. Corría el año de 1842. Durante una cena en su casa, en Roma, el Barón le propuso al acaudalado banquero un desafío: pidió a Ratisbona que se colocase la Medalla Milagrosa. Parece ser que el ateo practicante tomó la propuesta como algo pueril pero al fin la aceptó, aunque al colgarse la medalla del cuello exclamó riéndose con sarcasmo: “Bueno, ya soy católico, apostólico y romano”. “Era el demonio que profetizaba con mi boca”, comentaría después Alfonso. El señor de Bussiéres exultaba ingenuamente por su victoria y quiso hacerla todavía mayor, proponiéndole que rezara por la mañana y por la tarde el Acordaos de San Bernardo. Alfonso sintió bullir dentro de sí toda su animosidad, todo su resentimiento contra el proselitismo y contra todos los que él llamaba hipócritas y apóstatas. Para encerrar el tema y sin dar mayor importancia a la cosa, le prometió a Teodoro rezar la oración: “Aunque no me beneficie, por lo menos no me perjudicará”, comentó Alfonso. El jueves 20 de enero de 1842, debiendo Teodoro encargar una Misa por el Conde de Laferronays, pidió a Ratisbona que lo acompañase a la basílica de Santa Andrea delle Fratte, en Roma. Al entrar, se dirigió a la sacristía mientras Alfonso admiraba las obras de artes. Grande fue su sorpresa cuando, al volver, se encontró al renegado de rodillas, orando fervientemente frente a uno de los altares. Cuando le preguntó que sucedía, aquel le respondió que había ocurrido un milagro: \"...Me sentí dominado por una turbación inexplicable. En la capilla de San Miguel se había concentrado toda la luz, y en medio de aquel esplendor apareció sobre el altar, radiante y llena de majestad y de dulzura, la Virgen Santísima tal y como está grabada en la medalla milagrosa. Una fuerza irresistible me impulsó hacia la capilla. Entonces la Virgen me hizo una seña con la mano como indicándome que me arrodillara... La Virgen no me habló pero lo he comprendido todo\". Poco tiempo después pidió ser bautizado en la Iglesia de Gesu en Roma, tomó la Primera Comunión y se confirmó en la verdadera Fe. Habiendo ingresado en la Compañía de Jesús en 1847 se ordenó sacerdote, siendo destinado primeramente a París donde ayudó a su hermano Teodoro en la conversión de judíos y en 1848 viajó a Tierra Santa donde fundó en 1855 el Convento de Nuestra Señora de Sión. Murió en 1884 en Ain-Karim, a los 70 años, cuando hacía tiempo que la Iglesia había reconocido a su conversión como verdadero milagro.\n\n2. RIONE TREVI 81 –Ss. Apostoli 82 –Madonna dell’Archetto 83 –S. Marcello al Croso 84 –S. Maria in Trivio 84a –Fontana di Trevi 85 –S. Maria in Via 86 –Santa Susanna e S. Maria della Vittoria","logi":{"Horario":"6:30 a 12:30 y 16:00 a 19:00","Costo":"Gratis","No perderse":"Los dos ángeles que Bernini talló para el Ponte Sant'Angelo"},"map":"Sant'Andrea delle Fratte, Roma","id":"s27","day":"13","hrs":{"open":[[390,750],[960,1140]],"closed":[]},"hv":false,"pri":2,"ver":["La capilla de la izquierda donde, el 20 de enero de 1842, se le apareció la Virgen a Alphonse Ratisbonne.","Los **dos ángeles de Bernini**, tallados para el Ponte Sant'Angelo y nunca colocados ahí: los conservó para sí.","El campanario y la cúpula de Borromini, que se ven mejor desde la calle de atrás."],"zone":"El norte · Spagna y Popolo"},{"time":"16:15","name":"Trinità dei Monti","tag":"site","type":"site","dur":35,"quick":"La iglesia francesa en lo alto de la Escalinata.","hist":"Fundada por Carlos VIII de Francia en 1502 y confiada después a los Mínimos de San Francisco de Paula.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Volver a Piazza di Spagna y subir la Escalinata de la Plaza de España, 135 escalones. Con cochecito, tomar el ascensor de la estación de metro Spagna, que sale arriba de todo.","tip":"La vista desde el atrio, con el obelisco en primer plano, es de las mejores de Roma."},"full":"Fundada por Carlos VIII de Francia en 1495, está precedida por la escalinata más famosa de Roma, contruída entre 1723 y 1726 por de Sanctis, según el dibujo de Specchi, alumno de Fontana; es un monumento barroco con gusto por perspectivas y por el trampantojo. Fue construida en homenaje a la Santísima Trinidad. Desde principios de los 50, durante la primavera, la escalinata es adornada con miles de azaleas, por lo que Trinità dei Monti se muestra preciosa. En la Plaza de España se encuentra también la Barcaccia, la famosa fuente barroca esculpida por Bernini. Fue construida para recordar la inundación que asoló Roma a finales del 1500. Las barcazas, embarcaciones utilizadas para el transporte de mercancías, permitieron llegar al punto donde se encuentra la fuente del Tíber. La fachada realizada por Maderno es de finales del s. XVI. En la segunda capilla de la izquierda, se encuentra la Deposición de la Cruz, de Daniel de Volterra, también autor de la Asunción de la tercera capilla de la derecha.","logi":{"Horario":"10:15 a 20:00","Costo":"Gratis","No perderse":"La Deposición de Daniele da Volterra","Sobre el horario":"Cerrada los lunes."},"map":"Trinità dei Monti, Roma","id":"s28","day":"13","hrs":{"open":[[615,1200]],"closed":[1]},"hv":false,"pri":2,"ver":["La **Deposición** de Daniele da Volterra, discípulo de Miguel Ángel, en la tercera capilla de la izquierda.","La vista desde el atrio, con el obelisco en primer plano y Roma al fondo.","Los frescos del refectorio, si está abierto: incluyen una anamorfosis de San Francisco de Paula que solo se entiende desde un punto exacto."],"zone":"El norte · Spagna y Popolo"},{"time":"17:00","name":"Pincio","tag":"site","type":"site","dur":20,"quick":"El mirador sobre Piazza del Popolo, con Roma entera de fondo.","hist":"La colina de los jardines de Lúculo en la antigüedad. La terraza actual la diseñó Giuseppe Valadier a comienzos del siglo XIX.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Desde Trinità dei Monti, seguir el Viale Trinità dei Monti bordeando el parque. El paseo lleva directo a la terraza del Pincio.","tip":"Es plano y arbolado: el mejor tramo del día para los cochecitos."},"full":"Fue el primer parque público de Roma. Lo proyectó Giuseppe Valadier y se construyó por orden de Napoleón, que había invadido los Estados Pontificios en 1809 y quería para Roma un paseo a la altura de los de París. Se terminó después de la caída del Imperio, ya con los papas de vuelta.\n\nLa colina, sin embargo, es mucho más vieja. En la antigüedad se llamaba *collis hortulorum*, la colina de los jardines, porque acá estaban las villas de Lúculo y de Salustio, las más famosas de la Roma republicana. Mesalina, la mujer de Claudio, hizo matar al dueño de los jardines de Lúculo para quedarse con ellos, y en ellos la mataron a ella.\n\nLa terraza mira sobre Piazza del Popolo: abajo el obelisco de Ramsés II, las dos iglesias gemelas de Santa Maria in Montesanto y Santa Maria dei Miracoli, y las tres calles del Tridente abriéndose hacia el centro. Al fondo, recortada contra el horizonte, la cúpula de San Pedro.\n\nEntre los árboles del paseo hay un reloj de agua, el *idrocronometro*, construido por el dominico Giovan Battista Embriaco en 1867: un mecanismo movido por un chorro que sigue funcionando.\n\nEs la mejor vista de Roma al atardecer, y es gratis. El tramo desde Trinità dei Monti es plano y arbolado: el mejor del día para los cochecitos.","logi":{"Costo":"Gratis","Mejor momento":"Última hora de la tarde"},"map":"Terrazza del Pincio, Roma","id":"s29","day":"13","pri":2,"fullSource":"propio","ver":["La terraza sobre Piazza del Popolo, con las dos iglesias gemelas abajo.","La cúpula de San Pedro recortada al fondo: al atardecer es la mejor vista de Roma.","El **idrocronometro**, un reloj movido por agua escondido entre los árboles del paseo."],"zone":"El norte · Spagna y Popolo"},{"time":"17:20","name":"Santa Maria del Popolo","tag":"site","type":"site","dur":40,"quick":"Dos Caravaggio y la capilla Chigi de Rafael.","hist":"Levantada en 1099 sobre el sepulcro de los Domicios, donde la leyenda situaba la tumba de Nerón. Reconstruida por Sixto IV en el Renacimiento.","travel":{"mode":"walk","dur":8,"costAd":"Gratis","costCh":"Gratis","how":"Bajar del Pincio por la rampa en zigzag hasta Piazza del Popolo. La iglesia está a la izquierda, pegada a la Porta del Popolo."},"full":"La iglesia actual fue erigida en 1477 por Sixto IV, sobre una antigua capilla levantada por el Papa Pascual II con limosnas del pueblo romano, en acción de gracias por la conquista de Jerusalén, en julio de 1099. Un bosque de álamos cubría antiguamente la tumba, y de este particular han deducido\n\notro origen del nombre de la puerta, de la iglesia y de la misma plaza: álamo en latín se dice populus. La iglesia sufrió en el s.XVII algunas reformas barrocas, obra de Bramante, pero que no alteraron substancialmente su aspecto arquitectónico florentino–romano, característico de la época sixtina. En el convento de esta iglesia vivía Lutero antes de abandonar el catolicismo. El interior es de tres naves, con bóvedas sostenidas por pilastras, con medias columnas adosadas, y crucero coronado por una cúpula. Sobre el altar de la primera capilla de la derecha, se encuentra una Adoración del Niño, de Pinturicchio, que pintó también las lunetas con escenas de la vida de San Jerónimo. La segunda tiene 16 columnas de jaspe siciliano y sobre el altar, un cuadro de Maratta que representa la Asunción. En la tercera, frescos de Pinturicchio y de otros colaboradores. La cúpula del crucero es la primera construida en Roma después de la época romana. El altar mayor fue reconstruido por Bernini, y en él se venera una imagen de la Virgen del s. XIII. En el techo, frescos de Pinturicchio. A la izquierda del altar mayor, en la primera capilla, hay dos obras de Caravaggio: la Crucifixión de San Pedro y la Conversión de San Pablo. La Capilla Chigi, la segunda de la nave de la izquierda, es obra de Rafael. Son de Rafael los mosaicos de la bóveda, con escenas del Antiguo y del Nuevo Testamento. En los lados, las tumbas de los Chigi en forma de pirámide. De la Piazza del Popolo parten tres calles: Babuino, Corso y Ripetta. Esta última conducía directamente al puerto de Ripetta, sobre el Tíber, antiquísimo punto de avituallamiento de la Urbe. Era, junto al Corso, lugar de paso obligado para los peregrinos ilustres que, después de atravesar la porta del Popolo, se dirigían hacia San Pedro. 4. RIONE CASTRO PRETORIO 15 –Sacro Cuore 15a –S. Maria degli Angeli 15b –Termas de Dioclesiano","logi":{"Horario":"7:15 a 12:30 y 16:00 a 19:00","Costo":"Gratis","No perderse":"La Conversión de San Pablo y la Crucifixión de San Pedro, en la capilla Cerasi"},"map":"Basilica di Santa Maria del Popolo, Roma","id":"s30","day":"13","hrs":{"open":[[435,750],[960,1140]],"closed":[]},"hv":false,"pri":1,"ver":["Los **dos Caravaggio** en la capilla Cerasi, a la izquierda del altar mayor: la Conversión de San Pablo y la Crucifixión de San Pedro.","La **capilla Chigi**, segunda de la nave izquierda, proyectada por Rafael: los mosaicos de la bóveda son suyos.","La **Adoración del Niño** de Pinturicchio, sobre el altar de la primera capilla de la derecha."],"zone":"El norte · Spagna y Popolo"},{"time":"18:00","name":"Retiro de entradas de la audiencia","tag":"rest","type":"rest","dur":20,"quick":"Santa Maria in Montesanto, sobre Piazza del Popolo. Son las entradas de mañana.","hist":"Una de las dos iglesias gemelas que enmarcan la entrada al Tridente. Montesanto es la de la izquierda mirando desde la plaza.","travel":{"mode":"walk","dur":3,"costAd":"Gratis","costCh":"Gratis","how":"Cruzar Piazza del Popolo: Santa Maria in Montesanto es la iglesia gemela de la izquierda, entre Via del Babuino y Via del Corso.","tip":"Sin estas entradas no se entra a la audiencia. Es el trámite más importante del día."},"logi":{"Confirmar":"Verificar el punto de retiro antes del viaje","Llevar":"Nombre de la reserva y cantidad de personas"},"map":"Santa Maria in Montesanto, Roma","id":"s31","day":"13","pri":1},{"time":"19:00","name":"Vuelta al departamento","tag":"rest","type":"rest","quick":"Día largo. Cena tranquila en el barrio.","travel":{"mode":"metro","dur":35,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Caminar a la estación Flaminio (línea A), tomar dirección Battistini hasta Ottaviano y bajar por Via di Porta Cavalleggeri."},"id":"s32","day":"13","pri":3}]},{"date":"2026-10-14","phase":1,"weekday":"Mié","dd":"14","title":"Audiencia · Letrán","note":"El día más largo del viaje: arranca 7:30 y cierra pasadas las 18:30. Vengan preparados.","stops":[{"time":"07:30","name":"En la Plaza de San Pedro","tag":"mass","type":"mass","dur":90,"quick":"Temprano, para conseguir buen lugar antes del control de seguridad.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Mismo camino de siempre: Via di Porta Cavalleggeri hasta Piazza del Sant'Uffizio y entrada por la columnata izquierda.","tip":"Llevar las entradas impresas o en el celular, y agua. Después del control ya no se sale."},"logi":{"Entradas":"Retiradas el martes 13","Costo":"Gratis","Consejo":"Cuanto más temprano, más cerca del pasillo central"},"map":"Piazza San Pietro, Roma","id":"s33","day":"14","pri":1,"full":"Bernini la diseñó entre 1656 y 1667 con una idea que él mismo explicó: los dos brazos de la columnata son los brazos maternos de la Iglesia, que se abren para abrazar a los católicos y para llamar a los que están afuera. Son 284 columnas y 88 pilastras en cuatro filas, coronadas por 140 estatuas de santos de tres metros y medio cada una.\n\nHay dos discos de piedra en el pavimento, uno a cada lado del obelisco, marcados como centro de la elipse. Parándose exactamente encima, las cuatro filas de columnas se alinean y se ven como una sola. Es un truco de geometría que Bernini calculó, y funciona.\n\nEl obelisco del centro es el testigo más antiguo del lugar. Lo trajo Calígula desde Egipto en el año 37 y lo plantó en el circo que después usaría Nerón: el mismo circo donde, hacia el 64, fueron martirizados los cristianos de Roma y donde, según la tradición, murió San Pedro. Estuvo mil quinientos años al costado de la basílica hasta que Sixto V, en 1586, lo hizo trasladar al centro de la plaza. El traslado ocupó a novecientos hombres y ciento cuarenta caballos durante cuatro meses, y se cuenta que el papa mandó guardar silencio absoluto bajo pena de muerte para que se oyeran las órdenes.\n\nEn lo alto del Palacio Apostólico, a la derecha, la segunda ventana del último piso es la del estudio del Papa: desde ahí se reza el Ángelus los domingos al mediodía.","fullSource":"propio","ver":["El **obelisco egipcio** del centro: estaba en el circo de Nerón y fue testigo del martirio de Pedro.","La columnata de Bernini: parándose en los discos de piedra del piso, las cuatro filas de columnas se ven como una sola.","La ventana del Palacio Apostólico, tercer piso, desde donde se reza el Ángelus."],"zone":"Vaticano y Prati"},{"time":"09:00","name":"Audiencia general","tag":"mass","type":"mass","dur":90,"quick":"Catequesis, saludos por idiomas y bendición final.","hist":"Las audiencias generales de los miércoles se celebran desde el siglo XIX. Cuando el tiempo lo permite se hacen en la plaza; si llueve, en el Aula Pablo VI.","logi":{"Duración":"90 min aprox.","Salida":"Hacia las 10:45"},"travel":{"mode":"walk","dur":2,"costAd":"Gratis","costCh":"Gratis","how":"Ya están ubicados en la plaza desde temprano."},"id":"s34","day":"14","pri":1,"full":"Los miércoles el Papa recibe a los peregrinos. Cuando el tiempo acompaña se hace en la plaza, y si llueve o hace frío, en el Aula Pablo VI, el gran salón que Pier Luigi Nervi construyó en 1971 detrás de la columnata izquierda, con capacidad para más de seis mil personas.\n\nLa costumbre viene del siglo XIX, pero fue Pablo VI quien le dio la forma actual: una catequesis breve sobre un tema que se desarrolla durante semanas, la lectura de un pasaje de la Escritura, y después el saludo grupo por grupo. Ese momento es el más largo y el más vivo: un lector va nombrando en cada idioma las parroquias, colegios y peregrinaciones presentes, y cada grupo responde con aplausos, banderas y cantos. Los argentinos suelen hacerse oír.\n\nLa audiencia cierra con el rezo del Padrenuestro en latín, cantado por toda la plaza, y la bendición apostólica. Esa bendición alcanza también a los objetos religiosos que se lleven encima: es el momento de sacar del bolsillo los rosarios, las medallas y las estampitas.\n\nLa entrada es gratuita pero hace falta el billete, que se retira el día anterior. Conviene estar temprano: el control de seguridad se abre a las 7:00 y los primeros en pasar son los que consiguen lugar sobre el pasillo central, por donde circula el papamóvil antes de empezar.","fullSource":"propio","ver":["La catequesis del Papa, y después los saludos grupo por grupo en cada idioma.","La bendición final alcanza también a los objetos religiosos: si llevan rosarios o medallas, sáquenlos."],"zone":"Vaticano y Prati"},{"time":"11:00","name":"Traslado a San Giovanni","tag":"rest","type":"rest","dur":45,"quick":"Metro A directo, sin combinaciones.","travel":{"mode":"metro","dur":35,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Desde Ottaviano, línea A dirección Anagnina hasta la estación San Giovanni. La basílica se ve al salir, cruzando la plaza.","tip":"Son once paradas, siempre en la misma línea. Nadie se pierde."},"id":"s35","day":"14","pri":3},{"time":"12:30","name":"Almuerzo cerca de Letrán","tag":"food","type":"food","dur":90,"quick":"Zona San Giovanni, tranquila y barata.","logi":{"Costo adultos":"€12 a €20","Costo niños":"€7 a €10"},"travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Las calles detrás de la basílica, hacia Via Merulana, tienen trattorias de barrio a buen precio."},"id":"s36","day":"14","pri":3},{"time":"14:00","name":"San Juan de Letrán","tag":"site","type":"site","dur":75,"quick":"La catedral de Roma, madre y cabeza de todas las iglesias. Y el Baptisterio.","hist":"Donada por Constantino al papa San Silvestre hacia el año 313. Fue residencia de los papas durante mil años y sigue siendo la catedral del obispo de Roma.","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Cruzar la Piazza di San Giovanni in Laterano hacia la fachada principal, la de las quince estatuas colosales."},"full":"Notas generales San Juan de Letrán es una de las cuatro basílicas patriarcales o mayores. El nombre proviene de sus primeros propietarios. La Basílica, dedicada al Salvador, fue construida sobre los palacios de los Laterani, donados por Constantino al Papa Melquiades. La primera mención se remonta al 313, fecha en que se tuvo un consistorio de obispos in domum Faustae in Lateranum. En la fachada actual se lee: Sacrosancta Ecclesiarum omnium urbis et orbis Mater et Caput (Sacrosanta madre y cabeza de todas las iglesias de la ciudad y del mundo). El 28 de octubre del 312, después de vencer a Majencio, Constantino hizo su entrada triunfal en Roma e inmediatamente acabó con la persecución de los cristianos. En el 314 el Papa Silvestre I fue a vivir al Laterano, donde se fijó la residencia oficial del papado hasta el exilio de Avignon. Antes de iniciar la construcción de la antigua basílica de San Pedro en el Vaticano, Constantino construyó la Basílica Laterana en el lugar donde se encontraban las viviendas de la guardia personal –los equites singulares–de Majencio. La Basílica estaba dedicada al Salvador y, aunque no era de dimensiones extraordinarias, tenía cinco naves y estaba precedida por un pórtico y un atrio con fuentes; en lo alto de la fachada estaba la imagen del Salvador. Posteriormente fue dedicada a San Juan Bautista y a San Juan Evangelista. Después de ser dañada por los bárbaros en el s. V y por un terremoto en el 896, fue destruida por un incendio en 1308. La Basílica se reconstruyó en le época barroca y en el s. XVIII. En total veinte Papas contribuyeron a su reconstrucción, restauración y embellecimiento: desde San León Magno (440–461) hasta León XIII (1878–1903). En este lugar se llevaron a cabo los cinco Concilios Lateranenses, decisivos en la historia de la Iglesia. Aquí fue, por ejemplo, donde Nicolás II reunió en el 1059 el Sínodo que determinó que la elección del Papa correspondía a los cardenales Por evidentes razones históricas, en 1962 Juan XXIII quiso que volvieran a Letrán las oficinas de la curia de la diócesis de Roma. Fachada Obra de Alessandro Galilei (1735), es probablemente la fachada más sugestiva de todas las basílicas romanas. Destaca el contraste entre las claras líneas de las columnas con las cavidades oscuras. Sobre la balaustrada de coronamiento se encuentran 15 estatuas, de 7 m. de altura, de Cristo, San Juan Bautista, San Juan Evangelista y Doctores de la Iglesia. Entrando en el pórtico, la puerta central de comunicación con el interior, proviene de la Curia o Parlamento del Foro Romano –probablemente la puerta más antigua que se conserva en el mundo–, y fue agrandada en 1660 con la adición de las zonas donde se encuentran las estrellas del Papa Alejandro VII. La última puerta de la derecha es la Puerta santa, que se abre sólo en los años jubilares. A la izquierda está la estatua del emperador Constantino, proveniente de las Termas del Quirinal. Sobre la estatua y sobre las puertas, se pueden ver varios altorrelieves en mármol con la historia de la vida del Bautista.","logi":{"Horario":"7:00 a 18:30 · salida hasta 18:45","Costo":"Gratis · claustro €5","No perderse":"Las cabezas de San Pedro y San Pablo sobre el baldaquino, y el Baptisterio","Sobre el horario":"El claustro 9:00 a 18:00 (€5). El Baptisterio 7:00 a 12:30 y 16:00 a 19:00: al mediodía está cerrado."},"map":"Basilica di San Giovanni in Laterano, Roma","id":"s37","day":"14","hrs":{"open":[[420,1110]],"closed":[]},"hv":true,"pri":1,"ver":["Las **cabezas de San Pedro y San Pablo** en los relicarios sobre el baldaquino gótico.","Las **doce estatuas colosales de los apóstoles** en la nave, cada una con el instrumento de su martirio.","El **claustro cosmatesco** del siglo XIII, con las columnas retorcidas y los mármoles de colores.","La **Porta Santa**, la última de la derecha en la fachada.","El **Baptisterio** está al lado, pero a esta hora cierra: queda para el final del día, a las 17:50."],"zone":"Letrán"},{"time":"15:20","name":"Scala Santa","tag":"mass","type":"mass","dur":55,"quick":"Los 28 escalones del pretorio de Pilato. Se suben de rodillas.","hist":"Traída de Jerusalén por Santa Elena y trasladada aquí por Sixto V en 1589. Arriba está el Sancta Sanctorum, la capilla privada de los papas medievales.","travel":{"mode":"walk","dur":4,"costAd":"Gratis","costCh":"Gratis","how":"Cruzar la plaza hacia el edificio de enfrente, sobre Piazza di San Giovanni in Laterano 14. La escalera santa está en el centro; a los costados hay escaleras normales para bajar."},"full":"Sixto V (1585–90) mandó demoler lo que quedaba del Palacio Laterano medieval, con dos excepciones: la Scala Santa, escaleras que de acuerdo con la tradición pertenecieron al palacio de Poncio Pilato y por las que subió Cristo el Viernes Santo, y la capilla privada de los Papas. Fueron trasladadas a un lugar cercano al original, en una construcción especialmente diseñada por Domenico Fontana para albergar la escalera, que tradicionalmente se sube de rodillas, en memoria de la Pasión del Señor. Los 28 escalones de mármol están recubiertos de madera, para aligerar la subida y para evitar el desgaste. En ciertos puntos, unos trozos de vidrio cubren manchas tradicionalmente consideradas gotas de la Sangre de Nuestro Señor. Al final de la escalera se llega al ambulatorio de la Capilla de San Lorenzo papal, también llamada Sancta Sanctorum, por las preciosas reliquias que contiene. Está siempre cerrada, pero a través de las rejas se puede apreciar la decoración de cosmatesco. Sobre el altar se encuentra el famoso icono de Cristo Archeiropoeton, es decir, no pintado por mano humana: la tradición dice que lo comenzó San Lucas y fue terminado por un ángel; llegó milagrosamente a Roma, desde Constantinopla, en el s. VIII. En realidad, todo parece indicar que se trata de una pintura sobre madera del s. VI o VII. La inscripción sobre el altar –non est in toto sanctior orbe locus (no hay en todo el orbe un lugar más santo que este)–afirma que nos encontramos en el lugar más santo de la tierra. Durante la Edad Media esta imagen era llevada en procesión por los Papas ante las grandes calamidades de la ciudad. Alrededor del altar están otras reliquias, y en las paredes hay 28 tabernáculos ojivales.","logi":{"Horario":"6:00 a 14:00 y 15:00 a 19:00","Costo":"Gratis · Sancta Sanctorum €3,50","Consejo":"Llevar algo para las rodillas si alguien lo necesita","Sobre el horario":"Subir de rodillas: hasta 13:30 y de 15:00 a 18:30. El Sancta Sanctorum cierra a las 17:00 y cuesta €3,50. Domingos abre 7:00. scala-santa.com"},"map":"Scala Santa, Roma","id":"s38","day":"14","hrs":{"open":[[360,840],[900,1140]],"closed":[]},"hv":true,"pri":1,"ver":["Los **28 escalones** que se suben de rodillas, en silencio. Al costado hay escaleras normales para bajar.","El **Sancta Sanctorum** arriba: se ve a través de la reja, era la capilla privada de los papas.","La **Acheropita**, la imagen del Salvador \"no pintada por mano de hombre\", detrás del altar de esa capilla."],"zone":"Letrán"},{"time":"16:30","name":"Santa Croce in Gerusalemme","tag":"site","type":"site","dur":60,"quick":"Las reliquias de la Pasión que trajo Santa Elena.","hist":"Levantada dentro del palacio de Santa Elena, madre de Constantino, para custodiar las reliquias que trajo de Tierra Santa hacia el año 325.","travel":{"mode":"walk","dur":15,"costAd":"Gratis","costCh":"Gratis","how":"Salir por Viale Carlo Felice, la avenida arbolada que une las dos basílicas en línea recta, un kilómetro exacto. Con cochecito es cómodo y todo llano.","tip":"Si el grupo está cansado, el tranvía 3 hace el mismo trayecto en cinco minutos."},"full":"\"¿pero dónde está el trofeo de la victoria? ¿Yo estoy en un trono y la cruz del Señor enterrada en el polvo? ¿Yo estoy rodeada de oro y el triunfo de Cristo entre las ruinas? (...). Veo que has hecho todo lo posible, diablo, para que fuese sepultada la espada que te ha reducido a la nada\". Santa Elena Entre los judíos estaba prohibido sepultar a los condenados en el cementerio común, y ése fue uno de los motivos por los que llevaron el cuerpo de Jesús a un sepulcro particular, donado por José de Arimatea. También los instrumentos de tortura usados para las ejecuciones se consideraban impuros, y por eso se enterraban o eran arrojados en alguna hendidura del terreno, fuera del alcance de la gente. No menos ignominiosa que esos instrumentos debía de resultar la colina del Gólgota para los habitantes de Jerusalén, como revelan las connotaciones siniestras de su nombre latino: locus calvariae, lugar de la calavera. Después de la Resurrección del Señor, sin duda produjo gran sorpresa en la ciudad el hecho de que los cristianos se acercasen con frecuencia a aquel desolador paraje, para arrodillarse en la tierra que había sido bañada por la sangre de Cristo y rezar junto al\n\nagujero donde había sido plantada la Cruz; también acudían a besar la roca en que había reposado su cuerpo muerto. Muy posiblemente esa costumbre tuvo que ser interrumpida en algunas épocas, a causa de las persecuciones y de otros avatares, como la destrucción de Jerusalén en el año 70 de nuestra era. No obstante, aún debía de conservarse en el siglo II, pues el emperador Adriano (117-138) mandó rellenar con tierra la depresión que separaba el Gólgota del Santo Sepulcro y en esa nueva plataforma hizo edificar dos templos: uno dedicado ajuno, sobre el Sepulcro; y otro dedicado a Venus, en la cima del Gólgota. Se sabe que Adriano sintió gran animadversión hacia el cristianismo al final de su vida, y es casi seguro que la construcción de estos templos tenía como fin borrar para siempre las huellas terrenas de la Redención. Los primeros historiadores eclesiásticos comentaban no sin cierta ironía el paradójico resultado que, con el correr del tiempo, tuvieron estos esfuerzos de los paganos. ¡Pobres hombres! –les apostrofaba Eusebio de Cesarea–¡Creían que era posible esconder al género humano el esplendor del sol que se había levantado sobre el mundo! Aún no comprendían que es imposible mantener oculto bajo tierra a Quien ha obtenido ya la victoria sobre la muerte. En efecto, en el siglo IV, cuando la Iglesia gozó al fin de libertad, los dos templos paganos permitieron localizar sin margen de error la situación de los Santos Lugares: bastó derruirlos y excavar debajo para encontrar el Santo Sepulcro y la cima del Calvario. La invención (descubrimiento) de la Santa Cruz. La gran impulsora del redescubrimiento de los Lugares de la Pasión fue la Emperatriz Santa Elena, que en el año 326 viajó a Tierra Santa. La madre de Constantino era ya de avanzada edad –debía de frisar los ochenta años–, pero no quería morir sin antes haber rezado en la tierra donde el Señor había vivido, muerto y resucitado. Tenemos pocos datos sobre la juventud de Elena. Probablemente nació en Bitinia y tuvo origen humilde. Según San Ambrosio era stabularia –esto es, camarera o sirvienta en una posada–antes de casarse con Constancio Cloro en el 273, unión de la que nació Constantino al año siguiente. Constancio era un ambicioso oficial del ejército romano, que en el 293 alcanzó la dignidad de César. Ese mismo año repudió a su esposa, que no tenía sangre noble, y Elena quedó en la sombra hasta que en el 306 su hijo Constantino le dio el título de Emperatriz. En ese momento Elena ya era cristiana, y se sirvió de la privilegiada posición que ocupaba para hacer el bien, ejercitando la caridad entre los necesitados e impulsando la extensión y dignidad del culto. Tanto brillaba por su fe y su piedad, que San Ambrosio no dudaba en tejer su alabanza diciendo: Mujer grande, que ofreció al emperador mucho más que lo que recibió de él. A su paso por Tierra Santa se debe la construcción de las primitivas basílicas de la Natividad, en Belén, y de la Ascensión, en el Monte de los Olivos. En cuanto al Gólgota, cuando Elena llegó a Jerusalén acababan de ser demolidos los templos paganos, de modo que la Emperatriz pudo cumplir su sueño de arrodillarse en la tierra sobre la que Nuestro Salvador había sido levantado en la Cruz y de rezar en la roca del Santo Sepulcro. Sin embargo, allí mismo reparó en que no se había hallado todavía la más importante de las reliquias. San Ambrosio nos la describe con gran viveza, caminando entre las ruinas de los templos romanos acompañada de soldados y obreros. Y preguntándose: “He aquí el lugar de la batalla: ¿pero dónde está el trofeo de la victoria? ¿Yo estoy en un trono y la cruz del Señor enterrada en el polvo? ¿Yo estoy rodeada de oro y el triunfo de Cristo entre las ruinas? (...). Veo que has hecho todo lo posible, diablo, para que fuese sepultada la espada que te ha reducido a la nada”. Las nuevas excavaciones que la Emperatriz mandó hacer tuvieron fruto cuando, al remover un terreno cercano al Gólgota, se encontraron tres cruces, y la tabla sobre la que se había escrito en hebreo, griego y latín: Jesús Nazareno Rey de los Judíos. Así se produjo la invención -el descubrimiento: inventio en latín significa venir hasta algo, encontrar- de la Santa Cruz del Señor, que había permanecido oculta durante tres siglos. La Santa Emperatriz dejó la mayor parte de las reliquias en Jerusalén, pero llevó consigo a Roma tres fragmentos de la Vera Crux, el título de la condena, uno de los clavos y algunas espinas de la corona que sus verdugos impusieron a Jesús. También hizo trasladar una gran cantidad de tierra del Gólgota y las gradas de piedra de la escalera que el Señor recorrió cuatro veces el día de su pasión, para comparecer ante Pilatos en el Pretorio.","logi":{"Horario":"7:00 a 12:45 y 15:30 a 19:30","Costo":"Gratis","Reliquias":"Capilla al fondo a la izquierda: fragmentos de la Cruz, un clavo, dos espinas y el titulus","Sobre el horario":"Verificar: durante el jubileo abrió corrido de 7:30 a 19:30."},"map":"Basilica di Santa Croce in Gerusalemme, Roma","id":"s39","day":"14","hrs":{"open":[[420,765],[930,1170]],"closed":[]},"hv":false,"pri":1,"ver":["La **capilla de las reliquias**, al fondo a la izquierda subiendo una rampa: fragmentos de la Cruz, un clavo, dos espinas y el **titulus** que Pilato mandó clavar.","El dedo de Santo Tomás, el que metió en el costado de Cristo.","La **capilla de Santa Elena**, en el nivel inferior: el piso está hecho con tierra del Calvario que ella trajo.","La tumba de la venerable Antonietta Meo, muerta a los seis años."],"zone":"Letrán"},{"id":"s70","time":"17:50","name":"Baptisterio de Letrán","tag":"site","type":"site","dur":30,"quick":"El baptisterio más antiguo de la cristiandad. Solo si quedan ganas.","hist":"Lo mandó construir Constantino hacia el año 315, sobre las termas del palacio de Fausta. Durante siglos fue el único lugar de Roma donde se bautizaba, y el modelo del que copiaron todos los baptisterios de Occidente.","ver":["La **planta octogonal**: ocho lados por el octavo día, el de la Resurrección.","Las **ocho columnas de pórfido rojo** alrededor de la pila bautismal.","Los mosaicos del siglo V en las capillas laterales de San Juan Evangelista y San Venancio."],"travel":{"mode":"walk","dur":15,"costAd":"Gratis","costCh":"Gratis","how":"Volver desde Santa Croce por Viale Carlo Felice, la misma avenida arbolada, un kilómetro en línea recta. El Baptisterio está a la izquierda de la basílica, con entrada propia desde la plaza.","tip":"Si el grupo está fundido, el tranvía 3 lo hace en cinco minutos."},"logi":{"Horario":"7:00 a 12:30 y 16:00 a 19:00","Costo":"Gratis","Por qué a esta hora":"Cierra de 12:30 a 16:00. A las 14:00, cuando el grupo llega a Letrán, está cerrado.","Sobre el horario":"Verificado en agosto de 2026. Cierra al mediodía."},"map":"Battistero Lateranense, Roma","day":"14","hrs":{"open":[[420,750],[960,1140]],"closed":[]},"hv":true,"pri":2,"full":"Es el baptisterio más antiguo de la cristiandad y el modelo del que salieron todos los demás. Lo mandó construir Constantino hacia el año 315, sobre las termas del palacio de su segunda esposa Fausta, en el mismo predio que había donado al papa San Silvestre.\n\nDurante siglos fue el único lugar de Roma donde se administraba el bautismo. Las familias de toda la ciudad venían acá, y en la vigilia pascual la pila se llenaba de catecúmenos adultos que se sumergían tres veces. La leyenda medieval quiso que el propio Constantino hubiera sido bautizado aquí por Silvestre; en realidad recibió el bautismo en su lecho de muerte, en Nicomedia, pero el relato quedó grabado en los frescos de las capillas laterales.\n\nSixto III le dio hacia el 440 la forma que todavía tiene: un octógono. El número no es decorativo. Ocho lados por el octavo día, el día después del sábado, el día de la Resurrección: el bautizado muere con Cristo y renace en ese octavo día que no tiene ocaso. Esa idea, materializada en piedra acá, se repitió después en cientos de baptisterios de toda Europa.\n\nEn el centro, ocho columnas de pórfido rojo rodean la pila. Alrededor se abren cuatro capillas: la de San Juan Evangelista y la de San Venancio conservan mosaicos del siglo V y del VII, con fondos de oro y follajes verdes que sobrevivieron a todas las reformas.\n\nEstá a treinta metros de la basílica, con entrada propia desde la plaza. La visita son veinte minutos, y cierra al mediodía.","fullSource":"propio","zone":"Letrán"},{"time":"18:45","name":"Vuelta al departamento","tag":"rest","type":"rest","quick":"Si el grupo no da más, Santa Croce se recorta y se pega al domingo 18.","travel":{"mode":"metro","dur":40,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Volver caminando o en tranvía 3 hasta San Giovanni y tomar la línea A dirección Battistini hasta Ottaviano."},"id":"s40","day":"14","pri":3}]},{"date":"2026-10-15","phase":1,"weekday":"Jue","dd":"15","title":"Vía Apia","note":"Solo la mañana. Tarde y noche libres: es el aniversario de Pablo y Maira, y la fiesta de Santa Teresa de Ávila.","stops":[{"time":"08:30","name":"Salida hacia la Appia","tag":"rest","type":"rest","dur":45,"quick":"Vans o taxis. En transporte público este tramo es incómodo.","logi":{"Distancia":"9 km al sur","Alternativa":"Metro B hasta Circo Massimo y bus 118"},"id":"s41","day":"15","pri":3},{"time":"09:15","name":"Domine Quo Vadis","tag":"site","type":"site","dur":25,"quick":"La capillita donde Cristo salió al encuentro de Pedro que huía.","hist":"Aquí, según los Hechos de Pedro, el Apóstol que escapaba de la persecución se cruzó con Cristo y le preguntó \"Domine, quo vadis?\". La respuesta lo hizo volver a Roma a morir.","travel":{"mode":"car","dur":30,"costAd":"≈ €25 por taxi","costCh":"—","how":"Bajar por el Lungotevere hasta Porta San Sebastiano y seguir por Via Appia Antica. La iglesita está a 800 metros de la puerta, en la primera bifurcación.","tip":"Dejar los vehículos ahí: desde este punto se sigue a pie hasta las catacumbas."},"full":"técnica de entonces. Adoquinada con polígonos de basalto –roca volcánica, de color negro o verdoso–, tenia una anchura total de 14 pies romanos. esto es, poco más de cuatro metros, lo que permitía el paso simultaneo de un carro en cada dirección. Además, contaba con aceras de tierra batida de metro y medio de ancho a cada lado, limitadas por un borde de piedra. Julio César la restauró a costa de su propio patrimonio. Con las sucesivas aportaciones de Augusto, Domiciano y Vespasiano, llegó a sus dimensiones definitivas: 540 kilómetros, que unían la capital del Imperio con Brindisi, al sur de Italia, puerto crucial para el dominio del Mediterráneo y para la comunicación con el Oriente; distancia que podía cubrirse en 13 ó 14 jornadas de viaje Por esta Via llegó San Pablo prisionero a Roma en el año 61. En los primeros 20 kilómetros, flanqueaban la Appia diversas tumbas de ciudadanos ilustres. A la altura de las Catacumbas de San Calixto, se encontraban las sepulturas de los Pomponios, los columbarios de los cocineros imperiales y de los marineros de la flota de Miseno, que tenían el encargo de manejar el toldo del Coliseo. Antes de llegar a las Catacumbas, se encuentra la Iglesia del Quo vadis, a la altura del cruce de la Via Appia con la Via Ardeatina. En esta iglesia se venera una piedra con las huellas de los pies de Cristo, copia del original, que se encuentra en las catacumbas de San Sebastián. Ya cerca de las Catacumbas de San Sebastián, se hallaba el mausoleo de Rómulo, hijo del emperador Majencio y, al lado, el circo de Majencio. La tumba que por grandeza y por su peculiar estado de conservación domina el camino consular es la de Cecilia Metela (s. I a.C.), que se erige al final de una corta subida en la tercera milla de la Via Appia. Está formada por un basamento cuadrangular sobre el que se levanta el cuerpo de fábrica. Tiene cerca de 20 metros de altura y está toda revestida de travertino; en la parte alta, una lápida recuerda a Cecilia, hija de Quinto Metelo Crético, el que sometió la isla de Creta.","logi":{"Horario":"8:00 a 18:00","Costo":"Gratis","En el piso":"La copia de las huellas: el original está en San Sebastián"},"map":"Chiesa del Domine Quo Vadis, Roma","id":"s42","day":"15","hrs":{"open":[[480,1080]],"closed":[]},"hv":false,"pri":2,"ver":["Las **huellas en el mármol** del piso, en el centro de la nave. Son una copia: el original está en San Sebastián.","La placa con el diálogo: \"Domine, quo vadis?\" — \"Venio Romam iterum crucifigi\".","La iglesita es mínima. Diez minutos alcanzan."],"zone":"Fuera de las murallas"},{"time":"10:00","name":"Catacumbas de San Calixto","tag":"site","type":"site","dur":60,"quick":"El mayor cementerio cristiano antiguo. La Cripta de los Papas y la de Santa Cecilia.","hist":"Veinte kilómetros de galerías en cuatro niveles, con medio millón de sepulturas. Aquí fueron enterrados dieciséis papas del siglo III y Santa Cecilia.","travel":{"mode":"walk","dur":15,"costAd":"€10","costCh":"€7 de 7 a 16 · gratis menores de 6","how":"Seguir por Via Appia Antica y tomar a la izquierda la entrada arbolada de San Calixto. El camino de acceso, entre cipreses, es de unos 500 metros.","tip":"Llevar abrigo: abajo hay 16 grados constantes."},"full":"El cementerio oficial más antiguo de la comunidad romana es también conocido porque fue la sepultura de casi todos los Papas del s. III, a excepción del Papa Urbano y del propio Calixto (217– 222), tal vez a causa de los disturbios populares al tiempo de su martirio. También es conocida por su excepcional colección de pintura paleocristiana. INTRODUCCIÓN. Recorriendo la vía Appia Antica, a menos de un kilómetro de la Puerta de San Sebastián, se encuentran la pequeña iglesia del \"Quo Vadis?\", después las Catacumbas de Pretextato, las de San Sebastián y, más allá, la tumba de Cecilia Metela. En el centro de esta área arqueológica, comprendida entre las vías Appia Antica, la Ardeatina y el Callejón de las Siete Iglesias se extiende el \"Complejo Calixtiano\", una vasto predio de unas treinta hectáreas, de las cuales unas quince encierran catacumbas. Las galerías, a veces en cuatro pisos sobrepuestos, alcanzan una longitud de casi veinte kilómetros. Numerosísimas son las tumbas, quizás medio millón. Este complejo resulta formado por varios núcleos cementeriales que se extendieron con el tiempo: el Cementerio de San Calixto y las Criptas de Lucina, que se fusionaron entre sí; los Cementerios de Santa Sotera, de los Santos Marcos, Marceliano y Dámaso, y finalmente el de Balbina. A nosotros nos interesan ahora las Catacumbas de San Calixto, que son entre las más importantes e imponentes de las aproximadamente sesenta catacumbas cristianas de Roma. Se las puede considerar como \"la cuna de la Cristiandad y los archivos de la Iglesia primitiva\", porque ilustran su vida, usos y costumbres, el Credo que profesó, y atestiguan su historia martirial. Tuvieron ellas su origen hacia la mitad del siglo II, a partir de un área funeraria perteneciente tal vez a la noble familia de los Cecilios; a comienzos del tercer siglo, pasaron a depender directamente de la Iglesia de Roma. El papa San Ceferino (199-217) confió la custodia de esta incipiente catacumba al diácono Calixto, a fin de que la administrara en nombre de la Iglesia. Calixto tenía que presidir la excavación para que todos los fieles, sobre todo los pobres y los esclavos, pudieran tener una digna sepultura. Nombrado a su vez papa, Calixto agrandó el complejo funerario que de él tomó el nombre y que llegó a ser el cementerio oficial de la Iglesia de Roma. Los núcleos más antiguos de las catacumbas de San Calixto son las Criptas de Lucina y la Zona llamada de los Papas y de Santa Cecilia, donde se conservan algunas entre las memorias más sagradas del lugar (la Cripta de los Papas y la de Santa Cecilia y los Cubículos de los Sacramentos); las otras zonas son las de San Cayo y de San Eusebio (fines del III siglo), la Occidental (primera mitad del siglo IV) y la Liberiana (segunda mitad de ese siglo). LA ZONA EXTERNA. Esta área a cielo abierto, preexistente a las catacumbas, estaba ocupada a ambos lados de la vía Appia por sepulcros paganos. Posteriormente fueron construidos mausoleos y pequeñas basílicas, sobre o junto a las tumbas de los mártires. De estos monumentos han llegado hasta nosotros tan solo dos pequeños edificios llamados \"Tricoras\", por los tres ábsides que constituyen su planta. Siempre en la superficie externa, tal vez en la \"Tricora occidental\", fueron sepultados cercanos, si bien en tiempos diversos, el papa San Ceferino y el joven mártir de la Eucaristía, San Tarsicio, celebrado en un poema del papa Dámaso (366-384), que recuerda así su martirio: \"Mientras un perverso grupo de fanáticos se abalanzaba sobre Tarsicio que llevaba la Eucaristía, para profanarla, el joven prefirió perder la vida antes que dejar a esos perros rabiosos el Cuerpo de Cristo\". Las dos tricoras han sido restauradas y la oriental desempeña ahora la función de pequeño museo, que contiene inscripciones del cementerio y numerosos fragmentos de sarcófagos, que representan escenas del Antiguo y del Nuevo Testamento. El más importante es el sarcófago del Niño, así llamado por sus dimensiones reducidas y que conserva ahora la parte del frente ricamente esculpida.","logi":{"Horario":"9:00 a 12:00 y 14:00 a 17:00","Cerrado":"Miércoles","Visita":"Solo con guía, unos 45 min","No permitido":"Cochecitos. Hay escaleras","Temperatura":"16 °C todo el año","Sobre el horario":"Cerradas los miércoles. €10 adultos, €7 de 7 a 16 años. La última visita de la mañana sale 12:00."},"map":"Catacombe di San Callisto, Roma","id":"s43","day":"15","hrs":{"open":[[540,720],[840,1020]],"closed":[3]},"hv":true,"pri":1,"ver":["La **Cripta de los Papas**, donde fueron sepultados dieciséis pontífices del siglo III.","La **cripta de Santa Cecilia**, con la copia de la estatua de Maderno en el lugar donde la encontraron incorrupta.","Los símbolos paleocristianos en las paredes: el pez, el ancla, el Buen Pastor.","Los **loculi** vacíos apilados de piso a techo, a los dos lados de las galerías."],"zone":"Fuera de las murallas"},{"time":"11:30","name":"Paseo por la Appia Antica","tag":"site","type":"site","dur":45,"quick":"El empedrado original entre pinos y tumbas romanas.","hist":"Abierta en el 312 a.C. por Appio Claudio. Por estas piedras entró San Pablo a Roma y aquí fueron crucificados los seis mil esclavos de Espartaco.","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Volver a la Via Appia Antica y caminar hacia el sur unos cientos de metros, hasta donde aparece el basolato original."},"full":"Introducción Las carreteras de Roma surgieron con un objetivo netamente militar, pero con el tiempo adoptaron fines diversos, incluido el turismo. Desde Roma partían 29 caminos dispuestos en abanico que enlazaban la ciudad con las provincias de Italia y continuaban en los países lindantes. Sobrepasando los Alpes. Estos caminos, llamados consulares, estaban a su vez enlazados entre sí por vías secundarias, llamadas provinciales. Los caminos tenían generalmente una parte central reservada a carros cuadrúpedos y, a los lados, las aceras más altas para los peatones. Por estos caminos también pasaba el correo romano, que permitía al emperador hacer llegar en poquísimo tiempo sus órdenes hasta los más lejanos confines del Imperio.. Los elevados gastos del correo, que corrían a cargo de las provincias, comprendían el mantenimiento de diversos edificios para el reposo durante el viaje, como mansiones, albergues (stationes), caballerizas, y gastos del numeroso personal de servicio (obreros, arrieros, veterinarios, carpinteros. mozos de cuadra y conductores). También recaía sobre las provincias la alimentación y los gastos inherentes a la estancia de los viajeros. A quien no podía disfrutar de estos servicios del Estado, no le quedaba otra salida que dirigirse a los particulares. De este modo, paralelamente a la organización oficial, nacida para satisfacer las necesidades políticas y militares, surgió rápidamente una organización privada que alquilaba coches y animales y que hacía frente al transporte del correo particular. Guías e itinerarios para viajeros (turistas) fueron escritos desde la más lejana antigüedad. Se recorrían 30 kilómetros al día, con paradas cada cinco, para que los viajeros pudieran apagar su sed o comer un poco. Al llegar la noche, se hospedaban en los albergues oficiales o particulares. La Via Appia Proyectada y llevada a cabo el año 312 a.C. por el Censor Apio Claudio, el ciego. Pretendió ser la más larga y bella de las carreteras romanas, y y pronto se le comenzó a llamar Regina Viarum. Para su alzado se hizo necesario vencer obstáculos sin cuento, como cruzar pantanos y valles, remontar torrentes y ríos, superar montañas, agudizando hasta extremos memorables la ciencia y la técnica de entonces. Adoquinada con polígonos de basalto –roca volcánica, de color negro o verdoso–, tenia una anchura total de 14 pies romanos. esto es, poco más de cuatro metros, lo que permitía el paso simultaneo de un carro en cada dirección. Además, contaba con aceras de tierra batida de metro y medio de ancho a cada lado, limitadas por un borde de piedra. Julio César la restauró a costa de su propio patrimonio. Con las sucesivas aportaciones de Augusto, Domiciano y Vespasiano, llegó a sus dimensiones definitivas: 540 kilómetros, que unían la capital del Imperio con Brindisi, al sur de Italia, puerto crucial para el dominio del Mediterráneo y para la comunicación con el Oriente; distancia que podía cubrirse en 13 ó 14 jornadas de viaje Por esta Via llegó San Pablo prisionero a Roma en el año 61. En los primeros 20 kilómetros, flanqueaban la Appia diversas tumbas de ciudadanos ilustres. A la altura de las Catacumbas de San Calixto, se encontraban las sepulturas de los Pomponios, los columbarios de los cocineros imperiales y de los marineros de la flota de Miseno, que tenían el encargo de manejar el toldo del Coliseo. Antes de llegar a las Catacumbas, se encuentra la Iglesia del Quo vadis, a la altura del cruce de la Via Appia con la Via Ardeatina. En esta iglesia se venera una piedra con las huellas de los pies de Cristo, copia del original, que se encuentra en las catacumbas de San Sebastián. Ya cerca de las Catacumbas de San Sebastián, se hallaba el mausoleo de Rómulo, hijo del emperador Majencio y, al lado, el circo de Majencio. La tumba que por grandeza y por su peculiar estado de conservación domina el camino consular es la de Cecilia Metela (s. I a.C.), que se erige al final de una corta subida en la tercera milla de la Via Appia. Está formada por un basamento cuadrangular sobre el que se levanta el cuerpo de fábrica. Tiene cerca de 20 metros de altura y está toda revestida de travertino; en la parte alta, una lápida recuerda a Cecilia, hija de Quinto Metelo Crético, el que sometió la isla de Creta.","logi":{"Costo":"Gratis","Terreno":"Empedrado irregular, difícil con cochecito"},"map":"Via Appia Antica, Roma","id":"s44","day":"15","pri":2,"ver":["El **basolato** original: las mismas piedras que pisó San Pablo entrando a Roma.","Las tumbas y mausoleos romanos al costado del camino.","Los pinos marítimos. Es el paisaje romano por excelencia."],"zone":"Fuera de las murallas"},{"time":"12:30","name":"Almuerzo en la zona","tag":"food","type":"food","dur":90,"quick":"Hay trattorias sobre la Appia, con jardín.","logi":{"Costo adultos":"€18 a €30","Costo niños":"€8 a €12"},"travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Hay varias trattorias con jardín sobre la Via Appia Antica, a pocos minutos de las catacumbas."},"id":"s45","day":"15","pri":3},{"time":"14:30","name":"Vuelta y tarde libre","tag":"rest","type":"rest","quick":"Descanso. La tarde queda abierta.","travel":{"mode":"car","dur":30,"costAd":"≈ €25 por taxi","costCh":"—","how":"Regreso en taxi o van por el mismo camino."},"id":"s46","day":"15","pri":3},{"time":"19:00","name":"Santa Maria della Vittoria","tag":"site","type":"site","dur":25,"quick":"Optativo, solo Pablo y Maira: el Éxtasis de Santa Teresa, el día de su fiesta.","hist":"Bernini talló aquí, entre 1647 y 1652, la Transverberación de Santa Teresa de Ávila: la santa atravesada por el dardo del ángel, en la capilla Cornaro.","full":"Vía XX Setembre y Largo Santa Susana Sobre el lugar de la actual iglesia se encontraban las casas de San Gabino, padre de S. Susana y S. Caio, sobrinos del emperador Dioclesiano. San Gabino, tras la muerte de su esposa se hizo sacerdote. La iglesia es obra maestra del equilibriode Carlo Maderno, terminada en 1603. Bajo el altar de la cripta están los cuerpos de Susana y Gabino. Enfrente está la iglesia de Santa María de la Vittoria. Dedicada inicialmente a S. Pablo, pero en 1622 se colocó bajo la advocación de S. María de la Vittoria y se trasladó con gran pompa una imagen de la Virgen cuya intervención milagrosa permitió la victoria católica de la Montaña Blanca, cerca de Praga en 1620. El interior se debe a Carlo Maderno, inspirado en el Gesù. Lo más importante es la capilla Cornaro, brazo izquierdo del crucero, realizada por Bernini entre 1646 y 1652 con el grupo escultórico del Éxtasis de Santa Teresa de Jesús, obra de las más importantes del autor: pocas veces se ha tratado el mármol con tanta soltura especialmente en el ropaje de la santa y del ángel y en las nubes.\n\n3. RIONE CAMPO MARZIO 10 –Ss. Ambrogio e Carlo 10a –Mausoleo di Augusto (Ara Pacis) 10b –Piazza Spagna 10c –Trinità dei Monti 10d –Viale Trinità dei Monti hasta Piazza del Popolo 11 –Gesù e Maria 12 –S. Giacomo in Augusta 13 –S. Maria dei Miracoli 14 –S. Maria del Popolo 14a –Piazza del Popolo","logi":{"Horario":"8:30 a 12:00 y 15:30 a 18:00","Costo":"Gratis","Metro":"Repubblica, línea A","Por qué hoy":"15 de octubre: fiesta de Santa Teresa de Ávila"},"map":"Santa Maria della Vittoria, Roma","travel":{"mode":"metro","dur":30,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Desde Ottaviano, línea A dirección Anagnina hasta Repubblica. La iglesia está a 200 metros de la salida, en la esquina de Via XX Settembre.","tip":"Verificar el horario: cierra a las 18:00."},"id":"s47","day":"15","hrs":{"open":[[510,720],[930,1080]],"closed":[]},"hv":false,"pri":2,"ver":["El **Éxtasis de Santa Teresa** de Bernini, en la capilla Cornaro, a la izquierda.","Los palcos de mármol a los costados: la familia Cornaro esculpida como público, mirando la escena.","La luz que baja por la ventana oculta sobre el grupo. Bernini la calculó."],"zone":"El norte · Spagna y Popolo"},{"time":"20:00","name":"Cena de aniversario","tag":"food","type":"food","dur":150,"quick":"Pablo y Maira. Las nenas quedan con la abuela.","logi":{"Pendiente":"Falta elegir y reservar el restaurante"},"travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Según dónde sea la reserva. Todavía está por definirse."},"id":"s48","day":"15","pri":1}]},{"date":"2026-10-16","phase":1,"weekday":"Vie","dd":"16","title":"Pontinia · Fossanova","note":"El día que le da sentido familiar a todo el viaje. Reservado exclusivamente para esto.","stops":[{"time":"07:30","name":"Salida de Roma","tag":"rest","type":"rest","dur":90,"quick":"Por la SS148 Pontina, 70 km hacia el sureste.","logi":{"Distancia":"70 km","Duración":"1h 15 a 1h 30","Vehículos":"Dos vans de nueve plazas"},"id":"s49","day":"16","pri":3},{"time":"09:00","name":"MAP · Museo dell'Agro Pontino","tag":"site","type":"site","dur":90,"quick":"El museo de la bonifica: los colonos, la malaria y la vida cotidiana de los que hicieron esta tierra.","hist":"Inaugurado en 2015 en la Ex Torre Idrica de la ciudad. Recoge objetos, fotografías y testimonios del período pre y post bonifica del Agro Pontino: la malaria, los migrantes del Véneto, las herramientas del trabajo en el pantano, la vida cotidiana de los colonos.","travel":{"mode":"car","dur":90,"costAd":"Combustible y peajes","costCh":"—","how":"Salir de Roma por la Via Cristoforo Colombo y empalmar con la SS148 Pontina hacia el sur. Atravesar la llanura pontina hasta Pontinia. El museo está en Piazza Roma, en el centro exacto de la ciudad.","tip":"Cargar combustible antes de salir de Roma."},"full":"El MAP — Museo dell'Agro Pontino fue creado en 2015 dentro de la antigua torre hidráulica de Pontinia, en Piazza Roma. Esta torre, construida en los años 30, formaba parte del sistema de abastecimiento de agua de la nueva ciudad y era uno de sus hitos visuales más característicos. Al perder su función original, fue restaurada y convertida en museo.\n\nLa colección reúne herramientas agrícolas, fotografías de época, documentos y objetos cotidianos de los primeros pobladores. Hay testimonios directos de las familias colonas: cartas, libretas de trabajo, fotos de las viviendas originales (las llamadas \"case coloniche\" idénticas, dispersas por toda la llanura), trajes regionales del Véneto y de Emilia que las mujeres siguieron usando durante años en Pontinia.\n\nUn núcleo importante del museo está dedicado a la malaria: la enfermedad endémica que hacía inhabitable esta tierra. Se muestran los métodos de profilaxis, las botellas de quinina, los registros de mortandad. Otro núcleo cuenta la dura vida de los obreros que excavaron los canales: muchos murieron antes de ver la tierra seca.\n\nPara los descendientes de aquellos colonos, una visita al MAP suele ser emocionante. Es posible encontrar fotografías o documentos que mencionan apellidos familiares, ya que los registros están relativamente completos. El personal del museo conoce muchas de las familias originales y puede orientar consultas concretas.","logi":{"Dirección":"Piazza John F. Kennedy 1, en el ex mercado cubierto","Ojo":"NO es la torre de agua. Esa está en Piazza Roma y es una sala de exposiciones aparte, que abre solo por eventos","Horario":"Hay que llamar","Teléfono":"+39 0773 84641 · lo gestiona la Pro Loco de Pontinia","Alerta":"Algunas fuentes de 2024 lo dan por cerrado. Confirmar antes de viajar los 70 km"},"map":"Piazza John F. Kennedy 1, Pontinia","id":"s50","day":"16","hv":false,"pri":1,"ver":["La torre de agua misma, símbolo de la ciudad nueva.","Las fotos de los colonos llegando del Véneto y de Friuli en 1935.","Las herramientas y los objetos cotidianos de la bonifica."],"zone":"Agro Pontino"},{"time":"10:30","name":"Iglesia de Sant'Anna","tag":"mass","type":"mass","dur":45,"quick":"La patrona de Pontinia, con su campanario racionalista de cincuenta metros.","hist":"Construida junto con la ciudad en los años 30. Su campanario de 50 metros, revestido de travertino blanco, evoca los tubos de un órgano. Los símbolos de los cuatro evangelistas están esculpidos en la torre: el ángel (Mateo), el león (Marcos), el toro (Lucas) y el águila (Juan).","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Desde Piazza Roma, la iglesia está a pocos metros: el campanario se ve desde toda la ciudad."},"full":"La iglesia de Sant'Anna es el corazón espiritual de Pontinia. Fue construida entre 1934 y 1935 según el estilo racionalista que define toda la ciudad: líneas limpias, fachada sobria, ningún ornamento superfluo.\n\nEl elemento más característico es el campanario: 50 metros de altura, revestido de travertino blanco, en posición central respecto a la fachada. Su forma evoca los tubos de un órgano, dándole a la silueta del edificio una calidad casi musical. En el campanario están esculpidos los cuatro símbolos evangélicos: el ángel de san Mateo, el león de san Marcos, el toro de san Lucas y el águila de san Juan.\n\nSanta Ana, madre de la Santísima Virgen, fue elegida como patrona porque la primera piedra de Pontinia se colocó el 19 de diciembre de 1934, durante el año en que su festividad (26 de julio) coincidía con la inauguración prevista. La fiesta patronal del 26 de julio es la celebración mayor del año en Pontinia: procesión, fuegos artificiales, comidas comunitarias.\n\nDentro, el espacio es luminoso y desnudo, propio del racionalismo. Vale detenerse a observar las naves, el altar y los objetos litúrgicos. Para muchas familias colonas, esta fue la iglesia donde se bautizaron los hijos nacidos ya en la tierra recuperada — el primer signo de que la nueva vida echaba raíces.","logi":{"Dirección":"Piazza Indipendenza, Pontinia","Horario":"Habitualmente 8-12 y 16-19","Costo adultos":"Gratis","Costo niños":"Gratis"},"map":"Chiesa Sant'Anna Pontinia","id":"s51","day":"16","pri":1,"ver":["El campanario racionalista de cincuenta metros: se ve desde toda la llanura.","La sobriedad del interior, muy distinta de las iglesias romanas."],"zone":"Agro Pontino"},{"time":"11:15","name":"Centro racionalista","tag":"site","type":"site","dur":90,"quick":"El Palazzo Comunale, la plaza fundacional y el monumento a los caídos.","hist":"El centro de Pontinia es un raro ejemplo intacto de urbanismo racionalista italiano de los años 30. Edificios públicos en perfecta simetría, plazas amplias, materiales sobrios. Lo opuesto a un pueblo medieval.","travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Todo el centro fundacional está alrededor de Piazza Indipendenza, a pasos de la iglesia."},"logi":{"Costo adultos":"Gratis","Costo niños":"Gratis","Opcional":"Si alguien tiene apellidos vénetos/friulanos, consultar en el registro municipal por archivos familiares."},"id":"s52","day":"16","pri":2,"full":"Pontinia se fundó el 18 de diciembre de 1935 y fue la tercera de las ciudades nuevas del Agro Pontino, después de Littoria y Sabaudia. No creció: fue diseñada entera, en un tablero, y construida en pocos meses sobre tierra que hasta hacía nada era pantano y malaria.\n\nEl plano lo hicieron los ingenieros Alfredo Pappalardo, Ugo Frezza y Alfredo Petrucci, en el lenguaje racionalista de esos años: volúmenes limpios, ladrillo a la vista, travertino, ninguna decoración. Todo se organiza alrededor de dos plazas contiguas, Piazza Indipendenza y Piazza Pio XII, con el Palazzo Comunale y su torre cívica, la iglesia de Sant'Anna, la casa del fascio, la oficina de correos y la escuela.\n\nSobre la entrada del Municipio quedó grabada una frase que resume el sentido de todo el proyecto: *«È l'aratro che traccia il solco, ma è la spada che lo difende»* — es el arado el que traza el surco, pero es la espada la que lo defiende.\n\nA la ciudad llegaron los colonos que la habitarían: familias enteras del Véneto, de Friuli y de Emilia, trasladadas con sus animales y sus herramientas, a las que se les asignó una casa rural y un lote. De ahí venimos. Caminar estas dos plazas es caminar el lugar exacto donde empezó esa historia.","fullSource":"propio","ver":["Piazza Indipendenza y el Palazzo Comunale, el corazón de la ciudad fundada en 1935.","El monumento a los caídos.","El trazado de las calles: una ciudad entera diseñada y levantada sobre el pantano."],"zone":"Agro Pontino"},{"time":"13:00","name":"Almuerzo típico","tag":"food","type":"food","dur":120,"quick":"La alcachofa romanesca está en temporada justo en octubre.","logi":{"Costo adultos":"€20-30 menú completo","Costo niños":"€10-15","Tip":"Pedir alcachofa romanesca si es temporada (octubre suele tener)."},"travel":{"mode":"walk","dur":5,"costAd":"Gratis","costCh":"Gratis","how":"Los restaurantes del centro de Pontinia están todos alrededor de Piazza Indipendenza y Via Roma."},"id":"s53","day":"16","pri":3},{"time":"15:30","name":"Abadía de Fossanova","tag":"site","type":"site","dur":120,"quick":"La abadía cisterciense donde murió Santo Tomás de Aquino en 1274.","hist":"Primera abadía cisterciense de Italia, consagrada en 1208 sobre un monasterio benedictino anterior. Santo Tomás de Aquino murió aquí el 7 de marzo de 1274, camino al Concilio de Lyon, y se conserva la celda donde expiró.","travel":{"mode":"car","dur":25,"costAd":"€5 aprox.","costCh":"Gratis los menores","how":"Desde Pontinia, tomar la SS7 Appia hacia Priverno. La abadía está en la localidad de Fossanova, señalizada desde la ruta. Son unos 15 km.","tip":"Confirmar por teléfono el horario de la tarde: en otoño las abadías cierran temprano."},"full":"La abadía de Fossanova, en el término de Priverno, es el ejemplo más puro de la arquitectura cisterciense en Italia. Los monjes de Císter llegaron en 1135 a un monasterio benedictino en decadencia y lo reconstruyeron entero según el modelo de Claraval: iglesia sin campanario, sin cripta, sin decoración figurada, con la sola luz y la proporción como ornamento. La consagración fue en 1208, con Inocencio III presente.\n\nEl nombre viene del \"fossa nova\", el canal nuevo que los monjes abrieron para desecar los pantanos de la zona. Ocho siglos antes de la bonifica fascista, los cistercienses ya estaban haciendo el mismo trabajo sobre la misma tierra.\n\nSanto Tomás de Aquino se dirigía al Concilio de Lyon, convocado por Gregorio X, cuando enfermó en el camino. Lo llevaron a Fossanova, donde fue alojado en el cuarto del hermano del abad. Allí, pidiendo que le leyeran el Cantar de los Cantares, murió el 7 de marzo de 1274, con menos de cincuenta años. La celda se conserva y fue transformada en capilla en el siglo XVIII.\n\nEl conjunto incluye la iglesia abacial, el claustro con su lado románico y los otros tres góticos, la sala capitular, el refectorio y la hospedería de peregrinos. El silencio del claustro, a media tarde, es lo que más se recuerda del lugar.","logi":{"Horario":"8:00 a 19:30","Dirección":"Via San Tommaso d'Aquino, Priverno (LT)","Distancia":"15 km de Pontinia","Verificar":"Horario de tarde antes de viajar","No perderse":"La celda donde murió Santo Tomás","Sobre el horario":"Horario de verano, vigente hasta el 25 de octubre. Confirmado en cultura.gov.it."},"map":"Abbazia di Fossanova, Priverno","fullSource":"Redacción propia","id":"s54","day":"16","hrs":{"open":[[480,1170]],"closed":[]},"hv":true,"pri":1,"ver":["La **celda donde murió Santo Tomás de Aquino** el 7 de marzo de 1274, hoy convertida en capilla.","El **claustro**: un lado románico y los otros tres góticos. En el piso, las supuestas huellas de la mula que lo trajo.","El **rosetón** de la fachada.","La iglesia sin campanario, sin cripta y sin decoración: la regla cisterciense en piedra.","La sala capitular y el refectorio."],"zone":"Agro Pontino"},{"time":"19:00","name":"Regreso a Roma","tag":"rest","type":"rest","quick":"Vuelta por la misma ruta. Llegada hacia las 20:30.","travel":{"mode":"car","dur":90,"costAd":"Gratis","costCh":"Gratis","how":"SS7 hasta Latina y de ahí SS148 Pontina hacia el norte, hasta Roma.","tip":"Un viernes a la tarde el tráfico de entrada a Roma es pesado: salir antes de las 19:30."},"id":"s55","day":"16","pri":3}]},{"date":"2026-10-17","phase":1,"weekday":"Sáb","dd":"17","title":"Roma antigua","note":"La Roma imperial y la cristiana antigua, en fila desde el Coliseo. Se camina en serio: calzado cómodo.","stops":[{"time":"08:30","name":"Traslado al Coliseo","tag":"rest","type":"rest","dur":45,"quick":"Metro hasta Colosseo. Media hora larga.","logi":{"Recorrido":"Línea A hasta Termini, línea B hasta Colosseo","Costo adultos":"€1,50","Costo niños":"Gratis los menores de 10"},"id":"s56","day":"17","pri":3},{"time":"09:00","name":"Coliseo","tag":"site","type":"site","dur":105,"quick":"El anfiteatro Flavio. Escenario del martirio de tantos cristianos.","hist":"Inaugurado por Tito en el año 80 con cien días de juegos. Cabían más de cincuenta mil espectadores.","travel":{"mode":"metro","dur":40,"costAd":"€18 + €2 de reserva","costCh":"€2 de 18 a 25 · gratis menores de 18","how":"Desde Ottaviano, línea A dirección Anagnina hasta Termini. Cambiar a la línea B dirección Laurentina y bajar en Colosseo: el anfiteatro está al salir de la estación.","tip":"La entrada con reserva es la del lado de Via Sacra. Un sábado sin entrada previa la fila es de horas."},"full":"El edificio Entre el Esquilino, el Celio y el Palatino, se yergue el Anfiteatro Flavio, llamado comúnmente Coliseo, el monumento más representativo de la Roma clásica, iniciado por Vespasiano en el 72 d. C., en el lugar donde antaño surgiera el lago artificial de la neroniana Domus Aurea. Se cuenta que lo construyó un tal Gaudencio, pobre hombre que no gozó mucho tiempo de su trabajo: terminó ahí dentro, ad bestias. Se inauguró en el año 80, bajo Tito, con fastuosas fiestas y espectáculos que, según el poeta Marcial, se prolongaron durante cien días. Completado en algunas partes por Domiciano y restaurado por Septimio Severo, durante muchos siglos el Coliseo vino a ser el símbolo de la grandeza y de la potencia de Roma. En él se celebraron especialmente continuos combates entre gladiadores, quizá el espectáculo más apreciado por el pueblo romano. Las luchas entre gladiadores terminaron hacia el año 404, mientras que aquellas entre animales continuaron hasta el s. VI.\n\nGraves terremotos dañaron muchas veces el anfiteatro; más tarde las familias romanas de los Frangipani y de los Anibaldi lo hicieron su fortaleza. hasta que en el 1312, por orden de Arrigo VII el Coliseo volvió a ser propiedad del pueblo romano. Durante los siglos sucesivos inició su decadencia; enormes bloques de travertino fueron sacados y utilizados para otras construcciones; finalmente, en 1750, Benedicto XIV lo declaró lugar santo, por haber sido teatro del martirio de los cristianos, evitando así posteriores expolios; una cruz negra, de madera, conmemora la fe y la fortaleza de los mártires que dieron en este lugar su vida por el nombre de Cristo; entre estos cabe citar a San Ignacio, obispo de Antioquía y discípulo de San Juan, enviado a las fieras bajo Trajano (98–117). El anfiteatro es de forma elíptica, de 188 metros por 156, y tiene una altura de 57 metros. Las obras de construcción duraron más de diez años. La estructura exterior es de travertino, y está distribuida en 4 pisos. Los bloques de la base de los pilares son de dos metros cúbicos cada uno y pesan 5 toneladas. Los tres primeros pisos están formados por 80 arcos de medio punto, divididos por pilastras en las que están adosadas semicolumnas que siguen la secuencia canónica de los estilos: el primer piso de estilo dórico; el segundo de estilo jónico, y el tercero corintio. El cuarto piso es de pared llena con pilastras corintias salientes de la pared y con pequeñas ventanas. En la cornisa que remata la obra, se pueden ver todavía los orificios donde se introducían los palos que sujetaban el toldo, con el que se protegía del sol a los espectadores, operación que llevaban a cabo los marineros de la flota imperial del Miseno. A cada arco de la planta baja le correspondía un acceso al correspondiente sector del anfiteatro, 76 de esos ingresos estaban numerados (son visibles todavía los números romanos sobre los arcos); los cuatro principales estaban reservados: uno a la corte imperial, uno a las vestales, uno a los magistrados y el cuarto a los huéspedes de honor. Todos los arcos del segundo y tercer piso estaban adornados con estatuas, hoy perdidas. Cuando en la Edad Media, el Coliseo se convirtió en una enorme mina de material para la construcción, le fueron extirpadas todas las grapas metálicas de sutura entre los bloques de travertino, originando innumerables agujeros aún hoy visibles. En la explanada que había delante del anfiteatro se erguía la estatua de Nerón, de bronce dorado, de casi 30 metros de altura. El anfiteatro tenía cabida para unos 50.000 espectadores, que se distribuían en las gradas según la clase social. Existían tres órdenes de puestos: podium, era el primer Orden, reservado a las clases más elevadas y al palco del Emperador; el orden central acogía a los ciudadanos que pertenecían a la clase media; y el último orden, la suma, era el destinado al pueblo. Todo el piso, formado de tablas de madera, estaba cubierto de arena; alrededor había una red para proteger a los espectadores. Debajo de la arena existía un sistema de celdas, galerías, almacenes, camarines y subterráneos, que hoy son visibles gracias a las excavaciones. Los principales espectáculos eran los ludi (luchas) de los gladiadores y las cazas de fieras, pero en la arena se efectuaban, también, exhibiciones de malabaristas, competiciones atléticas, torneos a caballo y naumaquias simulacros de batallas navales. Un martirio insigne in Amphitheatrum Un ejemplo conmovedor de cómo afrontaban el martirio los primeros cristianos nos lo ha dejado San Ignacio de Antioquía, muerto en tiempos del emperador Trajano. Convertido del paganismo, Ignacio fue el segundo sucesor de San Pedro en la sede episcopal de Antioquía. El año 107 fue detenido, condenado adbelvas -a las fieras- y enviado a Roma bajo custodia militar para cumplir allí su pena. Del largo viaje desde Siria a la capital del Imperio conocemos bastantes detalles por el historiador Eusebio de Cesarea y, sobre todo, gracias a las siete cartas que el mismo San Ignacio escribió a las Iglesias de otras tantas ciudades para fortalecerles en la fe y prevenirles ante las herejías gnósticas, que por entonces empezaban a extenderse.","logi":{"Horario":"8:30 a 18:30 · último ingreso 17:30","Reserva":"CoopCulture · entradas 30 días antes","Entrada":"Incluye Foro y Palatino, válida 24 h","Cochecitos":"Permitidos, hay ascensor","Sobre el horario":"Horario del 1 al 24 de octubre. El 25 cambia a 9:00–16:30. colosseo.it"},"map":"Colosseo, Roma","id":"s57","day":"17","hrs":{"open":[[510,1110]],"closed":[]},"hv":true,"pri":1,"ver":["La **cruz** en el borde de la arena, donde el Papa reza el Vía Crucis del Viernes Santo.","Los **subterráneos** al descubierto: los pasillos y jaulas por donde subían las fieras.","El **Arco de Constantino** al lado, del 315, levantado tras la victoria del Puente Milvio.","Los tres órdenes de arcadas de la fachada: dórico, jónico y corintio, de abajo hacia arriba."],"zone":"Roma antigua"},{"time":"10:45","name":"San Clemente","tag":"site","type":"site","dur":75,"quick":"Tres iglesias apiladas: medieval, paleocristiana y un mitreo romano.","hist":"Basílica del siglo XII sobre otra del siglo IV, y esa sobre una casa romana con un templo de Mitra. Se baja mil años por cada escalera.","travel":{"mode":"walk","dur":8,"costAd":"€10 los niveles inferiores","costCh":"€5","how":"Salir del Coliseo hacia el este por Via di San Giovanni in Laterano. San Clemente está a 400 metros, sobre la mano izquierda.","tip":"La entrada a los niveles inferiores es por la sacristía, a la derecha."},"full":"Se levanta sobre una iglesia del s. IV, dedicada a San Clemente, cuarto Romano Pontífice de la Iglesia, que a su vez había sido edificada sobre una casa romana que se dice que perteneció al santo. Fue destruida en 1084 y reconstr
