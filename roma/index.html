<style>
:root{
  --paper:#f6f0e4; --paper2:#fbf7ee; --ink:#2c2620; --soft:#8a7f6f; --mute:#a09482;
  --crimson:#7c1f2b; --deep:#5e1620; --gold:#a9863c; --gold2:#c9a24a;
  --line:#e6dcc6; --line2:#efe7d4;
  --warn:#fdf0e2; --warnl:#e8cfa8; --warnk:#a2661c;
  --ok:#e9efdf; --okk:#4a5d3a;
  --sans:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;
  --disp:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --serif:'EB Garamond',Garamond,Georgia,serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.serif{font-family:var(--serif)} .disp{font-family:var(--disp)}

/* ══ PORTÓN ══ */
#gate{position:fixed;inset:0;z-index:99;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:26px}
#gate .box{width:100%;max-width:320px;text-align:center}
#gate img{width:78px;height:78px;border-radius:18px;box-shadow:0 4px 16px rgba(60,40,15,.24)}
#gate h1{font-family:var(--disp);font-weight:600;font-size:31px;color:var(--crimson);
  margin:16px 0 1px;letter-spacing:.01em}
#gate .sub{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:16px;margin-bottom:24px}
#gate input{width:100%;padding:13px 15px;font:inherit;font-size:17px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:11px;text-align:center;
  letter-spacing:.06em;outline:none}
#gate input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,134,60,.16)}
#gate button.go{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:600;
  color:#fff;background:var(--crimson);border-radius:11px}
#gate .err{color:var(--crimson);font-family:var(--serif);font-style:italic;font-size:15px;
  margin-top:12px;min-height:21px}
#gate .foot{margin-top:22px;font-family:var(--serif);font-style:italic;color:var(--mute);font-size:14px}

/* ══ ESTRUCTURA ══ */
#app{display:none;flex-direction:column;height:100%}
#app.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(var(--safeT) + 15px) 16px 14px;
  background:var(--paper);flex:0 0 auto;border-bottom:1px solid #eee5d1}
.topbar img{width:30px;height:30px;border-radius:8px;flex:0 0 auto}
.topbar .nm{font-size:13.5px;font-weight:700;letter-spacing:.09em;color:var(--mute);text-transform:uppercase}
.topbar .net{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#8fbf6a;
  font-size:0;overflow:hidden;flex:0 0 auto}
.topbar .net.off{background:#d59a3c}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:22px}
.pad{padding:0 16px}
nav.tabs{flex:0 0 auto;display:flex;gap:2px;background:#efe7d4;border-top:1px solid #e2d6ba;
  padding:0 6px calc(var(--safeB) + 6px)}
nav.tabs button{flex:1;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute);
  padding:11px 0 13px;border-radius:11px 11px 0 0;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs svg{display:block}
nav.tabs button.on{background:var(--paper);color:var(--crimson);
  box-shadow:inset 0 -2px 0 var(--gold)}
nav.tabs button.on:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--crimson);border-radius:3px 3px 0 0}

/* ══ PIEZAS ══ */
.lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hero{background:var(--crimson);color:#fbf3e2;padding:16px 16px 18px}
.hero .lbl{color:#e0b866}
.hero h2{font-family:var(--disp);font-size:32px;font-weight:600;line-height:1.05;
  margin:5px 0 4px;letter-spacing:.01em}
.hero .sub{font-size:12.5px;color:#e6c8ad}
.hero .prog{height:4px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:12px;overflow:hidden}
.hero .prog i{display:block;height:100%;background:var(--gold2);border-radius:3px}
.card{background:var(--paper2);border-left:3px solid var(--gold);border-radius:12px;
  padding:12px 13px 12px 14px;margin-top:12px;box-shadow:0 2px 10px rgba(90,68,30,.09)}
.card h3{font-family:var(--disp);font-size:20px;font-weight:600;margin-top:3px;line-height:1.15}
.go{display:flex;align-items:center;gap:8px;background:var(--line2);border-radius:10px;
  padding:9px 11px;margin-top:10px;font-size:12.5px;color:#4a4136}
.go b{color:var(--crimson)}
.go .btn{margin-left:auto;background:var(--crimson);color:#fff;border-radius:8px;
  padding:7px 11px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chips{display:flex;background:var(--paper2);border-radius:13px;padding:11px 4px;
  margin-top:12px;box-shadow:0 2px 10px rgba(90,68,30,.09)}
.chip{flex:1;text-align:center;position:relative}
.chip+.chip:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:#eadfc7}
.chip .k{font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chip .v{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.08;
  margin-top:3px;color:var(--ink)}
.warn{display:flex;gap:8px;background:var(--warn);border:1px solid var(--warnl);
  border-left:3px solid #c9761f;border-radius:11px;padding:10px 12px;margin-top:12px;
  font-size:12px;color:#7a5320;line-height:1.45}
.warn b{color:var(--warnk)}
.strip{display:flex;gap:8px;margin-top:14px;overflow-x:auto;
  padding:3px 2px 8px;-webkit-overflow-scrolling:touch}
.strip button{flex:1 0 auto;min-width:56px;border:none;border-radius:13px;
  padding:10px 0;font-size:17px;font-weight:700;color:var(--mute);background:var(--paper2);
  box-shadow:0 2px 7px rgba(90,68,30,.09);line-height:1.1}
.strip button.on{background:var(--crimson);color:#fff;
  box-shadow:0 3px 10px rgba(124,31,43,.3)}
.strip button i{display:block;font-style:normal;font-size:9px;letter-spacing:.08em;
  opacity:.75;margin-bottom:2px;font-weight:700}

/* ── día ── */
.dayhd{padding:15px 16px 0}
.dayhd h2{font-family:var(--disp);font-size:29px;font-weight:600;color:var(--crimson);line-height:1.08}
.dayhd .nt{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:15px;margin-top:4px}
ol.tl{list-style:none;padding:14px 16px 0 62px;position:relative}
ol.tl:before{content:"";position:absolute;left:47px;top:24px;bottom:14px;width:1px;background:#e9dfc8}
ol.tl li{position:relative;padding-bottom:14px}
ol.tl li:before{content:"";position:absolute;left:-19px;top:9px;width:9px;height:9px;
  border-radius:50%;background:var(--paper);border:1.5px solid var(--gold)}
ol.tl li.key:before{background:var(--crimson);border-color:var(--crimson);width:11px;height:11px;left:-20px}
ol.tl li.done:before{background:#ded2b8;border-color:#ded2b8}
.hr{position:absolute;left:-62px;top:3px;width:40px;text-align:right;font-size:12px;
  color:var(--soft);font-variant-numeric:tabular-nums;font-weight:600}
.stop{width:100%;text-align:left;background:var(--paper2);border-left:3px solid var(--gold);
  border-radius:12px;padding:11px 12px 11px 13px;display:block;
  box-shadow:0 2px 9px rgba(90,68,30,.085)}
.stop .n{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--crimson);line-height:1.15}
.stop .q{font-size:12.5px;color:#4a4136;margin-top:3px;line-height:1.45}
.stop .m{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;
  align-items:center;align-content:flex-start}
.tagm{display:inline-flex;align-items:center;align-self:center;flex:0 0 auto;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;line-height:1.7;border-radius:999px;padding:2px 9px;
  background:var(--line2);color:var(--soft)}
.tagm.hot{background:var(--warn);color:var(--warnk)}
.tagm.lit{background:#f2e3e0;color:var(--crimson)}
.trav{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--soft);
  margin:0 0 10px;padding-left:2px}
/* nivel 2 · si hay tiempo */
.stop.s2{background:transparent;border-left-color:#ded2b8;box-shadow:none;padding:9px 11px 9px 12px}
.stop.s2 .n{font-size:17px;color:#9a4a54}
.stop.s2 .q{font-size:12px;color:#5f5648}
ol.tl li.s2:before{background:var(--paper);border-color:var(--gold);width:9px;height:9px}
/* nivel 3 · logística */
ol.tl li.s3{padding-bottom:9px}
ol.tl li.s3:before{width:5px;height:5px;left:-17px;top:9px;background:#d6c9ab;border-color:#d6c9ab}
.logi{display:block;width:100%;text-align:left;font-size:13px;color:var(--soft);padding:2px 0}
.logi b{font-weight:600;color:#5f5648}
/* interruptor */
.seg{display:flex;border-radius:11px;overflow:hidden;margin-top:12px;
  box-shadow:0 2px 9px rgba(90,68,30,.085)}
.seg button{flex:1;padding:8px 0;font-size:11.5px;font-weight:700;color:var(--soft);background:var(--paper2)}
.seg button.on{background:var(--crimson);color:#fff}

/* ── guía ── */
.search{width:100%;padding:12px 15px;font:inherit;font-size:15px;background:#fff;
  border:none;border-radius:11px;outline:none;margin-top:14px;
  box-shadow:0 2px 10px rgba(90,68,30,.1)}
.search:focus{border-color:var(--gold)}
.zone{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin:20px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:5px}
/* foto de la ficha */
.ph{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;
  background:var(--line2);box-shadow:0 3px 14px rgba(90,68,30,.12);display:flex;
  align-items:center;justify-content:center;margin-top:12px}
.ph span{font-family:var(--serif);font-style:italic;color:var(--mute);font-size:14px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s}
.ph img.on{opacity:1}
/* miniatura de la guía */
.gth{flex:0 0 54px;height:54px;border-radius:10px;overflow:hidden;position:relative;
  background:var(--line2);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:#d9c9a4;font-size:15px}
.gth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s}
.gth img.on{opacity:1}
.gitem{width:100%;text-align:left;padding:10px 0;border-bottom:1px dotted var(--line);
  display:flex;gap:11px;align-items:flex-start}
.gitem .tx{flex:1;min-width:0}
.gitem .n{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--crimson);line-height:1.2}
.gitem .q{font-size:12.5px;color:#4a4136;margin-top:2px;line-height:1.45}
.gitem .d{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mute);
  text-transform:uppercase;margin-top:4px}

/* ── info ── */
.block{margin-top:22px}
.block h3{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--crimson);
  border-bottom:1px solid var(--line);padding-bottom:5px}
.row{display:flex;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.row .k{flex:0 0 40%;color:var(--soft);font-weight:600}
.row .v{flex:1;color:var(--ink)}
.mass{background:var(--paper2);border-left:3px solid #ded2b8;border-radius:12px;
  padding:11px 12px 11px 13px;margin-top:9px;box-shadow:0 2px 9px rgba(90,68,30,.075)}
.mass.pick{border-left-color:var(--gold);background:#fdf8ec}
.mass .h{display:flex;align-items:baseline;gap:8px}
.mass .hh{font-size:17px;font-weight:700}
.mass .pl{font-family:var(--disp);font-size:18px;font-weight:600;margin-top:2px}
.mass .mt{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.4}

/* ══ FICHA ══ */
#scrim{position:fixed;inset:0;background:rgba(30,22,12,.5);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:60}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;z-index:61;
  background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(101%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;
  box-shadow:0 -8px 34px rgba(40,28,10,.28)}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:3px;background:#ddd0b4;margin:9px auto 0;flex:0 0 auto}
#sheet .in{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(var(--safeB) + 26px)}
#sheet h2{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--crimson);
  line-height:1.06;margin-top:8px;letter-spacing:.01em}
#sheet .kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
#sheet .kv span{font-size:10.5px;font-weight:600;color:#4a4136;background:var(--line2);
  border:1px solid var(--line);border-radius:20px;padding:4px 9px}
#sheet .kv .hot{background:var(--warn);border-color:var(--warnl);color:var(--warnk)}
#sheet .kv .okc{background:var(--ok);border-color:#cdd9bc;color:var(--okk)}
#sheet .sum{font-family:var(--serif);font-size:16.5px;line-height:1.55;color:#3a332a;margin-top:13px}
details{border-top:1px solid var(--line);margin-top:14px}
details summary{list-style:none;display:flex;align-items:center;padding:11px 0 10px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary .t{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;color:var(--gold)}
details summary .c{margin-left:auto;color:var(--gold);font-size:15px;transition:transform .2s}
details[open] summary .c{transform:rotate(90deg)}
details .body{padding-bottom:13px;font-size:14px;line-height:1.6;color:#3a332a}
ul.mir{list-style:none;padding:0 0 13px;margin:0}
ul.mir li{position:relative;padding:0 0 9px 17px;font-size:14.5px;line-height:1.55;color:#3a332a}
ul.mir li:before{content:"";position:absolute;left:1px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}
ul.mir li b{color:var(--crimson);font-weight:600}
.body.rd{font-family:var(--serif);font-size:16.5px;line-height:1.66;color:#3a332a}
.body.rd p{margin:0 0 15px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.body.rd p:last-child{margin-bottom:0}
.body.rd b{font-weight:600;color:var(--crimson)}
.body.rd i{color:#5f5648}
.src{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);
  font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--mute);
  line-height:1.5}
.src b{font-style:normal;font-weight:600}
details .body p{margin-bottom:11px}
h3.sub{font-family:var(--disp);font-size:21px;font-weight:600;color:var(--crimson);
  margin:26px 0 11px;padding-bottom:5px;position:relative;letter-spacing:.01em}
h3.sub:after{content:"";position:absolute;left:0;bottom:0;width:34px;height:2px;
  background:var(--gold);border-radius:2px}
h3.sub:first-child{margin-top:4px}
.mapbtn{display:block;width:100%;text-align:center;background:var(--ink);color:var(--paper);
  border-radius:11px;padding:12px;font-size:13px;font-weight:700;margin-top:11px;
  box-shadow:0 3px 12px rgba(44,38,32,.22)}
.close{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;
  background:var(--line2);color:var(--soft);font-size:16px;line-height:1}
.empty{text-align:center;color:var(--mute);font-family:var(--serif);font-style:italic;
  padding:44px 20px;font-size:16px}

/* ══ SANTOS ══ */
.snote{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:14.5px;line-height:1.45;margin:-2px 0 8px}
.sfil{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sfil.sjump{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sfc{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--soft);
  background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.sfc.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.stag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;line-height:1.7;border-radius:999px;padding:2px 9px}
.stag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stag.vV{background:var(--ok);color:var(--okk)}
.stag.vU{background:#f4ead2;color:#8a6a24}
.stag.vU:before{background:transparent;border:1.5px solid currentColor;width:4px;height:4px}
.stag.vE{background:var(--warn);color:var(--warnk)}
.stag.vN,.stag.vX{background:transparent;border:1px dashed #d8cbb0;color:var(--mute)}
.stag.vN:before,.stag.vX:before{background:transparent;border:1.5px dashed currentColor;width:4px;height:4px}
.stag.vO{background:#f2e3e0;color:var(--crimson)}
.stag.vO:before{content:"✠";background:none;width:auto;height:auto;font-size:9px}
.stags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sst{font-style:normal;color:var(--gold)}
.gth.smark{font-family:var(--disp);font-size:22px;color:var(--gold);flex-basis:34px;height:34px}
.gth.smark.m1{color:var(--crimson)}
.ssaint .d{text-transform:none;letter-spacing:.02em;font-size:11px}
/* iglesia con sus santos */
.sch{background:var(--paper2);border-left:3px solid var(--gold);border-radius:12px;margin-top:10px;
  box-shadow:0 2px 9px rgba(90,68,30,.085);overflow:hidden}
.schh{display:flex;align-items:center;gap:9px;padding:10px 12px 9px 13px;border-bottom:1px dotted var(--line)}
.schn{flex:1;min-width:0;font-size:19px;font-weight:600;color:var(--crimson);line-height:1.15}
.schm{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--crimson);text-decoration:none;
  border:1px solid #e3c9c9;border-radius:8px;padding:4px 9px}
.smin{flex:0 0 auto;font-size:10.5px;font-weight:700;color:#fff;background:var(--crimson);
  border-radius:8px;padding:3px 8px;white-space:nowrap}
.srow{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px 9px 13px;
  border-bottom:1px dotted var(--line)}
.srow:last-child{border-bottom:none}
.srow:active{background:var(--line2)}
.smk{flex:0 0 16px;text-align:center;font-family:var(--disp);font-size:16px;color:var(--gold)}
.smk.m1{color:var(--crimson)}
.stx{flex:1;min-width:0;display:flex;flex-direction:column}
.sn{font-family:var(--disp);font-size:17.5px;font-weight:600;color:var(--ink);line-height:1.2}
.sr{font-size:11.5px;color:var(--soft);line-height:1.35;margin-top:1px}
.sside{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details .srow{padding-left:2px;padding-right:0}
/* cerca */
.sgps{margin-top:12px}
.sgps .mapbtn{margin-top:0}
.ssel{width:100%;margin-top:8px;padding:11px 13px;font:inherit;font-size:14px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 10px rgba(90,68,30,.08)}
.sgps .snote{margin-top:8px}
details.sfar{margin-top:16px}
/* ficha del santo */
.splace{background:var(--paper2);border-left:3px solid var(--gold);border-radius:12px;padding:11px 12px 12px 13px;
  margin-bottom:10px;box-shadow:0 2px 9px rgba(90,68,30,.07)}
.spn{font-size:19px;font-weight:600;color:var(--crimson);line-height:1.15;margin-top:7px}
.spz{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:3px 0 4px}
.splace .row .k{flex-basis:28%}
.mapbtn.salt{background:var(--paper);color:var(--crimson);border:1px solid var(--line);box-shadow:none}
.mapbtn.sstar{background:var(--crimson)}
.mapbtn.sstar.on{background:var(--paper2);color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.sback{font-size:12px;font-weight:700;color:var(--crimson);padding:6px 0 0}
.spray{text-align:center;font-style:italic;color:var(--crimson)}
.src a{color:var(--soft)}
nav.tabs button{font-size:10px;letter-spacing:.06em}

/* lugares para improvisar */
.qrbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:11.5px;color:var(--soft)}
.qrbox img{width:180px;height:180px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.lrow{padding:10px 0;border-bottom:1px dotted var(--line)}
.lrow:last-child{border-bottom:none}
.lhd{display:flex;gap:8px;align-items:center}
.ln{font-size:17.5px;font-weight:600;color:var(--crimson);line-height:1.2;min-width:0}
.lmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px;font-size:11px;color:var(--soft);font-weight:600}
.ld{font-size:13px;color:#4a4136;line-height:1.45;margin-top:5px}
.lh{font-size:11.5px;color:var(--mute);margin-top:4px}
.lh a{color:var(--crimson);font-weight:700;text-decoration:none}
.stag.lc-cristiana{background:#f2e3e0;color:var(--crimson)}
.stag.lc-imperial{background:#ece6da;color:#6b5b44}
.stag.lc-mirador{background:var(--ok);color:var(--okk)}

.leg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-4px 0 12px;padding-left:2px}
.legl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:2px}
.lchip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--paper2);border:1px solid var(--line);color:#4a4136;text-align:left}
.lchip.ls{color:var(--crimson);border-color:#e8d2d2}
.ln{text-align:left}

ponde a la llamada Loggia de las Bendiciones, desde donde el Papa\nimparte las Bendiciones solemnes; debajo, se encuentra el altorrelieve La Entrega de las Llaves, de\n\nColumna dórica: es la que tiene el capitel más sencillo; sigue en complejidad el jónico y el más elaborado y florido es\nel corintio.\n\nBonvicino (1614). Coronan la fachada trece estatuas (5,70 m) del Redentor, **San Juan Bautista** y los\nApóstoles, a excepción de **San Pedro**. Corona el conjunto la majestuosa cúpula de **Miguel Ángel**\n(1465–1564), las dos cúpulas laterales, de Vignola (discípulo de Miguel Ángel y director de las\nobras a la muerte del maestro), son meramente decorativas: no guardan relación con el interior de la\nBasílica.\n A la derecha de la fachada, en el llamado Palacio del Mayordomo, está la imagen de la Virgen en\nmosaico. Son 50.000 teselas o piedrecitas que reproducen la imagen que se venera como Mater\nEcclesiae en el interior de la Basílica.\n\nPórtico2\n Al fondo a la derecha, la estatua de **Constantino**, de **Bernini** (1670). A la izquierda, la estatua\necuestre de Carlomagno (de Cornacchini, 1725), coronado en San Pedro, en la Navidad del año 800,\ndurante el pontificado de León III. De las cinco puertas por las que se entra a la Basílica, la de la\nderecha es la **Puerta Santa**, que se abre sólo cada Año Jubilar.\n\nSobre la puerta central se pusieron las\nhojas de bronce de la antigua basílica, que tienen como tema central una evocación del Concilio de\nFlorencia, en el que se debatió y se resolvió, por un tiempo, la difícil cuestión de la unión entre las\nIglesias de Oriente y de Occidente. Encima hay un relieve, Jesús que confió a San Pedro la Grey\nCristiana, de Bernini o de uno de sus discípulos. A la izquierda la Puerta de la Muerte, de Giaccomo\nManzú, y a la derecha la Puerta de los Sacramentos. Otro recuerdo de la antigua Basílica es el\nMosaico de la Navecilla, obra de **Giotto** muy restaurada y deteriorada; se ve entrando en el atrio3 y\ndando la espalda a la nave central.\n\n## La nave central\n\nSan Pedro tiene cerca de 35.000 m2 de superficie, incluyendo las capillas laterales y la sacristía, y\n186 m de largo, que llegan a 194 si se tiene en cuenta el espesor de los muros. El largo total, incluido\nel pórtico, es de 211,5 m. La capacidad interior, aprovechando todos los espacios disponibles, llega a\n60.000 personas, aunque en las ceremonias suelen entrar solamente 15.000. En el suelo de la nave\ncentral se pueden ver las medidas de algunas iglesias especialmente conocidas.\n\nLa nave central tiene la típica estructura de las iglesias de la Contrarreforma. Está cubierta por\nuna bóveda artesonada (de 44 m de alto), ricamente decorada en la época de Pío VI (1780). A nivel\nde la pilastra que está en línea con las capillas del Santísimo Sacramento y del Coro, se puede ver el\nempalme de la arquitectura de **Maderno**, más alta y más ancha con el brazo de crucero proyectado\npor **Miguel Ángel**. En los nichos excavados en las pilastras (= columnas cuadrangulares) a partir del\n1706 se han colocado estatuas de Fundadores de órdenes religiosas. Al final de la nave central está la\nestatua de San Pedro en bronce, con el pie derecho desgastado por los besos de los fieles. Durante\naños se pensó que era una escultura de **Arnolfo di Cambio** del s. XIII, pero recientes investigaciones\n(1989) permiten asegurar la paternidad a un artista sirio del s.V.\n\nSobre esta estatua, arriba de todo está la estatua de Don Bosco, con una hermosa curiosidad: tiene\ndos jovencitos: uno de ellos es Domingo Savio y el otro es CEFERINO NANUMCURÁ. Sobre esto\nquiero reportar aquí lo que cuentan las “Memorias Biográficas”tomo XIX:\n\n“Hay un detalle muy curioso, certificado por don Miguel Rúa. La primera vez que el Don Bosco visitó\n la Basílica de S. Pedro, en su compañía, el 26 de febrero de 1858, después de haber permanecido unos\n instantes contemplando en silencio el espectáculo de tanta magnificencia, lo que más llamó su atención fue\n la serie de estatuas de mármol que representaban a los fundadores de familias religiosas; y he aquí que\n había llegado también para él el momento de ser colocado en uno de los nichos, que entonces observó\n vacío y a la espera de quien lo había de ocupar. Subió a él, por tanto, en el mes de enero de 1936.\n Su monumento es un colosal grupo de mármol, cuya figura principal mide cuatro metros con ochenta\n centímetros de altura, sin tener en cuenta el pedestal de un metro y siete centímetros. Don Bosco está\n representado en actitud de señalar con noble gesto de su derecha el altar papal con dos jovencitos,\n\nPórtico: sitio cubierto y con columnas que se construye delante de los templos u otros edificios suntuosos.\n Atrio: espacio descubierto y por lo común cercado de pórticos, que hay en algunos edificios.\n\nenvueltos por su mano izquierda con un amplio gesto paternal. Son éstos el Venerable Domingo Savio y el\n patagón Ceferino Namuncurá. José De Mori hizo de ella una descripción, de la que extraemos algunos\n períodos (L'Avvenire d'Italia, 9 de enero de 1936). La estatua de Don Bosco transparenta, en efecto, «el\n carácter meditativo del Santo, su fuerza intelectual, su previsión de santo y de apóstol, lo que, unido a la\n sonrisa paternal de su boca, integra bien su carácter exuberante de caridad y de amor».\n\nEl gesto es\n «expresivo, espontáneo y al mismo tiempo recogido y austero. Con la mano izquierda protege a dos\n jovencitos que son la personificación histórica y espiritual de su misión. Más alto Domingo Savio, alumno\n predilecto, que pronto le seguirá en el honor de los altares. Más pequeño el muchacho patagón, Ceferino\n Namuncurá, hijo del gran Cacique, convertido con su tribu por el cardenal Cagliero, que fue como\n adoptado por don Bosco y por los Salesianos, para indicar que su apostolado en favor de la juventud no\n conoce límites de continentes ni prejuicios de razas (...).\n\nCon su mano derecha señala San Juan Bosco el\n venerado sepulcro del Príncipe de los Apóstoles y parece que los dos jovencitos estén pendientes de sus\n labios para oír perpetuada en el mármol aquella profesión de fidelidad al Pontificado Romano, que ha sido\n la divisa incontaminada de don Bosco».\n\nPara no recaer, en el error en el que deplorablemente incurrió alguno, hay que considerar que ni\n Domingo Savio ni Ceferino Namuncurá son los representantes de su país de origen, sino que, mientras el\n primero representa a la juventud de todo el mundo civilizado educada por don Bosco y sus discípulos, el\n otro simboliza a la juventud que los Misioneros de don Bosco van redimiendo en tierras no besadas todavía\n por el sol del Cristianismo y de la civilización.\n\nEl haber elegido como tipo de la segunda categoría a un hijo\n de las Pampas, se debe únicamente al hecho de que don Bosco enviara a sus primeros apóstoles del\n Evangelio, como todos saben, a las tribus de la Patagonia, entonces salvajes. El monumento fue inaugurado el treinta y uno de enero. La hornacina asignada por el Papa a don Bosco puede muy bien decirse que es un sitio de honor; en\n efecto, no hay ninguna otra en un lugar tan distinguido. La estatua se levanta allí sobre la de San Pedro y se\n destaca sobre el medallón en mosaico de Pío IX; don Francisco Tomasetti explicó muy bien lo que ello\n significa.\n\nLos que vivieron en los últimos años del Santo no podían contemplarlo allá arriba sin recordar un\n sueño suyo, que le oyeron contar siendo niños. Le había parecido hallarse precisamente dentro de aquella\n hornacina sin saber cómo había sucedido aquello. Espantado miraba alrededor para pedir socorro; pero,\n reinaba un profundo silencio bajo las bóvedas del templo.\n\nDio entonces un grito, y con la angustia se\n despertó. ¡Quién sabe cuántas veces, al visitar San Pedro, se había él acercado a la estatua de bronce del\n Apóstol, había besado su pie, y había acercado, como suele hacerse, la frente hasta tocarlo como signo de\n humildad y fiel sumisión al Vicario de Jesucristo! Nadie, y él menos aún, habría imaginado entonces qué\n arcano podía esconderse bajo el velo del extraño sueño”.\n\n## La cúpula\n\n, que descansa sobre cuatro grandiosos arcos, tiene un perímetro de 71 m. Todo es\ngigantesco: la pluma de San Marcos mide cerca de dos metros: la linterna mide más de 17 m. En los\nmedallones de las pechinas se representan los cuatro evangelistas. En la base del tambor, la cúpula\nmide más de 42 m de diámetro, un espacio inmenso que llenan 96 figuras en mosaico de Papas,\nSantos y Doctores de la Iglesia, a medio busto, en el inferior: siguen sentados el Redentor, la Virgen,\n**San Pablo**, **San Juan Bautista** y los Apóstoles.\n\nEn la linterna, el Padre Eterno bendiciendo. En los cuatro grandes nichos de la base de la cúpula, están las estatuas mandadas colocar por\nUrbano VIII (de 5 m de alto) de:\n  San Longino, el soldado romano que clavó la lanza en el pecho de Jesús (Bernini); aquí,\n en los nichos del balcón, se guarda la punta de la lanza con la que éste abrió el\n costado de Jesús;\n  **Santa Elena** (Andrea Bolgil); se conserva aquí un fragmento de la verdadera cruz;\n  Santa Verónica (Mochil); se conserva aquí el llamado sudario de la Verónica, que ya\n estaba en la anterior basílica y es mostrado durante cada Semana Santa.\n  y **San Andrés** (Duquesnov); aquí se conservaba hasta 1964 la cabeza de san Andrés,\n que en ese año fue restituida por **Pablo VI** a la diócesis de Patras.\n\nActualmente se dice\n que está el manto de san Andrés. Bajo el altar papal está **la Confesión**, de Maderno; se llama así porque está construido\ndirectamente sobre la tumba del Apóstol que derramo su sangre por confesar a Cristo; 99 lámparas\nperennales que iluminan la tumba de San Pedro, al lado de la cual está la estatua de Pío VI (Canova). Papa amable y de cultura refinada que creó los Museo\n\n## El baldaquino y la Confesión\n\ns Vaticanos en los últimos años del s. XVIII.\nSobre el altar papal se levanta el Baldaquino, obra maestra de Bernini. Inaugurado por Urbano VIII\n\nBarberini el 28 de junio de 1633, víspera de San Pedro y San Pablo, tiene la altura de Palacio\nFarnese (29 m).\n\n## La nave de la derecha\n\nLa primera capilla es la de **la Piedad**, famoso grupo escultórico de Miguel Ángel, realizado\ncuando contaba 25 años de edad. Es la única obra que lleva la firma del artista: puede verse en la\ncinta que cruza el vestido de la Santísima Virgen. Firmó cuando oyó un impostor adjudicarse la\nobra. A continuación se encuentra La Capilla Elíptica de Bernini, donde se ha colocado el Crucifijo\natribuido a Cavallini (s. XIII), de expresión vigorosa.\n\nLa siguiente capilla está dedicada al Martirio de San Sebastián, capilla que sustituyó al altar que\nse dedicaba en la antigua basílica constantiniana a Sebastián, mártir capitán de los Pretorianos bajo\ndel imperio de Diocleciano. A continuación, viene la Capilla del Santísimo Sacramento, donde se colocó el Tabernáculo de\nBernini, de bronce dorado y lapislázuli.\n\nDetrás del tabernáculo, el fresco de La Trinidad, obra de\nPietro di Cortona. Saliendo de la capilla, a mano derecha se encuentra el monumento al Papa Gregorio XIII\nBoncompagni, flanqueado por las estatuas de la Religión y de la Sabiduría. El bajorrelieve, recuerda\nla reforma del calendario dispuesta por el Pontífice. Al fondo, sobre el pilar que sostiene la cúpula está la tumba del beato Juan XIII. Girando este mismo pilar está la tumba con el cuerpo de san Josafat de Kuncewyz, metropolita\nucraniano, martirizado en 1623.\n\nFue traído de Viena a Roma después de la Segunda Guerra Mundial. Pío XII quiso que recibiera honores especiales en San Pedro por haber muerto por la unidad de la\nIglesia. La siguiente es la capilla Gregoriana, diseñada por Della Porta, y riquísima en mármoles y\npiedras preciosas. Sobre el altar, la pequeña imagen de la Virgen del Socorro, del s. XI, que estaba\nya en la primera Basílica. Bajo el altar está enterrado San Gregorio Nacianceno (+ 390), patriarca\nde Constantinopla y uno de los cuatro grandes Padres de Oriente.\n\nCrucero de la derecha\n Aquí tuvieron lugar las sesiones del Concilio Vaticano I, mientras que las del Vaticano II fueron\nen la nave central de la Basílica. En los tres altares del crucero están los mosaicos de San\nWenceslao, Rey de Bohemia; el Martirio de San Proceso y San Martiniano y están sus reliquias\n(estos fueron los carceleros de san Pedro y fueron convertidos por él); y El Martirio de San Erasmo.\n\nTodos los cuadros del interior de la Basílica son copias en mosaico de famosas pinturas al óleo de\nla época. En las obras escultóricas trabajaron más de 600 artistas.\n\nÁbside\n El luminoso proyecto para el\n\n## El ábside y la Cátedra\n\nábside, de Miguel Ángel, fue superado por el formidable sentido\ndecorativo –fantasía barroca– de Bernini, que engrandece **la Cátedra** de San Pedro, realizada en\nbronce y oro bajo el pontificado de Alejandro VII (1656–65), como relicario de un trono papal\ncuyo origen se remonta al s.VIII. Este trono fue traído por Carlos el Calvo en el 875 para su\ncoronación y luego donado al Papa; pero según otros se trataría de una silla proveniente de la\niglesia de santa Pudenciana, y propiedad del senado san Pudente quien hospedaba a san Pedro,\npor lo que la habría usado este apóstol.\n\nDos tumbas papales flanquean la cátedra: la de Urbano VIII de Bernini, y la de Paulo III, de\nDella Porta (1551–75). Al fondo, la Gloria de Bernini, con la representación del Espíritu Santo. La luz penetra a través\ndel cristal de Bohemia como entre una nube de oro. Sigue la Capilla de Nuestra Señora de la Columna, donde se encuentran las reliquias de San\nLeón Magno. Papa que tuvo que enfrentarse con numerosas controversias y herejías; fue él quien\n\nconvocó el Concilio de Calcedonia en el 451, donde los más de 600 Padres Conciliares dieron un\nclaro ejemplo de la unión con el Romano Pontífice. Cuando recibieron la carta del Papa, la\naclamaron: “Pedro ha hablado por boca de León”. En la misma capilla se encuentra la imagen de la\nVirgen, Madre de la Iglesia, que procede de la Basílica primitiva. En esta capilla se quiso\nrepresentar a los doctores que más han escrito sobre la Santísima Virgen: Santo Tomás, San Juan\nDamasceno, San Genaro y San Buenaventura.\n En el pasaje que sigue, la tumba de Alejandro VII, del último periodo de actividad de Bernini,\ncon las representaciones de la Caridad, la Verdad, la Justicia y la Prudencia, obra de Mazzoli.\n\nCrucero de la izquierda\n El tercer brazo de la cruz griega de Miguel Ángel está formado por la tribuna, también llamada\nde los Santos Simón y Judas, y que comprende, además de la enorme bóveda decorada por\nVanvitelli y Maini, tres altares decorados con mármoles preciosos:\n  San Marcial, de Camuccini,\n  Al centro San José Protector de la Iglesia Universal –la única pintura moderna de la\n Basílica–, de Achille Funi. Bajo este altar están enterrados los restos de los apóstoles\n Simón y Judas Tadeo.\n  y el Martirio de San Pedro, de Guido Reni, sobre el punto exacto del Circo de **Nerón** en\n el que el primer Papa fue crucificado sobre una cruz invertida.\n\nA continuación, se encuentra la capilla Clementina, llevada a cabo por Della Porta. En el altar de\nla derecha, **San Gregorio Magno**, de Andrea Sacchi; bajo el altar se conservan las reliquias del\nsanto; Gregorio era miembro de una familia noble romana, llegó a ser prefecto de la Urbe antes de\nser elegido Papa, el año 590. Al lado, la tumba de Pío VIII: Papa que sufrió la prisión en 1809 por\norden de Napoleón, obra neoclásica de Thorvaldsen (1823). Es la única obra realizada en San Pedro\npor un artista protestante.\n\n## La nave de la izquierda\n\nEn su extremo, el altar de la Transfiguración, con el mosaico que reproduce la obra maestra de\n**Rafael** (1483–1530). Enfrente se encuentra la capilla del Coro, destinada a la oración de los canónigos, obra de Della\nPorta, que guarda los sepulcros de Clemente XI y de San Juan Crisóstomo. En el pasaje siguiente, la Tumba de Inocencio VIII, de Pollaiolo (1498), en bronce parcialmente\ndorado. Es el monumento fúnebre más antiguo, el único que fue trasladado de la Basílica\nConstantiniana a la nueva (1619), y el primero en el que se ve a un Papa sentado en su trono.\n\nSon\nespecialmente bellos los relieves en los nichos con las figuras de las cuatro virtudes cardinales. En\neste mismo pasaje, el monumento a **San Pío X**. Bajo el altar de la siguiente capilla, de la Presentación, se encuentran los restos incorruptos de\n**San Pío X**, canonizado en 1954. En esta misma capilla está el monumento a Benedicto XV. A la derecha del altar, se halla el lóculo donde se depositan los restos del Papa desde\nque fallece hasta que se trasladan a su sepultura definitiva. Por último, el Baptisterio, con el mosaico del Bautismo de Jesús, diseñado por Maratta. En las\npechinas, están representadas las partes del mundo que han sido evangelizadas.", "logi": {"Horario": "7:00 a 20:00 · último ingreso 19:15", "A pie": "8 min", "Costo adultos": "Basílica gratis · Cúpula €10", "Costo niños": "Gratis · Cúpula €5", "Tip": "Llegar 8:30 para evitar fila", "Sobre el horario": "Desde junio de 2026, todos los días. basilicasanpietro.va"}, "map": "Basilica di San Pietro", "id": "s5", "day": "10", "hrs": {"open": [[420, 1200]], "closed": []}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **Piedad**, primera capilla de la nave derecha. Única obra que Miguel Ángel firmó: la firma está en la cinta que cruza el pecho de la Virgen.", "La **Confesión** bajo el altar papal, con 99 lámparas siempre encendidas sobre la tumba del Apóstol.", "El **baldaquino de Bernini**: 29 metros de bronce, la altura del Palacio Farnese.", "La **estatua de bronce de San Pedro**, al final de la nave central, con el pie derecho gastado por los besos.", "El **cuerpo de San Pío X**, incorrupto, en la capilla de la Presentación.", "La **Cátedra de Bernini** en el ábside, y arriba la Gloria con el Espíritu Santo en alabastro.", "En los nichos de la cúpula, **San Longino** de Bernini: ahí se guarda la punta de la lanza que abrió el costado de Cristo."], "zone": "Vaticano y Prati"}, {"time": "10:20", "name": "Grutas Vaticanas", "tag": "site", "type": "site", "dur": 40, "quick": "El nivel de las tumbas papales. Aquí está Benedicto XVI.", "hist": "Nivel inferior de la basílica, construido sobre la necrópolis antigua. Reposan aquí decenas de pontífices, desde el siglo X hasta hoy.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde adentro de la basílica, bajar por la escalera señalizada \"Tombe dei Papi / Grotte Vaticane\", cerca de la Confesión. No hay que salir ni volver a hacer fila."}, "logi": {"Horario": "7:00 a 18:00", "Costo": "Gratis", "Salida": "Da al exterior, junto a la sacristía", "Sobre el horario": "Siguen el horario de verano de la basílica hasta el 25 de octubre."}, "id": "s6", "day": "10", "hrs": {"open": [[420, 1080]], "closed": []}, "hv": false, "pri": 1, "full": "Entre el piso de la basílica que se pisa hoy y la necrópolis romana que está mucho más abajo hay un tercer nivel que casi nadie espera encontrar. Son las Grutas Vaticanas: lo que quedó de la basílica que **Constantino** levantó en el siglo IV, sepultada cuando el Renacimiento decidió reemplazarla por algo más grande.\n\n## Por qué existen\n\nHacia el año 320, Constantino mandó construir sobre la tumba del Apóstol una basílica de cinco naves y ciento veinte metros de largo. Para ganar una superficie plana sobre la ladera del Vaticano hubo que hacer un trabajo brutal de nivelación: se cortó la colina de un lado y se rellenó del otro, sepultando bajo miles de metros cúbicos de tierra la necrópolis pagana que cubría la pendiente. Ese relleno es la razón por la que hoy se puede visitar el Scavi: la tierra conservó los mausoleos intactos durante mil seiscientos años.\n\nLa basílica constantiniana estuvo en pie unos mil doscientos años. Cuando en 1506 **Julio II** decidió demolerla y levantar la actual, el nivel del piso nuevo quedó unos tres metros y medio más alto que el antiguo. Ese hueco entre los dos pisos, en vez de rellenarse, se convirtió en cripta. Ahí quedaron atrapados capiteles, columnas, sarcófagos, mosaicos y frescos de la vieja iglesia. Y ahí se fueron acomodando, siglo tras siglo, las tumbas de los papas.\n\n## Lo que se conserva de la basílica vieja\n\nEs el testimonio más importante que queda de la Roma cristiana del siglo IV en el Vaticano. Se conservan tramos del pavimento original, columnas del pórtico, fragmentos del mosaico que decoraba el ábside y varios sarcófagos paleocristianos con escenas del Antiguo y del Nuevo Testamento talladas en el frente. También hay lápidas medievales, restos de altares y frescos de los siglos XIII y XIV que estaban en la nave antes de la demolición.\n\nLos papas del Renacimiento no siempre trataron bien lo que encontraban: buena parte del mármol de la basílica vieja se reutilizó en la nueva, y muchos monumentos se perdieron. Lo que hay acá es lo que se salvó, muchas veces por accidente.\n\n## Las tumbas\n\nReposan alrededor de noventa pontífices, desde el siglo X hasta hoy, junto con algunos soberanos que quisieron ser enterrados a los pies de Pedro.\n\nEstá **Adriano IV**, el único papa inglés de la historia, muerto en 1159 y sepultado en un sarcófago de granito rojo que ya era antiguo cuando lo usaron. Está **Bonifacio VIII**, el del primer Jubileo de 1300, con el monumento funerario que le hizo **Arnolfo di Cambio**. Está **Nicolás III**, que fue quien empezó a construir los palacios vaticanos. Y están las reinas: **Cristina de Suecia**, que abdicó de su trono en 1654 para convertirse al catolicismo y se vino a vivir a Roma, y Carlota de Chipre.\n\nEn el sector más nuevo está el sarcófago de **Benedicto XVI**, muerto el 31 de diciembre de 2022. Es de mármol blanco, con una inscripción sobria: su nombre, las fechas, nada más. También está Juan Pablo I, el papa de los treinta y tres días.\n\n## La capilla clementina\n\nEs el punto central de todo el recorrido, aunque no lo parezca. Está exactamente sobre la tumba de **San Pedro**, en el eje vertical que une la necrópolis, el altar papal y la cúpula de **Miguel Ángel**.\n\nDetrás del altar de esta capilla hay un muro. Del otro lado, a menos de dos metros, está el **trofeo de Gayo**, el pequeño monumento con columnas que hacia el año 200 ya marcaba el sepulcro del Apóstol, y el Muro G donde aparecieron los restos óseos. Quien hizo el Scavi por la mañana reconoce esa pared desde el otro lado.\n\nEl nombre viene de Clemente VIII, que hizo decorar el espacio a fines del siglo XVI. Es un lugar chico y silencioso, muy distinto de la basílica enorme que está justo encima.\n\n## La visita\n\nLa entrada es gratuita y se hace desde adentro de la basílica, bajando por una escalera señalizada junto a **la Confesión**. No hay que salir ni volver a hacer la fila del control. El recorrido es de una sola dirección y termina saliendo al exterior, cerca de la sacristía.\n\nMedia hora alcanza. Hay silencio obligatorio y no se permiten fotos. Conviene hacerlo después de recorrer la basílica de arriba: la secuencia natural es ver primero lo monumental y bajar después a lo antiguo.", "src": "propio", "ver": ["La **tumba de Benedicto XVI**.", "Los restos de la basílica de Constantino, del siglo IV, bajo el piso actual.", "La capilla clementina, justo encima de la tumba de San Pedro."], "zone": "Vaticano y Prati"}, {"time": "11:15", "name": "Almuerzo temprano en el Borgo", "tag": "food", "type": "food", "dur": 60, "quick": "Algo liviano antes de los Museos: hay que estar en la puerta a las 12:40.", "travel": {"mode": "walk", "dur": 8, "costAd": "Gratis", "costCh": "Gratis", "how": "Saliendo de las Grutas junto a la sacristía, cruzar la plaza hacia la columnata derecha y entrar a Borgo Pio, la calle peatonal paralela a Via della Conciliazione."}, "logi": {"Costo adultos": "€15 a €25", "Costo niños": "€8 a €12"}, "id": "s7", "day": "10", "pri": 3}, {"time": "12:40", "name": "En la puerta de los Museos", "tag": "rest", "type": "rest", "dur": 20, "quick": "Viale Vaticano. Estar 20 minutos antes del turno de las 13:00.", "logi": {"Entrada": "Viale Vaticano, muralla norte", "Turno": "Sábado 10, 13:00", "Llegar": "12:40", "Importante": "Entradas en el celular y documento de cada uno"}, "map": "Musei Vaticani ingresso, Viale Vaticano", "id": "s19", "day": "10", "pri": 3, "travel": {"mode": "walk", "dur": 12, "costAd": "Gratis", "costCh": "Gratis", "how": "Desde Borgo Pio, salir a Piazza del Risorgimento por Via di Porta Angelica y seguir la muralla por Via Leone IV y Viale Vaticano hasta la entrada.", "tip": "Salir del almuerzo 12:25 a más tardar."}}, {"time": "13:00", "name": "Museos Vaticanos y Capilla Sixtina", "tag": "site", "type": "site", "dur": 210, "quick": "Galería de los Mapas, Estancias de Rafael y la Sixtina. Turno 13:00.", "hist": "La colección papal empezó con el Laocoonte, comprado por Julio II en 1506. Hoy son siete kilómetros de salas.", "travel": {"mode": "walk", "dur": 2, "costAd": "Gratis", "costCh": "Gratis", "how": "Ya en la puerta: control de seguridad y validación de las entradas adentro.", "tip": "Hay que salir de las salas 30 minutos antes del cierre."}, "full": "## Lo que no hay que perderse\n\nLas obras más sobresalientes que conviene ver como mínimo:  De la Pinacoteca. Sala II: Políptico de **Giotto**; Sala III: la Coronación de la Virgen, de Filippo Lippi y La Virgen de los Ángeles, de Fray Angélico; Sala V: La Piedad, de **Bernini**; Sala VI: La Virgen con el Niño, de Perugino; Sala VII: varias obras de Rafael; Sala VIII: Boceto de San Jerónimo, de Leonardo da Vinci (1452–1519); Sala X: La\n\nVirgen de San Nicolás, de **Ticiano**: Sala XII: Comunión de San Jerónimo, de **Domenichino** y La Deposición, de Caravaggio: Sala XIII: Las bodas de Santa Catalina, de Murillo.  En el Museo Pío–Clementino, que se encuentra en el Palacio del Belvedere, se conservan obras de la antigüedad griega y romana. Lo más sobresaliente es el grupo del Laconte, el Apolo, Perseo, Hermes y El Atleta en el Patio del Belvedere: La Estatua de Meleagro, en la sala de los Animales: Apolo Saurótono, en la Galería de las estatuas: varias esculturas de la Galería de los Bustos: la Venus de Cnido, en el Gabinete de las Máscaras.\n\n## Las Estancias de Rafael\n\nEl Torso del Belvedere, en la Sala de las Musas.  Las estancias de **Rafael**.  La Capilla Sixtina. Estancias de Rafael La Estancia del Incendio (1514–17) fue la última habitación diseñada personalmente por Rafael, pues a partir de 1515 trabajó con un grupo de asistentes, que plasmaban los frescos del maestro. Los del techo son de Perugino. Para honrar al Papa León X –sucesor de **Julio II**–, que confirmó a Rafael en el encargo de decorar las estancias, el artista retrató al Papa al representar a sus predecesores León III y León IV.\n\nEn la Coronación de Carlomagno (en la pared de entrada), el emperador está representado como Francisco I de Francia, contemporáneo del pintor. En la pared de la derecha, de frente a la ventana, el Incendio del Borgo, en el que se representa el pasaje del **Liber Pontificalis** que narra el incendio, ocurrido el 847, del barrio del Borgo, extinguido por León IV con el signo de la Cruz. En la pared de enfrente, la Batalla de Ostia, que representa el triunfo de León IV sobre los sarracenos (849), idea alusiva a la cruzada contra los turcos, que ocupó vivamente a León X.\n\n## Sala de Heliodoro\n\nEn la pared de la izquierda, el Juramento de León III, representa el momento en que el Romano Pontífice aclaró en **San Pedro** la falsedad de ciertas acusaciones (23–XII–800). Cuenta la tradición que una voz tronó: “Corresponde a Dios, no a los hombres, juzgar a los Obispos”(inscripción latina a la izquierda de la ventana) . La Estancia de la Signatura (1508–11) está considerada como la obra pictórica más insigne de Rafael.\n\nParte del techo fue concluida por dos de sus colaboradores: **Sodoma** y Bramantino. En la pared de entrada, la disputa del Santísimo Sacramento, también llamado la Glorificación del Catolicismo, pues cielo y tierra se unen en un himno a Dios Uno y Trino en el misterio de la Transubstanciación. Es el primero de los grandes frescos romanos de Rafael. En la parte alta, la Iglesia triunfante rodea a la Santísima Trinidad. En la tierra, alrededor del altar con el Ostensorio (centro de toda la composición), Doctores de la Iglesia, Papas y fieles: se distingue a Dante, a la derecha con la corona de laurel.\n\nEn la pared de la derecha, la Prudencia y la Templanza. A la derecha de la ventana, Gregorio IX (retrato de Julio II) entrega a un abogado consistorial los Decretales; a la izquierda de la ventana, Justiniano entrega a Treboniano el Corpus Iuris Civilis. En la pared de enfrente, **la Escuela de Atenas**. Al centro, Platón (retrato de Leonardo da 'Vinci) y Aristóteles. A la izquierda, Sócrates (en túnica) habla con Alcibíades; Diógenes y un discípulo; Epicuro, coronado de laurel; Arquímedes (retrato de **Bramante**) hace figuras geométricas.\n\n## La Escuela de Atenas\n\nEn la esquina de la derecha aparece el mismo Rafael (con sombrero negro) , junto al pintor Sodoma (con sombrero blanco). La figura solitaria del primer–plano, con la cabeza apoyada en la mano izquierda, es **Miguel Ángel** que trabaja en **la Capilla Sixtina**. En la pared de la izquierda, el Parnaso. Alrededor de Apolo y las nueve Musas están agrupados los grandes poetas, encabezados por Homero y Virgilio. En la Estancia de Heliodoro (1512–14), los temas de la decoración, probablemente sugeridos por el mismo Julio II muestran intervenciones milagrosas de Dios en favor de su Iglesia.\n\nEn la pared de entrada, San León detiene la invasión de Atila. Una aparición de los Apóstoles Pedro y Pablo, dio ánimos a San León para repeler la invasión de los Hunos. Rafael ha trasladado el evento a Roma, como se puede ver por el Coliseo, el acueducto y la Basílica.. Rafael no había terminado la obra cuando Julio II murió (1513) y en el último momento le sustituyó en la persona de\n\nSan León I, por León X, a pesar que ya estaba representado en la figura del cardenal Giovanni de Medeci, a la izquierda con la Lámpara magna. En la pared de la derecha está representado el Milagro de Bolsena. En 1263, un sacerdote que dudaba en la presencia real de Cristo en las especies sacramentales, vio manar sangre de la Hostia en el momento de la Consagración, mientras celebraba la Santa Misa en Bolsena.\n\nEn esta obra maestra, Rafael resuelve magistralmente el problema de la ventana descentrada: colocándolo de forma asimétrica las escaleras a ambos lados del altar y situando a la multitud en el lado izquierdo, donde son mayores las restricciones. En la pared de enfrente se representa la Expulsión de Heliodoro, pasaje tomado del libro de los Macabeos: Heliodoro, que intenta robar el tesoro del Templo es expulsado por ángeles. En la pared de la izquierda, la Liberación de San Pedro, obra maestra por su dominio de la luz, que anticipa más de un siglo a **Caravaggio** y Rembrandt.\n\nLa Batalla de **Constantino** ( 1517–25) está decorada casi totalmente por discípulos de Rafael, tras la temprana muerte del maestro. En la pared de entrada, el Bautismo de Constantino; a la derecha, la Batalla del Puente Milvio; enfrente, la Aparición de la Santa Cruz; y a la izquierda, la Donación de Constantino, simbolizada por la entrega de una estatuilla dorada de Roma. La Sala del Claroscuro fue decorada por Rafael en 1517, pero no se conservan los frescos originales, que fueron sustituidos por otros. Contiene un modelo de madera que muestra la construcción interna de la cúpula de San Pedro.\n\n## La capilla de Nicolás V\n\nLa Capilla de Nicolás V fue decorada por fray Juan de Fiésole, llamado Beato Angélico, entre el 1447 y el 1451. En los ángulos se representa a grandes Doctores de la Iglesia; en el techo, a los Evangelistas. En las paredes, escenas de la vida de los mártires San Esteban y **San Lorenzo**, los dos santos diáconos, martirizados durante la persecución de Valeriano en el año 258.\n\n## La Capilla Sixtina\n\nEn el pavimento de mármol están representadas las figuras de los signos del zodíaco. Capilla Sixtina La Capilla Sixtina, dedicada a la Asunción de la Virgen, fue construida por Giovannino de'Dolci (1475–81), según un diseño de Boccio Pontelli, bajo el papado de **Sixto IV**, de quien toma el nombre. Es la capilla oficial de los Pontífices, en la que se celebran los cónclaves para la elección del nuevo Papa. Se trata de un ambiente rectangular de 40,5 m de largo, 13,2 m de ancho, y 20,7 m de altura. El pavimento, del s.XV, es una muestra singularísima de opus alexandrinum, semejante al cosmatesco.\n\n## Las paredes laterales\n\nLas paredes laterales fueron pintadas entre el 1481 y el 1483. En la zona inferior están pintados unos cortinajes, que recuerdan los que se colocaban entre las columnas en las antiguas Basílicas. Hace tiempo, para las ceremonias más importantes, se cubrían con los tapices de Rafael. Entre las Ventanas, retratos de antiguos Papas. En la zona intermedia, dos grandes series de frescos, en los que trabajaron los mejores artistas del s.XVI: la de la izquierda, mirando hacia el alta , representa sucesos de la vida de Moisés, y la de la derecha, de Cristo.\n\nA la izquierda, comenzando a contar desde el fondo hacia la pared del Juicio Universal se encuentran: 1. Moisés con su esposa Séfora en Egipto (Perugino); 2. La Zarza Ardiente (**Botticelli**) , Moisés mata al egipcio y expulsa a los Madianitas, La Familia de Jetro, de Botticelli; 3. Paso del Mar Rojo (Roselli); 4. Moisés en el Sinaí y La Adoración del Becerro de Oro; 5. Castigo de Cora, Dathan y Abiram, (Botticelli); 6, Testamento y Muerte de Moisés, (Siqnorelli).\n\nA la derecha, 1. Bautismo de Jesús (**Pinturicchio** y Perugino); 2. Curación del Leproso y Tentaciones de Cristo (Botticelli); 3, La Vocación de San Pedro y **San Andrés** (Ghirlandaio) ; 4, El Sermón de la Montaña y Curación del Leproso (Roselli); 5, La Entrega de las Llaves, una de las mayores composiciones de Perugino (el quinto personaje de la derecha es el mismo artista); 6. La Última Cena, de Rosselli. Frente al altar encontramos La Resurrección de Cristo, de Ghirlandaio, y San Miguel que protege el Cuerpo de Moisés, de Signorelli: destruidos y rehechos en el s.XVI.\n\n## El techo de Miguel Ángel\n\nFrescos del Techo. Cuando Julio II abandonó el proyecto escultórico de la tumba, Miguel Ángel regresó a Florencia, pero en 1508 volvió a llamarle para que pintara a los doce Apóstoles en el techo de la Capilla Sixtina, entonces pintado sólo de azul con unas estrellas doradas. Apenas había comenzado a trabajar, cuando se le ocurrió que no bastaría con los Apóstoles. Faltaba la decoración (de una superficie tan grande (cerca de 800 m2). Miguel Ángel abandonó el esquema tradicional,\n\nidear toda una única y grandiosa composición arquitectónica que abrazase todo el techo y que comprendiese no sólo retratos encasetonados en la misma repartición arquitectónica. Se cuenta que Julio II intentaba acercarse con frecuencia para dar una ojeada a la obra, pero el artista nunca se lo permitió, y a las frecuentes preguntas del Pontífice sobre cuándo terminaría, daba siempre la misma respuesta: “cuando pueda”. Empezando desde el altar, en los espacios rectangulares entre arco y arco, se encuentran los siguientes pasajes del Génesis: 1.\n\nDios divide la luz de las tinieblas; 2. Dios crea el sol, la luna y las plantas; 3. Dios divide las aguas y crea los peces y las aves; 4. Creación del primer hombre; 5. Creación de Eva, de la costilla de Adán; 6. El pecado original y la expulsión del paraíso; 7. El sacrificio de Noé; 8. El Diluvio universal; 9. La embriaguez de Noé. En cada recuadro menor, Miguel Ángel pintó los Ignudi, figuras de reminiscencia clásica que, por parejas, sostienen festones o guirnaldas y medallones que imitan el bronce, y que parecen comentar, con gestos, las escenas de los frescos.\n\nEn las doce penachos laterales, se encuentran las cátedras de los Profetas y Sibilas; 11. Zacarías, que consulta un libro; 12. Joel lee un papiro; 13. La Sibila Eritrea no sabe por dónde empezar su estudio; 14. Ezequiel con un rollo de papiro escucha a un Ángel; 15. La Sibila Persa enfrascada en la lectura; 16. Meditación del profeta Jeremías; 17. El profeta Jonás sale de la ballena; 18. La Sibila Libia se vuelve para tomar un libro; 19. Daniel escribe; 20.La Sibila Cumana abre un libro; 21.\n\nIsaías en meditación; 22. La Sibila Délfica desenrolla pensativamente un papiro. En las esquinas del techo se encuentran otras escenas bíblicas; 23. Judith y Olofernes; 24. David y Goliat; 25. El Castigo de Adán; y 26.La Serpiente de Bronce. En la parte alta de las ventanas, Miguel Ángel representó a los Antepasados de Cristo. El Juicio Final Pintado un cuarto de siglo después del techo (1536–41), bajo el Pontificado de Pablo III, cuando el artista contaba ya más de 60 años. Para su ejecución se tapiaron dos ventanas y se quitaron dos frescos de Perugino y dos lunetas del mismo Miguel Ángel.\n\n## El Juicio Final\n\nEn la parte central, en alto, domina la figura de Cristo, Juez Supremo; a su lado, la Virgen, alrededor, Santos, Patriarcas y Mártires, que llenan el Paraíso. A la derecha de Jesús, los elegidos entran al Cielo llevados por ángeles, mientras que los demonios tratan en vano de detenerlos. A su izquierda, los condenados son precipitados al castigo eterno, siendo recibidos por Caronte en su barca.\n\nEn el ángulo de la derecha, Minos, maestro del infierno, en el que Miguel Ángel retrató a Biagio da Cesena, Maestro de Ceremonias de Paulo III, añadiendo a la descripción de Dante dos grandes orejas de burro pues el Maestro había criticado la obra. Cuentan que el maestro de ceremonias pidió al Papa que le quitaran de ahí, y el Papa le contestó que no tenía poder para sacar a nadie del infierno. Abajo, a la izquierda, está la Resurrección de los Muertos y en medio, Caronte, el grupo de ángeles que hacen sonar las trompetas del juicio. A los pies de Jesús está San Bartolomé, que muestra su propia piel, en la que se ha autorretratado Miguel Ángel. En las lunetas, unos ángeles sostienen los símbolos de la Pasión.", "logi": {"Horario": "8:00 a 19:00 · último ingreso 17:00", "Reserva": "Comprada · sábado 10, 13:00", "Vestimenta": "Hombros y rodillas cubiertos", "Sobre el horario": "Cerrados los domingos, salvo el último de cada mes. Hay que salir de las salas 30 min antes.", "Costo": "Entradas ya compradas"}, "map": "Musei Vaticani", "id": "s20", "day": "10", "hrs": {"open": [[480, 1140]], "closed": [0]}, "hv": true, "pri": 1, "src": "fuentes", "ver": ["La **Galería de los Mapas**: 120 metros de frescos cartográficos del siglo XVI.", "Las **Estancias de Rafael**, sobre todo la Escuela de Atenas.", "La **Capilla Sixtina**: el techo y el Juicio Final. En silencio y sin fotos.", "El **Laocoonte**, en el Patio Octogonal. Con él arrancó la colección, en 1506."], "zone": "Vaticano y Prati"}, {"time": "16:45", "name": "Vuelta y descanso", "tag": "rest", "type": "rest", "quick": "Después de la Sixtina, a casa. Primer día completo: no estirarlo.", "travel": {"mode": "walk", "dur": 15, "costAd": "Gratis", "costCh": "Gratis", "how": "Saliendo por Viale Vaticano, bajar por Via di Porta Angelica, cruzar la Piazza San Pietro y seguir por Via di Porta Cavalleggeri hasta el departamento."}, "id": "s8", "day": "10", "pri": 3}]}, {"date": "2026-10-11", "phase": 1, "weekday": "Dom", "dd": "11", "title": "Misa · Esquilino", "note": "Todo el día está a diez minutos a pie de la capilla. Misa temprano para aprovechar la mañana entera.", "stops": [{"time": "08:10", "name": "Salida hacia Monti", "tag": "rest", "type": "rest", "dur": 40, "quick": "Unos 40 minutos hasta Via Urbana. Salir con margen.", "logi": {"Recorrido": "Metro A hasta Termini, después B una parada hasta Cavour", "Costo adultos": "€1,50", "Costo niños": "Gratis los menores de 10", "Alternativa": "Cuatro taxis, 20 min, ≈ €15 cada uno"}, "id": "s10", "day": "11", "pri": 3}, {"time": "08:30", "name": "Confesiones", "tag": "mass", "type": "mass", "dur": 30, "quick": "Antes de la misa, en la capilla.", "travel": {"mode": "metro", "dur": 40, "costAd": "€1,50", "costCh": "Gratis menores de 10", "how": "Caminar hasta la estación Ottaviano (línea A) y tomar dirección Anagnina hasta Termini. Ahí cambiar a la línea B dirección Laurentina, una sola parada hasta Cavour. Desde Cavour, subir por Via Cavour y doblar a la derecha en Via Urbana: la capilla está a 300 metros.", "tip": "Domingo temprano: el metro va casi vacío y hay ascensores en Termini para los cochecitos."}, "id": "s11", "day": "11", "logi": {"Horario": "Desde 8:30"}, "hrs": {"open": [[480, 540]], "closed": []}, "hv": true, "pri": 2, "full": "Antes de la misa dominical hay confesiones en la capilla, desde las 8:30. Es la razón por la que conviene llegar media hora antes.\n\n## Por qué se venía a Roma\n\nDurante siglos, confesarse en Roma fue uno de los motivos principales de la peregrinación. No era solo devoción: había pecados cuya absolución estaba reservada a la Santa Sede, y el penitente tenía que venir hasta acá o conseguir que su obispo escribiera.\n\nPara eso existe la Penitenciaría Apostólica, uno de los tribunales más antiguos de la Curia, creada en el siglo XII. De ella dependen los **penitenciarios** de las basílicas patriarcales: sacerdotes con facultades especiales para absolver casos reservados. En **San Pedro** son franciscanos conventuales, en **San Pablo** benedictinos, en Santa María la Mayor dominicos y en Letrán franciscanos menores.\n\n## Dónde confesarse en Roma\n\nLas cuatro basílicas mayores tienen confesionarios atendidos durante casi todo el día, y cada cabina lleva un cartel con los idiomas que habla el confesor. Español hay siempre.\n\nEn **San Pedro** están sobre la nave izquierda, pasando la capilla del Coro; suele haber diez o doce confesionarios funcionando a la vez. En **San Pablo Extramuros**, a la derecha del transepto. En **Santa María la Mayor**, cerca de la capilla del Santísimo. En **San Juan de Letrán**, en la nave izquierda.\n\nTambién hay confesión permanente en el Gesù, en Santa Maria in Trastevere y en la Chiesa Nuova. En la capilla de la Fraternidad, los domingos antes de cada misa y los viernes antes de la de las 18:30.\n\n## La indulgencia de las basílicas\n\nVisitar las cuatro basílicas mayores —San Pedro, San Juan de Letrán, Santa María la Mayor y San Pablo Extramuros— es la peregrinación romana clásica, y en todas ellas se puede ganar indulgencia plenaria cumpliendo las condiciones habituales: confesión sacramental, comunión eucarística y oración por las intenciones del Sumo Pontífice, con el desapego de todo pecado incluso venial.\n\nLa confesión no tiene que ser el mismo día: vale dentro de un período razonable, antes o después. Con una sola confesión se pueden ganar varias indulgencias, pero hace falta una comunión y una oración por el Papa para cada una.\n\n## Un consejo\n\nEl viaje va a tener días largos, cansancio y roces: quince personas conviviendo tres semanas es mucho. Aprovechar los domingos para confesarse, más que un trámite devocional, es lo que sostiene el clima del grupo. Y en Roma es más fácil que en cualquier otro lado: siempre hay un sacerdote esperando.", "src": "propio", "zone": "Monti y Esquilino"}, {"time": "09:00", "name": "Santa Misa", "tag": "mass", "type": "mass", "dur": 75, "quick": "Cappella Santa Caterina da Siena, Via Urbana 85. Rito tradicional.", "hist": "La capilla de la Fraternidad San Pío X en Roma, en pleno Monti, a pasos del Foro de Augusto. Misa dominical en la forma extraordinaria del rito romano.", "logi": {"Horario": "9:00 y 11:00 los domingos", "Dirección": "Via Urbana 85, Rione Monti", "Horarios domingo": "9:00 y 11:00", "Viernes": "18:30", "Costo": "Gratis", "Sobre el horario": "Cappella Santa Caterina da Siena. Viernes 18:30."}, "map": "Via Urbana 85, Roma", "travel": {"mode": "walk", "dur": 2, "costAd": "Gratis", "costCh": "Gratis", "how": "Es en la misma capilla donde se confesaron. Solo hay que sentarse."}, "id": "s12", "day": "11", "hrs": {"open": [[510, 630]], "closed": []}, "hv": true, "pri": 1, "full": "La Fraternidad Sacerdotal **San Pío X** tiene en Roma su capilla en Via Urbana 85, en pleno Rione Monti, a pasos del Foro de **Augusto** y de la basílica de Santa Pudenciana. Está dedicada a Santa Catalina de Siena.\n\n## Santa Catalina y el regreso de los papas\n\nCatalina Benincasa nació en Siena en 1347, la vigésimo cuarta hija de un tintorero. Terciaria dominica, analfabeta hasta la juventud, dictaba sus cartas a secretarios y se las mandaba a reyes, cardenales y papas con una libertad que a muchos les resultaba insoportable.\n\nEn 1376 viajó a Aviñón, donde los papas llevaban setenta años instalados bajo la protección de la corona francesa. Se plantó delante de **Gregorio XI** y le dijo que volviera a Roma. El papa volvió al año siguiente. Catalina murió en Roma en 1380, a los treinta y tres años, agotada. Es patrona de Italia y de Europa, y doctora de la Iglesia.\n\nQue la capilla lleve su nombre no es casual: es la santa que peleó por que la sede de Pedro estuviera donde tiene que estar.\n\n## La misa tradicional\n\nSe celebra en la forma extraordinaria del rito romano, el rito que **San Pío V** codificó en 1570 con la bula *Quo primum*, después del Concilio de Trento, y que se rezó prácticamente sin cambios durante cuatro siglos.\n\nPío V no inventó nada: fijó lo que la Iglesia de Roma venía haciendo desde hacía más de mil años, y ordenó que ese misal se usara en todas partes salvo donde hubiera un rito propio con más de dos siglos de antigüedad. De ahí que sobrevivieran el ambrosiano de Milán, el mozárabe de Toledo y el dominicano.\n\nLa misa es en latín, el sacerdote celebra vuelto al altar junto con el pueblo, y hay largos silencios: el canon se reza en voz baja. Para quien no está acostumbrado, conviene llegar unos minutos antes y conseguir un misal bilingüe.\n\n## Los horarios\n\nDomingos a las 9:00 y a las 11:00, con confesiones antes de cada una. Viernes a las 18:30. La capilla es chica y en temporada alta se llena, así que conviene no llegar sobre la hora.\n\n## El barrio\n\nMonti es el rione más antiguo de Roma. En la antigüedad era la Suburra, el barrio popular y hacinado donde vivían los pobres de la ciudad y donde nació **Julio César**. Hoy conserva un aire de pueblo que se perdió en el resto del centro: calles angostas, escaleras, ropa colgada, trattorias de barrio y talleres de artesanos.\n\nAlrededor de la capilla, en un radio de diez minutos a pie, hay más iglesias importantes que en casi cualquier otro punto de Roma. **Santa Pudenciana**, a la vuelta, con el mosaico absidal más antiguo de la ciudad. **Santa Práxedes**, con la columna de la flagelación y la capilla de **San Zenón**. **Santa María la Mayor**, la basílica mayor mariana. Y **San Pietro in Vincoli**, con las cadenas del Apóstol y **el Moisés** de Miguel Ángel.\n\n## Cómo llegar\n\nDesde el departamento son unos cuarenta minutos: metro A hasta Termini, línea B una parada hasta Cavour, y cinco minutos caminando. Subiendo por Via Cavour se dobla a la derecha en Via Urbana. Un domingo temprano el metro va casi vacío y Termini tiene ascensores para los cochecitos.", "src": "propio", "zone": "Monti y Esquilino"}, {"time": "10:15", "name": "Santa Pudenciana", "tag": "site", "type": "site", "dur": 30, "quick": "A la vuelta de la capilla. El mosaico absidal más antiguo de Roma.", "hist": "Levantada sobre la casa del senador Pudente, donde según la tradición se hospedó San Pedro. El mosaico del ábside es del siglo IV.", "travel": {"mode": "walk", "dur": 5, "costAd": "Gratis", "costCh": "Gratis", "how": "Bajar por Via Urbana hacia Via Cavour. Santa Pudenciana está sobre Via Urbana 160, unos metros más abajo, en un nivel hundido respecto de la calle actual.", "tip": "El piso está varios metros por debajo del nivel de hoy: eso da la medida de cuánto subió Roma en dieciséis siglos."}, "full": "## La casa de Pudente\n\nLa antigua tradición narra que en los primeros tiempos de la era cristiana existía en este lugar la casa del noble senador romano Pudente, padre de **Santa Práxedes** y **Santa Pudenciana**, quien había hospedado al apóstol Pedro, quien bautizó a S. Pudenciana. Aquí habitó S. Justino, filósofo y mártir. Están sepultados numerosos mártires, enterrados aquí por las santas Pudenciana y Práxedes (así como en la iglesa de S. Práxedes). En la capilla de S. Pedro, un sarcófago, ideado por el Card. Wiseman (autor de “Fabiola”) encierra un fragmento del altar de madera sobre el cual S. Pedro celebraba la Misa.\n\n## El mosaico del ábside\n\nEn el s.II se instalaron aquí unas termas y en el s.IV la iglesia de Santa Pudenciana, que se incendió en ese mismo siglo. Fue reconstruida en el s.VIII y sucesivamente restaurada. A finales del s.XII **Inocencio III** mandó construir el campanario y la entrada. En 1589 se realizaron profundas modificaciones, sobrepuestas al antiguo edificio románico. En el interior destacan los mosaicos del s.IV, uno de los más antiguos ejemplos –junto con los de Santa María la Mayor, Santa Constanza y el Baptisterio de San Juan de Letrán–de mosaico cristiano en Roma. La forma en que está representado Cristo, el brillante colorido y el movimiento de las figuras muestran la persistencia de las características romanas en el mosaico cristiano, antes de la influencia oriental.\n\nDesde aquí, por la Via Urbana, se desemboca en la Piazza dell´Esquilino. En cuyo centro se levanta un obelisco (14.80 m) que, como su gemelo de la Plaza del Quirinal, adornaba el ingreso del Mausoleo de **Augusto**, y que fue transportado por **Sixto V** en el 1587. A la derecha, sobre la grandiosa Escalinata, se puede apreciar la parte exterior del ábside de Santa María la Mayor.", "logi": {"Horario": "8:30 a 12:00 y 15:00 a 18:00", "Costo": "Gratis"}, "map": "Basilica di Santa Pudenziana, Roma", "id": "s13", "day": "11", "hrs": {"open": [[510, 720], [900, 1080]], "closed": []}, "hv": false, "pri": 2, "src": "fuentes", "ver": ["El **mosaico del ábside**, del siglo IV: Cristo entronizado entre los apóstoles vestidos como senadores romanos. El más antiguo de Roma.", "El nivel del piso, varios metros por debajo de la calle: es la medida de cuánto subió Roma en dieciséis siglos.", "Aquí estuvo la casa del senador Pudente, que hospedó a San Pedro, y aquí vivió San Justino mártir."], "zone": "Monti y Esquilino"}, {"time": "10:45", "name": "Santa Práxedes", "tag": "site", "type": "site", "dur": 30, "quick": "La capilla de San Zenón y la columna de la flagelación.", "hist": "Fundada por el papa San Pascual I en el siglo IX. La capilla de San Zenón está enteramente revestida de mosaico bizantino, único en Roma.", "travel": {"mode": "walk", "dur": 7, "costAd": "Gratis", "costCh": "Gratis", "how": "Cruzar Via Cavour y subir por Via di San Martino ai Monti. La entrada de Santa Práxedes es discreta, sobre Via di Santa Prassede, casi al lado de Santa María la Mayor.", "tip": "La puerta principal suele estar cerrada: se entra por la lateral."}, "full": "## Las dos hermanas\n\nEsta iglesia es uno de los “antiguos títulos”, es decir, una casa particular donde se tenían las ceremonias litúrgicas en la antigüedad. En este lugar era la casa de la familia de **Santa Práxedes**, de su hermana **Santa Pudenciana**, de sus hermanos San Timoteo y Novato y su padre San Pudente. Bajo el altar mayor, en la cripta están los sarcófagos con los restos de santa Práxedes y Pudenciana, traídas aquí del cementerio de Priscilla.\n\nAdemás se veneran los restos de 2300 mártires (estas santas juntaban los cuerpos después del martirio y los sepultaban en su casa), Se tienen noticias de su existencia como Basílica ya desde el s.V; pueden verse todavía restos de las antiguas estructuras en el cuádruple pórtico de la iglesia. La construcción actual es de la época de **Pascual I** (822), y responde a una planta basilical, con las tres naves separadas por 16 columnas de pórfido gris y 6 pilastras en las que se apoyan directamente las trabes.\n\n## La iglesia\n\nFue modificada en el s.XIII, al agregársele tres arcos transversales en la nave, en el s.XVII al decorarla con frescos, y al arreglar el techo en el s.XIX. Lo más sobresaliente en el interior son los mosaicos del arco triunfal y del ábside, del s.IX y especialmente la Capilla de **San Zenón** (a la derecha), el monumento bizantino más importante de Roma, fue encargada por Pascual I (817–824), como mausoleo para su madre, Teodora. Aunque ha sufrido modificaciones posteriores, se trata de una obra deliciosa, llamada el Jardín del Paraíso.\n\n## La capilla de San Zenón\n\nLas doce columnas de granito negro, a los lados del portal, y el rico marco que sirve de trabe, provienen de edificios de la antigüedad pagana, así como las bases de las columnas y la urna de mármol que se encuentra en el arco de la entrada. El interior (dirigirse a la sacristía) está cubierto de mosaicos sobre fondo dorado, de gran interés artístico, por su riguroso estilo bizantino. El ícono de la Virgen se denomina “Santa María, libera nos a poenis inferni”, muy venerado en la antigüedad.\n\nA la derecha de esta capilla se encuentra un pequeño monumento donde se puede venerar la Columna de la Flagelación de Nuestro Señor; en la pared opuesta, por el lado exterior, un fresco recuerda esta escena con toda su crueldad. Fue traída de Jerusalén en 1223 por el cardenal Giovanni Colonna. También se conservan tres espinas de la corona de Cristo, en un relicario. En el monasterio de S. Práxedes habitaron del 867 al 869 los santos Cirilo y Metodio, apóstoles de los eslavos y creadores de la escritura paleoeslava. Aquí murió S. Cirilo el 14 de febrero de 869 (sus restos están en la iglesia de S. Clemente).\n\n## La nave izquierda\n\nEn la segunda capilla de la nave izquierda, dedicada a S. Carlos Borromeo, está el faldistorio de San Carlos (del latín faldistorium; es un elegante asiento originario de la Edad Media que utilizan los obispos delante del altar en algunas funciones pontificales como impartir la confirmación, ordenaciones, etc. Es un asiento sin respaldo, con cuatro pilares pequeños en los ángulos y las patas en forma de tijera). En la tercera capilla se custodia la mesa en la que el mismo santo distribuía la comida a los pobres.", "logi": {"Horario": "7:30 a 12:00 y 16:00 a 18:30", "Costo": "Gratis", "No perderse": "La columna de la flagelación, en la capilla de San Zenón", "Sobre el horario": "Se entra por la puerta lateral de Via di Santa Prassede."}, "map": "Basilica di Santa Prassede, Roma", "id": "s14", "day": "11", "hrs": {"open": [[450, 720], [960, 1110]], "closed": []}, "hv": false, "pri": 1, "src": "fuentes", "ver": ["La **capilla de San Zenón**, a la derecha: enteramente revestida de mosaico bizantino. El monumento bizantino más importante de Roma.", "La **columna de la flagelación**, dentro de esa misma capilla, traída de Jerusalén en 1223.", "Los mosaicos del arco triunfal y del ábside, del siglo IX, encargados por el papa San Pascual I.", "El disco de mármol en el piso de la nave: la tradición dice que ahí Práxedes recogía la sangre de los mártires."], "zone": "Monti y Esquilino"}, {"time": "11:15", "name": "Santa María la Mayor", "tag": "site", "type": "site", "dur": 90, "quick": "Basílica mayor mariana: la reliquia del pesebre, la Salus Populi Romani y la tumba de San Pío V.", "hist": "La mayor de las iglesias marianas de Occidente, levantada tras el Concilio de Éfeso (431). Conserva los mosaicos paleocristianos del siglo V en la nave.", "travel": {"mode": "walk", "dur": 4, "costAd": "Gratis", "costCh": "Gratis", "how": "Salir de Santa Práxedes y bordear la manzana: la fachada lateral de Santa María la Mayor está enfrente. El ingreso principal da a Piazza di Santa Maria Maggiore.", "tip": "Hay control de seguridad, puede haber unos minutos de fila."}, "full": "## La nevada de agosto\n\nEl **Liber Pontificalis** narra que la noche del 5 de agosto del 352, la Santísima Virgen se apareció en sueños a un patricio romano de nombre Ioannes, a quien expresó su deseo de que se construyera una iglesia en cierto lugar de Roma donde nevaría la mañana siguiente. Ioannes refirió el mensaje al Papa Liberio, esa misma mañana, mientras una copiosa nevada cubría de blanco el punto más alto del Esquilino, una de las sete colinas romanas, sede de un aristocrático barrio donde habían vivido Mecenas, Ovidio, Horacio y Virgilio.\n\nEl Papa, acompañado del patricio, trazó, en el suelo los límites de lo que sería la primera basílica romana dedicada a Nuestra Señora. Cada 5 de agosto, se evoca aquella singular nevada con una lluvia de pétalos blancos sobre el pavimento de la Basílica. La actual Santa María la Mayor fue edificada por el Papa **Sixto III** sobre la antigua basílica liberiana (del Papa Liberio), para conmemorar la proclamación por el **Concilio de Éfeso** (431) de la Maternidad divina de María. Tras Sixto III, los Papas sucesivos, han volcado su atención sobre el Santuario más antiguo y venerado en honor al dogma de María, Madre de Dios.\n\n## Por fuera\n\nLa fachada es creación de **Ferdinando Fuga** (1743–50). Está flanqueada por dos alas idénticas, si bien construidas con un siglo de diferencia. El campanario (1377) es el más alto de la ciudad–y su decoración polícroma –mayólica sobre ladrillo rojo–es típicamente romana. En el pórtico resaltan, a la derecha, la estatua de Felipe IV de España, de Lucenti (1692) bajo diseño de **Bernini**; y a la izquierda, la Puerta Santa.\n\nDesde el pórtico, por la escalera de la izquierda, se llega a la loggia desde la que el Papa daba las bendiciones Urbi et Orbi (abierta de 9 a 11. solicitando permiso en la Sacristía), donde se conserva un monumental mosaico,
