esores de Pedro.", "oracion": "San Clemente, ruega por nosotros; alcánzanos paz y unidad en la Iglesia.", "practico": [{"iglesia": "San Clemente", "horario": "Lun-sáb 9:00-12:30 y 14:00-18:00; dom y feriados 12:00-18:00 (última entrada 30 min antes).", "entrada": "basílica superior gratis; los subterráneos (basílica inferior y mitreo) con entrada paga y reserva online", "consejo": "Queda a 5 minutos del Coliseo; vale la pena reservar los subterráneos con anticipación y reservar tiempo para rezar en la basílica superior."}], "fuentes": ["https://www.basilicasanclemente.com/eng/key-figures/", "https://catacomberoma.com/basilica-di-san-clemente-roma/", "https://www.newadvent.org/cathen/04012c.htm"]}, "San Ignacio de Antioquía": {"vida": "Ignacio fue el tercer obispo de Antioquía, discípulo según la tradición del apóstol Juan. Bajo el emperador Trajano fue arrestado y llevado encadenado a Roma para ser echado a las fieras. En el viaje escribió siete cartas a las Iglesias, donde llama por primera vez 'católica' a la Iglesia y proclama la Eucaristía como 'medicina de inmortalidad'. Murió en el anfiteatro de Roma hacia el año 107, deseando ser 'trigo de Dios molido por los dientes de las fieras'. Su nombre figura en el Canon Romano.", "patrono": "— (invocado por la Iglesia de Oriente y contra enfermedades de la garganta).", "reliquia": "Tras el martirio, los diáconos Filón y Agatopo llevaron sus restos a Antioquía; el emperador Teodosio II los trasladó después a una iglesia de la ciudad. Según la Catholic Encyclopedia, en 637 (cuando Antioquía cayó ante los árabes) fueron llevados a Roma, a San Clemente, donde reposan con los de San Clemente bajo el altar mayor. No se ven. Es una tradición antigua, no verificada científicamente.", "porQue": "Su fiesta, el 17 de octubre, cae durante el viaje, y a pocos pasos está el Coliseo, donde la tradición sitúa su martirio.", "oracion": "San Ignacio de Antioquía, ruega por nosotros; alcánzanos amor a la Eucaristía y valentía para dar testimonio.", "practico": [{"iglesia": "San Clemente", "horario": "Lun-sáb 9:00-12:30 y 14:00-18:00; dom y feriados 12:00-18:00 (última entrada 30 min antes).", "entrada": "gratis (subterráneos con entrada paga)", "consejo": "Combinar con el Coliseo; leer antes un fragmento de su Carta a los Romanos para rezarlo junto al altar."}], "fuentes": ["https://www.newadvent.org/cathen/07644a.htm", "https://www.basilicasanclemente.com/eng/key-figures/"]}, "San Cirilo, apóstol de los eslavos": {"vida": "Constantino, llamado Cirilo al hacerse monje, nació en Tesalónica hacia 827 y fue un sabio de Constantinopla. En 863, con su hermano Metodio, fue enviado a evangelizar la Gran Moravia; para eso creó el alfabeto glagolítico y tradujo la Escritura y la liturgia a la lengua eslava. En 867 viajaron a Roma, donde el papa Adriano II aprobó la liturgia en eslavo. Cirilo murió en Roma el 14 de febrero de 869, tras hacerse monje, y fue sepultado en San Clemente. San Juan Pablo II lo proclamó copatrono de Europa en 1980.", "patrono": "Copatrono de Europa (con Metodio); patrono de los pueblos eslavos y de la unidad entre Oriente y Occidente.", "reliquia": "Fue enterrado en la basílica de San Clemente, pero sus restos se perdieron en 1798, durante la ocupación francesa. En 1963 los dominicos irlandeses de San Clemente encontraron un pequeño fragmento y San Pablo VI lo colocó personalmente en la basílica. Las fuentes lo ubican en la capilla de los Santos Cirilo y Metodio, a la derecha de la nave, dentro del altar; el sitio de turismo de Roma menciona fragmentos en la basílica inferior, junto al lugar de su tumba original, cubierta de placas de agradecimiento de pueblos eslavos. Es un fragmento pequeño y no siempre visible.", "porQue": "Es el único resto que queda de un santo que dio alfabeto y fe a millones de eslavos; se reza por la unidad de católicos y ortodoxos.", "oracion": "San Cirilo, ruega por nosotros; alcanza la unidad de los cristianos de Oriente y Occidente.", "practico": [{"iglesia": "San Clemente", "horario": "Lun-sáb 9:00-12:30 y 14:00-18:00; dom y feriados 12:00-18:00 (última entrada 30 min antes).", "entrada": "capilla gratis; el lugar de la tumba original está en la basílica inferior (entrada paga, reserva online)", "consejo": "Primero buscar la capilla de Cirilo y Metodio en la nave derecha de la basílica superior; luego, si se hace la visita subterránea, rezar ante la tumba original."}], "fuentes": ["https://www.johnsanidopoulos.com/2021/05/the-tomb-and-relics-of-saint-cyril.html", "https://www.turismoroma.it/en/places/basilica-san-clemente", "https://www.basilicasanclemente.com/eng/key-figures/"]}, "Santos Juan y Pablo": {"vida": "Juan y Pablo eran, según su Pasión, hermanos y altos funcionarios romanos al servicio de la familia imperial en tiempos de Constantino. Bajo Juliano el Apóstata se negaron a renunciar a la fe y a volver al servicio del emperador pagano. Hacia el año 362 fueron decapitados en secreto en su propia casa del Celio y enterrados allí para evitar escándalo. Sobre esa casa se levantó muy pronto una iglesia. Sus nombres figuran en el Canon Romano y su fiesta es el 26 de junio.", "patrono": "— (invocados tradicionalmente contra el granizo y las tormentas).", "reliquia": "Sus restos se conservan en una antigua urna romana de pórfido bajo la mesa del altar mayor; se ve la urna. Una losa en el piso de la nave central marca, según la tradición, el lugar del martirio. Bajo la basílica están las Case Romane, casas de los s. I-IV con frescos cristianos que confirman un antiguo culto de mártires en el lugar. La tradición es antigua y sólida; los detalles de la Pasión son tardíos.", "porQue": "Se reza sobre la casa misma donde murieron, y las excavaciones de las Case Romane muestran cómo vivían y se reunían los primeros cristianos.", "oracion": "Santos Juan y Pablo, rueguen por nosotros; alcáncennos fidelidad a Cristo por encima de todo poder humano.", "practico": [{"iglesia": "Santi Giovanni e Paolo", "horario": "Todos los días 8:30-12:45 y 14:00-17:00 (verificar). Misa dominical 11:45.", "entrada": "gratis (las Case Romane, con entrada aparte paga: verificar días y precio)", "consejo": "La basílica está en una plaza tranquila del Celio, a 10 minutos del Coliseo; la urna de pórfido se ve bajo el altar mayor."}], "fuentes": ["https://www.vaticannews.va/it/chiesa/news/2021-02/santi-giovanni-e-paolo-al-celio-chiesa-stazionale-di-venerdi-18.html", "https://www.romasegreta.it/celio/santi-giovanni-e-paolo.html", "https://www.turismoroma.it/en/places/basilica-santi-giovanni-e-paolo-al-celio"]}, "San Pablo de la Cruz": {"vida": "Pablo Francisco Danei nació en Ovada (Piamonte) en 1694. Tras una conversión profunda recibió la inspiración de fundar una congregación dedicada a predicar la Pasión de Cristo, y en 1720 comenzó a vivir como ermitaño con su hermano Juan Bautista. Así nacieron los Pasionistas, aprobados en 1741, que misionaban en el campo y hacían un cuarto voto de promover la memoria de la Pasión. Fue un gran predicador y director de almas, y vivió largas pruebas interiores. En 1773 Clemente XIV les dio la casa de los Santos Juan y Pablo, donde Pablo murió el 18 de octubre de 1775. Fue canonizado en 1867.", "patrono": "Fundador y patrono de los Pasionistas; invocado por los que sufren y por los predicadores.", "reliquia": "Murió en el convento anexo a la basílica. Sus restos se trasladaron a la gran capilla construida en su honor entre 1862 y 1880, tercera de la nave derecha. Reposan bajo el altar dentro de una figura yacente vestida con el hábito pasionista, visible tras un cristal. La atribución es firme; el cuerpo no está expuesto al desnudo.", "porQue": "Murió el 18 de octubre y su fiesta es el 19 (calendario actual), en plena estadía: los Pasionistas celebran con solemnidad en la iglesia donde está su tumba.", "oracion": "San Pablo de la Cruz, ruega por nosotros; graba en nuestro corazón la memoria de la Pasión de Jesús.", "practico": [{"iglesia": "Santi Giovanni e Paolo", "horario": "Todos los días 8:30-12:45 y 14:00-17:00 (verificar). Misa dominical 11:45.", "entrada": "gratis", "consejo": "Se entra a la capilla por un vestíbulo desde la nave derecha; en los días 18 y 19 de octubre conviene averiguar el horario de la misa solemne."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santi_Giovanni_e_Paolo", "https://www.romasegreta.it/celio/santi-giovanni-e-paolo.html", "https://www.passiochristi.org/wp-content/uploads/2019/10/Guida-Italiano.pdf", "https://www.newadvent.org/cathen/11590a.htm"]}, "San Alejo": {"vida": "Según una leyenda muy difundida desde el siglo V (de origen sirio, el «hombre de Dios» de Edesa), Alejo era hijo del senador romano Eufemiano. La noche de su boda dejó todo y partió como peregrino y mendigo hacia Oriente. Años después volvió a Roma y vivió unos diecisiete años, sin ser reconocido, bajo la escalera de la casa paterna, alimentándose de las sobras. Al morir se halló un escrito suyo que reveló quién era. Su historicidad es muy incierta, pero su culto expresa el ideal de la pobreza voluntaria y la humildad escondida; desde 1969 no está en el calendario universal, aunque sigue venerado.", "patrono": "Mendigos, peregrinos y vagabundos; los Hermanos Alexianos.", "reliquia": "Según la tradición, sus restos se hallaron durante la reconstrucción de la iglesia y se colocaron bajo el altar mayor en 1217, donde siguen; lo que se ve es el altar/urna, no los huesos. En la nave izquierda se conserva, protegida por vidrio, la escalera de madera que la leyenda identifica con aquella bajo la cual vivió, sostenida por ángeles de estuco. La atribución descansa en la tradición medieval, no en documentación antigua.", "porQue": "Es la iglesia construida sobre la supuesta casa familiar de Alejo, en lo alto del Aventino, junto al Giardino degli Aranci y el famoso «ojo de la cerradura» de los Caballeros de Malta.", "oracion": "San Alejo, ruega por nosotros; alcánzanos amor a la humildad y desprendimiento de los bienes de este mundo.", "practico": [{"iglesia": "Santos Bonifacio y Alejo (Sant'Alessio)", "horario": "Todos los días 8:30–12:30 y 15:30–18:30 en horario de invierno (20:00 en verano); confirmar, porque cambia", "entrada": "gratis", "consejo": "Combinalo con el Giardino degli Aranci, Santa Sabina y la cerradura de la Piazza dei Cavalieri di Malta, todo a menos de 5 minutos a pie."}], "fuentes": ["https://www.turismoroma.it/en/places/basilica-ss-bonifacio-e-alessio-allaventino", "https://it.wikipedia.org/wiki/Basilica_dei_Santi_Bonifacio_e_Alessio", "https://www.rome-roma.net/it/basilica-santi-bonifacio-e-alessio/"]}, "Santo Tomás Becket": {"vida": "Nació en Londres hacia 1120 y fue canciller y amigo íntimo del rey Enrique II. Nombrado arzobispo de Canterbury en 1162, cambió de vida y defendió la libertad de la Iglesia frente a las pretensiones del rey. Por eso pasó seis años exiliado en Francia (1164–1170). A fines de 1170 volvió a Canterbury y el 29 de diciembre cuatro caballeros del rey lo asesinaron dentro de su catedral, durante las vísperas. El papa Alejandro III lo canonizó en 1173 y su tumba fue uno de los grandes santuarios de peregrinación de Europa hasta que Enrique VIII la destruyó en 1538.", "patrono": "Clero secular; defensores de la libertad de la Iglesia; Portsmouth (Inglaterra).", "reliquia": "La cripta románica de la basílica fue consagrada a Santo Tomás Becket el 21 de marzo de 1218, y bajo su altar se guardan algunas reliquias suyas (fragmentos). En 1862 los padres somascos las examinaron y enviaron una parte al obispo de Edimburgo. No están a la vista: la cripta suele estar cerrada y se abre en ocasiones especiales. La presencia de reliquias está documentada desde la consagración medieval, aunque no se detalla qué huesos son.", "porQue": "Es uno de los pocos lugares de Roma con reliquias del mártir de Canterbury, en una cripta del siglo XIII sobre la misma colina que Sant'Alessio.", "oracion": "Santo Tomás Becket, ruega por nosotros; danos valentía para defender la fe y la libertad de la Iglesia.", "practico": [{"iglesia": "Santos Bonifacio y Alejo", "horario": "Iglesia: 8:30–12:30 y 15:30–18:30 (invierno). Cripta: solo en ocasiones especiales, consultar", "entrada": "gratis", "consejo": "Preguntá a los padres somascos si es posible bajar a la cripta; si no, se puede rezar arriba ante el altar mayor."}], "fuentes": ["https://www.ancoraonline.it/2014/07/29/roma-san-tommaso-becket-a-santalessio-allaventino/", "https://it.wikipedia.org/wiki/Basilica_dei_Santi_Bonifacio_e_Alessio"]}, "San Valentín": {"vida": "Fue un presbítero romano martirizado hacia el año 269, bajo el emperador Claudio II, y sepultado junto a la Via Flaminia, donde se le levantó una basílica. Muy pronto su historia se mezcló con la de otro Valentín, obispo de Terni, y hoy no es seguro si eran dos personas o una. Las actas cuentan que curó a la hija ciega de su carcelero y que fue decapitado por negarse a renegar de Cristo. La costumbre de asociarlo con los enamorados es medieval (Chaucer, siglo XIV) y no tiene base en su vida. Su memoria del 14 de febrero ya no está en el calendario universal, pero el Martirologio lo conserva.", "patrono": "Enamorados y novios; tradicionalmente invocado contra la epilepsia.", "reliquia": "El cráneo, adornado con una corona de flores, se ve dentro de un relicario en la capilla lateral izquierda. Fue exhumado a comienzos del siglo XIX en el cementerio de San Hipólito, cerca de San Lorenzo extramuros (fuentes citan 1836), y llevado luego a esta iglesia. Su atribución es dudosa: el santuario original de Valentín estaba en la Via Flaminia, y el cráneo podría ser de otro mártir del mismo nombre. Cada 14 de febrero se lo corona de rosas.", "porQue": "Es una reliquia a la vista, con la cara del santo mirando al visitante, en una de las iglesias medievales más lindas de Roma (con la Bocca della Verità en el pórtico).", "oracion": "San Valentín, ruega por nosotros; bendice a los novios y matrimonios y concédeles un amor fiel y casto.", "practico": [{"iglesia": "Santa María in Cosmedin", "horario": "9:30–17:00 (18:00 en verano); último ingreso 10 minutos antes", "entrada": "gratis (la cripta puede tener un pequeño aporte al custodio)", "consejo": "La fila de afuera es para la Bocca della Verità: entrá a la iglesia por la puerta sin hacer esa cola; el cráneo está en la capilla de la nave izquierda."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_in_Cosmedin", "https://en.wikipedia.org/wiki/Saint_Valentine"]}, "Santa Elena": {"vida": "Nació hacia el 248, probablemente en Bitinia, de origen humilde, y fue madre del emperador Constantino. Se hizo cristiana y, ya anciana, hacia el 326 peregrinó a Tierra Santa, donde promovió las basílicas de Belén y del Monte de los Olivos. Una tradición muy antigua (ya a fines del siglo IV) le atribuye el hallazgo de la Vera Cruz en Jerusalén. Murió hacia el 329 y fue sepultada en un mausoleo junto a la Via Labicana, en Roma. Se la venera por su fe tardía pero ardiente, su caridad con los pobres y su amor a los Santos Lugares.", "patrono": "Arqueólogos, conversos, matrimonios difíciles; invocada para encontrar objetos perdidos.", "reliquia": "Su mausoleo original estaba en la Via Labicana (hoy Tor Pignattara); su gran sarcófago de pórfido vacío está en los Museos Vaticanos. Parte de sus restos fue llevada en 840 a la abadía de Hautvillers (Francia), y otra parte llegó al Aracoeli en el siglo XII. Desde 1602 se guardan en una antigua urna de pórfido dentro del templete octogonal de la capilla de Santa Elena, en el extremo del crucero izquierdo; se ve la urna, no los huesos. Que haya reliquias en dos lugares hace que la atribución sea tradicional y en parte discutida.", "porQue": "El templete ocupa, según la tradición, el sitio del «Ara Coeli», el altar donde la Sibila habría anunciado a Augusto el nacimiento de Cristo; en la misma iglesia está el Santo Bambino.", "oracion": "Santa Elena, ruega por nosotros; ayúdanos a encontrar y abrazar la Cruz de Cristo en nuestra vida.", "practico": [{"iglesia": "Santa María in Aracoeli", "horario": "9:00–17:30 (9:30–18:30 de mayo a septiembre)", "entrada": "gratis", "consejo": "Para evitar las 124 escalinatas, entrá por la puerta lateral desde la Piazza del Campidoglio; el templete está al fondo del crucero izquierdo."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_in_Aracoeli", "https://en.wikipedia.org/wiki/Helena,_mother_of_Constantine_I"]}, "Santa Mónica": {"vida": "Nació en Tagaste (actual Argelia) hacia el 331, en una familia cristiana, y se casó con Patricio, un pagano de carácter violento a quien ganó para la fe antes de su muerte. Durante años rezó y lloró por la conversión de su hijo Agustín, que vivía lejos de la Iglesia; un obispo la consoló diciéndole que «no puede perderse el hijo de tantas lágrimas». Lo siguió a Italia y lo vio bautizado por San Ambrosio en Milán en la Pascua del 387. Ese mismo año, esperando embarcarse de regreso a África, murió en Ostia tras una célebre conversación con Agustín sobre la vida eterna, que él narra en las «Confesiones».", "patrono": "Madres, esposas y viudas; madres que rezan por hijos alejados de la fe.", "reliquia": "Estuvo sepultada en Ostia durante más de mil años. En 1430 los agustinos, con permiso de Martín V, hallaron sus restos y los trajeron a Roma el Domingo de Ramos; pasaron unos veinte años en San Trifón y en 1455 se trasladaron a Sant'Agostino. Hoy están en la capilla de Santa Mónica, a la izquierda del altar mayor, en una urna bajo el altar; al lado se ve el sarcófago de Isaia da Pisa (1455). La atribución es tradicional pero sólida, apoyada por la historia documentada de la traslación.", "porQue": "Rezar ante la madre de San Agustín es especial para padres que piden por sus hijos; en la misma iglesia está la «Virgen de los Peregrinos» de Caravaggio y la Madonna del Parto.", "oracion": "Santa Mónica, ruega por nosotros; alcanza la conversión y la perseverancia en la fe de nuestros hijos y familiares.", "practico": [{"iglesia": "Sant'Agostino", "horario": "Todos los días 7:30–12:00 y 16:00–19:30", "entrada": "gratis", "consejo": "La capilla de Santa Mónica está a la izquierda del presbiterio; está a dos cuadras de Piazza Navona, fácil de sumar al recorrido del centro."}], "fuentes": ["https://www.vaticannews.va/it/chiesa/news/2026-08/reliquie-santa-monica-ostia-roma-tomba-agostiniani-culto.html", "https://www.rome-roma.net/it/sant-agostino-in-campo-marzio/"]}, "Santa Victoria": {"vida": "Se sabe muy poco con certeza. Es una de las mártires de las catacumbas romanas cuyo cuerpo fue extraído en la Edad Moderna y ofrecido a la veneración con el nombre de Victoria. Algunos la identifican con Santa Victoria, virgen romana que según una pasión tardía rechazó un matrimonio pagano y fue ejecutada hacia el 250, en la persecución de Decio, pero esa identificación no está probada. Lo seguro es que la Iglesia de Roma honró sus restos como los de una mártir de los primeros siglos. Su memoria recuerda a los miles de cristianos anónimos que dieron la vida por Cristo.", "patrono": "—", "reliquia": "Sus restos se conservan dentro de una figura de cera, vestida y recostada, visible en una urna bajo el altar de la capilla de San José, en el crucero derecho. Es un «santo de catacumba»: no hay documentación publicada sobre la fecha de llegada ni sobre la identidad exacta, y las fuentes la describen como una mártir poco conocida. Lo que se ve es la efigie de cera que contiene los huesos.", "porQue": "Está en la misma iglesia que el Éxtasis de Santa Teresa de Bernini, así que la visita suma una reliquia visible y una de las obras maestras del barroco.", "oracion": "Santa Victoria, ruega por nosotros; alcánzanos la victoria sobre el pecado y fidelidad a Cristo hasta el final.", "practico": [{"iglesia": "Santa María de la Victoria", "horario": "Todos los días 7:00–12:00 y 15:30–19:15 (visita turística: días de semana 8:30–12:00 y 15:30–18:00)", "entrada": "gratis (hay una máquina con monedas para iluminar el Bernini)", "consejo": "La capilla de San José está en el crucero derecho, enfrente de la capilla Cornaro de Santa Teresa; durante la misa solo se permite rezar."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_della_Vittoria", "https://en.wikipedia.org/wiki/Santa_Maria_della_Vittoria,_Rome"]}, "San José María Tomasi": {"vida": "Nació en Licata (Sicilia) el 12 de septiembre de 1649, hijo del príncipe de Lampedusa, y renunció a sus derechos de herencia para entrar a los teatinos en 1664. Ordenado sacerdote en 1673, se dedicó a estudiar los antiguos libros litúrgicos de Roma; publicó ediciones críticas como la del Sacramentario Gelasiano y fue llamado «príncipe de los liturgistas». Vivía con gran austeridad, enseñaba el catecismo a niños y atendía a los pobres. Clemente XI lo creó cardenal en 1712 contra su voluntad, y siguió con la misma vida sencilla en su título de San Martino ai Monti. Murió el 1 de enero de 1713; fue beatificado en 1803 y canonizado por Juan Pablo II en 1986.", "patrono": "—", "reliquia": "Fue sepultado primero en San Martino ai Monti, su iglesia titular. En 1971 sus restos fueron trasladados solemnemente a Sant'Andrea della Valle, iglesia madre de los teatinos. Hoy están expuestos a la veneración bajo el altar, en el lado derecho de la capilla del Crucifijo, en el ángulo del crucero derecho. La atribución es segura (santo moderno con traslados documentados).", "porQue": "Es un santo muy ligado a la liturgia tradicional de Roma: un buen lugar para pedir amor y reverencia por la Misa, en una basílica barroca imponente.", "oracion": "San José María Tomasi, ruega por nosotros; enséñanos a amar la sagrada liturgia y a rezar con la Iglesia.", "practico": [{"iglesia": "Sant'Andrea della Valle", "horario": "Todos los días 7:30–19:45 (misas diarias 9:00 y 19:00)", "entrada": "gratis", "consejo": "Buscá la capilla del Crucifijo en el ángulo del crucero derecho; queda a pasos de Piazza Navona y del Campo de' Fiori."}], "fuentes": ["https://it.wikipedia.org/wiki/San_Giuseppe_Maria_Tomasi", "https://teatinos.org/en/saint-joseph-maria-tomasi/", "https://www.causesanti.va/it/santi-e-beati/giuseppe-maria-tomasi.html", "https://thecatholictraveler.com/guides/rome/churches/santandrea-della-valle/"]}, "San Estanislao de Kostka": {"vida": "Nació en 1550 en Rostkowo (Polonia), en una familia noble. Estudiando en el colegio jesuita de Viena, sintió la vocación a la Compañía, pero su padre se oponía; a los 17 años huyó a pie, disfrazado, y caminó unos 900 km hasta Dillingen, donde lo recibió San Pedro Canisio. De allí siguió a Roma, donde San Francisco de Borja lo admitió en el noviciado de Sant'Andrea al Quirinale en octubre de 1567. Vivió diez meses de noviciado ejemplar, con gran amor a la Virgen, y murió de fiebre el 15 de agosto de 1568, día de la Asunción, como había pedido. Fue canonizado en 1726.", "patrono": "Novicios, estudiantes y jóvenes; Polonia; invocado por los enfermos graves.", "reliquia": "Su cuerpo descansa en la capilla de San Estanislao, a la izquierda del altar mayor, dentro de una urna de bronce y lapislázuli hecha en 1716, bajo el cuadro de Carlo Maratta (1687). Se ve la urna, no el cuerpo. Junto a la iglesia se conservan sus habitaciones del noviciado, con la conmovedora estatua de mármol policromado de Pierre Legros (1702–03) que lo muestra moribundo. La atribución es segura.", "porQue": "Rezar en el mismo noviciado donde vivió y murió, en la pequeña joya elíptica de Bernini, es único; las habitaciones con la estatua de Legros impactan mucho.", "oracion": "San Estanislao de Kostka, ruega por nosotros; protege a nuestros jóvenes y concédeles pureza y fidelidad a su vocación.", "practico": [{"iglesia": "Sant'Andrea al Quirinale", "horario": "Martes a domingo 9:00–12:00 y 15:00–18:00; lunes cerrado", "entrada": "gratis (puede pedirse un aporte para ver las habitaciones del santo)", "consejo": "Preguntá en la sacristía por las «stanze di San Stanislao» para ver la estatua de Legros; San Carlo alle Quattro Fontane de Borromini está a una cuadra."}], "fuentes": ["https://santandrea.gesuiti.it/informazioni/orari/", "https://en.wikipedia.org/wiki/Sant%27Andrea_al_Quirinale"]}, "Santa Francisca Romana": {"vida": "Nació en Roma en 1384 y, aunque quería ser religiosa, a los 12 años la casaron con Lorenzo Ponziani, noble del Trastevere. Fue esposa y madre ejemplar, perdió dos hijos por la peste y convirtió su casa en hospital y granero para los pobres durante las guerras y epidemias. Según su testimonio, veía a su ángel custodio. En 1425 reunió a un grupo de mujeres, las Oblatas de Tor de' Specchi, que vivían en el mundo dedicadas a la oración y la caridad. Al enviudar se unió a ellas y murió el 9 de marzo de 1440; fue canonizada en 1608.", "patrono": "Roma; las oblatas benedictinas; viudas; automovilistas (desde 1925).", "reliquia": "Fue enterrada en esta iglesia, entonces llamada Santa María Nova, junto al Foro. Sus restos fueron redescubiertos en 1638 y colocados en la confesión bajo el altar mayor, obra atribuida a Bernini. Hoy se ve su esqueleto revestido con el hábito de las oblatas, sin máscara de cera, con un breviario en las manos. La atribución es segura.", "porQue": "Es la santa romana por excelencia, patrona de la ciudad, y su iglesia está dentro del área del Foro y el Coliseo; su esqueleto a la vista impresiona.", "oracion": "Santa Francisca Romana, ruega por nosotros; ayúdanos a santificarnos en la familia y en el servicio a los pobres.", "practico": [{"iglesia": "Santa Francesca Romana", "horario": "Aproximado: martes a viernes y domingo 7:30–9:00 y 10:00–18:00; lunes 9:00–11:30 y 15:00–19:00; sábado reducido. Horarios poco estables: verificar", "entrada": "gratis", "consejo": "Se entra desde la Via dei Fori Imperiali, junto al Coliseo; se baja a la cripta por las escaleras a los costados del presbiterio (si están cerradas, se ve desde arriba)."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Francesca_Romana", "https://www.rome-roma.net/it/santa-francesca-romana-maria-nova/"]}, "Santa Inés": {"vida": "Fue una virgen romana martirizada muy joven, a los 12 o 13 años, probablemente en la persecución de Diocleciano (hacia el 304). Rechazó a los pretendientes diciendo que ya estaba consagrada a Cristo; por eso fue denunciada como cristiana. Según la tradición la expusieron desnuda en un prostíbulo junto al estadio de Domiciano (hoy Piazza Navona), donde su pureza fue milagrosamente protegida, y luego murió degollada. Fue sepultada en la Via Nomentana, y ya en el siglo IV San Ambrosio y el papa Dámaso cantaron su martirio. Su nombre está en el Canon Romano.", "patrono": "Jóvenes, niñas, novias y la castidad; las Hijas de María.", "reliquia": "Sant'Agnese in Agone: el cráneo se conservaba en el Sancta Sanctorum de Letrán, y San Pío X ordenó llevarlo a esta iglesia, construida sobre el lugar del martirio; hoy se ve en un tabernáculo en forma de templete en la capilla de San Felipe Neri. Sant'Agnese fuori le mura: el 14 de junio de 1615 el cuerpo, junto con el de su hermana de leche Santa Emerenciana, se colocó bajo el altar mayor en una urna de plata donada por Pablo V; la urna no se ve. Ambas atribuciones descansan en una tradición antigua y continua.", "porQue": "Se pueden unir los dos extremos de su historia: el lugar del martirio en Piazza Navona y su tumba en la Via Nomentana, sobre catacumbas del siglo III.", "oracion": "Santa Inés, ruega por nosotros; alcánzanos pureza de corazón y valentía para confesar a Cristo.", "practico": [{"iglesia": "Sant'Agnese in Agone", "horario": "Martes a viernes 9:00–13:00 y 15:00–19:00; sábado y domingo 9:00–13:00 y 15:00–20:00; lunes cerrado", "entrada": "gratis", "consejo": "Está sobre Piazza Navona; la capilla de San Felipe Neri con el cráneo está a la izquierda del altar mayor. La cripta del lugar del martirio se abre en ocasiones: preguntá."}, {"iglesia": "Sant'Agnese fuori le mura", "horario": "Basílica: mañana y tarde (verificar). Catacumbas: lunes a sábado 10:00–13:00 y 15:00–18:00, solo con visita guiada; domingo cerrado", "entrada": "Basílica gratis; catacumbas 10 € (7 € reducida)", "consejo": "Queda fuera del centro (Via Nomentana 349, bus 60 o 90); vale combinarla con el mausoleo de Santa Constanza, al lado."}], "fuentes": ["https://www.santagneseinagone.org/en/chapel-of-saint-filippo-neri/", "https://www.santagneseinagone.org/en/hours-contact-information/", "https://it.wikipedia.org/wiki/Basilica_di_Sant%27Agnese_fuori_le_mura", "https://www.rome-roma.net/it/complesso-di-sant-agnese-fuori-le-mura/catacombe-di-sant-agnese/"]}, "San Juan Bautista": {"vida": "Hijo de Zacarías e Isabel, nació unos seis meses antes que Jesús y fue santificado en el seno materno. Vivió como asceta en el desierto de Judea y predicó un bautismo de conversión junto al Jordán, donde bautizó a Jesús y lo señaló como «el Cordero de Dios». Por reprochar a Herodes Antipas su unión con Herodías, fue encarcelado en la fortaleza de Maqueronte. Allí fue decapitado hacia el año 29, a pedido de Salomé. Jesús dijo de él que «entre los nacidos de mujer no ha surgido nadie mayor».", "patrono": "Precursor de Cristo; patrono de bautizados, monjes, Florencia, Turín y Puerto Rico, entre muchos otros.", "reliquia": "La cabeza aparece en la historia de Roma hacia 1140, venerada en la pequeña iglesia vecina de San Giovanni in Capite, y pasó a las clarisas en el siglo XIII, cuando recibieron el monasterio. Hoy se ve en un relicario de los siglos XIII–XIV, en una capilla a la izquierda de la entrada. La autenticidad es incierta: otras sedes, como Amiens (Francia) y la Mezquita de los Omeyas en Damasco, también dicen tener la cabeza o parte de ella.", "porQue": "Es la reliquia más famosa atribuida al Precursor en Roma y está a la vista, a pocos pasos de la Fontana di Trevi y del Panteón.", "oracion": "San Juan Bautista, ruega por nosotros; prepara nuestros corazones para recibir a Cristo y danos valor para decir la verdad.", "practico": [{"iglesia": "San Silvestro in Capite", "horario": "Días de semana 7:00–19:00; domingo 9:00–12:45 y 15:30–18:30", "entrada": "gratis", "consejo": "La capilla con la cabeza queda a la izquierda apenas entrás; hay poca luz, conviene ir de día. Es la iglesia de los católicos de habla inglesa (palotinos)."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Silvestro_in_Capite", "https://en.wikipedia.org/wiki/San_Silvestro_in_Capite"]}, "San Crisógono": {"vida": "Fue un mártir de los primeros siglos, muerto probablemente en Aquilea (norte de Italia) durante la persecución de Diocleciano, hacia el 304. Su culto se difundió muy pronto a Roma, donde un título (iglesia parroquial) del Trastevere llevó su nombre desde el siglo IV. Su «pasión» es una leyenda tardía que lo hace maestro de Santa Anastasia, y casi nada de ella es verificable. Su gran importancia está en que su nombre figura en el Canon Romano de la Misa, entre los mártires que la Iglesia de Roma recuerda desde la Antigüedad.", "patrono": "—", "reliquia": "En el altar mayor hay un relicario de 1127 que contiene otro relicario con reliquias de San Crisógono, dentro de una caja de vidrio que se ve a través de aberturas protegidas. No se especifica qué parte del cuerpo es; la tradición romana habla de la cabeza, pero no está confirmado. El cuerpo, según la tradición medieval, estuvo en Zadar (Croacia) y desde 1204 lo reclama la iglesia de San Trovaso en Venecia, así que la atribución es tradicional y discutida.", "porQue": "Es uno de los santos del Canon Romano, y bajo la iglesia actual se puede visitar la basílica paleocristiana del siglo IV con frescos antiguos.", "oracion": "San Crisógono, ruega por nosotros; danos firmeza en la fe en medio de las pruebas.", "practico": [{"iglesia": "San Crisogono", "horario": "Días de semana 7:00–11:30 y 16:00–19:30; domingo 8:00–13:00 y 16:00–19:30", "entrada": "Iglesia gratis; excavaciones subterráneas unos 3 € (pedir al sacristán)", "consejo": "Está sobre el Viale Trastevere; pedí bajar a la iglesia primitiva por la sacristía, último ingreso media hora antes del cierre de la tarde."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Crisogono", "https://it.wikipedia.org/wiki/Basilica_di_San_Crisogono"]}, "San Gaspar del Búfalo": {"vida": "Nació en Roma el 6 de enero de 1786. Siendo joven sacerdote, en 1810 se negó a jurar fidelidad a Napoleón, que había ocupado Roma, y por eso sufrió cuatro años de destierro y cárcel. Vuelto a Roma, Pío VII le encargó predicar misiones populares, y en 1815 fundó los Misioneros de la Preciosísima Sangre para renovar la fe en los Estados Pontificios, incluso en zonas dominadas por bandidos. Fue un predicador incansable y un gran apóstol de la devoción a la Sangre de Cristo. Murió en Roma el 28 de diciembre de 1837, y Pío XII lo canonizó en 1954.", "patrono": "Misioneros de la Preciosísima Sangre; apóstol de la devoción a la Preciosa Sangre.", "reliquia": "Sus restos están bajo el altar de la segunda capilla de la izquierda, en un sarcófago de mármol rojo con una efigie yacente de bronce dorado de Aurelio Mistruzzi. Se ve el sarcófago con la efigie, no el cuerpo. La atribución es segura (santo moderno, iglesia a cargo de su congregación).", "porQue": "Los Misioneros de la Preciosísima Sangre celebran su fiesta el 21 de octubre, en plena fecha del viaje; la iglesia está a pocos pasos de la Fontana di Trevi.", "oracion": "San Gaspar del Búfalo, ruega por nosotros; enséñanos a amar y adorar la Preciosísima Sangre de Jesús.", "practico": [{"iglesia": "Santa Maria in Trivio", "horario": "Días de semana 8:30–12:30 y 13:30–19:30; fines de semana 8:30–12:30 y 16:00–19:30", "entrada": "gratis", "consejo": "Está en la Piazza dei Crociferi, a media cuadra de la Fontana di Trevi; ideal para entrar a rezar temprano, antes de las multitudes."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_in_Trivio", "https://en.wikipedia.org/wiki/Gaspar_del_Bufalo"]}, "San Vicente Pallotti": {"vida": "Nació en Roma el 21 de abril de 1795 y fue ordenado sacerdote en 1818. Fue confesor, predicador y consejero incansable en cárceles, hospitales, cuarteles y colegios de la ciudad. En 1835 fundó la Unión del Apostolado Católico (los palotinos), convencido de que todos los bautizados están llamados al apostolado, una idea adelantada a su tiempo. También impulsó en Roma la Octava de la Epifanía, por la unidad y las misiones. Murió el 22 de enero de 1850, se dice que tras dar su abrigo a un pobre en una noche fría, y Juan XXIII lo canonizó en 1963, durante el Concilio.", "patrono": "Palotinos; precursor del apostolado de los laicos.", "reliquia": "Su cuerpo está bajo el altar mayor, dentro de una urna de vidrio, revestido, con el rostro y las manos a la vista. Según la fuente consultada, al ser exhumado (en 1950) se lo halló incorrupto y lo que se ve son su rostro y manos reales; conviene preguntar a los palotinos, porque en muchos santos se usa cera. Junto a la iglesia se conservan las habitaciones donde vivió sus últimos años, convertidas en museo con recuerdos suyos. La atribución es segura.", "porQue": "Es uno de los pocos cuerpos de santo que se ven con claridad en Roma, en una iglesia pequeña y tranquila junto a Ponte Sisto.", "oracion": "San Vicente Pallotti, ruega por nosotros; enciende en nosotros el celo por la salvación de las almas.", "practico": [{"iglesia": "San Salvatore in Onda", "horario": "Todos los días 8:00–12:00 (misa 7:00; domingo también 11:00)", "entrada": "gratis", "consejo": "Está en Via dei Pettinari, junto a Ponte Sisto; andá a la mañana, porque a la tarde suele estar cerrada. Preguntá por las habitaciones del santo."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Salvatore_in_Onda", "https://en.wikipedia.org/wiki/Vincent_Pallotti"]}, "Santa Teresa de Jesús": {"vida": "Nació en Ávila el 28 de marzo de 1515 y entró en el Carmelo de la Encarnación en 1535. Tras años de tibieza y enfermedad, vivió hacia 1554 una profunda conversión ante una imagen de Cristo muy llagado. Desde 1562 reformó el Carmelo, fundando diecisiete conventos de carmelitas descalzas y, con San Juan de la Cruz, iniciando la reforma masculina, en medio de grandes oposiciones. Escribió obras maestras de la mística, como «Las Moradas», «Camino de perfección» y el «Libro de la Vida». Murió en Alba de Tormes el 4 de octubre de 1582; fue canonizada en 1622 y en 1970 fue la primera mujer declarada Doctora de la Iglesia.", "patrono": "España; escritores; carmelitas; invocada contra los dolores de cabeza.", "reliquia": "En la capilla de Santa Teresa, en el crucero derecho, se conserva y se ve en un relicario su pie derecho. Su cuerpo fue exhumado varias veces tras su muerte y se distribuyeron reliquias; el cuerpo principal sigue en Alba de Tormes. La reliquia está custodiada por los carmelitas descalzos de esta iglesia desde el siglo XVII; es una atribución tradicional y aceptada por la Orden.", "porQue": "Su fiesta es el 15 de octubre, dentro del viaje; ver el pie de la santa andariega que recorrió España fundando conventos es muy elocuente.", "oracion": "Santa Teresa de Jesús, ruega por nosotros; «nada te turbe, nada te espante: sólo Dios basta». Enséñanos a orar.", "practico": [{"iglesia": "Santa Maria della Scala", "horario": "10:00–13:00 y 16:00–19:00 (verificar)", "entrada": "gratis", "consejo": "Está en Trastevere (Piazza della Scala); al lado está la antigua farmacia de los carmelitas del siglo XVII, que se visita con cita previa."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_della_Scala", "https://en.wikipedia.org/wiki/Teresa_of_%C3%81vila"]}, "Santa Leoncia": {"vida": "No se conoce su vida. Es una «santa de catacumba»: sus restos fueron extraídos de uno de los cementerios cristianos de Roma y presentados a la veneración como los de una mártir llamada Leoncia. En los siglos XVII a XIX muchos de estos cuerpos se identificaron como mártires por signos que hoy se consideran poco seguros, como un vaso con restos rojizos o una palma grabada. Por eso su martirio no puede afirmarse con certeza. Aun así, recuerda a los cristianos anónimos de los primeros siglos que se enterraron esperando la resurrección.", "patrono": "—", "reliquia": "Sus restos se guardan dentro de una figura de cera vestida y recostada, en una urna de vidrio bajo el altar de la capilla de la Sagrada Familia (tercera a la derecha). La etiqueta en latín dice «Corpus S. Leontiae mart.», es decir, cuerpo de Santa Leoncia mártir, con la indicación de que proviene de las catacumbas. No hay documentación publicada sobre su llegada; la atribución de martirio es, como mucho, conjetural.", "porQue": "La visita vale sobre todo por la iglesia: aquí se hospedó San Francisco de Asís en 1219 y se conserva su celda y la piedra que usaba de almohada, además de la Beata Ludovica Albertoni de Bernini.", "oracion": "Santa Leoncia, ruega por nosotros; ayúdanos a vivir y morir en la esperanza de la resurrección.", "practico": [{"iglesia": "San Francesco a Ripa", "horario": "Todos los días 8:00–13:00 y 15:30–19:00", "entrada": "gratis", "consejo": "Pedí en la sacristía ver la «stanza di San Francesco» (celda del santo); el Bernini está en la capilla del fondo a la izquierda."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Francesco_d'Assisi_a_Ripa_Grande", "https://www.romasegreta.it/trastevere/s-francesco-a-ripa.html"]}, "San José de Calasanz": {"vida": "Nació en Peralta de la Sal (Aragón) en 1557 y fue ordenado sacerdote en 1583. En 1592 llegó a Roma y, al ver a los niños pobres del Trastevere sin instrucción, abrió en 1597 junto a Santa Dorotea la primera escuela pública y gratuita de Europa. De allí nacieron las Escuelas Pías (escolapios), aprobadas como orden en 1621. Al final de su vida sufrió intrigas internas y la reducción de su orden por Inocencio X en 1646, que soportó con paciencia heroica. Murió en Roma el 25 de agosto de 1648, a los 90 años; fue canonizado en 1767.", "patrono": "Escuelas populares cristianas y educadores (declarado por Pío XII en 1948).", "reliquia": "Su cuerpo se conserva bajo el altar mayor, construido entre 1763 y 1767, dentro de una valiosa urna de pórfido; se ve la urna, no el cuerpo. En la casa contigua de los escolapios se conservan las habitaciones donde vivió y murió, con objetos personales y numerosas reliquias. La atribución es segura.", "porQue": "Es la casa madre de los escolapios; rezar donde vivió el fundador de la escuela gratuita es muy significativo para padres y educadores.", "oracion": "San José de Calasanz, ruega por nosotros; protege a nuestros niños y maestros y alcánzales «piedad y letras».", "practico": [{"iglesia": "San Pantaleo", "horario": "Antiguo horario 7:30–13:10 y 16:00–19:10 (verificar)", "entrada": "gratis", "consejo": "Está en Piazza di San Pantaleo, a una cuadra de Piazza Navona; para ver las habitaciones del santo conviene pedir cita a los padres escolapios."}], "fuentes": ["https://it.wikipedia.org/wiki/Chiesa_di_San_Pantaleo_(Roma)", "https://www.rome-roma.net/it/chiesa-san-pantaleo/"]}, "Santa Faustina Kowalska": {"vida": "Helena Kowalska nació en Głogowiec (Polonia) en 1905, tercera de diez hijos de una familia campesina pobre. En 1925 entró en la Congregación de las Hermanas de Nuestra Señora de la Misericordia, donde trabajó como cocinera, jardinera y portera. Desde 1931 recibió revelaciones de Jesús, que le pidió pintar la imagen con la inscripción «Jesús, en Ti confío», difundir la Coronilla y establecer la fiesta de la Misericordia; todo lo registró en su «Diario». Murió de tuberculosis en Cracovia el 5 de octubre de 1938, a los 33 años. Juan Pablo II la canonizó el 30 de abril de 2000 e instituyó el Domingo de la Divina Misericordia.", "patrono": "Apóstol de la Divina Misericordia.", "reliquia": "En la tercera capilla de la derecha, dedicada a la Divina Misericordia y a Santa Faustina, se veneran reliquias suyas (fragmentos óseos) en un relicario visible junto a la imagen de Jesús Misericordioso. Juan Pablo II declaró esta iglesia santuario de la Divina Misericordia en Roma y la visitó en 1995. La reliquia es de primer grado, entregada por su congregación; la atribución es segura.", "porQue": "Es el santuario romano de la Divina Misericordia, a una cuadra de San Pedro; rezar la Coronilla a las 15 horas ante su reliquia es una experiencia muy fuerte.", "oracion": "Santa Faustina, ruega por nosotros; «Jesús, en Ti confío». Alcánzanos la misericordia de Dios para nosotros y para el mundo entero.", "practico": [{"iglesia": "Santo Spirito in Sassia", "horario": "Días de semana 7:15–12:00 y 14:50–18:30; domingo 9:00–13:00 y 14:50–18:30. Hora de la Misericordia diaria a las 15:00", "entrada": "gratis", "consejo": "Llegá antes de las 15:00 para la Coronilla; está en Borgo Santo Spirito, a 5 minutos a pie de la plaza de San Pedro."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santo_Spirito_in_Sassia", "https://en.wikipedia.org/wiki/Faustina_Kowalska"]}, "San Justino mártir": {"vida": "Nació a comienzos del siglo II en Flavia Neápolis (Nablus, Samaría), de familia pagana. Buscó la verdad en las escuelas filosóficas hasta que un anciano le mostró los profetas y a Cristo, y se convirtió hacia el 130. Enseñó en Roma como «filósofo cristiano» y escribió dos «Apologías» y el «Diálogo con Trifón»; en la primera Apología dejó la descripción más antigua de la Misa dominical. Denunciado, fue juzgado por el prefecto Rústico y decapitado con seis compañeros hacia el 165, bajo Marco Aurelio; las actas de su martirio son auténticas. Es el primer gran apologista de la Iglesia.", "patrono": "Filósofos y apologistas.", "reliquia": "Según una tradición, sus reliquias se veneran detrás del altar del coro de los frailes capuchinos, en la iglesia de Via Veneto. Ese coro es parte del convento y no está abierto al público, así que la reliquia no se ve. La atribución es discutida: no se conoce con certeza el lugar de su sepultura, y otras localidades (como Sacrofano, cerca de Roma) también afirman tener reliquias suyas.", "porQue": "Rezar a quien dejó el primer testimonio escrito de la Misa es muy valioso; la visita se une a la famosa Cripta de los Capuchinos y a la tumba de San Félix de Cantalicio, en la misma iglesia.", "oracion": "San Justino, ruega por nosotros; danos amor a la verdad y valor para dar razón de nuestra fe.", "practico": [{"iglesia": "Capuchinos de Via Veneto", "horario": "Museo y cripta: todos los días 9:00–19:00 (última entrada 30 minutos antes); la reliquia está en el coro conventual, no visitable", "entrada": "Iglesia gratis; museo y cripta con entrada paga (unos 10–11 €, verificar)", "consejo": "Preguntá a los frailes si es posible rezar ante la reliquia; en la iglesia están también el cuadro de San Miguel de Guido Reni y el cuerpo de San Félix de Cantalicio."}], "fuentes": ["https://www.gliscritti.it/blog/entry/305", "https://www.santiebeati.it/dettaglio/23200", "https://siviaggia.it/idee-di-viaggio/cripta-dei-cappuccini-a-roma-come-arrivare-orari-storia/248476/"]}, "San Benito José Labre": {"vida": "Nació en Amettes (Francia) en 1748, el mayor de quince hijos. Quiso ser monje, pero trapenses, cartujos y cistercienses lo rechazaron por su salud y su carácter. Entendió entonces que Dios lo llamaba a ser un peregrino pobre: recorrió a pie los grandes santuarios de Europa y desde 1774 se estableció en Roma, durmiendo en las ruinas del Coliseo y pasando horas en adoración ante el Santísimo en las Cuarenta Horas. Vivía de limosna y compartía lo poco que recibía. El Miércoles Santo, 16 de abril de 1783, se desplomó en las escalinatas de Santa Maria ai Monti y murió en una casa vecina; fue canonizado por León XIII en 1881.", "patrono": "Peregrinos, personas sin hogar, mendigos y rechazados.", "reliquia": "Fue sepultado en Santa Maria ai Monti, donde descansa bajo un altar del crucero izquierdo. En 1892 se inauguró allí el altar con una efigie yacente del santo moribundo, obra de Achille Albacini; se ve la efigie, no el cuerpo. A dos cuadras, en Via dei Serpenti 2, se conserva la habitación donde murió, transformada en santuario con su cama, sus ropas y reliquias. La atribución es segura.", "porQue": "Es el santo peregrino por excelencia: ideal para encomendar el propio viaje. Se puede unir la tumba, la habitación donde murió y el Coliseo, donde dormía.", "oracion": "San Benito José Labre, ruega por nosotros; haz de nuestro viaje una verdadera peregrinación y enséñanos a adorar a Jesús en la Eucaristía.", "practico": [{"iglesia": "Santa Maria ai Monti", "horario": "Todos los días 7:30–22:00 (según datos de 2023; verificar)", "entrada": "gratis", "consejo": "El altar está en el crucero izquierdo; después caminá a Via dei Serpenti 2 (santuario de las Oblatas, 9:00–13:00 y 15:00–18:30) para ver la habitación donde murió."}], "fuentes": ["https://it.wikipedia.org/wiki/Cappella_di_San_Benedetto_Giuseppe_Labre_ai_Monti", "https://www.diocesidiroma.it/a-santa-maria-ai-monti-le-celebrazioni-per-san-benedetto-giuseppe-labre/", "https://it.wikipedia.org/wiki/Chiesa_di_Santa_Maria_ai_Monti"]}, "San Josemaría Escrivá": {"vida": "Nació en Barbastro (España) el 9 de enero de 1902 y fue ordenado sacerdote en Zaragoza en 1925. El 2 de octubre de 1928, en Madrid, fundó el Opus Dei para recordar que todos los bautizados están llamados a la santidad en su trabajo y su vida ordinaria. Vivió la Guerra Civil española escondido y cruzó los Pirineos a pie para poder seguir ejerciendo el sacerdocio. Desde 1946 residió en Roma, desde donde extendió la obra a los cinco continentes. Murió de repente, de un paro cardíaco, en su despacho de Roma el 26 de junio de 1975. San Juan Pablo II lo beatificó en 1992 y lo canonizó el 6 de octubre de 2002.", "patrono": "Sin patronazgo oficial; se lo invoca para santificar el trabajo cotidiano y la vida familiar.", "reliquia": "Fue sepultado en 1975 en la cripta de esta iglesia, sede prelaticia del Opus Dei. Tras la beatificación (1992) su cuerpo se colocó en una urna bajo el altar mayor. Para la canonización de 2002 estuvo expuesto una semana en la basílica de Sant'Eugenio y el 10 de octubre de 2002 volvió a Santa María de la Paz. Se ve la urna, no el cuerpo; la atribución es plena y documentada. En la cripta están además los restos del beato Álvaro del Portillo.", "porQue": "Es la tumba de un santo del siglo XX con su sucesor beato en la misma iglesia, y un lugar muy recogido, con confesiones disponibles, lejos del turismo del centro.", "oracion": "San Josemaría, ruega por nosotros; ayúdanos a santificar el trabajo y la vida de familia.", "practico": [{"iglesia": "Santa María de la Paz (Viale Bruno Buozzi 75)", "horario": "Lun-vie 8:15-19:30; domingos y feriados 9:30-19:30. Misas lun-vie 8:30 y 12:00; sáb, dom y feriados 12:00.", "entrada": "gratis", "consejo": "Está en Parioli, fuera del centro: conviene combinarla con Villa Borghese; bajar también a la cripta para rezar ante el beato Álvaro del Portillo."}], "fuentes": ["https://opusdei.org/it-it/article/dove-si-trova-santa-maria-della-pace/", "https://opusdei.org/it-ch/article/le-reliquie-di-san-josemaria-escriva-ritornano-a-santa-maria-della-pace/", "https://opusdei.org/it/article/santa-maria-della-pace-chiesa-prelatizia-dellopus-dei/"]}, "Santa Paula Frassinetti": {"vida": "Nació en Génova el 3 de marzo de 1809, única mujer entre varios hermanos, varios de ellos sacerdotes. El 12 de agosto de 1834, en San Martino d'Albaro, fundó con siete compañeras la Congregación de las Hermanas de Santa Doroteo, dedicada a educar a niñas pobres. En 1841 se trasladó a Roma y en 1844 Gregorio XVI le confió el Conservatorio de Santa María del Refugio, junto a Sant'Onofrio al Gianicolo. La obra se extendió a Portugal y Brasil todavía en vida de ella. Murió en Roma el 11 de junio de 1882, tras dos derrames cerebrales. Pío XI la beatificó en 1930 y san Juan Pablo II la canonizó el 11 de marzo de 1984.", "patrono": "Sin patronazgo oficial; protectora de las Hermanas Doroteas y de sus colegios.", "reliquia": "Su cuerpo, considerado incorrupto por la congregación y las fuentes católicas, reposa bajo el altar de la capilla de la casa general de las Doroteas, en la Salita di Sant'Onofrio 38, donde vivió y murió. Se ve a través de una urna de vidrio. La atribución es segura: está en la misma casa donde falleció.", "porQue": "Es poco conocida y muy silenciosa: rezar ante una santa fundadora en la casa donde vivió, a pasos del Gianicolo, es una experiencia íntima y sin multitudes.", "oracion": "Santa Paula Frassinetti, ruega por nosotros; protege a los educadores y a los niños.", "practico": [{"iglesia": "Capilla de las Doroteas (Salita Sant'Onofrio 38)", "horario": "verificar (es capilla de una casa religiosa; conviene llamar o tocar timbre)", "entrada": "gratis", "consejo": "Subir a pie desde el Lungotevere o bajar desde el Gianicolo; se puede combinar con la iglesia de Sant'Onofrio, donde está la tumba del poeta Torquato Tasso."}], "fuentes": ["https://it.wikipedia.org/wiki/Paola_Frassinetti_(santa)", "https://it.cathopedia.org/wiki/Santa_Paola_Frassinetti", "https://www.famigliacristiana.it/articolo/santa-paola-frassinetti.aspx"]}, "San Pancracio": {"vida": "Fue un joven mártir romano; según la tradición, huérfano llegado de Frigia y bautizado en Roma. Hacia el año 304, durante la persecución de Diocleciano, fue decapitado en la Vía Aurelia a los catorce años por negarse a sacrificar a los dioses. Fue sepultado en la catacumba que hoy lleva su nombre. El papa Símaco levantó una basílica sobre su tumba hacia el año 500 y Honorio I la reconstruyó en el siglo VII. Su culto se difundió por toda Europa; san Gregorio Magno lo tenía por garante de los juramentos.", "patrono": "Patrono de los niños y de los juramentos (contra el perjurio); en Italia se lo invoca popularmente por la salud y el trabajo.", "reliquia": "En el siglo IX la cabeza fue llevada al Laterano; el resto del cuerpo fue profanado y dispersado por las tropas francesas en 1798 y por los garibaldinos en 1849. A mediados del siglo XIX volvió un pequeño fragmento de la cabeza, y en 1973 Pablo VI ordenó devolver el resto de la cabeza a esta basílica. Hoy está en un busto-relicario del siglo XVI, en una vitrina baja de la nave derecha; se lleva al altar el 12 de mayo, su fiesta. Tradición antigua y continua.", "porQue": "Es la basílica sobre la tumba original de un mártir niño, con catacumbas visitables debajo, en una zona verde junto a Villa Pamphili.", "oracion": "San Pancracio, ruega por nosotros; danos fidelidad a la palabra dada y ayuda en el trabajo.", "practico": [{"iglesia": "San Pancrazio", "horario": "Lun-sáb 9:00-12:00 y 16:00-19:00; domingos 8:00-13:00 y 16:00-20:00 (verificar). Catacumbas: visitas guiadas mar-jue 9:30, 10:30 y 11:30.", "entrada": "gratis (catacumbas con donación)", "consejo": "La vitrina con el busto está baja en la nave derecha: pedir a los carmelitas si no se encuentra; combinar con Villa Doria Pamphili."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Pancrazio", "https://it.wikipedia.org/wiki/Basilica_di_San_Pancrazio", "https://www.carmelitanicentroitalia.it/dove-siamo/conventi-della-provincia/s-pancrazio-roma/"]}, "San Jorge": {"vida": "Fue un soldado cristiano, probablemente oriundo de Capadocia, martirizado en Lida (Palestina) hacia el año 303, bajo Diocleciano. Su tumba en Lida fue centro de peregrinación desde muy temprano. Es uno de los mártires más venerados de Oriente y Occidente. La historia del dragón y la princesa es una leyenda medieval (difundida por la Leyenda Dorada) que simboliza la victoria de la fe sobre el mal; lo histórico es su martirio.", "patrono": "Patrono de los soldados, caballeros y scouts; de Inglaterra, Georgia, Cataluña, Aragón y Génova, entre otros.", "reliquia": "El papa Zacarías (741-752), de origen griego, trasladó a esta iglesia desde el Laterano las reliquias de san Jorge: parte del cráneo, la punta de la lanza y un trozo de su estandarte. Están bajo el altar mayor, en una confesión con lastra de mármol cosmatesca del siglo XIII y una ventanita (fenestella) por la que se ven. Es una tradición antigua, documentada desde el siglo VIII, aunque no verificada científicamente.", "porQue": "Pocas iglesias de Roma tienen una reliquia de un mártir tan universal en una basílica medieval tan sobria, junto al Arco de Jano y la Boca de la Verdad.", "oracion": "San Jorge, ruega por nosotros; danos valor para combatir el mal y defender la fe.", "practico": [{"iglesia": "San Giorgio in Velabro", "horario": "Horario irregular: misa lun-vie 7:00, sáb-dom 8:30; apertura para visitas reducida (algunas fuentes: mar, vie y sáb 10:00-12:30 y 16:00-18:15). Verificar al 06 69797536.", "entrada": "gratis", "consejo": "Ir por la mañana temprano; combinar con Santa María in Cosmedin (Boca de la Verdad) a 200 metros."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Giorgio_in_Velabro", "https://www.turismoroma.it/en/node/751", "https://en.wikipedia.org/wiki/San_Giorgio_in_Velabro"]}, "San Carlos Borromeo": {"vida": "Nació en Arona el 2 de octubre de 1538, en una familia noble; su tío Pío IV lo hizo cardenal a los 22 años. Fue alma de la última etapa del Concilio de Trento y del Catecismo Romano. Como arzobispo de Milán (1564-1584) reformó el clero, fundó seminarios y visitó a pie su enorme diócesis. Durante la peste de 1576 se quedó en la ciudad, asistiendo a los enfermos y vendiendo sus bienes para alimentar a los pobres; en 1569 sobrevivió a un atentado a tiros. Murió agotado en Milán el 3 de noviembre de 1584, a los 46 años, y fue canonizado el 1 de noviembre de 1610.", "patrono": "Patrono de los obispos, seminaristas y catequistas; invocado contra la peste.", "reliquia": "Su cuerpo está en la cripta del Duomo de Milán. Su corazón fue donado a esta iglesia en 1614 por su primo, el cardenal Federico Borromeo, poco después de la canonización. Se conserva en un relicario dorado en el deambulatorio detrás del presbiterio, el único deambulatorio de una iglesia romana. La atribución está bien documentada.", "porQue": "Rezar ante el corazón de un gran obispo reformador de Trento, en plena Via del Corso, es un contraste fuerte con el bullicio comercial de afuera.", "oracion": "San Carlos Borromeo, ruega por nosotros; danos pastores santos y valor en la adversidad.", "practico": [{"iglesia": "San Carlo al Corso", "horario": "Misas lun-sáb 7:30, 12:00 y 18:30; domingos 8:00, 9:30, 11:00, 12:00 y 18:30. Durante la misa no se permite la visita. Verificar horario de apertura (06 68805941).", "entrada": "gratis", "consejo": "Rodear el altar por detrás para llegar al nicho del corazón; está a pasos del Mausoleo de Augusto y del Ara Pacis."}], "fuentes": ["https://www.turismoroma.it/en/places/basilica-santi-ambrogio-e-carlo-al-corso", "https://en.wikipedia.org/wiki/Sant%27Ambrogio_e_Carlo_al_Corso", "https://it.wikipedia.org/wiki/Basilica_dei_Santi_Ambrogio_e_Carlo_al_Corso"]}, "Santa Francisca Javier Cabrini": {"vida": "Nació en Sant'Angelo Lodigiano (Lombardía) el 15 de julio de 1850. En 1880 fundó en Codogno las Misioneras del Sagrado Corazón de Jesús. Soñaba con China, pero León XIII la envió 'no a Oriente sino a Occidente': en 1889 llegó a Nueva York para atender a los inmigrantes italianos. Fundó unas 67 obras (escuelas, hospitales, orfanatos) en América y Europa; en 1895 estuvo en Buenos Aires, cruzando los Andes a lomo de mula desde Chile, y fundó allí un colegio. Murió en Chicago el 22 de diciembre de 1917 y Pío XII la canonizó el 7 de julio de 1946: fue la primera ciudadana estadounidense elevada a los altares.", "patrono": "Patrona de los inmigrantes (declarada por Pío XII en 1950).", "reliquia": "Su cuerpo se repartió tras la exhumación para la beatificación: la mayor parte está en su santuario de Nueva York, el corazón en Codogno y un brazo en Chicago. El cráneo fue llevado a la casa de su congregación en Roma y está colocado dentro de una efigie de la santa que yace en una urna en el lado derecho de la nave. Se ve la figura, no el hueso. Atribución segura y documentada por la propia congregación.", "porQue": "Es una santa ligada a la Argentina: estuvo en Buenos Aires y es modelo para quienes emigran; rezar ante su cabeza en la casa que ella misma fundó en Roma es muy especial.", "oracion": "Santa Francisca Javier Cabrini, ruega por nosotros; protege a los migrantes y a nuestras familias lejos de casa.", "practico": [{"iglesia": "Santísimo Redentor y Santa Francisca Cabrini (Via Sicilia)", "horario": "verificar (iglesia de la casa de las Misioneras, Via Sicilia 195-215)", "entrada": "gratis", "consejo": "Queda a pocos minutos a pie de Via Veneto y de la Porta Pinciana; conviene ir por la mañana."}], "fuentes": ["http://www.saintsinrome.com/2013/08/st-frances-xavier-cabrini.html", "https://gcatholic.org/churches/urbis/4737", "https://cabrinishrinenyc.org/about-the-shrine/"]}, "San Martín I papa": {"vida": "Nacido en Todi, fue elegido papa en 649. Ese mismo año convocó el Sínodo de Letrán, que condenó el monotelismo (la negación de la voluntad humana de Cristo) y el edicto imperial Typos de Constante II. En 653 el exarca lo arrestó en la basílica de Letrán y lo llevó enfermo a Constantinopla, donde fue juzgado, humillado y condenado. Desterrado a Quersoneso, en Crimea, murió allí en septiembre de 655 por hambre y malos tratos. Es el último papa venerado como mártir.", "patrono": "—", "reliquia": "Murió y fue sepultado en Crimea. Según la tradición romana, sus reliquias fueron llevadas a Roma y colocadas en esta basílica cuando el papa Sergio II la reconstruyó hacia 845 y trajo aquí restos de mártires de las catacumbas. Reposan en la cripta o confesión bajo el altar mayor, no visibles directamente. La atribución es tradicional; su historia de traslado no está documentada con detalle.", "porQue": "Honrar a un papa mártir por defender la verdad sobre Cristo frente al poder imperial, en una basílica con restos del siglo IV debajo.", "oracion": "San Martín, papa y mártir, ruega por nosotros; danos fidelidad a la fe aunque cueste.", "practico": [{"iglesia": "San Martino ai Monti", "horario": "Aprox. 7:00-12:00 y 16:00-19:00 (verificar). Misas lun-sáb 8:30 y 18:00.", "entrada": "gratis", "consejo": "El acceso a la confesión está frente al altar; los subterráneos antiguos sólo se ven con visita guiada. Queda a 5 minutos de Santa María la Mayor."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Martino_ai_Monti", "https://www.romasegreta.it/monti/s-martino-ai-monti.html", "https://www.iubilaeum2025.va/it/pellegrinaggio/le-chiese-giubilari/Basilica-di-San-Silvestro-e-Martino-ai-Monti.html"]}, "San Canuto IV de Dinamarca": {"vida": "Fue rey de Dinamarca de 1080 a 1086. Favoreció a la Iglesia, promovió el pago del diezmo, protegió al clero y construyó iglesias, lo que le ganó enemigos entre los nobles. En 1085 preparó una invasión a Inglaterra que no se concretó, y el descontento derivó en una rebelión. El 10 de julio de 1086 fue asesinado mientras rezaba ante el altar de la iglesia de San Albano, en Odense, junto con su hermano Benito y diecisiete compañeros. En 1101 el papa Pascual II aprobó su culto como mártir.", "patrono": "Patrono de Dinamarca.", "reliquia": "Su cuerpo está en la catedral de San Canuto, en Odense. La reliquia de Roma es un hueso extraído durante un reconocimiento de sus restos en 1875, entregado a la capilla danesa de esta iglesia (2.ª a la derecha), creada en el siglo XVII. Según las fuentes consultadas, la reliquia no está expuesta en forma permanente: se muestra en el altar en su memoria (19 de enero y 10 de julio). Atribución segura.", "porQue": "Es el santuario nacional de los católicos daneses en Roma, a pasos de San Pedro, y recuerda a un rey que murió rezando.", "oracion": "San Canuto, ruega por nosotros; protege a los gobernantes y a los pueblos del norte de Europa.", "practico": [{"iglesia": "Santa Maria in Traspontina", "horario": "Lun-sáb 6:30-12:00 y 16:00-19:15; domingos 7:30-13:00 (verificar).", "entrada": "gratis", "consejo": "Está sobre la Via della Conciliazione camino a San Pedro; preguntar a los carmelitas si se puede ver la reliquia fuera de las fiestas."}], "fuentes": ["https://romanchurches.fandom.com/wiki/Santa_Maria_in_Traspontina", "https://www.iubilaeum2025.va/it/pellegrinaggio/cammini-giubilari-dentro-roma/iter-europaeum/chiesa-di-manta-maria-in-traspontina-danimarca.html", "https://www.vaticannews.va/it/santo-del-giorno/07/10/san-canuto-iv.html"]}, "San Sabas": {"vida": "Nació en 439 en Mutalaska, Capadocia, y se hizo monje de joven. Vivió como ermitaño en el desierto de Judea y en 483 fundó la Gran Laura (hoy Mar Saba), en el valle del Cedrón, entre Jerusalén y el Mar Muerto. Fue nombrado archimandrita de los ermitaños de Palestina y defendió la fe del Concilio de Calcedonia, llegando a viajar a Constantinopla ante el emperador. Murió en su monasterio el 5 de diciembre de 532, a los 93 años. Es uno de los grandes padres del monacato oriental.", "patrono": "—", "reliquia": "Su cuerpo fue llevado a Venecia en la Edad Media y san Pablo VI lo devolvió a Mar Saba en 1965. En Roma, la iglesia del Aventino, fundada por monjes palestinos en el siglo VII, conserva una reliquia (un hueso que parece de brazo) bajo el altar, visible a través de un óculo circular. La cripta no está abierta al público. Tradición antigua ligada a la comunidad palestina fundadora.", "porQue": "Es un rincón de Oriente en Roma: una iglesia fundada por monjes que huían de Tierra Santa, con frescos antiguos y un claustro tranquilo en el 'pequeño Aventino'.", "oracion": "San Sabas, ruega por nosotros; enséñanos el silencio y la oración.", "practico": [{"iglesia": "San Saba", "horario": "Lun-sáb 8:00-12:00 y 16:00-19:10; domingos 9:30-13:00 y 16:00-19:30 (verificar).", "entrada": "gratis", "consejo": "Buscar el óculo en el altar mayor; combinar con Santa Sabina y el Jardín de los Naranjos en el Aventino."}], "fuentes": ["https://romanchurches.fandom.com/wiki/San_Saba", "https://it.wikipedia.org/wiki/Basilica_di_San_Saba", "https://www.info.roma.it/monumenti_dettaglio.asp?ID_schede=497"]}, "San Policarpo": {"vida": "Fue obispo de Esmirna (hoy Izmir, Turquía) y, según san Ireneo, discípulo del apóstol san Juan. Se conserva su Carta a los Filipenses. Hacia 154 viajó a Roma para tratar con el papa Aniceto la fecha de la Pascua. Hacia 155-156, ya anciano, fue arrestado y condenado a la hoguera; ante el procónsul dijo: 'Ochenta y seis años lo he servido y nunca me hizo mal; ¿cómo voy a blasfemar de mi Rey que me salvó?'. El Martirio de Policarpo, escrito por testigos, relata que las llamas no lo tocaron y lo remataron con una daga; es el acta martirial más antigua que se conserva.", "patrono": "Invocado tradicionalmente contra el dolor de oídos.", "reliquia": "Esta iglesia, hoy sede de la Congregación Benedictina Sublacense-Casinense, declara conservar reliquias de san Policarpo bajo el altar mayor. No son visibles. Las fuentes no detallan cuándo ni cómo llegaron, por lo que se trata de una atribución tradicional.", "porQue": "Permite rezar ante un eslabón directo con los apóstoles: un discípulo de san Juan, en una iglesia escondida del Gueto que casi nadie visita.", "oracion": "San Policarpo, ruega por nosotros; danos fidelidad a Cristo hasta el final.", "practico": [{"iglesia": "Sant'Ambrogio della Massima", "horario": "verificar (horario reducido; consultar al 06 68802792)", "entrada": "gratis", "consejo": "Está en la Via di Sant'Ambrogio, en el Gueto judío; ir antes de la misa conventual de los benedictinos."}], "fuentes": ["https://www.turismoroma.it/en/places/chiesa-di-santambrogio-della-massima", "https://en.wikipedia.org/wiki/Sant%27Ambrogio_della_Massima", "http://www.enrosadira.it/santi/p/policarpo.htm"]}, "Santa María Magdalena": {"vida": "Discípula de Jesús, de Magdala en Galilea, de quien el Señor expulsó siete demonios (Lc 8,2). Acompañó a Jesús y a los apóstoles, estuvo al pie de la cruz y en la sepultura. Fue la primera testigo de la Resurrección y recibió el encargo de anunciarla a los apóstoles (Jn 20), por eso la tradición la llama 'apóstol de los apóstoles'. En 2016 el papa Francisco elevó su memoria a fiesta. La identificación con la pecadora que unge a Jesús es una tradición latina, no un dato del Evangelio; la tradición provenzal la sitúa luego en Francia, y la oriental en Éfeso.", "patrono": "Patrona de los penitentes, de los contemplativos y de los perfumistas y peluqueros.", "reliquia": "Se conserva un hueso del pie izquierdo, según la tradición el que primero entró en el sepulcro vacío. Una versión dice que fue separado en el siglo IX, al trasladar el cuerpo de Oriente a Francia. Está en un relicario de plata con forma de pie, atribuido al taller de Benvenuto Cellini, expuesto desde 2012 en una capilla del lado izquierdo. Atribución tradicional, sin verificación científica.", "porQue": "Es una de las reliquias más llamativas de Roma y una forma concreta de meditar sobre la primera testigo de la Resurrección.", "oracion": "Santa María Magdalena, ruega por nosotros; danos un amor fiel a Cristo y el don de la conversión.", "practico": [{"iglesia": "San Giovanni dei Fiorentini", "horario": "Aprox. 7:25-12:00 y 17:00-19:00 (verificar).", "entrada": "gratis", "consejo": "Al fondo de Via Giulia, junto al Tíber; buscar el relicario en la capilla a la izquierda del presbiterio."}], "fuentes": ["https://www.santodelgiorno.it/roma/basilica-di-san-giovanni-dei-fiorentini/", "https://reliquiosamente.com/2020/10/29/le-reliquie-di-maria-maddalena/", "https://www.unaguidaturisticaroma.com/news-details/post/216015/il-piede-della-maddalena-e-il-suo-reliquiario"]}, "San Francisco de Asís": {"vida": "Nació en Asís en 1181 o 1182, hijo de un rico comerciante. Tras la cárcel y la enfermedad se convirtió; el Crucifijo de San Damián le pidió 'repara mi casa'. Renunció a todo ante el obispo y en 1209 Inocencio III aprobó su forma de vida; la Regla definitiva fue confirmada en 1223. Armó el primer pesebre en Greccio (1223) y en septiembre de 1224 recibió los estigmas en La Verna. Murió en la Porciúncula la tarde del 3 de octubre de 1226 y Gregorio IX lo canonizó el 16 de julio de 1228. En 2026 se cumplen 800 años de su muerte.", "patrono": "Patrono de Italia, de la ecología, de los animales y de la Acción Católica.", "reliquia": "Capilla de las Reliquias (antigua sala capitular de la Basílica Inferior): se ven el hábito gris remendado, la Regla bulada de 1223, el pergamino autógrafo con la bendición a fray León, el cáliz, los velos de Jacopa de Settesoli y el cuerno de marfil del sultán, entre otros objetos. Tradición muy firme y documentada. Sobre la reliquia de sangre: no pude confirmar en fuentes oficiales qué reliquia de sangre se expone hoy aquí; la principal reliquia de sangre de los estigmas está en La Verna. Conviene verificarlo en el lugar. Tumba: su cuerpo fue trasladado aquí en 1230 y escondido; se redescubrió en 1818. Reposa en una urna de piedra dentro de un pilar, tras rejas, en la cripta rehecha en 1925-1932. Entre febrero y marzo de 2026 fue expuesto por primera vez por el octavo centenario; en octubre ya estará otra vez en la tumba.", "porQue": "Es el corazón del franciscanismo, y peregrinar en el año del octavo centenario de su muerte le da un sentido especial.", "oracion": "San Francisco de Asís, ruega por nosotros; haznos instrumentos de tu paz y enamorados de Cristo pobre y crucificado.", "practico": [{"iglesia": "Basílica de San Francisco", "horario": "Basílica Inferior 6:00-19:00 (miércoles hasta las 18:00); Basílica Superior 8:30-18:45 (verificar horario de la Capilla de las Reliquias).", "entrada": "gratis", "consejo": "La Capilla de las Reliquias está al fondo del transepto derecho de la Basílica Inferior; se exige hombros y rodillas cubiertos y silencio."}, {"iglesia": "Basílica de San Francisco", "horario": "Mismo horario que la Basílica Inferior (verificar).", "entrada": "gratis", "consejo": "Preguntar a un fraile qué reliquia de sangre se muestra antes de buscarla."}, {"iglesia": "Basílica de San Francisco (Chiesa Inferiore)", "horario": "Cripta 6:00-18:15; viernes y sábado también 21:00-22:00 para oración personal.", "entrada": "gratis", "consejo": "Ir temprano, antes de los grupos; a las 21:00 del viernes o sábado la cripta está casi vacía."}], "fuentes": ["https://basilica.sanfrancesco.org/", "https://www.acistampa.com/story/23409/le-reliquie-di-san-francesco-dassisi", "https://it.wikipedia.org/wiki/Basilica_inferiore_di_San_Francesco_d%27Assisi", "https://www.famigliacristiana.it/fede-spiritualita/tomba-di-san-francesco-dal-22-febbraio-al-22-marzo-2026-il-corpo-visibile-a-tutti-le-cose-da-sapere-qo7rmlni"]}, "Frailes León, Rufino, Maseo y Ángel": {"vida": "Fueron cuatro de los primeros y más íntimos compañeros de san Francisco. Fray León fue su secretario y confesor, a quien Francisco llamaba 'ovejita de Dios'; murió en 1271. Fray Rufino, primo de santa Clara, era un hombre de oración muy contemplativo. Fray Maseo de Marignano fue el que acompañó a Francisco en muchos viajes, y fray Ángel Tancredi, un caballero de Rieti que dejó las armas. León, Rufino y Ángel figuran como autores de la tradición de la 'Leyenda de los tres compañeros'.", "patrono": "—", "reliquia": "Sus restos reposan en nichos en los cuatro ángulos de la cripta, alrededor de la tumba de san Francisco, en la disposición creada en la reforma de 1925-1932. Se ven los nichos, no los restos. La atribución es tradicional y aceptada por los frailes del Sacro Convento.", "porQue": "Rezar ante Francisco rodeado de sus compañeros ayuda a ver la fraternidad concreta de los orígenes.", "oracion": "Frailes León, Rufino, Maseo y Ángel, intercedan por nosotros; enséñennos la amistad en Cristo.", "practico": [{"iglesia": "Basílica de San Francisco", "horario": "Cripta 6:00-18:15; viernes y sábado también 21:00-22:00.", "entrada": "gratis", "consejo": "Rodear la tumba del santo: los cuatro nichos están en las esquinas; arriba, en la nave, está la tumba de Jacopa de Settesoli."}], "fuentes": ["https://it.wikipedia.org/wiki/Basilica_inferiore_di_San_Francesco_d%27Assisi", "https://basilica.sanfrancesco.org/"]}, "Santa Clara de Asís": {"vida": "Nació en Asís hacia 1193-1194, hija del noble Favarone di Offreduccio y de Ortolana. En la noche del Domingo de Ramos de 1211 o 1212 huyó a la Porciúncula, donde Francisco le cortó el cabello y la consagró. Vivió más de cuarenta años en San Damián con las 'Damas Pobres', defendiendo el 'privilegio de la pobreza'. Según la tradición, en 1240 alejó a los sarracenos que atacaban el monasterio mostrando la Eucaristía. Fue la primera mujer en escribir una regla para mujeres, aprobada por Inocencio IV el 9 de agosto de 1253, dos días antes de su muerte el 11 de agosto. Alejandro IV la canonizó en 1255.", "patrono": "Patrona de la televisión (Pío XII, 1958), de los bordadores y de las enfermedades de los ojos.", "reliquia": "Fue sepultada en 1260 en esta basílica; su cuerpo se redescubrió en 1850 bajo el altar mayor y la cripta se construyó entre 1852 y 1872. El reconocimiento de 1986-1987 encontró sólo 57 huesos frágiles; hoy están dentro de un relicario con forma de cuerpo, vestido con el hábito, en una urna de cristal y piedra del Subasio, tras una reja. Lo que se ve es esa figura, no los huesos. En la parte extendida de la cripta se exponen otras reliquias de Clara y Francisco (hábitos, cabellos, objetos). Atribución segura.", "porQue": "Es la tumba de la 'plantita' de Francisco, y en la misma basílica está el Crucifijo de San Damián que le habló a él.", "oracion": "Santa Clara, ruega por nosotros; danos amor a la Eucaristía y a la pobreza evangélica.", "practico": [{"iglesia": "Basílica de Santa Clara (Santa Chiara)", "horario": "Invierno 6:30-12:00 y 14:00-18:00; verano 9:00-12:00 y 14:00-19:00 (verificar desde noviembre).", "entrada": "gratis", "consejo": "No sacar fotos en la cripta; después rezar ante el Crucifijo de San Damián en la capilla de la derecha."}, {"iglesia": "Basílica de Santa Clara", "horario": "Mismo horario que la basílica.", "entrada": "gratis", "consejo": "El espacio de reliquias está siguiendo el pasillo de la cripta, después de la urna."}], "fuentes": ["https://www.assisisantachiara.it/la-cripta-e-le-reliquie/", "https://www.assisisantachiara.it/la-cripta-e-le-reliquie/il-corpo-di-santa-chiara/", "https://www.visit-assisi.it/monumenti/edifici-religiosi/basilica-santa-chiara/"]}, "Santa Inés de Asís": {"vida": "Hermana menor de santa Clara, se llamaba Catalina y nació en Asís hacia 1195-1197. Pocos días después de la huida de Clara la siguió, resistiendo la violenta oposición de su familia, y Francisco le dio el nombre de Inés. Hacia 1221 fue enviada como abadesa a Monticelli, cerca de Florencia, y fundó o reformó otros monasterios. Volvió a Asís para acompañar a Clara en su agonía en 1253. Murió ese mismo año, poco después de su hermana (la fecha tradicional de su fiesta es el 16 de noviembre). Benedicto XIV la canonizó en 1753.", "patrono": "—", "reliquia": "Reposa en la capilla que lleva su nombre dentro de la basílica, junto a su madre Ortolana y su hermana Beatriz. En 1602 el obispo Crescenzi trasladó allí sus reliquias junto con las de las beatas Amata y Benedicta. Se ve el sepulcro, no los restos. Atribución tradicional y aceptada por las clarisas.", "porQue": "Completa la visita a Clara: aquí están juntas las mujeres de la familia que siguieron a Francisco.", "oracion": "Santa Inés de Asís, ruega por nosotros; danos perseverancia en la vocación.", "practico": [{"iglesia": "Basílica de Santa Clara", "horario": "Invierno 6:30-12:00 y 14:00-18:00; verano 9:00-12:00 y 14:00-19:00.", "entrada": "gratis", "consejo": "La capilla de Santa Inés es también la del Santísimo: entrar en silencio y rezar antes de mirar."}], "fuentes": ["https://www.assisisantachiara.it/guida-semplice-della-basilica/welcome-to-the-basilica-of-saint-clare-in-assisi/s-agnese-dassisi/", "https://www.assisisantachiara.it/santa-agnese-di-assisi/", "https://www.assisisantachiara.it/beata-benedetta-di-assisi/"]}, "Beatas Hortelana, Beatriz, Amata y compañeras": {"vida": "Hortelana (Ortolana) fue la madre de Clara, Inés y Beatriz: noble piadosa que peregrinó a Tierra Santa, Roma y el Monte Gargano, y que al enviudar entró en San Damián con sus hijas; murió hacia 1238. Beatriz, la hermana menor, entró en San Damián en 1229. Amata era sobrina de Clara, que la curó de una enfermedad; declaró en el proceso de canonización de su tía. Benedicta fue la sucesora de Clara como abadesa y dirigió el traslado de su cuerpo. Son figuras veneradas localmente como beatas.", "patrono": "—", "reliquia": "Según las clarisas de la basílica, Hortelana y Beatriz están sepultadas en la capilla de Santa Inés, y en 1602 el obispo Crescenzi colocó allí también las reliquias de las beatas Amata y Benedicta. Se ven las tumbas, no los restos. Atribución tradicional.", "porQue": "Permite ver la santidad de toda una familia: madre, hijas y sobrina unidas en el mismo camino.", "oracion": "Beatas Hortelana, Beatriz, Amata y compañeras, intercedan por nuestras familias.", "practico": [{"iglesia": "Basílica de Santa Clara", "horario": "Invierno 6:30-12:00 y 14:00-18:00; verano 9:00-12:00 y 14:00-19:00.", "entrada": "gratis", "consejo": "Están en la misma capilla que santa Inés: una sola parada cubre a todas."}], "fuentes": ["https://www.assisisantachiara.it/guida-semplice-della-basilica/welcome-to-the-basilica-of-saint-clare-in-assisi/s-agnese-dassisi/", "https://www.assisisantachiara.it/beata-benedetta-di-assisi/"]}, "San Rufino de Asís": {"vida": "Es considerado el primer obispo y el evangelizador de Asís. Según su pasión, fue martirizado en el siglo III (hacia 238): lo arrojaron al río Chiascio, cerca de Costano, con una piedra atada al cuello. Su cuerpo fue recuperado y venerado por los cristianos de la ciudad. Sobre su tumba se levantaron tres iglesias sucesivas; la actual catedral se empezó en 1140. En su pila bautismal, según la tradición, fueron bautizados san Francisco y santa Clara.", "patrono": "Patrono de Asís.", "reliquia": "Sus restos están bajo el altar mayor de la catedral, donde fueron colocados en 1212. El sarcófago romano del siglo III con el mito de Diana y Endimión, que según la tradición contuvo su cuerpo, no está bajo el altar sino en la cripta del museo diocesano. Se ve el altar, no los restos. Tradición antigua y continua.", "porQue": "Aquí está la raíz cristiana de Asís: el mártir que evangelizó la ciudad y la pila donde fueron bautizados Francisco y Clara.", "oracion": "San Rufino, ruega por nosotros; guarda la fe que recibimos en el bautismo.", "practico": [{"iglesia": "Catedral de San Rufino", "horario": "Todos los días 7:30-19:00. Museo y cripta: lun-vie 10:00-13:00 y 15:00-18:00; sáb 10:00-18:00; dom 11:00-18:00.", "entrada": "gratis (museo y cripta con entrada)", "consejo": "Tocar la pila bautismal a la derecha de la entrada; la catedral queda a 5 minutos cuesta arriba desde Santa Clara."}], "fuentes": ["https://www.visit-assisi.it/monumenti/edifici-religiosi/cattedrale-di-san-rufino/", "https://en.wikipedia.org/wiki/Assisi_Cathedral", "https://www.assisimuseodiocesano.it/la-cattedrale-di-san-rufino/"]}, "San Pío de Pietrelcina": {"vida": "Francesco Forgione nació en Pietrelcina el 25 de mayo de 1887, entró en los capuchinos en 1903 y fue ordenado sacerdote en 1910. Desde 1916 vivió en el convento de San Giovanni Rotondo. El 20 de septiembre de 1918 recibió los estigmas, que llevó durante cincuenta años. Pasaba muchas horas diarias confesando y celebraba la Misa con gran devoción; soportó investigaciones y restricciones del Santo Oficio con obediencia. En 1956 inauguró el hospital Casa Alivio del Sufrimiento. Murió el 23 de septiembre de 1968; san Juan Pablo II lo beatificó en 1999 y lo canonizó el 16 de junio de 2002.", "patrono": "Patrono de los voluntarios de Protección Civil de Italia; invocado por enfermos, confesores y quienes sufren.", "reliquia": "Su cuerpo fue exhumado en 2008 y
