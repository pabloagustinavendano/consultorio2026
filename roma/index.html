uida en el mismo sitio por Pascual II en 1108. Este santo murió en el exilio en Crimea y sus restos fueron traídos a Roma por los santos Cirilo y Metodio. El interior conserva la planta original del s. XII, con una nave principal y dos laterales. La unidad de estilo, sin embargo, viene rota por la decoración barroca (frescos del techo y las paredes). correspondientes al s. XIII. Son especialmente interesantes los trabajos de mármol; por ejemplo, la schola cantorum de la nave principal, algunos restos de la primera basílica. con su pavimento cosmatesco, y los ambones del s. XII. La balaustrada que separa el coro del presbiterio corresponde a la basílica primitiva y data del s. VI. Bajo el altar mayor están las reliquias de San Clemente I, papa y un brazo de S. Ignacio de Antioquía, martirizado en el cercano Coliseo. En la iglesia subterránea está enterrado S. Cirilo (+ 869), apóstol de los eslavos. El mosaico del ábside es del s. XII y representa la exaltación de la Santa Cruz. Es una cruz “staurotesca”, es decir, que contiene fragmentos de la verdadera cruz de Cristo. Las doce palomas simbolizan a los Apóstoles; a los flancos, la Virgen y San Juan. En la parte alta, el Paraíso, con Dios Padre que sostiene la corona de Jesús. Debajo de la Cruz, un grupo de ciervos, símbolo de los catecúmenos, acude a saciar su sed en la verdad cristiana. Más abajo, en el\n\nábside, un rebaño de ovejas abandonan Jerusalén, imagen de la Antigua Ley, y se dirigen a adorar al Cordero. Sobre el arco, los profetas Jeremías e Isaías proclaman el triunfo de Cristo, que está rodeado por los símbolos de los Evangelistas; entre Cristo y los Profetas se encuentran San Clemente (en la barca con San Pedro) y San Lorenzo (acompañado por San Pablo). En la nave izquierda, en la parte más cercana al pórtico, se halla la Capilla de Santa Catalina. Los frescos de Masolino da Panicale (1383–1447), representan a San Cristóbal llevando a Jesús (a la izquierda de la arcada); episodios de la vida de Santa Catalina de Alejandría (pared de la izquierda); la Crucifixión (pared del fondo); y particulares de la vida de San Ambrosio (pared de la derecha, algo dañada), obispo de Milán que animó al emperador Graciano hacia el año 380 a renunciar al título de Pontifex Maximus y a clausurar en Roma el altar de la victoria donde todavía se ofrecían sacrificios idolátricos. En la nave de la derecha, a un lado de la Sacristía, se encuentra la escalera que conduce a las excavaciones de la basílica primitiva (s. IV). Tiene una planta típicamente basilical con nártex (espacio cubierto, entre el atrio y la nave), una nave central y dos laterales y un ábside. Un muro de carga, que soporta la basílica superior, divide la nave central en dos partes. Especialmente interesantes son los frescos. Los del nártex datan de los s. XI y XII, y otros son más antiguos. En la nave se encuentran algunos que llaman la atención por su buen estado de conservación y por la viveza de las escenas: Sisinius, prefecto de Roma, acude a arrestar a su mujer porque asistía a una Misa clandestina celebrada por el Papa San Clemente, pero quedó ciego, al igual que sus sirvientes, y cargaron una columna pensando que era la esposa de Sisinius. El fresco es particularmente célebre porque contiene algunas de las primerísimas frases en italiano, muy valiosas para el estudio de la formación del italiano romance. A la izquierda del ábside de la basílica antigua, se encuentran unas escaleras que conducen a los restos de dos casas construidas en la época de la República. La que se encuentra bajo el ábside, que data del s. III, estaba provista de un Mithraeum, pequeño templo dedicado al culto del dios Mitra. Se accede salvando unos antiguos peldaños, hasta llegar a dos bancos de piedra, donde se sentaban los iniciados. La estatua del dios sol fue colocada al fondo; en el centro se encuentra el altar. que muestra a Mitra cortando la lengua del toro, mientras el perro, la serpiente y el escorpión –símbolos del mal–tratan de evitar el sacrificio.","logi":{"Horario":"9:00 a 12:30 y 15:00 a 18:00","Costo":"Iglesia superior gratis · excavaciones €10","No permitido":"Cochecitos en los niveles inferiores","Sobre el horario":"Excavaciones €10 adultos, €5 niños. Sin cochecitos en los niveles inferiores."},"map":"Basilica di San Clemente, Roma","id":"s58","day":"17","hrs":{"open":[[540,750],[900,1080]],"closed":[]},"hv":false,"pri":1,"ver":["La **schola cantorum** de mármol en la nave, rescatada de la iglesia anterior.","El **mosaico del ábside**: la cruz como árbol de la vida, con volutas verdes que se comen todo el fondo dorado.","La tumba de **San Clemente**, cuyos restos trajeron desde Crimea los santos Cirilo y Metodio.","Un nivel más abajo, la iglesia del siglo IV con frescos de la vida del santo.","Abajo de todo, el **mitreo** romano. Se escucha correr un manantial que sigue ahí."],"zone":"Roma antigua"},{"time":"12:30","name":"Almuerzo","tag":"food","type":"food","dur":90,"quick":"Zona Monti o Celio, lejos de las trampas turísticas del Coliseo.","travel":{"mode":"walk","dur":12,"costAd":"Gratis","costCh":"Gratis","how":"Volver hacia el Coliseo y subir a Monti por Via degli Annibaldi, o cruzar al Celio, más tranquilo."},"logi":{"Costo adultos":"€15 a €25","Costo niños":"€8 a €12","Evitar":"Los restaurantes con foto en la carta frente al Coliseo"},"id":"s59","day":"17","pri":3},{"time":"14:00","name":"Foro Romano y Palatino","tag":"site","type":"site","dur":135,"quick":"El corazón de la Roma antigua y la colina de los emperadores.","hist":"Plaza pública, mercado, tribunal y centro religioso de la República y del Imperio. En el Palatino vivieron Augusto y sus sucesores.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"La entrada del Foro está sobre Via della Salara Vecchia, del lado del Coliseo. Se usa la misma entrada del Coliseo, que vale 24 horas.","tip":"Poca sombra: gorra y agua. La subida al Palatino es empinada."},"full":"Vista panorámica desde el Belvedere del Capitolio Desde una terraza situada a la derecha del Palacio Senatorial, se encuentra otra de las más sugestivas panorámicas del Foro Romano. La vista abraza todo el valle del Foro, limitado a la izquierda por la vía de los Foros Imperiales y a la derecha por la ladera del Palatino. Después de la realización de la Cloaca Máxima, construida durante la dinastía de los Tarquinos (los últimos reyes de Roma), el valle pantanoso que se extendía entre el Capitolio, el Palatino, y las laderas del Esquilino, fue saneado y llegó a convertirse en lugar de encuentro de los habitantes que\n\nresidían en las colinas cercanas. A partir de ese momento, el pequeño valle se convirtió en la plaza (el Foro): el centro político, religioso y comercial de Roma. Inmediatamente bajo la terraza, se distingue el Pórtico de los dioses Consejeros. Se trata del consejo de las doce divinidades principales. Formado por dos alas que forman un ángulo obtuso, es el último gran monumento dedicado en Roma al culto pagano. Fue restaurado por el Prefecto de Roma, amigo de Juliano el Apóstata (367). A la izquierda se distinguen las tres columnas del Templo de Vespasiano iniciado por Domiciano (81) en honor de Vespasiano y Tito, fue restaurado por Septimio Severo y Caracalla. Desde aquí arriba podemos observar también las columnas del Templo de Saturno. Inaugurado en el año 497 a.C, era uno de los monumentos más venerados de la Roma republicana. Reconstruido por un general de César el año 30 a.C, con el botín de la guerra de Siria, fue durante algún tiempo el lugar donde se custodiaba el tesoro del Estado. De sus restos destacan hoy las ocho columnas de granito del pronaos o pórtico. A la izquierda, un poco más abajo, se distingue el ARCO DE SEPTIMIO SEVERO, erigido el año 203 d. C., en honor de quien fue el autor del edicto Ne fiant christiani, que prohibía las conversiones al cristianismo. Con sus 23 metros de anchura, es uno de los más grandes arcos honorarios que existen. La inscripción en las dos caras del friso recuerda las victorias del emperador sobre partos, árabes y adiabenos. El estado de conservación de los bajorrelieves no es óptimo; sin embargo, está intacta la estructura general del arco, gracias a haber quedado incluido durante siglos en construcciones de la Edad Media que han impedido el deterioro. ¿Cómo consiguieron los primeros cristianos convertir el Imperio? Antes de introducirnos en el Foro, vale la pena preguntarnos cómo impactó todo esto en los primeros cristianos y cómo hicieron ellos para convertir este imperio. “Hermanos, cuánto puede ser bella la Jerusalén celestial, si así resplandece la Roma terrena” Estas palabras de San Fulgencio, transmitidas por uno de sus discípulos, reflejan la gran admiración que suscitaba la Urbe entre quienes, viajando desde las provincias imperiales, la visitaban por primera vez. En esos momentos, a comienzos del siglo VI, Roma ya había sido evangelizada: los antiguos templos paganos llevaban más de un siglo cerrados, y en el mismo Foro Romano se habían construido algunas iglesias cristianas. En el himno que dedica a San Lorenzo, el poeta Prudencio exulta por la victoria de la fe en el corazón del Imperio: los ciudadanos romanos de antigua estirpe llenan los atrios de las iglesias; los principales del Senado, que antaño tenían como gran honor desfilar como flamines en las procesiones por la Vía Sacra, ahora besan el umbral de los santuarios de los mártires; las familias nobles ven con agrado que sus hijos e hijas dediquen su vida al servicio de la Iglesia; el fuego que ardía en el templo de Vesta se encuentra extinguido, e incluso la decana de las vírgenes vestales que lo guardaban, Claudia, se ha convertido al cristianismo; la Cruz, en resumen, domina sobre los antiguos signos paganos. ¿Cómo fue posible este cambio? Aparte de la acción de Dios, uno de los factores que lo explican es que los primeros cristianos jamás se consideraron ajenos a su ciudad ni a su oficio, por haber abrazado la fe. No eran pocos los que desempeñaban su trabajo en los Foros, a menudo en actividades directamente al servicio del Imperio: ya en tiempos de Pedro y Pablo algunos eran patricios y formaban parte de los trescientos senadores que se reunían en la Curia; otros eran jurisconsultos, abogados o jueces; en la Epístola a los Filipenses, que escribió durante su cautividad en Roma, el Apóstol envía saludos de parte de los santos que vivían en la casa del César; y en la Epístola a los Romanos cita los nombres de Aristóbulo y Narciso, que habían sido colaboradores del emperador Claudio. Con casi toda seguridad, algunos miembros de la familia imperial habían abrazado la fe ya a finales del siglo I. Tito Flavio Clemente y Flavia Domitila, por ejemplo, eran un matrimonio","logi":{"Horario":"9:00 a 18:30 · último ingreso 17:30","Costo":"Incluido en la entrada del Coliseo","Terreno":"Empedrado irregular, poca sombra","Sobre el horario":"Misma entrada que el Coliseo, válida 24 h."},"map":"Foro Romano, Roma","id":"s60","day":"17","hrs":{"open":[[540,1110]],"closed":[]},"hv":true,"pri":1,"ver":["La **Curia**, la sala del Senado, entera y en pie.","El **Arco de Tito**: adentro, el relieve del candelabro de siete brazos saqueado del Templo de Jerusalén.","La **casa de las Vestales**, con el estanque y las estatuas de las sacerdotisas.","En el Palatino, la casa de Augusto y los restos de los palacios imperiales.","La vista del Foro desde los Orti Farnesiani, arriba: la mejor foto del día."],"zone":"Roma antigua"},{"time":"16:15","name":"Cárcel Mamertina","tag":"site","type":"site","dur":30,"quick":"La celda donde estuvieron presos San Pedro y San Pablo.","hist":"El Tullianum, la prisión de Estado de la Roma republicana. La tradición sitúa aquí el encarcelamiento de los dos Apóstoles antes del martirio.","travel":{"mode":"walk","dur":10,"costAd":"Gratis","costCh":"Gratis","how":"Atravesar el Foro hacia el noroeste, en dirección al Capitolio. La cárcel está al pie de la colina, sobre Clivo Argentario."},"full":"Antes de entrar al Foro y bajando del Capitolio por la escalera que da hacia la Via dei Fori Imperiali puede visitarse la Iglesia de San Lucas y Martina y la Cárcel Mamertina. La IGLESIA DE LOS SANTOS LUCAS Y MARTINA, comprende además otra iglesia inferior, subterránea. Esta segunda fue erigida en el s. VI sobre las ruinas de la estancia del secretario del Senado, y dedicada a la mártir Santa Martina; más tarde, reedificada y restaurada, fue donada en 1588 por Sixto V a la Academia de San Lucas, corporación de artistas del s. XIV que estaba anexa a la iglesia. Fue posteriormente demolida para la distribución de los Foros Imperiales. De San Lucas toma el segundo nombre. La iglesia actual fue construida por Pietro da Cortona en 1634, por iniciativa del cardenal Barberini, protector de la Academia. En frente, está la CÁRCEL MAMERTINA, desde tiempos muy remotos e inciertos la prisión principal de Roma, especialmente durante la República. A veces era llamada Tullianum, palabra que se deriva de tullus, o manantial de agua. Consta de dos aposentos hoy unidos por una escalera medieval: el piso inferior, la cárcel propiamente dicha, de forma semicircular y cónica, está construida con gruesos bloques de peperino. Antiguamente comunicaba con el aposento superior sólo por una abertura practicada en el techo, por donde eran arrojados los presos. La parte inferior comunicaba a su vez por medio de un corredor con la Cloaca Máxima. En esta cárcel se recluían prisioneros que hoy llamaríamos políticos como Yugurta, Vergincetórix, los cómplices de Catilina... y San Pedro y San Pablo que permanecieron en esta prisión a la espera del martirio. En la pared apoya un pequeño altar con relieve a modo de Retablo, que representa un hecho narrado por la tradición: el bautismo de los carceleros Proceso y Martiano –luego mártires también–, y de los cuarenta y siete compañeros de prisión, con el agua de una fuente que brotó milagrosamente. A la izquierda del altar, la tradición señala en una pequeña columna el sitio donde los dos Apóstoles fueron encadenados. En base a esta tradición, desde el Siglo XVI empezó a llamarse San Pietro in Carcere. Entrando al Foro CURIA. A su derecha, oculta en parte por el Arco, se ve la fachada de la Curia, sede del Senado, que fue teatro de los acontecimientos más determinantes de la historia de Roma. El Papa Honorio la transformó el s. VII en iglesia y la dedicó a San Adriano. La tradición la hace remontarse a Tulio Ostilio, tercer rey de Roma. Julio César la reedificó completamente más cerca del antiguo Comicio. El actual edificio de ladrillos es de la época de Diocleciano (303 d. C.); la puerta de bronce original fue sacada por el Papa Alejandro VII y colocada en la entrada principal de la Basílica de San Juan de Letrán. El interior de la Curia tiene forma rectangular (27 x 18 m.); las paredes están revestidas hasta cierta altura con lastras de mármol. Por encima de la decoración en mármol, había tres nichos en cada lado, decorados con pequeñas columnas de alabastro, y a los lados existen tres escalones, todavía visibles, en los que estaban colocados los asientos en madera de los senadores (cerca de 300). El pavimento está formado por incrustaciones de pórfido y mármol serpentino. Delante de la entrada debía de hallarse el ara sobre la que los senadores ofrecían sacrificios al entrar en el aula. En la pared opuesta a la entrada, había un podio para el presidente, y sobre el podio, adosada a la pared, la ESTATUA DE LA VICTORIA. Esta estatua (su original, pues aquí encontramos una réplica) protagonizó una importante historia: Hasta tiempo después de impuesto el cristianismo, el mundo romano seguía siendo pagano, y era frecuente sentir el balanceo de la hegemonía de una u otra religión. Quizá donde estaba simbolizada esta lucha era en la estatua de la Victoria, el símbolo más venerable del paganismo oficial. Toda de oro macizo,","logi":{"Horario":"9:00 a 17:00","Costo":"€10 aprox.","Acceso":"Escalera empinada hasta la celda inferior"},"map":"Carcere Mamertino, Roma","id":"s61","day":"17","hrs":{"open":[[540,1020]],"closed":[]},"hv":false,"pri":2,"ver":["El **Tullianum**, la celda inferior: se baja por una escalera empinada al pozo donde estuvieron los Apóstoles.","La columna a la que, según la tradición, ataron a San Pedro.","El manantial que, dice la tradición, brotó ahí para que Pedro bautizara a sus carceleros."],"zone":"Roma antigua"},{"time":"16:45","name":"Campidoglio y Santa Maria in Aracoeli","tag":"site","type":"site","dur":60,"quick":"La plaza de Miguel Ángel y la iglesia sobre la colina capitolina.","hist":"Miguel Ángel rediseñó la plaza en 1536 para la visita de Carlos V. Aracoeli está sobre el templo de Juno Moneta, donde según la leyenda la Sibila anunció a Augusto el nacimiento de Cristo.","travel":{"mode":"walk","dur":8,"costAd":"Gratis","costCh":"Gratis","how":"Subir por el Clivo Argentario hasta la Cordonata, la rampa que Miguel Ángel diseñó para llegar a la plaza. A Aracoeli se puede entrar por una puerta lateral desde el Campidoglio.","tip":"Esa puerta lateral evita los 124 escalones de la escalinata principal. Con cochecito, imprescindible."},"full":"Surge en la cima más alta de la colina Capitolina. Esta iglesia, una de las primeras dedicadas a Santa María, fue construida entre el s. IV y el VII, en el lugar que según la leyenda, la Sibila había anunciado a Augusto quién sería su sucesor: un niño hebreo, Rey del Cielo. En ese mismo lugar, Augusto erigió un altar, y entre el s. IV y VII se levantó un monasterio y la iglesia. El aspecto actual de la iglesia es fruto de la reconstrucción románico–gótica realizada a principios del s. XIII. Fue abadía benedictina en el s. X y pasó a los franciscanos en 1250. Durante la época medieval, la basílica fue una especie de foro o centro político–administrativo, donde se tenían las reuniones y debates de las asambleas populares (en aquel momento se vio la posibilidad de organizar un Ayuntamiento libre). En Santa Maria d'Aracoeli se celebró el triunfo de Marco Antonio Colonna en la batalla de Lepanto (1571); como recuerdo se cubrió de oro el techo que recorre toda la nave. La escalinata tiene 122 peldaños de mármol, y fue construida en 1348. La iglesia está dividida en tres naves. separadas por 22 columnas procedentes de diversos edificios de época romana. Bajo el pavimento cosmatesco (fines del s. XIII). se hallan sepulcros de los s. III y IV; el techo, con símbolos navales, conmemora la victoria de Lepanto. En la parte alta de la contra fachada se puede apreciar la enorme inscripción de Urbano VIII sostenida por dos virtudes, de la escuela de Bernini; y en la parte derecha, sobre el muro, la piedra sepulcral del archidiácono Giovanni Crivelli, obra de Donatello. En el pavimento. sobre la tercera columna de la izquierda, se encuentra la inscripción: “cubículo”de los Augustos, atravesada por un agujero inclinado que probablemente servía para las observaciones celestes; sobre la siguiente columna, un fresco de influencia sienesa de la Virgen Refugium Peccatorum (s. XV); delante, la tumba del Magister Aldus, constructor de la Iglesia. En las naves laterales destaca la Capilla Bufalini con la historia de San Bernardo, decorada con espléndidos frescos de Pinturicchio (1486). En el altar mayor, barroco, destaca una antigua imagen bizantina de la Virgen (s. X). Se la conoce como Madonna di S. Luca. A ella consagró Pío XII la ciudad de Roma en 1948. A la izquierda del altar mayor, en la capilla de san Gregorio, están los restos del beato Juan de Triora, mártir en China (+ 1816). Al centro del transepto izquierdo, la Capilla de Santa Elena, elegante construcción de 1605. En el interior del altar se halla una urna de pórfido que contiene los restos de Santa Elena; sobre la urna, un poco más abajo del actual pavimento, se encuentra la Aparición de la Virgen a Augusto, un altar cosmatesco de finales del s. XIII colocado sobre el ara que –según leyenda–mandó construir el propio Augusto, después de la aparición de la profetisa. En una capilla al lado de la sacristía, se conserva el famoso Santo Bambino, muy popular y venerado en Roma. La imagen original fue robada hace años; se trataba de una escultura realizada con madera de olivo del Getsemaní a finales del s. XIII, revestida según la costumbre de la época para los recién nacidos, y adornada con exvotos. En el viejo convento, demolido para hacer el llamado Altar de la Patria (o Máquina de Escribir, como la llaman los que no les gusta, que son todos los que tienen un poco de buen gusto), que fue Curia Generalicia de los Franciscanos Menos, vivieron varios santos: san Buenaventura (+ 1274), san Diego de Alcalá (+ 1463), san Juan de Capistrano (+ 1456), san Bernardino de Siena (+ 1444), san Juan de la Marca (+ 1476) y otros.","logi":{"Horario":"9:00 a 18:30","Costo":"Gratis","No perderse":"El Santo Bambino y la vista del Foro desde el mirador"},"map":"Piazza del Campidoglio, Roma","id":"s62","day":"17","hrs":{"open":[[540,1110]],"closed":[]},"hv":false,"pri":2,"ver":["La plaza de **Miguel Ángel** con el pavimento en estrella y el Marco Aurelio ecuestre (el original está adentro de los museos).","El **Santo Bambino** de Aracoeli, en su capilla: los chicos de Roma le escriben cartas.","La **capilla Bufalini**, primera de la derecha: frescos de Pinturicchio con la vida de San Bernardino.","El mirador detrás del Palazzo Senatorio, con el Foro entero abajo."],"zone":"Roma antigua"},{"time":"17:45","name":"Vuelta al departamento","tag":"rest","type":"rest","quick":"Si a la tarde el grupo está fundido, se corta después del Foro y el Campidoglio queda para otro día.","travel":{"mode":"bus","dur":35,"costAd":"€1,50","costCh":"Gratis menores de 10","how":"Bus 40 o 64 desde Piazza Venezia hasta la Stazione San Pietro, casi en la puerta de casa.","tip":"Cuidado con los carteristas en el 64: mochilas adelante."},"id":"s63","day":"17","pri":3}]},{"date":"2026-10-18","phase":1,"weekday":"Dom","dd":"18","title":"Despedida · ase una posición central en el centro de la nave. La nueva Basílica era más grande que la de San Pedro. La noche del 15 al 16 de julio de 1823, un incendio estuvo a punto de devastar la basílica. Los daños fueron sólo parciales, y se procedió enseguida a remediar la catástrofe, con ayudas que llegaron de todo el orbe cristiano. La nave central y las laterales se reconstruyeron totalmente, a pesar de que las llamas no habían tocado la parte sur. El ábside y el crucero requirieron una reparación considerable. Aunque San Pablo Extramuros está adornada hoy en día con brillantes mármoles y vivos colores, aún corresponde a los planos originales del s.IV, y manifiesta la grandeza de las primitivas basílicas cristianas de Roma, y la fe de aquellas primeras generaciones de seguidores de Cristo. Atrio Entrando por la puerta principal –la que mira al Tíber se encuentra el cuadripórtico, rodeado de arcadas, construido a principios de este siglo. En la parte más cercana a la fachada se encuentran diez columnas monolíticas de mármol rosa de Baveno, de 10 m de alto; en los otros lados está rodeado por columnas de granito blanco, en filas dobles a los flancos, y en una triple fila en el lado del Tíber. En el centro se encuentra la estatua de San Pablo, y a la derecha de la fachada, la de San Lucas, ambas del s. XIX. El mosaico es una reposición del realizado por Pietro Cavallini en el s.XIV. La puerta central de acceso al interior, flanqueada por las estatuas de San Pedro y San Pablo, está decorada, en bronce y plata, con escenas de las vidas de los Apóstoles. La Puerta Santa se encuentra, tapiada, al lado derecho; en la parte interna de esta puerta están colocados los dos batientes de la puerta mayor de la antigua Basílica, cinceladas y damasquinadas en plata, con 54 recuadros en los que se narran historias del Antiguo y del Nuevo Testamento, símbolos e inscripciones, realizados en Constantinopla por Staurachio de Scio (1070), por encargo del Abad Hildebrando, que después sería el const D = DATA, T = D.trip, DAYS = T.days;
const STOPS = {}; DAYS.forEach(d => d.stops.forEach(s => STOPS[s.id] = s));
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MO = ['enero','febrero','marzo','abril','mayo','junio','julio',
            'agosto','septiembre','octubre','noviembre','diciembre'];

/* ── reloj de Roma ── */
function rome(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,
    weekday:'short'}).formatToParts(new Date());
  const g = k => p.find(x => x.type === k).value;
  return {ymd:`${g('year')}-${g('month')}-${g('day')}`,
          min:(+g('hour'))*60 + (+g('minute')),
          dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday'))};
}
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin = t => { const [a,b] = t.split(':'); return (+a)*60 + (+b); };
function dur(m){ const h = Math.floor(m/60), r = m%60;
  return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; }

/* ── estado ── */
let TAB = 'ahora', DAY = 0, Q = '';
const R = rome();
const todayIdx = DAYS.findIndex(d => d.date === R.ymd);
const before = R.ymd < DAYS[0].date, after = R.ymd > DAYS[DAYS.length-1].date;
DAY = todayIdx >= 0 ? todayIdx : (after ? DAYS.length-1 : 0);

/* ── horarios ── */
function closesIn(s, dayIso){
  if(!s.hrs || dayIso !== R.ymd) return null;
  if(s.hrs.closed && s.hrs.closed.includes(R.dow)) return {shut:true};
  for(const [a,b] of s.hrs.open){
    if(R.min >= a && R.min < b) return {left:b - R.min};
  }
  return null;
}
function warnings(){
  const d = DAYS[DAY]; if(!d || d.date !== R.ymd) return [];
  const out = [];
  for(const s of d.stops){
    const c = closesIn(s, d.date);
    if(c && !c.shut && c.left <= 60 && toMin(s.time) >= R.min - 30) out.push({s, left:c.left});
  }
  return out;
}

/* ── clima ── */
function paintWx(o, stale){
  const el = document.getElementById('wx'); if(!el) return;
  if(!o){ el.textContent = '—'; return; }
  const ic = o.code === 0 ? '☀' : o.code < 4 ? '⛅' : o.code < 60 ? '☁' : '🌧';
  el.textContent = `${o.temp}°`;
  const n = document.getElementById('wxn');
  if(n) n.textContent = (stale ? 'dato viejo ' : 'Roma ') + ic;
}
async function loadWx(){
  let c = null;
  try{ c = JSON.parse(localStorage.getItem('rome2026:wx') || 'null'); }catch(e){}
  if(c) paintWx(c, Date.now() - c.t > 6*3600e3);
  if(c && Date.now() - c.t < 3*3600e3) return;
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.902&longitude=12.453&current=temperature_2m,weather_code&timezone=Europe%2FRome');
    const j = await r.json();
    const o = {t:Date.now(), temp:Math.round(j.current.temperature_2m), code:j.current.weather_code};
    localStorage.setItem('rome2026:wx', JSON.stringify(o)); paintWx(o);
  }catch(e){ if(!c) paintWx(null); }
}

/* ── utilidades ── */
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapsUrl = s => 'https://www.google.com/maps/search/?api=1&query=' +
  encodeURIComponent(s.map || (s.name + ', Roma'));
const pic = (id, mini) => `<img src="fotos/${mini?'mini/':''}${id}.jpg" loading="lazy"
  alt="" onload="this.classList.add('on')" onerror="this.remove()">`;
const MODE = {walk:'🚶 A pie', metro:'Ⓜ️ Metro', bus:'🚌 Bus', car:'🚗 En auto', train:'🚆 Tren'};

/* ══ AHORA ══ */
function viewAhora(){
  const d = DAYS[DAY];
  let hero, next = null, cur = null;
  if(d.date === R.ymd){
    for(let i = 0; i < d.stops.length; i++){
      const s = d.stops[i], a = toMin(s.time), b = a + (s.dur || 45);
      if(R.min >= a && R.min < b){ cur = {s, a, b}; next = d.stops[i+1]; break; }
      if(R.min < a){ next = s; break; }
    }
  }
  if(before){
    const dd = Math.round((new Date(DAYS[0].date) - new Date(R.ymd)) / 864e5);
    hero = `<div class="hero"><div class="lbl">El viaje no empezó</div>
      <h2 class="disp">Faltan ${dd} días</h2>
      <div class="sub">Primer día: viernes 9 de octubre</div></div>`;
    next = DAYS[0].stops[0];
  } else if(after){
    hero = `<div class="hero"><div class="lbl">Fin del viaje</div>
      <h2 class="disp">Volvimos</h2><div class="sub">Que quede el recuerdo</div></div>`;
  } else if(cur){
    const pc = Math.round((R.min - cur.a) / (cur.b - cur.a) * 100);
    hero = `<div class="hero"><div class="lbl">En curso · ${hhmm(R.min)}</div>
      <h2 class="disp">${esc(cur.s.name)}</h2>
      <div class="sub">Termina ${hhmm(cur.b)} · ${esc(cur.s.quick || '')}</div>
      <div class="prog"><i style="width:${pc}%"></i></div></div>`;
  } else if(next){
    hero = `<div class="hero"><div class="lbl">Ahora · ${hhmm(R.min)}</div>
      <h2 class="disp">Rato libre</h2>
      <div class="sub">Lo próximo empieza ${next.time}</div></div>`;
  } else {
    hero = `<div class="hero"><div class="lbl">${esc(d.weekday)} ${d.dd} · ${hhmm(R.min)}</div>
      <h2 class="disp">Día terminado</h2><div class="sub">A descansar</div></div>`;
  }

  let nx = '';
  if(next){
    const t = next.travel;
    const ttl = before ? `Primera parada · vie 9, ${next.time}` : `Después · ${next.time}`;
    nx = `<div class="card"><div class="lbl">${ttl}</div>
      <h3 class="disp">${esc(next.name)}</h3>
      ${t && !before ? `<div class="go"><span>${MODE[t.mode] || '→'}</span>
        <span><b>${t.dur} min</b> ${esc((t.how||'').split('.')[0])}</span></div>` : ''}
      ${before ? `<div class="go"><span>🕒</span><span>${esc(next.quick||'')}</span></div>` : ''}
      <button class="mapbtn" onclick="window.open('${mapsUrl(next)}','_blank')">📍 Abrir en Google Maps</button>
    </div>`;
  }

  let pend = '';
  if(before){
    const p = D.info.reservas.rows.filter(r => /pendiente/i.test(r[1]));
    if(p.length) pend = `<div class="card"><div class="lbl">Todavía falta reservar</div>
      ${p.map(([k,v]) => `<div class="row"><div class="k">${esc(k)}</div>
        <div class="v">${esc(v)}</div></div>`).join('')}</div>`;
  }

  const rest = d.date === R.ymd ? d.stops.filter(s => toMin(s.time) > R.min).length : d.stops.length;
  const last = d.stops[d.stops.length-1];
  const chips = `<div class="chips">
    <div class="chip"><div class="k" id="wxn">Roma</div><div class="v" id="wx">…</div></div>
    <div class="chip"><div class="k">Paradas</div><div class="v">${rest}</div></div>
    <div class="chip"><div class="k">Cierra</div><div class="v">${last.time}</div></div></div>`;

  const w = warnings().map(x => `<div class="warn">⏳ <span><b>${esc(x.s.name)}
    cierra en ${dur(x.left)}.</b> Si van hoy, tiene que ser ahora.</span></div>`).join('');

  return hero + `<div class="pad">${nx}${chips}${w}${pend}</div>`;
}

function strip(){
  return '<div class="strip">' + DAYS.map((d,i) =>
    `<button class="${i===DAY?'on':''}" onclick="go(${i})"><i>${d.weekday}</i>${d.dd}</button>`
  ).join('') + '</div>';
}
function go(i){ DAY = i; if(TAB === 'guia') TAB = 'dia'; render(); }

/* ══ DÍA ══ */
let ONLY = false;
function viewDia(){
  const d = DAYS[DAY], isToday = d.date === R.ymd;
  const list = d.stops.filter(s => !ONLY || s.pri === 1);
  const li = list.map(s => {
    const done = isToday && toMin(s.time) + (s.dur||45) < R.min;
    const c = closesIn(s, d.date);
    const t = s.travel;
    const trav = (!ONLY && t) ? `<div class="trav">${MODE[t.mode]||'→'} · ${t.dur} min</div>` : '';
    if(s.pri === 3) return `${trav}<li class="s3 ${done?'done':''}">
      <span class="hr">${s.time}</span>
      <button class="logi" onclick="open_('${s.id}')"><b>${esc(s.name)}</b>${
        s.dur ? ` · ${dur(s.dur)}` : ''}</button></li>`;
    const tags = [];
    if(s.pri === 2) tags.push('<span class="tagm">Si hay tiempo</span>');
    if(s.dur) tags.push(`<span class="tagm">${dur(s.dur)}</span>`);
    if(s.tag === 'mass') tags.push('<span class="tagm lit">Liturgia</span>');
    if(c && !c.shut && c.left <= 60) tags.push(`<span class="tagm hot">Cierra en ${dur(c.left)}</span>`);
    return `${trav}<li class="${s.pri===1?'key':'s2'} ${done?'done':''}">
      <span class="hr">${s.time}</span>
      <button class="stop ${s.pri===2?'s2':''}" onclick="open_('${s.id}')">
        <div class="n">${esc(s.name)}</div>
        <div class="q">${esc(s.quick||'')}</div>
        ${tags.length?`<div class="m">${tags.join('')}</div>`:''}
      </button></li>`;
  }).join('');
  const n1 = d.stops.filter(s => s.pri === 1).length;
  return `<div class="pad">${strip()}
      <div class="seg">
        <button class="${!ONLY?'on':''}" onclick="ONLY=false;render()">Todo el día</button>
        <button class="${ONLY?'on':''}" onclick="ONLY=true;render()">Solo lo esencial · ${n1}</button>
      </div></div>
    <div class="dayhd"><h2 class="disp">${esc(d.title)}</h2>
      <div class="nt">${esc(d.note||'')}</div></div>
    <ol class="tl">${li}</ol>`;
}

/* ══ GUÍA ══ */
function viewGuia(){
  const q = Q.trim().toLowerCase();
  const all = [];
  DAYS.forEach(d => d.stops.forEach(s => { if(s.zone) all.push(s); }));
  const hits = q ? all.filter(s =>
    (s.name + ' ' + (s.quick||'') + ' ' + (s.hist||'')).toLowerCase().includes(q)) : all;
  let out = `<div class="pad"><input class="search" placeholder="Buscar un lugar…"
    value="${esc(Q)}" oninput="Q=this.value;render();this.focus()"></div>`;
  if(!hits.length) return out + '<div class="empty">Nada con esa palabra.</div>';
  out += '<div class="pad">';
  T.zones.forEach(z => {
    const g = hits.filter(s => s.zone === z);
    if(!g.length) return;
    out += `<div class="zone">${esc(z)}</div>` + g.map(s =>
      `<button class="gitem" onclick="open_('${s.id}')">
        <span class="gth">✠${pic(s.id, true)}</span>
        <span class="tx">
          <div class="n">${esc(s.name)}</div>
          <div class="q">${esc(s.quick||'')}</div>
          <div class="d">${esc(DAYS.find(d=>d.dd===s.day).weekday)} ${s.day}${
            s.pri===2 ? ' · si hay tiempo' : ''}</div>
        </span>
      </button>`).join('');
  });
  return out + '</div>';
}

/* ══ INFO ══ */
function viewInfo(){
  const blk = o => `<div class="block"><h3 class="disp">${esc(o.title)}</h3>` +
    o.rows.map(([k,v]) => `<div class="row"><div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div></div>`).join('') +
    (o.map ? `<button class="mapbtn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.map)}','_blank')">📍 Abrir en Google Maps</button>` : '') +
    '</div>';
  const misas = ['11','18'].map(dd => {
    const d = DAYS.find(x => x.dd === dd);
    return `<div class="block"><h3 class="disp">Domingo ${dd} · misas</h3>` +
      D.masses.filter(m => m.d === dd).map(m => `<div class="mass ${m.rite==='trad'?'pick':''}">
        <div class="h"><div class="hh">${m.time}</div>
          <span class="tagm ${m.rite==='trad'?'lit':''}">${m.rite==='trad'?'Tradicional':'Novus Ordo'}</span></div>
        <div class="pl disp">${esc(m.place)}</div>
        <div class="mt">${esc(m.note)}</div>
        <button class="mapbtn" style="padding:9px;font-size:12px"
          onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.map)}','_blank')">📍 Cómo llegar</button>
      </div>`).join('') + '</div>';
  }).join('');
  return '<div class="pad">' + blk(D.info.casa) + blk(D.info.reservas) + misas +
    blk(D.info.vuelos) + blk(D.info.frases) + blk(D.info.horarios) +
    '<div class="warn" style="margin-top:20px">☂ <span>Los horarios de misa hay que ' +
    'confirmarlos en septiembre: en San Pedro cambian según las celebraciones.</span></div></div>';
}

/* ══ FICHA ══ */
function open_(id){
  const s = STOPS[id], d = DAYS.find(x => x.dd === s.day);
  const c = closesIn(s, d.date);
  const kv = [];
  if(s.logi && s.logi['Horario']) kv.push(`<span>${esc(s.logi['Horario'])}</span>`);
  if(s.hv === true) kv.push('<span class="okc">✓ Verificado</span>');
  else if(s.hv === false) kv.push('<span class="hot">Horario a confirmar</span>');
  const cost = (s.logi && (s.logi['Costo'] || s.logi['Costo adultos'])) ||
               (s.travel && s.travel.costAd);
  if(cost) kv.push(`<span>${esc(cost)}</span>`);
  if(s.dur) kv.push(`<span>${dur(s.dur)}</span>`);
  if(c && !c.shut) kv.push(`<span class="hot">Cierra en ${dur(c.left)}</span>`);
  if(c && c.shut) kv.push('<span class="hot">Hoy cerrado</span>');

  const mirar = s.ver ? `<details open><summary><span class="t">Qué mirar</span>
    <span class="c">›</span></summary><ul class="mir">${
      s.ver.map(x => `<li>${bold(x)}</li>`).join('')}</ul></details>` : '';

  const t = s.travel;
  const como = t ? `<details><summary><span class="t">Cómo llegar</span><span class="c">›</span></summary>
    <div class="body"><b>${MODE[t.mode]||''} · ${t.dur} min</b><br><br>${esc(t.how)}
    ${t.tip ? `<br><br><i>${esc(t.tip)}</i>` : ''}
    ${t.costAd && t.costAd !== 'Gratis' ? `<br><br>Adultos ${esc(t.costAd)} · niños ${esc(t.costCh)}` : ''}
    <button class="mapbtn" onclick="window.open('${mapsUrl(s)}','_blank')">📍 Abrir en Google Maps</button>
    </div></details>` : `<div style="margin-top:14px">
    <button class="mapbtn" onclick="window.open('${mapsUrl(s)}','_blank')">📍 Abrir en Google Maps</button></div>`;

  const hist = s.hist ? `<details><summary><span class="t">Qué es</span><span class="c">›</span></summary>
    <div class="body rd">${esc(s.hist)}${s.full ? `<div style="margin-top:12px">
      <button class="mapbtn" style="background:var(--paper2);color:var(--crimson);
      border:1px solid var(--line)" onclick="full('${s.id}')">Leer la historia completa ›</button></div>` : ''}
    </div></details>` : '';

  const logi = s.logi ? `<details><summary><span class="t">Datos</span><span class="c">›</span></summary>
    <div class="body">${Object.entries(s.logi).map(([k,v]) =>
      `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}
    </div></details>` : '';

  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     <h2 class="disp">${esc(s.name)}</h2>
     <div style="font-size:11.5px;color:var(--soft);font-weight:600;margin-top:5px">
       ${esc(d.weekday)} ${s.day} · ${s.time}</div>
     ${kv.length ? `<div class="kv">${kv.join('')}</div>` : ''}
     ${s.pri < 3 ? `<div class="ph"><span>foto pendiente</span>${pic(s.id)}</div>` : ''}
     <div class="sum">${esc(s.quick||'')}</div>
     ${mirar}${como}${hist}${logi}`;
  show();
}
function full(id){
  const s = STOPS[id];
  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     <h2 class="disp">${esc(s.name)}</h2>
     <div class="body rd" style="margin-top:14px">${
       s.full.split('\n\n').map(p => p.startsWith('## ')
         ? `<h3 class="sub">${esc(p.slice(3))}</h3>`
         : `<p>${esc(p).replace(/\*(.+?)\*/g,'<i>$1</i>')}</p>`).join('')}</div>
     <button class="mapbtn" style="background:var(--paper2);color:var(--crimson);
       border:1px solid var(--line)" onclick="open_('${s.id}')">‹ Volver</button>`;
  document.querySelector('#sheet .in').scrollTop = 0;
}
function show(){ document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.querySelector('#sheet .in').scrollTop = 0; }
function shut(){ document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on'); }

/* ══ RENDER ══ */
function render(){
  document.getElementById('view').innerHTML =
    TAB === 'ahora' ? viewAhora() :
    TAB === 'dia'   ? viewDia()   :
    TAB === 'guia'  ? viewGuia()  : viewInfo();
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === TAB));
  if(TAB === 'ahora') loadWx();
}
function tab(t){ TAB = t; document.getElementById('view').scrollTop = 0; render(); }

function net(){
  const e = document.getElementById('net');
  const on = navigator.onLine;
  e.textContent = on ? 'EN LÍNEA' : 'SIN DATOS · OK';
  e.className = 'net' + (on ? '' : ' off');
}
addEventListener('online', net); addEventListener('offline', net);

/* ══ PORTÓN ══ */
const GKEY = 68829258;
function gh(s){ let v = 5381; for(const c of s){ v = ((v*33) ^ c.codePointAt(0)) >>> 0; } return v; }
function tryGate(){
  const i = document.getElementById('gpass');
  if(gh(i.value.trim().toLowerCase()) === GKEY){
    localStorage.setItem('rome2026:auth', String(GKEY)); enter();
  } else {
    document.getElementById('gerr').textContent = 'Esa no es la clave.';
    i.value = ''; i.focus();
  }
}
function enter(){
  const g = document.getElementById('gate'); if(g) g.remove();
  document.getElementById('app').classList.add('on');
  let n = localStorage.getItem('rome2026:name');
  if(!n){
    n = (prompt('¿Cómo te llamás?') || '').trim();
    if(n) localStorage.setItem('rome2026:name', n);
  }
  document.getElementById('who').textContent = n || 'Peregrino';
  net(); render();
}
if(localStorage.getItem('rome2026:auth') === String(GKEY)) enter();
else document.getElementById('gpass')
  .addEventListener('keydown', e => { if(e.key === 'Enter') tryGate(); });

if('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
