/* ══ FICHA ══ */
function open_(id){
  const s = STOPS[id], d = DAYS.find(x => x.dd === s.day);
  const c = closesIn(s, d.date);
  const kv = [];
  if(s.logi && s.logi['Horario']) kv.push(`<span>${esc(s.logi['Horario'])}</span>`);
  if(s.hv === true) kv.push('<span class="okc">✓ Verificado</span>');
  else if(s.hv === false) kv.push('<span class="hot">Horario a confirmar</span>');
  const cost = (s.logi && (s.logi['Costo'] || s.logi['Costo adultos'])) ||
               (s.travel && s.travel.costAd);
  if(cost) kv.push(`<span>${esc(cost)}</span>`);
  if(s.dur) kv.push(`<span>${dur(s.dur)}</span>`);
  if(c && !c.shut) kv.push(`<span class="hot">Cierra en ${dur(c.left)}</span>`);
  if(c && c.shut) kv.push('<span class="hot">Hoy cerrado</span>');

  const mirar = s.ver ? `<details open><summary><span class="t">Qué mirar</span>
    <span class="c">›</span></summary><ul class="mir">${
      s.ver.map(x => `<li>${bold(x)}</li>`).join('')}</ul></details>` : '';

  const t = s.travel;
  const como = t ? `<details><summary><span class="t">Cómo llegar</span><span class="c">›</span></summary>
    <div class="body"><b>${MODE[t.mode]||''} · ${t.dur} min</b><br><br>${esc(t.how)}
    ${t.tip ? `<br><br><i>${esc(t.tip)}</i>` : ''}
    ${t.costAd && t.costAd !== 'Gratis' ? `<br><br>Adultos ${esc(t.costAd)} · niños ${esc(t.costCh)}` : ''}
    ${SANTOS.route(s.id)}
    <button class="mapbtn" onclick="window.open('${mapsUrl(s)}','_blank')">📍 Abrir en Google Maps</button>
    </div></details>` : `<div style="margin-top:14px">
    <button class="mapbtn" onclick="window.open('${mapsUrl(s)}','_blank')">📍 Abrir en Google Maps</button></div>`;

  const hist = s.hist ? `<details><summary><span class="t">Qué es</span><span class="c">›</span></summary>
    <div class="body rd">${esc(s.hist)}${s.full ? `<div style="margin-top:12px">
      <button class="mapbtn" style="background:var(--paper2);color:var(--crimson);
      border:1px solid var(--line)" onclick="full('${s.id}')">Leer la historia completa ›</button></div>` : ''}
    ${pieFuente(s)}</div></details>` : '';

  const logi = s.logi ? `<details><summary><span class="t">Datos</span><span class="c">›</span></summary>
    <div class="body">${Object.entries(s.logi).map(([k,v]) =>
      `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}
    </div></details>` : '';

  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     <h2 class="disp">${esc(s.name)}</h2>
     <div style="font-size:11.5px;color:var(--soft);font-weight:600;margin-top:5px">
       ${esc(d.weekday)} ${s.day} · ${s.time}</div>
     ${kv.length ? `<div class="kv">${kv.join('')}</div>` : ''}
     ${s.qr ? `<div class="qrbox"><img src="${s.qr}" alt="Código QR de la reserva"><div>Código QR de la reserva · mostrarlo en la entrada. Llevar también el mail original.</div></div>` : ''}
     ${s.pri < 3 ? `<div class="ph"><span>foto pendiente</span>${pic(s.id)}</div>` : ''}
     <div class="sum">${esc(s.quick||'')}</div>
     ${mirar}${SANTOS.stopSection(s.id)}${SANTOS.placesSection(s.id)}${como}${hist}${logi}`;
  show();
}
function full(id){
  const s = STOPS[id];
  document.getElementById('sheetIn').innerHTML =
    `<button class="close" onclick="shut()">✕</button>
     <h2 class="disp">${esc(s.name)}</h2>
     <div class="body rd" style="margin-top:14px">${
       s.full.split('\n\n').map(p => p.startsWith('## ')
         ? `<h3 class="sub">${esc(p.slice(3))}</h3>`
         : `<p>${esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
              .replace(/\*(.+?)\*/g,'<i>$1</i>')}</p>`).join('')}
       ${pieFuente(s)}</div>
     <button class="mapbtn" style="background:var(--paper2);color:var(--crimson);
       border:1px solid var(--line)" onclick="open_('${s.id}')">‹ Volver</button>`;
  document.querySelector('#sheet .in').scrollTop = 0;
}
function show(){ document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.querySelector('#sheet .in').scrollTop = 0; }
function shut(){ document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on'); }

"Santos Anastasio el Persa y Vicente de Zaragoza":"Anastasio, soldado persa convertido, murió mártir en 628; Vicente, diácono de Zaragoza, fue quemado en Valencia en 304.",
"San Zenón y compañeros":"Según una leyenda, 10.203 soldados cristianos obligados a construir las Termas de Diocleciano y luego martirizados.",
"Santa Susana y otros mártires":"Virgen romana que, según la leyenda, rechazó casarse con el hijo de Diocleciano.",
"San Eustaquio":"General romano que se convirtió al ver un crucifijo entre los cuernos de un ciervo. Patrono de los cazadores.",
"San Juan Calibita":"Según la leyenda, hijo de nobles que vivió como mendigo en una cabaña junto a la casa paterna.",
"Santos Crispín y Crispiniano":"Hermanos zapateros que evangelizaron la Galia. Patronos de los zapateros.",
"Santa Bibiana":"Virgen mártir romana del siglo IV, muerta a azotes.",
"Santa Prisca":"Joven mártir romana que la tradición vincula con Priscila, colaboradora de San Pablo.",
"San Policarpo":"Obispo de Esmirna y discípulo del apóstol Juan. Quemado vivo hacia el año 155, a los 86 años.",
"Santos Marco y Marceliano":"Hermanos gemelos, diáconos, martirizados en Roma hacia 286.",
"Santos Ciro y Juan; Santa Sinforosa":"Ciro y Juan eran médicos egipcios mártires; Sinforosa murió con sus siete hijos en Tívoli.",
"San Teodoro Tirón":"Recluta cristiano del ejército romano quemado vivo en el Ponto hacia 306.",
"San Sixto II papa":"Papa decapitado en 258 mientras celebraba en las catacumbas. Su diácono era San Lorenzo.",
"Beato Jacinto María Cormier":"Maestro general de los dominicos que fundó en Roma la universidad Angelicum. Murió en 1916.",
"Santa María Magdalena":"Discípula de Jesús, testigo de la crucifixión y primera en ver al Resucitado. Llamada apóstol de los apóstoles.",
"Santos Proto y Jacinto":"Hermanos mártires de la Vía Salaria, del siglo III.",
"Beatos Luis y María Beltrame Quattrocchi":"Matrimonio romano, el primero beatificado junto (2001), por su vida familiar ejemplar.",
"San Aniceto papa":"Papa sirio de 155 a 166. Recibió en Roma a San Policarpo para dialogar sobre la fecha de la Pascua.",
"San Francisco de Asís":"Hijo de un rico comerciante de Asís que dejó todo para vivir el Evangelio en pobreza. Fundó los franciscanos, recibió los estigmas y murió en 1226.",
"Frailes León, Rufino, Maseo y Ángel":"Cuatro de los primeros compañeros de Francisco. León fue su secretario y confesor.",
"Jacoba de Settesoli":"Viuda noble romana, amiga y bienhechora de Francisco, que la llamaba fray Jacoba. Estuvo junto a él cuando murió.",
"Santa Clara de Asís":"Joven noble de Asís que siguió a Francisco en 1212 y fundó las Clarisas. Vivió cuarenta años en San Damián.",
"Santa Inés de Asís":"Hermana menor de Clara, la siguió a los quince años y fue abadesa en Florencia.",
"Beatas Hortelana, Beatriz, Amata y compañeras":"La madre de Clara, su hermana menor y su sobrina, que entraron también al monasterio de San Damián.",
"San Rufino de Asís":"Primer obispo y patrono de Asís, martirizado según la tradición en el siglo III.",
"San Pío de Pietrelcina":"Fraile capuchino que llevó los estigmas cincuenta años y pasaba horas confesando. Fundó el hospital Casa Alivio del Sufrimiento; murió en 1968.",
"Santa Maximiana":"Mártir de los primeros siglos cuyos restos llegaron a esta iglesia hace siglos."

const INFO = {"San Pedro": {"vida": "Simón, pescador de Betsaida, fue llamado por Jesús, que le cambió el nombre por Pedro (Kefas, 'roca') y lo puso a la cabeza de los Doce. Lo negó tres veces durante la Pasión y fue confirmado por el Resucitado junto al lago ('Apacienta mis ovejas'). Predicó en Jerusalén y Antioquía y terminó su vida en Roma como primer obispo de la ciudad. Murió mártir en la persecución de Nerón, hacia el año 64-67, crucificado cabeza abajo según la tradición antigua, y fue sepultado en la colina vaticana. Es el primer Papa y fundamento visible de la unidad de la Iglesia.", "patrono": "Los Papas y la Iglesia universal; pescadores, marineros, relojeros y cerrajeros (por las llaves); ciudad de Roma.", "reliquia": "Basílica de San Pedro: las excavaciones de 1939-1950 hallaron la tumba venerada del siglo II (el 'trofeo de Gayo') bajo el altar papal; en 1968 Pablo VI anunció que los huesos hallados en un nicho del 'muro de los grafitos', estudiados por Margherita Guarducci, podían considerarse 'de modo convincente' de Pedro. La tumba es atribución arqueológica muy seria; la identificación de los huesos es aceptada por la Santa Sede, aunque algunos arqueólogos la discuten. En Letrán, desde 1370 (Urbano V) la tradición conserva las cabezas de Pedro y Pablo en relicarios-busto de plata dentro del ciborio gótico sobre el altar papal: se ven los bustos detrás de una reja, no el cráneo en sí; es tradición medieval. En San Sebastián Extramuros se veneran recuerdos de ambos apóstoles, cuyos restos según la tradición estuvieron escondidos allí hacia el año 258; los grafitos de peregrinos del siglo III invocando a Pedro y Pablo son auténticos.", "porQue": "Rezar ante la tumba del Príncipe de los Apóstoles es el corazón de cualquier peregrinación a Roma. En la visita a los Scavi se llega a pocos metros de sus huesos, bajo el altar donde celebra el Papa.", "oracion": "San Pedro, príncipe de los Apóstoles, ruega por nosotros: confirmanos en la fe y guarda al Papa y a la Iglesia.", "practico": [{"iglesia": "San Juan de Letrán (San Giovanni in Laterano)", "horario": "7:00-18:30 todos los días", "entrada": "gratis", "consejo": "Los bustos de Pedro y Pablo están en lo alto del ciborio gótico sobre el altar papal: mirá hacia arriba detrás de la reja; al salir, cruzá a la Scala Santa."}, {"iglesia": "San Sebastián Extramuros", "horario": "verificar", "entrada": "gratis (las catacumbas son con entrada paga y visita guiada)", "consejo": "Combinalo con la Via Appia y la capilla del Quo Vadis; en la capilla de las reliquias está también la piedra con las huellas atribuidas a Cristo."}, {"iglesia": "Basílica de San Pedro (San Pietro in Vaticano)", "horario": "Basílica 7:00-20:00; Scavi (necrópolis) solo con visita guiada reservada, lunes a sábado", "entrada": "Basílica gratis; Scavi con reserva previa en la Oficina de Excavaciones (scavi.va), con costo (aprox. 13 €) y edad mínima de 15 años; verificar", "consejo": "Pedí la reserva de los Scavi con semanas o meses de anticipación; si no conseguís, bajá a las Grutas Vaticanas y rezá ante la capilla Clementina, detrás de la tumba."}], "fuentes": ["https://www.basilicasanpietro.va/it/orari", "https://www.basilicasangiovanni.va/it/info-e-orari.html", "https://www.newadvent.org/cathen/11744a.htm"]}, "Beato Inocencio XI": {"vida": "Benedetto Odescalchi nació en Como en 1611, estudió derecho y fue cardenal y obispo de Novara, conocido por su caridad con los pobres. Elegido Papa en 1676, combatió el nepotismo, saneó las finanzas pontificias y promovió la comunión frecuente y la reforma de las costumbres. Impulsó y financió la Liga Santa que liberó Viena del asedio otomano en 1683, victoria decisiva para la Europa cristiana. Defendió con firmeza la libertad de la Iglesia frente a Luis XIV y el galicanismo. Murió en Roma en 1689 y Pío XII lo beatificó en 1956.", "patrono": "— (invocado tradicionalmente en relación con la defensa de la Cristiandad ante los turcos)", "reliquia": "Su cuerpo reposa en una urna de cristal, revestido con ornamentos pontificales. Desde su beatificación estuvo bajo el altar de San Sebastián, pero el 8 de abril de 2011 fue trasladado procesionalmente al altar de la Transfiguración para dejar lugar a Juan Pablo II. Ese altar está al fondo de la nave central, del lado izquierdo, en la parte posterior del pilar de San Andrés (cerca de la Capilla Clementina), no en la nave derecha. La atribución es plenamente segura.", "porQue": "Es el Papa de la victoria de Viena de 1683, un gran defensor de la fe; ver el cuerpo de un Papa del siglo XVII es algo poco común.", "oracion": "Beato Inocencio XI, ruega por nosotros: alcanzanos fortaleza para defender la fe y la paz entre los cristianos.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "Buscá el mosaico de la Transfiguración de Rafael al fondo del lado izquierdo de la nave central, junto a la Capilla Clementina; la urna está bajo ese altar."}], "fuentes": ["http://paparatzinger4-blograffaella.blogspot.com/2011/04/basilica-vaticana-traslazione-del-corpo.html", "https://www.basilicasanpietro.va/it/orari"]}, "San Pío X": {"vida": "Giuseppe Sarto nació en 1835 en Riese, en una familia humilde del Véneto, y fue párroco, obispo de Mantua y patriarca de Venecia. Elegido Papa en 1903 con el lema 'Instaurare omnia in Christo', promovió la comunión frecuente y la primera comunión de los niños, el canto gregoriano y el catecismo. Combatió con firmeza el modernismo (encíclica Pascendi, 1907) e inició la codificación del Derecho Canónico. Murió el 20 de agosto de 1914, afligido por el estallido de la guerra, y fue canonizado por Pío XII en 1954.", "patrono": "Primeras comuniones, catequistas; diócesis de Treviso y de Venecia; la Fraternidad que lleva su nombre.", "reliquia": "Tras su canonización su cuerpo fue llevado de las Grutas Vaticanas a la Capilla de la Presentación, en la nave izquierda de la basílica. Descansa en una urna de bronce y cristal, revestido de pontifical, con el rostro cubierto por una máscara de plata. Se lo ve con claridad; la atribución es plenamente segura. En 1959 el cuerpo fue llevado temporalmente a Venecia para su veneración.", "porQue": "Es el santo Papa más cercano a la sensibilidad tradicional y se lo ve de cuerpo entero; un lugar ideal para rezar por la Iglesia y por la fe de los niños.", "oracion": "San Pío X, ruega por nosotros: guardanos en la pureza de la fe y danos amor a la Eucaristía.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "Está en la nave izquierda, la capilla siguiente a la de Juan XXIII y antes de la Capilla del Coro; muy temprano (7:00) se reza en silencio y hay misas en los altares laterales."}], "fuentes": ["https://www.basilicasanpietro.va/it/orari", "https://www.santiebeati.it/dettaglio/24100", "https://www.vaticannews.va/it/santo-del-giorno/08/21/san-pio-x--papa.html"]}, "San Josafat Kuntsévych": {"vida": "Iván Kuntsévych nació hacia 1580 en Volodímir, en la actual Ucrania, y entró en el monasterio basiliano de Vilna tomando el nombre de Josafat. Trabajó sin descanso por la unión de los ortodoxos rutenos con Roma sellada en Brest en 1596, conservando el rito bizantino. Como arzobispo de Pólotsk fue un pastor austero y predicador incansable, lo que le ganó fuertes enemistades. El 12 de noviembre de 1623 fue asesinado a golpes de hacha en Vítebsk por opositores a la unión, y su cuerpo arrojado al río Dvina. Fue canonizado en 1867, primer santo oriental canonizado formalmente por Roma.", "patrono": "Unidad de los cristianos; Iglesia greco-católica ucraniana; Ucrania.", "reliquia": "Su cuerpo, recuperado del río, se veneró en Bielorrusia y Polonia; durante las guerras pasó por Viena, y en 1963 fue trasladado a San Pedro por Juan XXIII y colocado bajo el altar de San Basilio, en la nave derecha, cerca de la Capilla Gregoriana. Se lo ve en una urna de cristal, revestido con ornamentos episcopales bizantinos. Atribución segura y documentada.", "porQue": "Es un mártir de la unidad de la Iglesia, poco conocido para los peregrinos latinos; ver su cuerpo con vestiduras orientales es una experiencia muy particular en San Pedro.", "oracion": "San Josafat, ruega por nosotros: alcanzanos la unidad de los cristianos bajo el sucesor de Pedro.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "Nave derecha, al fondo, junto a la Capilla Gregoriana: el altar tiene un gran mosaico de San Basilio celebrando la misa."}], "fuentes": ["https://www.newadvent.org/cathen/08503a.htm", "https://www.basilicasanpietro.va/it/orari"]}, "San Gregorio Nacianceno": {"vida": "Nació hacia el 329 en Capadocia, hijo del obispo Gregorio el Viejo y de santa Nona, y estudió en Atenas, donde fue gran amigo de san Basilio. Contemplativo por naturaleza, aceptó a su pesar el sacerdocio y el episcopado. En 379 fue llamado a Constantinopla, dominada por los arrianos, y allí predicó sus célebres 'Discursos teológicos' sobre la Trinidad, que le valieron el título de 'el Teólogo'. Presidió un tiempo el Concilio de Constantinopla (381), renunció a la sede para evitar divisiones y se retiró a Nacianzo, donde murió hacia el 390. Es Doctor de la Iglesia y uno de los tres grandes Capadocios.", "patrono": "Poetas; invocado contra la sequía y como protector de los teólogos.", "reliquia": "Según la tradición sus restos llegaron a Roma con monjas bizantinas en los siglos VII-VIII y se veneraron en Santa María en Campo Marzio; en 1580 Gregorio XIII los trasladó a San Pedro, a la Capilla Gregoriana (nave derecha), bajo el altar de la Virgen del Socorro. El 27 de noviembre de 2004 Juan Pablo II entregó una porción de estas reliquias al Patriarca Bartolomeo de Constantinopla; el resto sigue en el Vaticano. Se ve el altar-sepulcro, no los huesos.", "porQue": "Rezar ante el Doctor de la Trinidad en la capilla que Gregorio XIII hizo construir para él, frente a una antigua imagen milagrosa de la Virgen.", "oracion": "San Gregorio Nacianceno, ruega por nosotros: danos una fe firme en la Santísima Trinidad.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "La Capilla Gregoriana está al fondo de la nave derecha, pasando la Capilla del Santísimo; el altar tiene la imagen medieval de la Virgen del Socorro."}], "fuentes": ["https://www.vatican.va/news_services/liturgy/2004/documents/ns_lit_doc_20041127_sulle-reliquie_it.html", "https://it.wikipedia.org/wiki/Gregorio_Nazianzeno", "https://www.newadvent.org/cathen/07010b.htm"]}, "San Juan Crisóstomo": {"vida": "Nació en Antioquía hacia el 349, estudió retórica con Libanio y vivió varios años como monje antes de ser ordenado sacerdote. Su predicación fue tan brillante que lo llamaron 'Crisóstomo', boca de oro. En 398 fue hecho arzobispo de Constantinopla, donde reformó el clero y denunció el lujo de la corte, lo que le valió la enemistad de la emperatriz Eudoxia. Fue depuesto y desterrado dos veces, y murió agotado por una marcha forzada en Comana del Ponto el 14 de septiembre del 407, diciendo: 'Gloria a Dios por todo'. Es Doctor de la Iglesia y su nombre lleva la Divina Liturgia bizantina.", "patrono": "Predicadores y oradores; Constantinopla; invocado contra la epilepsia.", "reliquia": "Su cuerpo fue llevado a Constantinopla en 438 y, tras el saqueo de 1204, parte de sus reliquias llegó a Roma; desde 1626 se veneran en San Pedro bajo el altar de la Capilla del Coro, en la nave izquierda. En noviembre de 2004 Juan Pablo II donó una parte de ellas al Patriarcado de Constantinopla; el resto permanece en el Vaticano. No se ven: están dentro del altar. La historia del traslado a Roma es de tradición, sin documentación continua.", "porQue": "La Capilla del Coro es donde los canónigos rezan el oficio y suele haber adoración y misa: se reza junto al más grande predicador de la Iglesia en un lugar de oración viva.", "oracion": "San Juan Crisóstomo, ruega por nosotros: danos palabra verdadera y valor para decir la verdad.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "La Capilla del Coro está en la nave izquierda y se reserva a la oración: entrá en silencio; por la tarde suelen rezarse vísperas."}], "fuentes": ["https://www.vatican.va/news_services/liturgy/2004/documents/ns_lit_doc_20041127_sulle-reliquie_it.html", "https://it.wikipedia.org/wiki/Giovanni_Crisostomo", "https://www.newadvent.org/cathen/08452b.htm"]}, "San León Magno": {"vida": "Nacido en Toscana o en Roma a fines del siglo IV, fue diácono de gran prestigio y Papa desde el 440 hasta su muerte en 461. Su 'Tomo a Flaviano' fijó la fe en las dos naturalezas de Cristo, y el Concilio de Calcedonia (451) lo aclamó: 'Pedro ha hablado por boca de León'. En 452 salió al encuentro de Atila junto al Mincio y logró que no marchara sobre Roma; en 455 obtuvo del vándalo Genserico que no incendiara la ciudad ni matara a sus habitantes. Nos dejó 96 sermones de gran belleza. Es Doctor de la Iglesia y el primer Papa llamado 'Magno'.", "patrono": "— (invocado por papas y defensores de la ortodoxia; patrono de músicos y cantores según algunas tradiciones)", "reliquia": "Fue el primer Papa sepultado dentro de la basílica de San Pedro. En 1715 sus restos se colocaron bajo el altar dedicado a él, en el ángulo del crucero, cuyo retablo es el gran relieve de mármol de Alessandro Algardi que muestra su encuentro con Atila. Los restos no se ven. La atribución se basa en una larga tradición y en las traslaciones documentadas dentro de la basílica.", "porQue": "El relieve de Algardi es una obra maestra y cuenta la escena de cómo un Papa salvó Roma solo con su autoridad espiritual.", "oracion": "San León Magno, ruega por nosotros: defendenos de los enemigos de la fe y danos verdadera doctrina.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "Buscá el enorme relieve de Atila junto a la Capilla de la Virgen de la Columna, cerca del ábside; al lado está la tumba de Alejandro VII de Bernini."}], "fuentes": ["https://www.newadvent.org/cathen/09154b.htm", "https://www.santiebeati.it/dettaglio/25000"]}, "Santos Simón y Judas Tadeo": {"vida": "Simón, llamado 'el Cananeo' o 'el Zelote', y Judas Tadeo, 'hermano de Santiago' y autor de la breve Carta de Judas, fueron elegidos por Jesús entre los Doce. En la Última Cena Judas preguntó al Señor por qué se manifestaría solo a los discípulos (Jn 14,22). Según una tradición antigua recogida en Occidente, ambos predicaron juntos en Persia y allí murieron mártires: Simón aserrado y Judas muerto a golpes de maza o hacha. Por eso la Iglesia latina los celebra juntos el 28 de octubre. San Judas Tadeo es muy invocado en los casos difíciles.", "patrono": "San Judas Tadeo: causas difíciles y desesperadas; San Simón: leñadores y curtidores.", "reliquia": "Sus reliquias se veneran desde la Edad Media en San Pedro; en 1605 fueron colocadas bajo el altar de San José, en el crucero izquierdo, dentro de un sarcófago antiguo. No se ven. Otras partes se veneran en Toulouse y en otros lugares; la atribución es de tradición antigua.", "porQue": "Su fiesta es el 28 de octubre, justo durante tu estadía: ese día hay una celebración especial en el altar de San José, y podés pedirle a San Judas por las causas difíciles.", "oracion": "San Judas Tadeo y San Simón, rueguen por nosotros: intercedan en las causas difíciles y guárdennos fieles al Evangelio.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "El altar de San José está en el crucero izquierdo, con la imagen del santo con el Niño; el 28 de octubre conviene ir temprano."}], "fuentes": ["https://www.newadvent.org/cathen/08542a.htm", "https://www.basilicasanpietro.va/it/orari"]}, "San Gregorio Magno": {"vida": "Nació en Roma hacia el 540 en una familia senatorial y fue prefecto de la ciudad, pero dejó todo para hacerse monje en su casa del Celio. Fue diácono y legado papal en Constantinopla, y en 590 fue elegido Papa en plena peste, sequía y amenaza lombarda. Organizó la ayuda a los pobres, negoció con los lombardos y envió a san Agustín de Canterbury a evangelizar Inglaterra en 596. Escribió la 'Regla pastoral', los 'Diálogos' y las 'Morales sobre Job', y dejó su nombre al canto gregoriano. Murió el 12 de marzo del 604; es Doctor de la Iglesia y se llamó a sí mismo 'siervo de los siervos de Dios'.", "patrono": "Músicos y cantores; maestros y estudiantes; Inglaterra; invocado contra la peste.", "reliquia": "Fue sepultado en el pórtico de la antigua basílica vaticana. En 1606 Pablo V trasladó sus restos bajo el altar de la Capilla Clementina, en la nave izquierda, cuyo retablo es un mosaico del 'milagro del corporal'. Los restos no se ven. La atribución es firme, con traslaciones documentadas.", "porQue": "Es el Papa de las misas gregorianas y del canto gregoriano: un lugar especial para rezar por los difuntos. La capilla está justo encima de la tumba de Pedro.", "oracion": "San Gregorio Magno, ruega por nosotros y por las almas del purgatorio.", "practico": [{"iglesia": "Basílica de San Pedro", "horario": "7:00-20:00 todos los días (último acceso 19:15; horario vigente desde el 1/6/2026)", "entrada": "gratis (control de seguridad; la fila puede ser larga)", "consejo": "La Capilla Clementina está al fondo de la nave izquierda, junto al altar de la Transfiguración (donde está Inocencio XI): podés rezar ante los dos juntos."}], "fuentes": ["https://www.newadvent.org/cathen/06780a.htm", "https://www.basilicasanpietro.va/it/orari"]}, "Beato Juan Pablo I": {"vida": "Albino Luciani nació en 1912 en Forno di Canale (Belluno), hijo de un obrero socialista, y fue sacerdote, obispo de Vittorio Veneto y patriarca de Venecia. Eligió como lema 'Humilitas' y se destacó por su catequesis sencilla y cálida. Elegido Papa el 26 de agosto de 1978, tomó el doble nombre de sus dos antecesores. Murió repentinamente el 28 de septiembre de 1978, tras solo 33 días de pontificado, por lo que lo llamaron 'el Papa de la sonrisa'. Francisco lo beatificó el 4 de septiembre de 2022.", "patrono": "— (invocado como modelo de humildad y de catequesis sencilla)", "reliquia": "Fue sepultado en 1978 en las Grutas Vaticanas, bajo la basílica, en un sarcófago de mármol. No se ve el cuerpo sino el sarcófago con su nombre. Atribución plenamente segura.", "porQue": "Es un beato muy reciente; en las Grutas rezás en el mismo recorrido junto a Benedicto XVI y a muchos otros Papas, a pocos metros de la tumba de Pedro.", "oracion": "Beato Juan Pablo I, ruega por nosotros: danos humildad y alegría en la fe.", "practico": [{"iglesia": "Basílica de San Pedro, Grutas Vaticanas", "horario": "verificar (las Grutas abren en horario más reducido que la basílica y cierran durante algunas celebraciones)", "entrada": "gratis", "consejo": "La entrada a las Grutas suele estar junto al pilar de San Andrés, dentro de la basílica; el recorrido es de un solo sentido y sale hacia el pórtico, así que visitalas al final."}], "fuentes": ["https://www.basilicasanpietro.va/it/orari", "https://www.santiebeati.it/dettaglio/90027", "https://www.causesanti.va/it/santi-e-beati/giovanni-paolo-i-albino-luciani.html"]}, "San Pablo": {"vida": "Saulo de Tarso, judío fariseo y ciudadano romano, persiguió a los cristianos hasta que Cristo resucitado se le apareció en el camino de Damasco. Convertido, se volvió el Apóstol de los gentiles: tres grandes viajes misioneros por Asia Menor y Grecia y catorce cartas del Nuevo Testamento que llevan su nombre. Detenido en Jerusalén, apeló al César y fue llevado a Roma. Según la tradición murió decapitado en la vía Ostiense, en el lugar llamado Tre Fontane, hacia el año 67, bajo Nerón. Fue sepultado en una necrópolis donde Constantino levantó la basílica.", "patrono": "Misioneros, teólogos, predicadores y periodistas; Malta; invocado contra las mordeduras de serpiente.", "reliquia": "San Pablo Extramuros: bajo el altar papal está el sarcófago del siglo IV con la inscripción 'PAULO APOSTOLO MART'; desde 2006 se ve a través de una ventana en la confesión. En 2009 Benedicto XVI anunció que un sondeo había hallado un tejido de lino púrpura con lentejuelas de oro, incienso y fragmentos óseos datados entre los siglos I y II, lo que confirma la tradición. En la misma confesión se venera la cadena atribuida a su prisión. Letrán: el busto-relicario de su cabeza en el ciborio es de tradición medieval. San Sebastián: recuerdo de su sepultura temporal hacia el 258 (tradición apoyada por grafitos antiguos).", "porQue": "En San Pablo se ve el sarcófago mismo del Apóstol y su cadena; y la basílica es una de las más impresionantes de Roma, con los retratos de todos los Papas.", "oracion": "San Pablo apóstol, ruega por nosotros: danos celo por la salvación de las almas.", "practico": [{"iglesia": "San Juan de Letrán", "horario": "7:00-18:30 todos los días", "entrada": "gratis", "consejo": "Los bustos están arriba en el ciborio gótico sobre el altar papal: Pedro y Pablo lado a lado."}, {"iglesia": "San Sebastián Extramuros", "horario": "verificar", "entrada": "gratis (catacumbas pagas con guía)", "consejo": "Pedí ver en las catacumbas la 'triclia' con grafitos que invocan a Pedro y Pablo."}, {"iglesia": "San Pablo Extramuros (San Paolo fuori le Mura)", "horario": "7:00-18:30 todos los días (claustro 8:00-18:00)", "entrada": "gratis (claustro y área arqueológica 4 €)", "consejo": "Bajá a la confesión delante del altar papal para ver el sarcófago y la cadena; queda en metro B (estación Basilica S. Paolo)."}], "fuentes": ["https://basilicasanpaolo.org/orari/", "https://www.newadvent.org/cathen/11567b.htm"]}, "San Matías": {"vida": "Discípulo de Jesús desde el bautismo en el Jordán hasta la Ascensión, Matías fue elegido por sorteo para ocupar el lugar de Judas Iscariote entre los Doce (Hechos 1,15-26). Es el único apóstol no llamado directamente por Jesús en su vida terrena, sino elegido por la Iglesia en oración. Las noticias sobre su misión son inciertas: se habla de Judea, Capadocia o Etiopía. Una tradición dice que murió mártir en Jerusalén, apedreado y decapitado. Su fiesta es el 14 de mayo (el 24 de febrero en el calendario tradicional).", "patrono": "Carniceros, carpinteros, sastres e ingenieros; invocado contra la viruela; diócesis de Tréveris.", "reliquia": "Según la tradición, santa Elena llevó sus restos a Occidente; una parte quedó en Roma y otra en Tréveris (Alemania), donde la abadía de San Matías afirma tener su cuerpo, al igual que Padua. En Santa María la Mayor sus reliquias se conservan en la urna de pórfido bajo el altar papal, junto a la confesión. Se ve la urna, no los huesos. La atribución es de tradición antigua y hay varias iglesias que la reclaman.", "porQue": "Rezar ante un apóstol en la basílica mariana más antigua de Occidente, a pocos pasos de la reliquia del pesebre de Belén.", "oracion": "San Matías apóstol, ruega por nosotros: alcanzanos fidelidad en nuestra vocación.", "practico": [{"iglesia": "Santa María la Mayor (Santa Maria Maggiore)", "horario": "7:00-19:00 aprox. (verificar)", "entrada": "gratis", "consejo": "Bajá a la confesión delante del altar papal: la urna de pórfido y el relicario del pesebre están en el mismo lugar; vestimenta con hombros y rodillas cubiertos."}], "fuentes": ["https://www.iubilaeum2025.va/it/pellegrinaggio/cammini-giubilari-dentro-roma/basiliche-papali/Basilica-Santa-Maria-Maggiore.html", "https://www.santiebeati.it/dettaglio/21050", "https://www.vaticannews.va/it/santo-del-giorno/05/14/san-mattia--apostolo.html"]}, "San Jerónimo": {"vida": "Nació hacia el 347 en Estridón, en Dalmacia, estudió en Roma y fue bautizado allí. Vivió como ermitaño en el desierto de Calcis, aprendió hebreo y fue ordenado sacerdote. Entre 382 y 385 fue secretario del papa san Dámaso en Roma, que le encargó revisar la traducción latina de la Biblia. Se estableció en Belén, donde tradujo casi toda la Escritura del hebreo y del griego: la Vulgata, texto oficial de la Iglesia latina durante siglos. Murió en Belén el 30 de septiembre del 420; es Doctor de la Iglesia.", "patrono": "Traductores, biblistas, bibliotecarios y estudiantes de Sagrada Escritura.", "reliquia": "Fue sepultado en Belén, junto a la gruta de la Natividad. Según la tradición, sus restos fueron llevados a Roma (se habla del siglo XIII) y depositados en Santa María la Mayor, en el ámbito de la cripta del Pesebre, bajo la actual Capilla Sixtina. No se ven. La historia del traslado es tradición no documentada con certeza, y su ubicación exacta dentro de la basílica se discute.", "porQue": "Jerónimo pasó su vida junto al pesebre de Belén y hoy descansa, según la tradición, junto a la reliquia del pesebre en la 'Belén de Occidente'.", "oracion": "San Jerónimo, ruega por nosotros: danos amor a la Sagrada Escritura.", "practico": [{"iglesia": "Santa María la Mayor", "horario": "7:00-19:00 aprox. (verificar)", "entrada": "gratis", "consejo": "La cripta del Pesebre está bajo la Capilla Sixtina (crucero derecho); a veces se abre al público solo en ciertos horarios, preguntá a los custodios."}], "fuentes": ["https://www.newadvent.org/cathen/08341a.htm", "https://www.iubilaeum2025.va/it/pellegrinaggio/cammini-giubilari-dentro-roma/basiliche-papali/Basilica-Santa-Maria-Maggiore.html"]}, "San Pío V": {"vida": "Antonio Ghislieri nació en 1504 en Bosco, cerca de Alessandria (Piamonte), de familia humilde, y fue fraile dominico con el nombre de Michele. Fue inquisidor, obispo y cardenal, conocido por su austeridad. Elegido Papa en 1566, aplicó con energía el Concilio de Trento: publicó el Catecismo Romano, el Breviario (1568) y el Misal Romano (1570), base de la Misa tradicional. Organizó la Liga Santa que venció a los turcos en Lepanto el 7 de octubre de 1571, victoria que atribuyó al Rosario e instituyó su fiesta. Murió en 1572 y fue canonizado en 1712.", "patrono": "— (invocado por la Misa tradicional y el Rosario; patrono de Bosco Marengo)", "reliquia": "Primero fue sepultado en San Pedro; en 1588 Sixto V lo trasladó a la Capilla Sixtina de Santa María la Mayor, en el crucero derecho, al monumento fúnebre que él mismo le hizo levantar. Su cuerpo está en una urna de bronce dorado y cristal, revestido con hábito pontificio, con el rostro cubierto por una máscara de plata. Se ve con claridad; atribución segura.", "porQue": "Es el Papa del Misal tradicional y de Lepanto: para un católico tradicional, rezar ante su cuerpo es una de las visitas más significativas de Roma. En la misma basílica está la tumba del papa Francisco (nave izquierda).", "oracion": "San Pío V, ruega por nosotros: guarda la santa Misa y alcanzanos la victoria por el Rosario.", "practico": [{"iglesia": "Santa María la Mayor", "horario": "7:00-19:00 aprox. (verificar)", "entrada": "gratis", "consejo": "La Capilla Sixtina está en el crucero derecho, frente a la Capilla Paulina de la Salus Populi Romani; rezá el Rosario ante la urna."}], "fuentes": ["https://www.newadvent.org/cathen/12130a.htm", "https://www.iubilaeum2025.va/it/pellegrinaggio/cammini-giubilari-dentro-roma/basiliche-papali/Basilica-Santa-Maria-Maggiore.html"]}, "San Lorenzo": {"vida": "Nacido probablemente en Hispania (Huesca, según la tradición), fue uno de los siete diáconos de Roma y encargado de los bienes de la Iglesia y de la ayuda a los pobres bajo el papa Sixto II. Durante la persecución de Valeriano, cuando le exigieron entregar los tesoros de la Iglesia, presentó a los pobres y enfermos diciendo: 'Estos son los tesoros de la Iglesia'. Murió mártir el 10 de agosto del 258, pocos días después del Papa. La tradición, recogida por san Ambrosio y Prudencio, dice que fue quemado en una parrilla y que bromeó: 'Denme vuelta, que de este lado ya estoy hecho'. Es uno de los mártires más venerados de Roma.", "patrono": "Diáconos, cocineros, bibliotecarios, bomberos y los pobres; ciudad de Roma (copatrono); Huesca.", "reliquia": "San Lorenzo Extramuros: su tumba está en la confesión bajo el presbiterio, junto a la de san Esteban, detrás de una reja; se ve el sepulcro, no los restos. Allí mismo se venera una losa de mármol con manchas que la tradición atribuye a su cuerpo quemado, colocado sobre ella tras el martirio. San Lorenzo in Lucina: se conserva un relicario con parte de la parrilla de su martirio, en la capilla de San Lorenzo (primera a la derecha). La tumba es tradición muy antigua y firme; la losa y la parrilla son tradición.", "porQue": "Visitar la tumba de uno de los mártires más amados de la Iglesia en la basílica constantiniana que la protege, y luego ver la parrilla en el centro de Roma.", "oracion": "San Lorenzo, ruega por nosotros: danos amor a los pobres y fortaleza en la prueba.", "practico": [{"iglesia": "San Lorenzo Extramuros", "horario": "verificar (misas lunes a sábado 8:00 y 18:30)", "entrada": "gratis", "consejo": "La basílica está junto al cementerio del Verano; hay tranvía 19 y bus. Buscá la losa en la zona de la cripta y pedí indicación al sacristán."}, {"iglesia": "San Lorenzo in Lucina", "horario": "verificar (misas lunes a sábado 11:00 y 18:30)", "entrada": "gratis", "consejo": "Está a pasos de Via del Corso y de la Piazza di Spagna; el relicario de la parrilla está en la primera capilla a la derecha."}, {"iglesia": "San Lorenzo Extramuros (San Lorenzo fuori le Mura)", "horario": "verificar (misas lunes a sábado 8:00 y 18:30)", "entrada": "gratis", "consejo": "La confesión se ve bajando unos escalones delante del presbiterio; mirá el mosaico del arco triunfal del siglo VI."}], "fuentes": ["https://www.turismoroma.it/en/places/basilica-san-lorenzo-fuori-le-mura", "https://www.turismoroma.it/en/places/basilica-san-lorenzo-lucina", "https://www.pnac.org/station-churches/week-3/sunday-san-lorenzo-fuori-le-mura/", "https://www.newadvent.org/cathen/09089a.htm"]}, "San Esteban protomártir": {"vida": "Fue uno de los siete diáconos elegidos por los Apóstoles para el servicio de las mesas y de los pobres en Jerusalén (Hechos 6). 'Lleno de gracia y de poder', predicaba con sabiduría y fue acusado ante el Sanedrín de blasfemia. Tras un largo discurso vio 'los cielos abiertos y al Hijo del hombre a la derecha de Dios', y fue apedreado fuera de la ciudad hacia el año 34-36. Murió perdonando a sus verdugos, en presencia de Saulo, el futuro san Pablo. Es el primer mártir de la Iglesia.", "patrono": "Diáconos, albañiles y canteros; invocado contra los dolores de cabeza.", "reliquia": "Su cuerpo fue hallado en 415 en Kafar Gamala, cerca de Jerusalén, por el sacerdote Luciano, y sus reliquias se difundieron por todo el mundo cristiano. Según la tradición, el papa Pelagio II (s. VI) llevó su cuerpo a San Lorenzo Extramuros y lo colocó en la misma tumba de san Lorenzo; la leyenda dice que Lorenzo 'se corrió' para hacerle lugar. Se ve la tumba de la confesión, no los restos. Es tradición medieval.", "porQue": "Rezar ante la tumba compartida de los dos grandes diáconos mártires, el primero de Jerusalén y el más célebre de Roma.", "oracion": "San Esteban, ruega por nosotros: enséñanos a perdonar a quienes nos hacen mal.", "practico": [{"iglesia": "San Lorenzo Extramuros", "horario": "verificar (misas lunes a sábado 8:00 y 18:30)", "entrada": "gratis", "consejo": "Es la misma tumba que la de San Lorenzo: con una sola visita venerás a los dos."}], "fuentes": ["https://www.pnac.org/station-churches/week-3/sunday-san-lorenzo-fuori-le-mura/", "https://it.wikipedia.org/wiki/Basilica_di_San_Lorenzo_fuori_le_mura", "https://www.newadvent.org/cathen/14286a.htm"]}, "Beato Pío IX": {"vida": "Giovanni Maria Mastai Ferretti nació en Senigallia en 1792 y fue elegido Papa en 1846; su pontificado de casi 32 años es el más largo después del de san Pedro. En 1854 proclamó el dogma de la Inmaculada Concepción y en 1864 publicó el Syllabus contra los errores del liberalismo. Convocó el Concilio Vaticano I, que definió la infalibilidad pontificia en 1870. Ese mismo año perdió Roma y los Estados Pontificios y vivió como 'prisionero del Vaticano'. Murió en 1878 y Juan Pablo II lo beatificó el 3 de septiembre de 2000.", "patrono": "— (invocado especialmente en devoción a la Inmaculada Concepción)", "reliquia": "Por su voluntad fue sepultado en San Lorenzo Extramuros; el traslado nocturno en 1881 fue atacado por anticlericales que intentaron arrojar el féretro al Tíber. Reposa en la capilla funeraria construida en el antiguo nártex, detrás del presbiterio, en un sarcófago con frente de cristal donde se ve el cuerpo revestido. A fines de 2011 fue retirado temporalmente para un reconocimiento canónico y luego repuesto. Atribución plenamente segura.", "porQue": "Es el Papa de la Inmaculada y del Vaticano I; su capilla, decorada con mosaicos donados por católicos de todo el mundo, es un monumento de fidelidad a Roma.", "oracion": "Beato Pío IX, ruega por nosotros: danos amor a la Inmaculada y fidelidad al Papa.", "practico": [{"iglesia": "San Lorenzo Extramuros", "horario": "verificar (misas lunes a sábado 8:00 y 18:30)", "entrada": "gratis", "consejo": "Se accede a la capilla por detrás del presbiterio; si está cerrada, preguntá a los frailes capuchinos que atienden la basílica."}], "fuentes": ["https://www.turismoroma.it/en/places/basilica-san-lorenzo-fuori-le-mura", "https://blog.messainlatino.it/2011/12/dove-sono-finite-le-reliquie-del-beato.html"]}, "San Sebastián": {"vida": "Oficial de la guardia pretoriana bajo Diocleciano, según su Pasión del siglo V, sostenía en secreto a los cristianos presos. Descubierto, fue atado a un poste y asaeteado por arqueros y dado por muerto; la piadosa Irene lo curó. Se presentó de nuevo ante el emperador para reprocharle su crueldad y fue muerto a golpes de palo hacia el año 288; su cuerpo fue arrojado a la Cloaca Máxima. Una matrona, Lucina, lo recuperó y lo sepultó en las catacumbas de la Vía Appia. La existencia del mártir y su culto son antiquísimos (figura en la Depositio martyrum del 354); los detalles de la Pasión son tradición.", "patrono": "Soldados, arqueros, atletas y deportistas; invocado contra la peste y las epidemias; copatrono de Roma.", "reliquia": "San Sebastián Extramuros: su cuerpo está bajo el altar de la capilla de San Sebastián (primera a la izquierda), bajo la estatua yacente de Antonio Giorgetti; la urna fue devuelta allí en 1218 por Honorio III tras siglos en San Pedro. En la capilla de las reliquias se ve una de las flechas y parte de la columna de su martirio. Quattro Coronati: el papa León IV (s. IX) colocó allí su cabeza en un relicario; la fuente de la basílica dice que se conserva en el relicario, pero no hay confirmación de que esté siempre expuesta a la vista, conviene preguntar. Las atribuciones son de tradición antigua.", "porQue": "Su tumba está sobre las catacumbas donde fue sepultado, en la Vía Appia; y la flecha y la columna hacen muy concreto su martirio.", "oracion": "San Sebastián, ruega por nosotros: líbranos de la peste y de toda enfermedad, y danos valor para dar testimonio.", "practico": [{"iglesia": "Santi Quattro Coronati", "horario": "verificar (misas: días de semana 19:00; domingo 11:00; oratorio de San Silvestre lun-sáb 9:30-12:00)", "entrada": "gratis (el oratorio de San Silvestre pide una pequeña ofrenda)", "consejo": "Es un monasterio de monjas agustinas de clausura; tocá el timbre para ver el oratorio de San Silvestre y preguntá por la cabeza de San Sebastián."}, {"iglesia": "San Sebastián Extramuros (San Sebastiano fuori le Mura)", "horario": "verificar", "entrada": "gratis (catacumbas pagas, visita guiada)", "consejo": "Combiná con las catacumbas y el busto 'Salvator Mundi', última obra de Bernini, que está en la misma basílica."}], "fuentes": ["https://www.vaticannews.va/it/chiesa/news/2025-04/san-sebastiano-fuori-le-mura-giubileo-arte-fede-storia.html", "https://www.turismoroma.it/en/places/basilica-san-sebastiano-outside-walls", "https://it.wikipedia.org/wiki/Basilica_dei_Santi_Quattro_Coronati", "https://www.newadvent.org/cathen/13667b.htm"]}, "Santo Tomás apóstol": {"vida": "Llamado Dídimo ('mellizo'), fue uno de los Doce. Cuando Jesús decidió ir a Betania dijo con valentía: 'Vayamos también nosotros a morir con él'. Ausente en la primera aparición del Resucitado, dudó, pero ocho días después, ante las llagas, hizo la confesión más alta del Evangelio: '¡Señor mío y Dios mío!'. Según una tradición antigua evangelizó Persia y la India, donde murió mártir atravesado por una lanza cerca de Mylapore (Chennai) hacia el año 72. Los cristianos de la India lo veneran como su padre en la fe.", "patrono": "India; arquitectos, albañiles y constructores; invocado por quienes luchan con dudas de fe.", "reliquia": "En la Capilla de las Reliquias de la Pasión de Santa Cruz en Jerusalén se conserva una falange de su dedo, que la tradición identifica con el que tocó la llaga del costado de Cristo. Está en un relicario de cristal dentro de la vitrina junto a los fragmentos de la Cruz, un clavo y el Titulus Crucis; las reliquias se ubican allí desde 1931. Su cuerpo, según la tradición, está en Ortona (Italia) desde 1258. La atribución es tradición.", "porQue": "Ver juntos el 'dedo que tocó las llagas' y las reliquias de la Pasión es una meditación única sobre la fe en el Resucitado.", "oracion": "Santo Tomás apóstol, ruega por nosotros: 'Señor mío y Dios mío', aumenta nuestra fe.", "practico": [{"iglesia": "Santa Cruz en Jerusalén", "horario": "lun-vie 8:00-12:45 y 15:30-19:30; sáb, dom y feriados 7:30-19:30", "entrada": "gratis", "consejo": "La Capilla de las Reliquias está al final de un pasillo a la izquierda del altar mayor y cierra 15 minutos antes de las misas; queda cerca de San Juan de Letrán, ideal para combinar."}], "fuentes": ["https://www.santacroceroma.it/it/features-2/reliquie.html", "https://www.fanpage.it/roma/basilica-di-santa-croce-in-gerusalemme-a-roma-gli-orari-delle-visite-per-il-giubileo-2025/", "https://www.newadvent.org/cathen/14658b.htm"]}, "San Ignacio de Loyola": {"vida": "Íñigo López de Loyola nació en 1491 en Guipúzcoa y fue caballero al servicio del virrey de Navarra. Herido en una pierna en la defensa de Pamplona en 1521, durante la convalecencia leyó vidas de Cristo y de los santos y se convirtió. En Manresa, en oración y penitencia, escribió los Ejercicios Espirituales. Estudió en París, donde reunió a sus primeros compañeros, y en 1540 Pablo III aprobó la Compañía de Jesús, puesta al servicio del Papa. Murió en Roma el 31 de julio de 1556 y fue canonizado en 1622 junto a san Francisco Javier.", "patrono": "Compañía de Jesús; ejercicios espirituales y retiros; soldados; Guipúzcoa y Vizcaya.", "reliquia": "Fue sepultado en la primitiva iglesia jesuita y en 1587 trasladado al Gesù. Desde fines del siglo XVII su cuerpo descansa en una urna de bronce dorado bajo el altar de su capilla, obra de Andrea Pozzo (crucero izquierdo). Se ve la urna, no el cuerpo. Atribución segura.", "porQue": "La capilla es una de las más ricas del barroco romano. Al lado están las 'Camerette', las habitaciones donde vivió y murió el santo, que se pueden visitar.", "oracion": "San Ignacio de Loyola, ruega por nosotros: 'Tomad, Señor, y recibid toda mi libertad'; todo a la mayor gloria de Dios.", "practico": [{"iglesia": "Il Gesù (Chiesa del Gesù)", "horario": "horario de invierno (desde fines de septiembre): lun-vie 7:30-12:30 y 16:30-19:30; sáb 7:30-12:30 y 16:30-20:00; dom 8:30-13:30 y 16:30-20:00", "entrada": "gratis", "consejo": "Todos los días a las 17:30 suele hacerse la 'máquina barroca' que baja el cuadro y descubre la estatua del santo (verificar); las Camerette tienen horario propio, preguntá en la portería."}], "fuentes": ["https://www.chiesadelgesu.org/contatti/orari/", "https://www.newadvent.org/cathen/07639c.htm"]}, "San Francisco Javier": {"vida": "Nació en 1506 en el castillo de Javier, Navarra. Estudiando en París conoció a San Ignacio de Loyola y fue uno de los siete primeros compañeros que fundaron la Compañía de Jesús. En 1541 partió como misionero a la India por pedido del rey de Portugal y evangelizó Goa, el sur de la India, las Molucas y Japón, bautizando a miles. Murió agotado y con fiebre el 3 de diciembre de 1552 en la isla de Sancián, frente a China, a la que soñaba entrar. Fue canonizado en 1622 junto con San Ignacio y es considerado el mayor misionero después de San Pablo.", "patrono": "Patrono de las misiones (junto con Santa Teresita), de Navarra, de Japón y del Oriente.", "reliquia": "Su cuerpo reposa en la basílica del Bom Jesús de Goa (India). El antebrazo derecho, con el que bautizó y bendijo a multitudes, fue separado por orden del padre general Claudio Acquaviva y llegó a Roma en 1614. Se conserva en un relicario de plata sobre el altar de su capilla, en el crucero derecho del Gesù, y se ve a través del cristal. Es una reliquia de atribución firme y documentada, que ha viajado en peregrinación a varios países.", "porQue": "Es la única reliquia corporal importante de Javier fuera de Asia y está a pocos metros de la tumba de San Ignacio: en una sola iglesia se reza ante los dos fundadores de las misiones jesuitas.", "oracion": "San Francisco Javier, ruega por nosotros; alcánzanos celo por las almas y que la fe llegue a quienes aún no conocen a Cristo.", "practico": [{"iglesia": "Il Gesù", "horario": "Lun-sáb 7:30-12:30 y 16:00-19:30; dom y feriados 7:45-13:30 y 16:00-20:00. Misas diarias 7:45, 10, 11, 12 y 19.", "entrada": "gratis", "consejo": "El relicario está en lo alto del altar del crucero derecho; conviene mirar con calma desde la baranda y, enfrente, visitar la capilla de San Ignacio en el crucero izquierdo."}], "fuentes": ["https://www.chiesadelgesu.org/", "https://ewtn.it/2024/12/03/la-reliquia-del-braccio-di-san-francesco-saverio-custodita-a-roma/", "https://www.newadvent.org/cathen/06233b.htm"]}, "San José Pignatelli": {"vida": "Nació en Zaragoza en 1737, en una familia noble de origen napolitano, y entró joven en la Compañía de Jesús. En 1767 Carlos III expulsó a los jesuitas de España y Pignatelli, aunque enfermo, sostuvo a sus hermanos en el exilio en Córcega y en Italia. Tras la supresión de la Compañía en 1773 vivió en Bolonia y dedicó su vida a mantener unidos a los jesuitas dispersos, obrando con discreción y obediencia a la Iglesia. Fue el gran artífice de su restauración en Italia y murió en Roma el 15 de noviembre de 1811, tres años antes de que Pío VII restableciera la orden. Pío XII lo canonizó en 1954 y es llamado el 'segundo fundador' de los jesuitas.", "patrono": "— (venerado como restaurador de la Compañía de Jesús).", "reliquia": "Sus reliquias se guardan en una urna de bronce bajo el altar de la Capilla de la Pasión, segunda a la derecha del Gesù, según la descripción oficial de la iglesia. No se ve el cuerpo: lo que el peregrino ve es la urna cerrada. Sobre el mismo altar hay otro relicario con el brazo derecho de San Andrés Bobola, mártir jesuita polaco.", "porQue": "Es la tumba del santo que salvó a la Compañía en su peor crisis; ideal para rezar por la fidelidad de las órdenes religiosas en tiempos difíciles. En la misma capilla se venera además el brazo de San Andrés Bobola.", "oracion": "San José Pignatelli, ruega por nosotros; alcánzanos fidelidad y paciencia en las pruebas de la Iglesia.", "practico": [{"iglesia": "Il Gesù", "horario": "Lun-sáb 7:30-12:30 y 16:00-19:30; dom y feriados 7:45-13:30 y 16:00-20:00. Misas diarias 7:45, 10, 11, 12 y 19.", "entrada": "gratis", "consejo": "Es la segunda capilla a la derecha al entrar; se puede combinar con el brazo de San Francisco Javier en el crucero derecho de la misma iglesia."}], "fuentes": ["https://www.chiesadelgesu.org/la-chiesa/visita-virtuale/cappella-della-passione/", "https://www.vaticannews.va/it/santo-del-giorno/11/15/san-giuseppe-pignatelli--sacerdote-gesuita.html", "https://it.cathopedia.org/wiki/San_Giuseppe_Pignatelli"]}, "San Luis Gonzaga": {"vida": "Nació en 1568 en Castiglione delle Stiviere, primogénito del marqués Gonzaga, destinado a una carrera militar y cortesana. Renunció a su herencia y en 1585 entró en el noviciado jesuita de Roma, venciendo la fuerte oposición de su padre; su confesor fue San Roberto Belarmino. Durante la epidemia de 1591 cargó en brazos a enfermos abandonados por las calles de Roma, se contagió y murió el 21 de junio de 1591, con 23 años. Fue canonizado en 1726 como modelo de pureza y de caridad heroica.", "patrono": "Patrono de la juventud católica, de los estudiantes y de los enfermos de sida (1991).", "reliquia": "Sus restos reposan en una urna de lapislázuli con adornos de bronce dorado, detrás de un cristal, bajo el altar de la capilla Lancellotti en el crucero derecho de Sant'Ignazio; encima hay un gran relieve de mármol de su gloria (Pierre Legros, fines del s. XVII). La cabeza no está en Roma: se venera en la basílica de San Luis en Castiglione delle Stiviere. La atribución es firme y continua desde su muerte.", "porQue": "Es un lugar muy querido para rezar por los jóvenes y los estudiantes de la familia; además, en la misma iglesia están San Juan Berchmans y su confesor, San Roberto Belarmino.", "oracion": "San Luis Gonzaga, ruega por nosotros; guarda la pureza de los jóvenes y danos caridad con los enfermos.", "practico": [{"iglesia": "Sant'Ignazio", "horario": "Todos los días 9:00-23:30 (horario corrido). Misa diaria 18:30; dom también 11:30.", "entrada": "gratis (la visita es libre; no pagar a 'guías' que cobren la entrada)", "consejo": "La urna está en el crucero derecho; aprovechar para ver la falsa cúpula de Pozzo desde el disco del piso, y evitar la hora de la misa de 18:30 para rezar tranquilo."}], "fuentes": ["https://chiesasantignazio.it/opere-arte-chiesa/", "https://chiesasantignazio.it/orari-contatti/", "https://romanchurches.fandom.com/wiki/Sant%27Ignazio_di_Loyola_a_Campo_Marzio"]}, "San Juan Berchmans": {"vida": "Nació en 1599 en Diest, en el Brabante flamenco, hijo de un zapatero. Entró en la Compañía de Jesús en Malinas en 1616 y fue enviado a estudiar filosofía al Colegio Romano. Se santificó en lo pequeño: su lema era hacer extraordinariamente bien las cosas ordinarias, con alegría y exactitud en la regla. Murió en Roma el 13 de agosto de 1621, a los 22 años, apretando el crucifijo, el rosario y el libro de reglas. León XIII lo canonizó en 1888.", "patrono": "Patrono de los monaguillos y acólitos, y de los estudiantes y jóvenes religiosos.", "reliquia": "Murió en el Colegio Romano, junto a la actual iglesia, y sus restos se veneran bajo el altar de la capilla Ludovisi o de la Anunciación, en el crucero izquierdo de Sant'Ignazio (retablo en relieve de Filippo della Valle). Lo que se ve es la urna o sepulcro bajo el altar, no el cuerpo. La atribución es firme: murió a pocos metros de allí y su culto fue continuo.", "porQue": "Queda justo enfrente de San Luis Gonzaga: dos jóvenes jesuitas santos, uno a cada lado del crucero, muy adecuados para encomendar a hijos, nietos y monaguillos.", "oracion": "San Juan Berchmans, ruega por nosotros; enséñanos a santificarnos en los deberes de cada día.", "practico": [{"iglesia": "Sant'Ignazio", "horario": "Todos los días 9:00-23:30 (horario corrido). Misa diaria 18:30; dom también 11:30.", "entrada": "gratis", "consejo": "Está en el crucero izquierdo, frente a San Luis; la iglesia abre hasta tarde, así que es buena visita al final del día."}], "fuentes": ["https://chiesasantignazio.it/opere-arte-chiesa/", "https://romanchurches.fandom.com/wiki/Sant%27Ignazio_di_Loyola_a_Campo_Marzio"]}, "San Roberto Belarmino": {"vida": "Nació en Montepulciano (Toscana) en 1542, sobrino del papa Marcelo II, y entró en la Compañía de Jesús en 1560. Enseñó teología en Lovaina y en el Colegio Romano, donde escribió las 'Controversias', la gran defensa de la fe católica frente al protestantismo, y un catecismo que se usó durante siglos. Fue cardenal desde 1599 y arzobispo de Capua, pero vivió con austeridad y dio todo a los pobres. Murió en Roma el 17 de septiembre de 1621. Pío XI lo canonizó en 1930 y lo declaró Doctor de la Iglesia en 1931.", "patrono": "Patrono de los catequistas y de los canonistas.", "reliquia": "Fue sepultado en el Gesù y en 1923, tras su beatificación, sus restos fueron trasladados a Sant'Ignazio, junto a su discípulo San Luis Gonzaga. Se veneran bajo el altar de la capilla de San Joaquín (tercera a la derecha): los huesos están dentro de una figura yacente vestida de cardenal, visible tras un cristal. Atribución firme.", "porQue": "Permite rezar ante un Doctor de la Iglesia cuyo catecismo formó a generaciones de católicos, a pocos pasos del joven santo al que guió espiritualmente.", "oracion": "San Roberto Belarmino, ruega por nosotros; alcánzanos amor a la verdad católica y fortaleza para defenderla.", "practico": [{"iglesia": "Sant'Ignazio", "horario": "Todos los días 9:00-23:30 (horario corrido). Misa diaria 18:30; dom también 11:30.", "entrada": "gratis", "consejo": "Es la tercera capilla de la nave derecha; la figura con ropa roja de cardenal se ve bien bajo el altar, conviene acercarse con respeto si hay alguien rezando."}], "fuentes": ["https://chiesasantignazio.it/opere-arte-chiesa/", "https://romanchurches.fandom.com/wiki/Sant%27Ignazio_di_Loyola_a_Campo_Marzio", "https://chiesasantignazio.it/orari-contatti/"]}, "Santa Catalina de Siena": {"vida": "Nació en Siena en 1347, la vigésimo cuarta hija de un tintorero. Terciaria dominica desde joven, unió una intensa vida mística con el servicio a los enfermos y a los condenados. Con cartas y viajes convenció al papa Gregorio XI de dejar Aviñón y volver a Roma en 1377, y trabajó sin descanso por la paz y la unidad de la Iglesia durante el Cisma de Occidente. Murió en Roma el 29 de abril de 1380, a los 33 años, ofreciendo su vida por la Iglesia. Pío II la canonizó en 1461 y San Pablo VI la declaró Doctora de la Iglesia en 1970.", "patrono": "Patrona de Italia (con San Francisco) y copatrona de Europa; también de las enfermeras.", "reliquia": "En Santa María sopra Minerva su cuerpo reposa desde 1855 bajo el altar mayor, en un sarcófago de mármol con su figura yacente (s. XV); la cabeza y un dedo están en Siena. Se ve el sarcófago, no los restos. Detrás de la sacristía se conservan las paredes de la habitación donde murió, trasladadas allí en 1637. En el monasterio dominico de Santa María del Rosario, en Monte Mario, las monjas de clausura custodian una reliquia que describen como una mano de la santa, junto con reliquias de Santo Domingo; no está expuesta de forma permanente.", "porQue": "La Minerva es el santuario nacional de Santa Catalina: se reza sobre su tumba y en la habitación donde entregó su vida por la Iglesia. Monte Mario suma el icono de la Virgen de San Lucas, de gran antigüedad.", "oracion": "Santa Catalina de Siena, ruega por nosotros; alcánzanos amor al Papa y a la unidad de la Iglesia.", "practico": [{"iglesia": "Santa María sopra Minerva", "horario": "Misas: lun-sáb 18:00; dom 11:00 y 18:00. Horario de visita: verificar (suele abrir mañana y tarde).", "entrada": "gratis", "consejo": "Detrás del obelisco del elefante, a una cuadra del Panteón; la tumba está bajo el altar mayor y a la izquierda está el Cristo de Miguel Ángel. Para ver la habitación de la santa, preguntar en la sacristía."}, {"iglesia": "Santa Maria del Rosario a Monte Mario", "horario": "Misa de lunes a sábado 7:30; domingos 11:00 (la iglesia suele abrir el domingo 10:30-12:30). La reliquia no está expuesta: verificar.", "entrada": "gratis", "consejo": "Es un monasterio de clausura en Via Alberto Cadlolo 51; para venerar la reliquia hay que pedirlo antes a las monjas (tel. 06 35420940, monacheoproma@gmail.com)."}], "fuentes": ["https://www.gliscritti.it/blog/entry/6396", "https://www.vaticannews.va/it/chiesa/news/2020-02/festa-beato-angelico-riapertura-santa-maria-sopra-minerva.html", "https://www.acistampa.com/story/16378/il-monastero-domenicano-da-cui-maria-e-protegge-i-pellegrini-che-vanno-a-san-pietro-16378", "https://romanchurches.fandom.com/wiki/Santa_Maria_del_Rosario_a_Monte_Mario"]}, "Beato Fra Angélico": {"vida": "Guido di Pietro nació hacia 1395 en el Mugello, cerca de Florencia. Entró en los dominicos de Fiesole con el nombre de fray Juan y pintó para rezar: sus frescos del convento de San Marcos en Florencia son una contemplación hecha color. Llamado a Roma, decoró la capilla Nicolina del Vaticano para el papa Nicolás V. Murió en el convento de la Minerva el 18 de febrero de 1455. San Juan Pablo II confirmó su culto como beato en 1982 y en 1984 lo proclamó patrono universal de los artistas.", "patrono": "Patrono universal de los artistas.", "reliquia": "Su sepulcro está en una capilla a la izquierda del presbiterio de la Minerva: una lápida de mármol del s. XV (atribuida a Isaia da Pisa) lo muestra con el hábito dominico, descalzo y con la cabeza sobre un almohadón. Se ve la lápida-sepulcro, no los restos. La tumba es la original desde 1455 y la tradición es continua; la lápida sufrió un acto vandálico en 2018.", "porQue": "Es la tumba del pintor que convirtió la pintura en oración; en la misma iglesia se reza ante Santa Catalina, dos dominicos en un solo lugar.", "oracion": "Beato Fra Angélico, ruega por nosotros; enséñanos a buscar a Dios en la belleza.", "practico": [{"iglesia": "Santa María sopra Minerva", "horario": "Misas: lun-sáb 18:00; dom 11:00 y 18:00. Horario de visita: verificar (suele abrir mañana y tarde).", "entrada": "gratis", "consejo": "La tumba está pasando el altar mayor hacia la izquierda; ir temprano o a media tarde, cuando hay menos grupos."}], "fuentes": ["https://museodisanmarco.blog/2024/02/27/il-beato-angelico-nella-basilica-di-santa-maria-sopra-minerva/", "https://www.santamariasopraminerva.it/it/", "https://www.turismoroma.it/en/places/basilica-santa-maria-sopra-minerva"]}, "San Felipe Neri": {"vida": "Nació en Florencia en 1515 y llegó a Roma hacia 1534, donde vivió como laico pobre, rezando en las catacumbas y ayudando a peregrinos y enfermos. En Pentecostés de 1544, en las catacumbas de San Sebastián, vivió una experiencia mística que, según su testimonio, le dilató el corazón. Ordenado sacerdote en 1551, fundó el Oratorio, una comunidad de sacerdotes seculares que atraía a jóvenes y artistas con oración, música y alegría. Confesor incansable, fue llamado 'el apóstol de Roma' y 'el santo de la alegría'. Murió el 26 de mayo de 1595 y fue canonizado en 1622.", "patrono": "Copatrono de Roma; patrono de los educadores, los oratorios y de la alegría cristiana.", "reliquia": "Su cuerpo reposa desde comienzos del s. XVII en su capilla, a la izquierda del presbiterio de la Chiesa Nuova, la iglesia que él mismo hizo construir. Está en una urna de cristal de fines del s. XIX, vestido con ornamentos sacerdotales, con el rostro cubierto por una máscara de plata y lirios de plata en las manos. La atribución es firme y continua.", "porQue": "Se reza ante el cuerpo del santo en la iglesia que él fundó y junto a las habitaciones donde vivió; pocas visitas en Roma son tan cálidas y familiares.", "oracion": "San Felipe Neri, ruega por nosotros; danos un corazón alegre y humilde en el servicio de Dios.", "practico": [{"iglesia": "Chiesa Nuova (Santa Maria in Vallicella)", "horario": "Lun-sáb 7:30-12:00 y 17:00-19:45; dom y feriados 8:00-12:00 y 17:00-20:00 (verificar). Misas diarias 8, 10 y 19.", "entrada": "gratis", "consejo": "La capilla está a la izquierda del altar mayor; las habitaciones del santo solo se abren en días puntuales, preguntar en la sacristía (tel. 06 6875289)."}], "fuentes": ["https://www.rerumromanarum.com/2025/05/cappella-di-san-filippo-neri-nella.html", "https://www.rome-roma.net/it/chiesa-nuova-santa-maria-in-vallicella/", "https://www.turismoroma.it/en/places/church-santa-maria-vallicella-chiesa-nuova-and-rooms-san-filippo-neri"]}, "San Felipe y Santiago el Menor": {"vida": "Felipe, de Betsaida, fue de los primeros llamados por Jesús y llevó a Natanael al Señor; en la Última Cena le pidió 'muéstranos al Padre'. Según la tradición predicó en Asia Menor y murió mártir en Hierápolis (Frigia), donde en 2011 se identificó su probable tumba. Santiago, hijo de Alfeo, llamado el Menor y 'hermano del Señor', fue según la tradición cabeza de la Iglesia de Jerusalén y se le atribuye la Carta de Santiago. Murió mártir hacia el año 62, arrojado del pináculo del Templo y rematado a palos. La Iglesia los celebra juntos porque sus reliquias fueron depositadas juntas en esta basílica.", "patrono": "Patronos de Montevideo (Uruguay); Santiago es invocado por los farmacéuticos y Felipe por los sombrereros y pasteleros.", "reliquia": "Las reliquias llegaron desde Oriente hacia el año 560, en tiempos del papa Pelagio I, cuando se construyó la basílica. Fueron redescubiertas bajo el altar mayor en 1873 y reconocidas oficialmente en 1879; se colocaron en la cripta construida por Luigi Carimini (1869-1871), inspirada en las catacumbas. En 2016 fueron estudiadas por especialistas y expuestas brevemente al público. Normalmente se ve la urna o el lugar del sepulcro en la cripta, no los restos; la antigüedad y continuidad del culto son sólidas.", "porQue": "Es una de las pocas iglesias de Roma con reliquias de dos apóstoles; el peregrino reza literalmente sobre la tumba de testigos directos de Jesús.", "oracion": "Santos Felipe y Santiago, rueguen por nosotros; alcáncennos una fe apostólica y obras dignas del Evangelio.", "practico": [{"iglesia": "Santos Doce Apóstoles (Santi XII Apostoli)", "horario": "Lun-sáb 7:00-12:00 y 16:00-19:00; dom 8:30-12:00 y 16:00-19:00.", "entrada": "gratis", "consejo": "La cripta se accede desde el interior; si está cerrada, pedir a los frailes franciscanos conventuales en la sacristía. Queda a 5 minutos de la Fontana di Trevi."}], "fuentes": ["https://www.vaticannews.va/it/chiesa/news/2021-02/la-basilica-dei-santi-xii-apostoli-la-memoria-la-bellezza.html", "https://www.romasette.it/le-reliquie-di-filippo-e-giacomo-esposte-ai-santi-apostoli/", "https://www.rome-roma.net/it/basilica-dei-santi-xii-apostoli/"]}, "San Bartolomé": {"vida": "Bartolomé es uno de los Doce Apóstoles y muchos lo identifican con Natanael de Caná, de quien Jesús dijo 'he aquí un verdadero israelita, en quien no hay engaño'. Según la tradición predicó en la India y en Armenia. Allí habría sufrido el martirio siendo desollado vivo y luego decapitado; por eso el arte lo representa con un cuchillo y su propia piel, como en el Juicio Final de Miguel Ángel. Su fiesta se celebra el 24 de agosto.", "patrono": "Patrono de curtidores, carniceros y encuadernadores; invocado contra las enfermedades de la piel.", "reliquia": "Según la tradición, las reliquias pasaron de Armenia a Lípari y luego a Benevento, y el emperador Otón III las trajo a Roma hacia el año 1000, fundando esta basílica. Reposan en una antigua tina romana de pórfido rojo, con cabezas de león, bajo el altar mayor; se ve la tina, no los restos. En la inundación de 1557 se llevaron al Vaticano y volvieron en 1560; la tina fue robada en 1981 y recuperada en 1985. La atribución está discutida: Benevento sostiene que a Otón le entregaron los restos de San Paulino de Nola y que el apóstol quedó allí.", "porQue": "Además de la tumba tradicional de un apóstol, la basílica es el memorial de los mártires de los siglos XX y XXI, con recuerdos de testigos de la fe de todo el mundo.", "oracion": "San Bartolomé, ruega por nosotros; alcánzanos un corazón sincero, sin engaño.", "practico": [{"iglesia": "San Bartolomé en la Isla (San Bartolomeo all'Isola)", "horario": "Lun-sáb 9:30-13:30 y 15:30-17:30; dom 9:30-13:00 y 15:30-17:30. Misas dominicales 11:30 y 19:00 (desde sept. 2026).", "entrada": "gratis", "consejo": "Está en la Isla Tiberina, a pie desde el Gueto o Trastevere; la tina de pórfido se ve bajo el altar al subir al presbiterio."}], "fuentes": ["https://www.sanbartolomeo.org/", "https://www.isolatiberina.org/la-basilica-di-san-bartolomeo", "https://it.wikipedia.org/wiki/Basilica_di_San_Bartolomeo_all'Isola"]}, "San Adalberto de Praga": {"vida": "Vojtěch nació hacia 956 en Bohemia, en la familia noble de los Slavník, y tomó el nombre de su maestro, el arzobispo Adalberto de Magdeburgo. Fue el primer obispo checo de Praga desde 982, pero chocó con la violencia y el paganismo de la nobleza y dos veces se retiró a Roma, como monje en el monasterio de San Bonifacio y San Alejo en el Aventino. Amigo del emperador Otón III, partió luego a evangelizar a los prusianos paganos. Allí fue martirizado el 23 de abril de 997, cerca de la costa del Báltico. Fue canonizado en 999, apenas dos años después.", "patrono": "Patrono de Polonia, de la República Checa, de Hungría y de Prusia.", "reliquia": "Otón III construyó esta basílica en honor de su amigo mártir y le llevó reliquias suyas; la iglesia estuvo dedicada primero a San Adalberto. Las reliquias se conservan en la capilla a la izquierda del altar mayor, llamada de los Molineros porque allí tuvo su sede el gremio de molineros de Roma hasta 1846, junto con reliquias de San Paulino, San Exuperancio y San Marcelo. La tradición antigua habla de un brazo del santo; su cuerpo principal reposa en Gniezno (Polonia).", "porQue": "Une en un solo lugar a un apóstol y a un gran misionero de Europa central, en la iglesia que fundó el emperador que fue su amigo.", "oracion": "San Adalberto, ruega por nosotros; alcánzanos valor para anunciar a Cristo aunque cueste.", "practico": [{"iglesia": "San Bartolomé en la Isla", "horario": "Lun-sáb 9:30-13:30 y 15:30-17:30; dom 9:30-13:00 y 15:30-17:30. Misas dominicales 11:30 y 19:00 (desde sept. 2026).", "entrada": "gratis", "consejo": "La capilla está a la izquierda del presbiterio; en la puerta de esa zona hay incrustada una bala de cañón del asedio de 1849, curioso detalle para buscar."}], "fuentes": ["https://www.isolatiberina.org/la-basilica-di-san-bartolomeo", "https://sanbartolomeo.org/santa-messa-memoria-santadalberto-vescovo-martire/?lang=en", "https://turismoroma.it/en/places/church-san-bartolomeo-all%E2%80%99isola"]}, "Santas Práxedes y Pudenciana": {"vida": "Según una antigua tradición romana, Práxedes y Pudenciana eran hijas del senador Pudente, el cristiano que habría hospedado a San Pedro. En tiempo de persecución habrían recogido los cuerpos y la sangre de los mártires para darles sepultura, escondiendo a cristianos en su casa. Sus 'Actas' son tardías y poco seguras, pero su culto en Roma está documentado desde muy antiguo, con dos iglesias que llevan sus nombres en el Esquilino y el Viminal. Son veneradas como vírgenes que sirvieron a la Iglesia perseguida.", "patrono": "—", "reliquia": "En el año 817 el papa Pascual I trasladó a esta basílica, que él reconstruyó, los restos de las dos hermanas desde las catacumbas de Priscila, junto con los de unos 2.300 mártires. Los cuerpos de ambas se conservan en dos sarcófagos antiguos en la cripta bajo el presbiterio; se ven los sarcófagos, no los restos. La atribución depende de la tradición del s. IX, antigua pero no verificable. En el piso de la nave, un disco de pórfido marca el pozo donde, según la tradición, Práxedes recogía la sangre de los mártires.", "porQue": "La misma iglesia guarda la capilla de San Zenón, con mosaicos del s. IX entre los más bellos de Roma, y la reliquia de la columna de la flagelación traída de Jerusalén en 1223.", "oracion": "Santas Práxedes y Pudenciana, rueguen por nosotras y nosotros; alcáncennos caridad con los que sufren por la fe.", "practico": [{"iglesia": "Santa Práxedes (Santa Prassede)", "horario": "Todos los días 7:30-12:00 y 15:00-18:30 (verificar).", "entrada": "gratis (llevar monedas de €1-2 para iluminar la capilla de San Zenón)", "consejo": "Entrada lateral por Via di Santa Prassede 9A, a pocos pasos de Santa María la Mayor; la cripta se baja por la escalera del presbiterio."}], "fuentes": ["https://www.romasegreta.it/monti/s-prassede.html", "https://mamalovesrome.com/visiting-santa-prassede-rome/", "https://www.santiebeati.it/dettaglio/63850"]}, "Santa Cecilia": {"vida": "Cecilia fue una joven noble romana, consagrada a Cristo, que según su Pasión (texto del s. V) convirtió a su esposo Valeriano la noche de bodas. Durante su martirio, hacia el año 230, habría sobrevivido tres días a un intento de asfixia en el baño de su casa y a tres golpes de espada, sin dejar de alabar a Dios. Su culto es uno de los más antiguos de Roma y su nombre figura en el Canon Romano. La tradición cuenta que 'cantaba a Dios en su corazón', de ahí su patronazgo sobre la música.", "patrono": "Patrona de los músicos, cantantes y de la música sacra.", "reliquia": "Hacia el año 821 el papa Pascual I encontró su cuerpo en las catacumbas de San Calixto y lo trasladó a esta basílica, construida sobre su casa. En 1599 el cardenal Sfondrati abrió el sepulcro y, según los testigos, el cuerpo apareció incorrupto, vestido de blanco y con heridas en el cuello; Stefano Maderno esculpió entonces la célebre estatua que reproduce su posición, bajo el altar mayor. El sarcófago está en la cripta neobizantina (1899-1901) y se ve a través de una pequeña ventana (fenestella confessionis), no el cuerpo. Atribución antigua y bien documentada.", "porQue": "Es la casa de la mártir: se reza donde vivió y murió, frente a la estatua de Maderno, una de las imágenes más conmovedoras del arte cristiano.", "oracion": "Santa Cecilia, ruega por nosotros; que nuestra vida sea un canto de alabanza a Dios.", "practico": [{"iglesia": "Santa Cecilia en Trastevere", "horario": "Lun-sáb 10:00-12:30 y 16:00-18:00; dom y feriados 11:30-12:30 y 16:00-18:00.", "entrada": "iglesia gratis; la cripta y las excavaciones tienen una pequeña entrada (verificar importe)", "consejo": "La estatua de Maderno está bajo el altar mayor y la bajada a la cripta está en la nave izquierda; el fresco de Cavallini se ve en el coro de las monjas con horario reducido."}], "fuentes": ["https://www.romasegreta.it/trastevere/s-cecilia-in-trastevere.html", "https://turismoroma.it/en/places/basilica-santa-cecilia-trastevere", "https://www.iubilaeum2025.va/it/pellegrinaggio/cammini-giubilari-dentro-roma/Donne-Patrone-Europa-e-Dottori-della-Chiesa/basilica-di-santa-cecilia-a-trastevere.html"]}, "Santos Valeriano, Tiburcio y Máximo": {"vida": "Según la Pasión de Santa Cecilia, Valeriano era su esposo pagano: ella le reveló su consagración a Dios y él se convirtió y fue bautizado por el papa Urbano. Luego convirtió a su hermano Tiburcio, y juntos se dedicaron a enterrar a los mártires. Arrestados y condenados, fueron decapitados. Máximo, el funcionario encargado de la ejecución, se convirtió al verlos morir y fue martirizado poco después. Su existencia como mártires se considera histórica y fueron sepultados en la catacumba de Pretextato, en la Vía Apia; los detalles de la Pasión, en cambio, son un relato piadoso de los s. V-VI.", "patrono": "—", "reliquia": "Pascual I trasladó sus restos desde la catacumba de Pretextato a esta basílica hacia el año 821, al mismo tiempo que los de Cecilia. Hoy sus sarcófagos están en la cripta de Santa Cecilia, junto a los de Cecilia y los papas Urbano y Lucio, visibles a través de la fenestella confessionis. Se ve el sarcófago, no los restos; la atribución es antigua pero depende de la tradición del s. IX.", "porQue": "Completan la historia de Cecilia: un matrimonio, un hermano y un verdugo convertidos, testimonio del poder de la fe dentro de una familia.", "oracion": "Santos Valeriano, Tiburcio y Máximo, rueguen por nosotros; alcancen la conversión de nuestros seres queridos.", "practico": [{"iglesia": "Santa Cecilia en Trastevere", "horario": "Lun-sáb 10:00-12:30 y 16:00-18:00; dom y feriados 11:30-12:30 y 16:00-18:00.", "entrada": "incluido en la entrada a la cripta (verificar importe)", "consejo": "Están en la misma cripta que Santa Cecilia; conviene visitarla temprano a la mañana, antes del cierre del mediodía."}], "fuentes": ["https://www.romasegreta.it/trastevere/s-cecilia-in-trastevere.html", "https://www.newadvent.org/cathen/03471b.htm", "https://turismoroma.it/en/places/basilica-santa-cecilia-trastevere"]}, "San Calixto I papa": {"vida": "Calixto fue un esclavo cristiano que, tras duras pruebas y condenas a trabajos forzados, fue liberado y puesto por el papa Ceferino al frente del cementerio cristiano de la Vía Apia, que hoy lleva su nombre. Elegido papa hacia el 217, defendió la misericordia con los pecadores arrepentidos frente al rigorismo de Hipólito. Murió hacia el 222; según la tradición fue arrojado a un pozo en el Trastevere durante un tumulto. Es uno de los primeros papas venerados como mártir y su fiesta es el 14 de octubre.", "patrono": "— (invocado tradicionalmente por los trabajadores de cementerios).", "reliquia": "Fue sepultado en el cementerio de Calepodio, en la Vía Aurelia. En el s. IX el papa Gregorio IV trasladó sus restos a Santa María en Trastevere, junto con los de los santos Calepodio, Cornelio y Julio I, y los colocó bajo el altar mayor, en la confesión. No se ven: están dentro del altar. La tradición es antigua y constante.", "porQue": "Su fiesta, el 14 de octubre, cae durante el viaje: rezar ese día sobre su tumba, en una de las iglesias marianas más antiguas de Roma, es una ocasión única.", "oracion": "San Calixto, ruega por nosotros; alcánzanos misericordia y perseverancia en la fe.", "practico": [{"iglesia": "Santa María en Trastevere", "horario": "Todos los días 7:30-20:30 (viernes desde 9:00); no se visita durante las misas.", "entrada": "gratis", "consejo": "Mirar hacia la confesión bajo el altar mayor; el 14 de octubre suele haber misa en su honor, y al lado está la iglesia de San Calixto con el pozo del martirio."}], "fuentes": ["https://www.lazionascosto.it/cosa-visitare-vedere-fare-citta-roma/basiliche/basilica-di-santa-maria-in-trastevere/", "https://www.newadvent.org/cathen/03183d.htm", "https://it.wikipedia.org/wiki/Basilica_di_Santa_Maria_in_Trastevere"]}, "San Clemente I papa": {"vida": "Clemente fue el cuarto obispo de Roma, después de Pedro, Lino y Anacleto, hacia los años 88-99; según San Ireneo conoció a los apóstoles. Escribió la Carta a los Corintios, uno de los textos cristianos más antiguos fuera del Nuevo Testamento, pidiendo paz y obediencia en esa comunidad dividida. Según una tradición posterior fue desterrado a Crimea, donde trabajó en las canteras, y murió arrojado al mar con un ancla al cuello. Su nombre figura en el Canon Romano y su fiesta es el 23 de noviembre.", "patrono": "Patrono de los marineros y de los canteros y marmolistas.", "reliquia": "Hacia 867-868 los santos Cirilo y Metodio trajeron desde Crimea las reliquias que habían hallado y las entregaron al papa Adriano II, que las depositó en esta basílica. Hoy se conservan bajo el altar mayor de la basílica superior y solo se exponen a la veneración el 23 de noviembre. La identificación depende del hallazgo de Cirilo en Crimea: tradición antigua y respetable, no verificada científicamente.", "porQue": "San Clemente es un 'libro de piedra': la iglesia del s. XII, debajo la basílica del s. IV y más abajo casas romanas del s. I; se reza sobre la tumba de uno de los primeros suc
